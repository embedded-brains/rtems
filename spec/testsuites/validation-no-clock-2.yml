enabled-by: true
links:
- role: requirement-refinement
  uid: validation
test-brief: |
  This validation test suite provides enough resources to run the tests of the
  directives which enqueue a thread in a thread queue with the priority
  discipline without a ${/glossary/clock-driver:/term}.
test-code: |
  const char rtems_test_name[] = "${.:/test-suite-name}";

  #define CONFIGURE_MAXIMUM_PROCESSORS 8

  #define CONFIGURE_APPLICATION_DOES_NOT_NEED_CLOCK_DRIVER

  #define CONFIGURE_MAXIMUM_THREAD_NAME_SIZE 0

  #define CONFIGURE_INIT_TASK_STACK_SIZE TEST_INIT_TASK_STACK_SIZE

  #include "ts-default.h"
test-description: |
  In SMP configurations, up to eight scheduler instances using the SMP EDF
  scheduler are provided using up to eight processors. The schedulers A, B, C,
  and D own the processors as in the other validation test suites. The schedulers
  E, F, G, and H own one processor each from processor 4 to processor 7.
test-includes: []
test-local-includes: []
test-target: testsuites/validation/ts-validation-no-clock-2.c
type: test-suite
