test-brief: |
  This validation test suite runs its test cases in the device driver
  initialization context.
test-code: |
  const char rtems_test_name[] = "${.:/test-suite-name}";

  #define CONFIGURE_INTERRUPT_STACK_SIZE ( 4 * RTEMS_MINIMUM_STACK_SIZE )

  #define CONFIGURE_STACK_CHECKER_ENABLED

  #include "ts-sysinit.h"
test-description: |
  A system initialization handler of the device driver initialization step runs
  the test cases before the start of the multitasking. The system initialization
  runs on the interrupt stack of the boot processor, so the suite configures a
  larger interrupt stack.
