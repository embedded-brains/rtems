links:
- role: requirement-refinement
  uid: validation
test-brief: |
  This validation test suite provides a configuration with the event recording
  enabled and a clock tick of one second.
test-code: |
  const char rtems_test_name[] = "${.:/test-suite-name}";

  static char buffer[ 512 ];

  static const T_action actions[] = { T_report_hash_sha256 };

  static const T_config test_config = {
    .name = rtems_test_name,
    .buf = buffer,
    .buf_size = sizeof( buffer ),
    .putchar = rtems_put_char,
    .verbosity = RTEMS_TEST_VERBOSITY,
    .now = T_now_clock,
    .allocate = T_memory_allocate,
    .deallocate = T_memory_deallocate,
    .action_count = T_ARRAY_SIZE( actions ),
    .actions = actions
  };

  static void Init( rtems_task_argument arg )
  {
    int exit_code;

    (void) arg;

    rtems_test_begin( rtems_test_name, TEST_STATE );
    T_register();
    exit_code = T_main( &test_config );

    if ( exit_code == 0 ) {
      rtems_test_end( rtems_test_name );
    }

    rtems_fatal( RTEMS_FATAL_SOURCE_EXIT, (uint32_t) exit_code );
  }

  #define CONFIGURE_APPLICATION_NEEDS_CLOCK_DRIVER

  #define CONFIGURE_MICROSECONDS_PER_TICK 1000000

  #define CONFIGURE_MAXIMUM_PROCESSORS 4

  #define CONFIGURE_RECORD_PER_PROCESSOR_ITEMS TEST_RECORD_PER_PROCESSOR_ITEMS

  #define CONFIGURE_MAXIMUM_FILE_DESCRIPTORS 0

  #define CONFIGURE_DISABLE_NEWLIB_REENTRANCY

  #define CONFIGURE_APPLICATION_DISABLE_FILESYSTEM

  #define CONFIGURE_IDLE_TASK_STORAGE_SIZE RTEMS_MINIMUM_STACK_SIZE

  #define CONFIGURE_MAXIMUM_TASKS 1

  #define CONFIGURE_RTEMS_INIT_TASKS_TABLE

  #define CONFIGURE_INIT_TASK_CONSTRUCT_STORAGE_SIZE \
    RTEMS_TASK_STORAGE_SIZE(                         \
      2 * RTEMS_MINIMUM_STACK_SIZE,                  \
      RTEMS_DEFAULT_ATTRIBUTES                       \
    )

  #define CONFIGURE_INIT

  #include <rtems/confdefs.h>
test-description: null
test-includes:
- rtems.h
- rtems/bspIo.h
- rtems/test-info.h
- rtems/test.h
- rtems/testopts.h
test-local-includes:
- ts-record.h
test-target: testsuites/validation/ts-validation-record-3.c
type: test-suite
