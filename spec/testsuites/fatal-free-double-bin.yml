links:
- role: requirement-refinement
  uid: validation
test-brief: |
  This validation test suite contains a test case which triggers a fatal error
  during system initialization. A system initialization handler frees a block
  twice. The second free finds the block in a bin of the processor blocks.
test-code: |
  const char rtems_test_name[] = "${.:/test-suite-name}";

  void *FreeDoubleBlock;

  static void FreeBlockTwice( void )
  {
    void *ptr;
    void *again;

    ptr = malloc( 16 );
    FreeDoubleBlock = ptr;
    again = ptr;
    RTEMS_OBFUSCATE_VARIABLE( again );
    free( ptr );
    free( again );
  }

  RTEMS_SYSINIT_ITEM(
    FreeBlockTwice,
    RTEMS_SYSINIT_DEVICE_DRIVERS,
    RTEMS_SYSINIT_ORDER_MIDDLE
  );

  #define FATAL_SYSINIT_RUN CValFreeDouble_Run

  #define CONFIGURE_APPLICATION_DOES_NOT_NEED_CLOCK_DRIVER

  /* The storage holds the thread-local storage area of errno */
  #define CONFIGURE_IDLE_TASK_STORAGE_SIZE ( 2 * RTEMS_MINIMUM_STACK_SIZE )

  #define CONFIGURE_MALLOC_CPU_DESCRIPTORS 64

  #define CONFIGURE_WORKSPACE_ALLOCATOR RTEMS_WORKSPACE_ALLOCATOR_RED_BLACK_TREE

  #include "ts-fatal-sysinit.h"
test-description: null
test-includes:
- rtems/sysinit.h
- stdlib.h
test-local-includes:
- tr-free-double.h
test-target: testsuites/validation/ts-fatal-free-double-bin.c
type: test-suite
