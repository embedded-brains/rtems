  description: null
text: |
  When the stack checker invokes the visitor routine specified by the
  ${../if/iterate:/params[0]/name} parameter of a ${../if/iterate:/name} call for
  a stack, the stack information shall be as specified by the transition map.
transition-map:
- enabled-by: true
  post-conditions:
    Id: Thread
    Name: Thread
    Area: Allocated
    StackPointer: Context
    Used: Deepest
  pre-conditions:
    Enabled:
    - 'Yes'
    Kind:
    - Thread
    HasExecuted:
    - 'Yes'
    StackPointer: all
- enabled-by: true
  post-conditions:
    Id: Thread
    Name: Thread
    Area: Allocated
    StackPointer: Context
    Used: Zero
  pre-conditions:
    Enabled:
    - 'Yes'
    Kind:
    - Thread
    HasExecuted:
    - 'No'
    StackPointer: all
- enabled-by: true
  post-conditions:
    Id: Processor
    Name: Interrupt
    Area: Allocated
    StackPointer: 'Null'
    Used: Deepest
  pre-conditions:
    Enabled:
    - 'Yes'
    Kind:
    - ISR
    HasExecuted:
    - 'Yes'
    StackPointer: N/A
- enabled-by: true
  post-conditions: InterruptStackUnused
  pre-conditions:
    Enabled:
    - 'Yes'
    Kind:
    - ISR
    HasExecuted:
    - 'No'
    StackPointer: N/A
- enabled-by: true
  post-conditions:
    Id: Thread
    Name: Thread
    Area: Allocated
    StackPointer: Context
    Used: Unknown
  pre-conditions:
    Enabled:
    - 'No'
    Kind:
    - Thread
    HasExecuted: all
    StackPointer: all
- enabled-by: true
  post-conditions: InterruptStackNotVisited
  pre-conditions:
    Enabled:
    - 'No'
    Kind:
    - ISR
    HasExecuted: all
    StackPointer: N/A
type: requirement
