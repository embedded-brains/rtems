test-context-support: |
  typedef enum { KIND_THREAD, KIND_ISR } Kind;

  typedef enum { POSITION_BELOW, POSITION_INSIDE, POSITION_ABOVE } Position;

  typedef enum {
    POINT_FAR,
    POINT_EDGE,
    POINT_FIRST,
    POINT_MIDDLE,
    POINT_LAST
  } Point;

  /*
   * This is the size of the name buffer of the stack checker including the
   * terminating null character.
   */
  #define NAME_SIZE 22
test-description: |
  The configuration of the test suite decides whether it enables the stack
  checker, so the test skips the variants of the other state.

  The processor of some architectures serves interrupts on the stack of the
  interrupted thread and never executes on its interrupt stack. The test
  therefore establishes the execution on the interrupt stack of processor 0
  itself. The processor uses one word of the interrupt stack first. If this word
  still holds the fill pattern of the stack checker, the test writes zero to it.

  The test marks a word of the usable stack as used. It writes zero to this word,
  so the test knows the deepest use of the stack of a thread. The representative
  Middle marks the word at the middle and the representative Deepest marks the
  deepest word of the usable stack. For an interrupt stack, an interrupt may use
  the stack deeper than the middle. The action restores the marked word, so the
  later visits of the interrupt stack do not see the mark.

  The test sets a name of the length of the representative for the test task. It
  checks this length, if the configured maximum thread name size allows it. It
  takes the expected name from the name of the thread.

  The member of the stack pointer in a saved context depends on the architecture
  and on some architectures also on the address of the context. The test locates
  the member in the context of the test task.
