enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/is-blown
post-conditions:
- name: Result
  states:
  - name: 'False'
    test-code: |
      T_true( ctx->returned );
      T_false( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/is-blown:/name} shall be
      ${/c/if/false:/name}.
  - name: NoReturn
    test-code: |
      T_false( ctx->returned );
    text: |
      The ${../if/is-blown:/name} call shall not return to the caller.
  test-epilogue: null
  test-prologue: null
- name: Fatal
  states:
  - name: Nop
    test-code: |
      T_eq_u32( ctx->fatal_counter, 0 );
    text: |
      The ${../if/is-blown:/name} call shall raise no fatal error.
  - name: StackChecker
    test-code: |
      T_eq_u32( ctx->fatal_counter, 1 );
      T_eq_int(
        ctx->fatal_source,
        ${/score/interr/if/source-stack-checker:/name}
      );
      T_eq_ulong( ctx->fatal_code, ctx->name );
    text: |
      The ${../if/is-blown:/name} call shall raise the fatal error with the fatal
      source ${/score/interr/if/source-stack-checker:/name} and the object name of
      the executing thread as the fatal code.
  - name: StackCheckerInterrupt
    test-code: |
      T_eq_u32( ctx->fatal_counter, 1 );
      T_eq_int(
        ctx->fatal_source,
        ${/score/interr/if/source-stack-checker:/name}
      );
      T_eq_ulong( ctx->fatal_code, rtems_build_name( 'I', 'N', 'T', 'R' ) );
    text: |
      The ${../if/is-blown:/name} call shall raise the fatal error with the fatal
      source ${/score/interr/if/source-stack-checker:/name} and the object name built
      from the characters `INTR` as the fatal code.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Context
  states:
  - name: Multitasking
    test-code: |
      if ( !_System_state_Is_up( _System_state_Get() ) ) {
        ${.:skip}
      }

      ctx->initialization = false;
    text: |
      While the multitasking started.
  - name: Initialization
    test-code: |
      if ( !_System_state_Is_before_multitasking( _System_state_Get() ) ) {
        ${.:skip}
      }

      ctx->initialization = true;
    text: |
      While the multitasking did not start.
  test-epilogue: null
  test-prologue: null
- name: StackPointer
  states:
  - name: Below
    test-code: |
      ctx->position = POSITION_BELOW;
    text: |
      While the ${/glossary/stackpointer:/term} of the caller is below the begin
      address of the ${/glossary/allocatedstackarea:/term} of the checked stack.
  - name: Inside
    test-code: |
      ctx->position = POSITION_INSIDE;
    text: |
      While the ${/glossary/stackpointer:/term} of the caller is inside the
      ${/glossary/allocatedstackarea:/term} of the checked stack.
  - name: Above
    test-code: |
      ctx->position = POSITION_ABOVE;
    text: |
      While the ${/glossary/stackpointer:/term} of the caller is above the end
      address of the ${/glossary/allocatedstackarea:/term} of the checked stack.
  test-epilogue: null
  test-prologue: null
- name: Pattern
  states:
  - name: Intact
    test-code: |
      ctx->damage = false;
    text: |
      While the ${/glossary/stackcheckerpatternarea:/term} of the stack of the
      executing thread holds the pattern.
  - name: Damaged
    representatives:
    - name: First
      test-code: |
        ctx->damage_offset = 0;
    - name: Last
      test-code: |
        ctx->damage_offset = STACK_CHECK_PATTERN_SIZE - 1;
    test-code: |
      ctx->damage = true;
    text: |
      While the ${/glossary/stackcheckerpatternarea:/term} of the stack of the
      executing thread does not hold the pattern.
  test-epilogue: null
  test-prologue: null
- name: InterruptStackPattern
  states:
  - name: Intact
    test-code: |
      ctx->damage_interrupt_stack = false;
    text: |
      While the ${/glossary/stackcheckerpatternarea:/term} of the
      ${/glossary/interruptstack:/term} of the current processor holds the pattern.
  - name: Damaged
    representatives:
    - name: First
      test-code: |
        ctx->interrupt_damage_offset = 0;
    - name: Last
      test-code: |
        ctx->interrupt_damage_offset = STACK_CHECK_PATTERN_SIZE - 1;
    test-code: |
      ctx->damage_interrupt_stack = true;
    text: |
      While the ${/glossary/stackcheckerpatternarea:/term} of the
      ${/glossary/interruptstack:/term} of the current processor does not hold the
      pattern.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Context covers the start of the multitasking, 2 states. The
  description of ${../if/is-blown:/name} states the checked stack of each state.
  After the start of the multitasking, the checked stack is the stack of the
  executing thread. Before the start of the multitasking, the system
  initialization runs on the interrupt stack of the current processor, so this
  stack is the checked stack. Dimension Pattern does not apply before the start
  of the multitasking.

  Dimension StackPointer covers the position of the stack pointer of the caller
  relative to the allocated stack area of the checked stack, 3 states. The manual
  states a check of the stack pointer against the bounds of the allocated stack
  area. The domain therefore holds the position below the begin address, the
  position inside the bounds and the position above the end address.

  Dimension Pattern covers the content of the stack checker pattern area of the
  stack of the executing thread, 2 states. The manual states that the stack
  checker pattern area is the last bytes of the stack in the direction of growth.
  The representatives of state Damaged damage the first or the last byte of the
  area, the two ends of the compared bytes.

  Dimension InterruptStackPattern covers the content of the stack checker pattern
  area of the interrupt stack of the current processor, 2 states. The description
  of ${../if/is-blown:/name} states this check. The representatives of state
  Damaged are those of dimension Pattern.

  The fatal error chapter of the manual states the fatal source and the fatal
  code of the thread. The chapter of the stack checker states that a detected
  overflow shuts the system down. The notes of ${../if/is-blown:/name} state the
  fatal code of the interrupt stack and the order of the two checks.
