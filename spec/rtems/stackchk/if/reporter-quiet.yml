definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/rtems/task/if/tcb:/name} *${.:/params[0]/name}
    - ${/c/if/bool:/name} ${.:/params[1]/name}
    return: void
  variants: []
description: |
  The reporter terminates the system with the fatal source
  ${/score/interr/if/source-stack-checker:/name} and the object name of the
  thread specified by ${.:/params[0]/name} as the fatal code. The stack checker
  uses this reporter unless the application configures another one with
  `CONFIGURE_STACK_CHECKER_REPORTER`.
enabled-by: true
