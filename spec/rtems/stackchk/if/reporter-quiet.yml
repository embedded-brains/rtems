  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
name: rtems_stack_checker_reporter_quiet
notes: null
params:
- description: |
    is the thread whose stack failed a check.
  dir: in
  name: running
- description: |
    is ${/c/if/true:/name} if the ${/glossary/stackcheckerpatternarea:/term} of the
    stack holds the pattern, otherwise it is ${/c/if/false:/name}.
  dir: null
  name: pattern_ok
return:
  return: null
  return-values: []
