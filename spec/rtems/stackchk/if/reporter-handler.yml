description: |
  The first parameter is the thread whose stack failed a check. The second
  parameter is ${/c/if/true:/name} if the
  ${/glossary/stackcheckerpatternarea:/term} of this stack holds the pattern,
  otherwise it is ${/c/if/false:/name}. The application configuration option
  `CONFIGURE_STACK_CHECKER_REPORTER` selects the reporter.
