text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Name: 'Null'
      then: InvAddr
    - if:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          NameType: Integer
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Index: Valid
          NameType: Integer
          Node: Valid
      then: Ok
    - else: InvId
    Name:
    - if:
        pre-conditions:
          Name: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Set
    - else: Zero
  pre-conditions:
    API: all
    Class:
      applicable:
      - pre-conditions:
          API: Valid
      - pre-conditions:
          Class:
          - Zero
          - Invalid
      skip:
        condition:
        - pre-conditions:
            API:
            - Zero
            - Invalid
            Class:
            - ValidNoObjects
            - ValidMaybeObjects
        reason: NeedsAPI
    Node: all
    Index:
      applicable:
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
          Node: Valid
      - pre-conditions:
          Index:
          - Zero
          - Invalid
      skip:
        condition:
        - pre-conditions:
            API:
            - Zero
            - Invalid
            Index: Valid
        - pre-conditions:
            Class:
            - Zero
            - Invalid
            Index: Valid
        - pre-conditions:
            Index: Valid
            Node:
            - Zero
            - Invalid
        reason: NeedsAPIClassNode
    NameType:
      applicable:
      - pre-conditions:
          API: Zero
          Class: Zero
          Index: Zero
          Node: Zero
      - pre-conditions:
          API: Valid
          Class: ValidMaybeObjects
    Name: all
type: requirement
