brief: |
  This structure contains the statistics of a heap.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
- default:
    brief: |
      This member contains the number of bytes which the heap allocated since its
      initialization.
    definition: ${/c/if/uint64_t:/name} ${.:name}
    description: null
    kind: member
    name: lifetime_allocated
  variants: []
- default:
    brief: |
      This member contains the number of bytes which the heap freed since its
      initialization.
    definition: ${/c/if/uint64_t:/name} ${.:name}
    description: null
    kind: member
    name: lifetime_freed
  variants: []
- default:
    brief: |
      This member contains the size in bytes of the memory areas which the heap
      manages.
    definition: ${/c/if/size_t:/name} ${.:name}
    description: null
    kind: member
    name: size
  variants: []
- default:
    brief: |
      This member contains the number of free bytes of the heap.
    definition: ${/c/if/size_t:/name} ${.:name}
    description: |
      The red-black tree heap keeps the descriptors of up to one more slab than it
      needs. An allocation and a free at the bound of its reserve therefore do not
      carve and free a slab each time. After the free of all blocks of a load, the
      free size of this heap may stay below the free size before the load. The
      difference is at most the size of one slab of descriptors. A slab which the
      heap drains stays used until later frees complete the drain. Until then, the
      difference is at most the size of two slabs.
    kind: member
    name: free_size
  variants: []
- default:
    brief: |
      This member contains the size in bytes of the largest free block of the heap.
    definition: ${/c/if/size_t:/name} ${.:name}
    description: |
      The size of a block in the processor bins of the C Program Heap does not count
      for this member.
    kind: member
    name: largest_free_size
  variants: []
- default:
    brief: |
      This member contains the least number of free bytes of the heap since its
      initialization.
    definition: ${/c/if/size_t:/name} ${.:name}
    description: null
    kind: member
    name: min_free_size
  variants: []
- default:
    brief: |
      This member contains the number of free blocks of the heap.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: free_blocks
  variants: []
- default:
    brief: |
      This member contains the largest number of free blocks of the heap since its
      initialization.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: max_free_blocks
  variants: []
- default:
    brief: |
      This member contains the number of used blocks of the heap.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: used_blocks
  variants: []
- default:
    brief: |
      This member contains the number of successful allocations since the
      initialization of the heap.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: allocs
  variants: []
- default:
    brief: |
      This member contains the number of failed allocations since the initialization
      of the heap.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: failed_allocs
  variants: []
- default:
    brief: |
      This member contains the number of successful frees since the initialization of
      the heap.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: frees
  variants: []
- default:
    brief: |
      This member contains the number of successful resizes since the initialization
      of the heap.
    definition: ${/c/if/uint32_t:/name} ${.:name}
    description: null
    kind: member
    name: resizes
  variants: []
definition-kind: typedef-only
description: |
  The heap which serves ${/c/if/malloc:/name}, the RTEMS Workspace and each
  region provide these statistics.
enabled-by: true
index-entries: []
interface-type: struct
links:
- role: interface-placement
  uid: ../../support/if/header
- role: interface-ingroup
  uid: group
name: rtems_heap_statistics
notes: null
type: interface
