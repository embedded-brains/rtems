test-actions:
- action-brief: |
    Freeze the time. Reset the CPU usage. Advance the time by one tick of the
    software timecounter. Build the expected report from the identifiers, the names
    and the CPU-time clocks of all threads.
  action-code: |
    rtems_printer printer;

    previous_timecount_handler = SetGetTimecountHandler( FreezeTime );
    rtems_cpu_usage_reset();
    TimecounterTick();
    BuildExpectedReport();
  checks:
  - brief: |
      Call ${../if/report-with-plugin:/name} with a printer which captures the
      output. Check that the output is the expected report.
    code: |
      ResetOutput( &output );
      printer.context = &output;
      printer.printer = Capture;
      rtems_cpu_usage_report_with_plugin( &printer );
      T_eq_str( output.buffer, expected.buffer );
    links:
    - role: validation
      uid: ../req/report-with-plugin-printer
    - role: validation
      uid: ../req/report-with-plugin-structure
    - role: validation
      uid: ../req/report-with-plugin-rule
    - role: validation
      uid: ../req/report-with-plugin-title
    - role: validation
      uid: ../req/report-with-plugin-column-rule
    - role: validation
      uid: ../req/report-with-plugin-columns
    - role: validation
      uid: ../req/report-with-plugin-threads
    - role: validation
      uid: ../req/report-with-plugin-fields
    - role: validation
      uid: ../req/report-with-plugin-id
    - role: validation
      uid: ../req/report-with-plugin-total
    - role: validation
      uid: ../req/report-with-plugin-time
    - role: validation
      uid: ../req/report-with-plugin-line-end
  - brief: |
      Call ${../if/report:/name}. Check that it prints the output of
      ${../if/report-with-plugin:/name} through the printk printer.
    code: |
      ResetOutput( &printk_output );
      output_char = BSP_output_char;
      BSP_output_char = OutputChar;
      rtems_cpu_usage_report();
      BSP_output_char = output_char;
      T_eq_str( printk_output.buffer, expected.buffer );
    links:
    - role: validation
      uid: ../req/report-printer
    - role: validation
      uid: ../req/report-output
  - brief: |
      Restore the timecount handler. Reset the CPU usage.
    code: |
      SetGetTimecountHandler( previous_timecount_handler );
      rtems_cpu_usage_reset();
    links: []
  links: []
- action-brief: |
    Freeze the time and reset the CPU usage. Let each read of the timecounter
    advance the time by one millisecond.
  action-code: |
    rtems_printer printer;

    previous_timecount_handler = SetGetTimecountHandler( FreezeTime );
    rtems_cpu_usage_reset();
    (void) SetGetTimecountHandler( AdvanceTime );
  checks:
  - brief: |
      Call ${../if/report-with-plugin:/name} with a printer which captures the
      output. Check that the PERCENT field of the calling thread is less than 100.
      The calling thread uses the processor since the reset point, so the PERCENT
      field is greater than 100 if the directive gets the time elapsed before the
      processor time of the thread.
    code: |
      ResetOutput( &output );
      printer.context = &output;
      printer.printer = Capture;
      rtems_cpu_usage_report_with_plugin( &printer );
      (void) SetGetTimecountHandler( FreezeTime );
      CheckPercentBelow100( rtems_task_self() );
    links:
    - role: validation
      uid: ../req/report-with-plugin-elapsed
  - brief: |
      Restore the timecount handler. Reset the CPU usage.
    code: |
      SetGetTimecountHandler( previous_timecount_handler );
      rtems_cpu_usage_reset();
    links: []
  links: []
- action-brief: |
    Get the thread of the last thread line. Freeze the time and reset the CPU
    usage. Give the thread one second of processor time and move the CPU usage
    reset point two seconds back. Let each read of the timecounter advance the time
    by one millisecond.
  action-code: |
    rtems_printer   printer;
    Thread_Control *thread;
    Threads         threads;
    rtems_id        last;

    threads.count = 0;
    rtems_task_iterate( CollectThread, &threads );
    T_assert_gt_sz( threads.count, 0 );
    last = threads.ids[ threads.count - 1 ];

    previous_timecount_handler = SetGetTimecountHandler( FreezeTime );
    rtems_cpu_usage_reset();
    thread = GetThread( last );
    thread->cpu_time_used_at_last_reset -= SBT_1S;
    CPU_usage_Uptime_at_last_reset -= 2 * SBT_1S;
    (void) SetGetTimecountHandler( AdvanceTime );
  checks:
  - brief: |
      Call ${../if/report-with-plugin:/name} with a printer which captures the
      output. Check that the PERCENT field of the last thread line is the SECONDS
      field of the line divided by the time of the total line. The times of the
      report have a resolution of one microsecond, so the check accepts a difference
      of one in the last decimal place.
    code: |
      ResetOutput( &output );
      printer.context = &output;
      printer.printer = Capture;
      rtems_cpu_usage_report_with_plugin( &printer );
      (void) SetGetTimecountHandler( FreezeTime );
      CheckOneElapsedTime( last );
    links:
    - role: validation
      uid: ../req/report-with-plugin-total-elapsed
  - brief: |
      Restore the timecount handler. Reset the CPU usage.
    code: |
      SetGetTimecountHandler( previous_timecount_handler );
      rtems_cpu_usage_reset();
    links: []
  links: []
test-brief: |
  Tests the CPU usage report.
