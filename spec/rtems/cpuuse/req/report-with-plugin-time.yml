requirement-type: functional
text: |
  The time format of the report of the ${../if/report-with-plugin:/name}
  directive shall be the seconds in decimal digits, padded on the left with space
  characters to seven characters, followed by `.`, followed by the nanoseconds
  divided by 1000 in decimal digits, padded on the left with zeros to six digits.
