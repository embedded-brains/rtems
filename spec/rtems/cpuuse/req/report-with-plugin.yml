enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/report-with-plugin
post-conditions:
- name: Name
  states:
  - name: Complete
    test-code: |
      CheckName( ctx, NAME_FIELD_SIZE );
    text: |
      The NAME field of the thread line of the thread shall be the name of the
      thread, padded on the right with space characters to 38 characters.
  - name: Truncated
    test-code: |
      CheckName( ctx, NAME_FIELD_SIZE - 1 );
    text: |
      The NAME field of the thread line of the thread shall be the first 37
      characters of the name of the thread, followed by one space character.
  test-epilogue: null
  test-prologue: null
- name: Seconds
  states:
  - name: Used
    test-code: |
      CheckTime( ctx->line + SECONDS_FIELD_OFFSET, &ctx->used_time );
    text: |
      The SECONDS field of the thread line of the thread shall be the processor time
      which the thread used since the last ${/glossary/cpu-usage-reset-point:/term}
      at some time point during the directive call, in the time format of the report.
  test-epilogue: null
  test-prologue: null
- name: Percent
  states:
  - name: Zero
    test-code: |
      T_eq_nstr( ctx->line + PERCENT_FIELD_OFFSET, "   0.000\n", 9 );
    text: |
      The PERCENT field of the thread line of the thread shall be `   0.000`.
  - name: Ratio
    test-code: |
      CheckPercent( ctx );
    text: |
      The PERCENT field of the thread line of the thread shall be the processor time
      which the thread used since the last ${/glossary/cpu-usage-reset-point:/term}
      multiplied by 100 and divided by the time elapsed since the last
      ${/glossary/cpu-usage-reset-point:/term}, truncated to three decimal places, in
      the form of the integer part in decimal digits padded on the left with space
      characters to four characters, followed by `.`, followed by the three decimal
      places.
  test-epilogue: null
  test-prologue: null
- name: Total
  states:
  - name: Elapsed
    test-code: |
      CheckTime( ctx->total + TOTAL_FIELD_OFFSET, &ctx->elapsed_time );
    text: |
      The TIME field of the total line shall be the time elapsed since the last
      ${/glossary/cpu-usage-reset-point:/term} at some time point during the
      directive call, in the time format of the report.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Name
  states:
  - name: Fits
    representatives:
    - name: Object
      test-code: |
        SetName( ctx, "", "WORK" );
    - name: Max
      test-code: |
        SetName( ctx, NAME_37, NAME_37 );
    test-code: null
    text: |
      While the name of a thread has at most 37 characters.
  - name: Long
    representatives:
    - name: Min
      test-code: |
        SetName( ctx, NAME_38, NAME_38 );
    - name: Max
      test-code: |
        SetName( ctx, NAME_47, NAME_47 );
    test-code: null
    text: |
      While the name of a thread has more than 37 characters.
  test-epilogue: null
  test-prologue: null
- name: Elapsed
  states:
  - name: Zero
    test-code: |
      ctx->elapsed = 0;
    text: |
      While the time elapsed since the last ${/glossary/cpu-usage-reset-point:/term}
      is zero.
  - name: NonZero
    representatives:
    - name: Seconds
      test-code: |
        ctx->elapsed = 2 * SBT_1S;
    - name: Hours
      test-code: |
        ctx->elapsed = 200 * 3600 * SBT_1S;
    test-code: null
    text: |
      While the time elapsed since the last ${/glossary/cpu-usage-reset-point:/term}
      is greater than zero.
  test-epilogue: |
    CPU_usage_Uptime_at_last_reset -= ctx->elapsed;
  test-prologue: null
- name: Used
  states:
  - name: Zero
    test-code: |
      ctx->used = 0;
    text: |
      While the processor time which the thread used since the last
      ${/glossary/cpu-usage-reset-point:/term} is zero.
  - name: Part
    test-code: |
      ctx->used = ctx->elapsed / 2;
    text: |
      While the processor time which the thread used since the last
      ${/glossary/cpu-usage-reset-point:/term} is greater than zero and less than the
      time elapsed since the last ${/glossary/cpu-usage-reset-point:/term}.
  - name: All
    test-code: |
      ctx->used = ctx->elapsed;
    text: |
      While the processor time which the thread used since the last
      ${/glossary/cpu-usage-reset-point:/term} is equal to the time elapsed since the
      last ${/glossary/cpu-usage-reset-point:/term}.
  test-epilogue: |
    ctx->thread->cpu_time_used_at_last_reset -= ctx->used;
  test-prologue: null
rationale: |
  Dimension Name covers the length of the name of the thread against the 37
  characters which the NAME field holds, 2 states. Dimension Elapsed covers
  whether the time elapsed since the last
  ${/glossary/cpu-usage-reset-point:/term} is zero, 2 states. Dimension Used
  covers the processor time of the thread relative to the elapsed time, 3 states.

  The state code of Elapsed comes first. The state code of Used derives the
  processor time of the thread from the elapsed time.

  The time stays frozen while the test case runs. The state code moves the CPU
  usage reset point of the system and of the thread back by the arranged times.
  The test case therefore reaches times above the range of the uptime of a test
  run.
references: []
requirement-type: functional
skip-reasons:
  NoElapsedTime: |
    While the time elapsed since the last ${/glossary/cpu-usage-reset-point:/term}
    is zero, the processor time which a thread used since this point is zero.
test-action: |
  rtems_printer printer;
  int           status;

  ResetOutput( ctx );
  printer.context = ctx;
  printer.printer = Capture;
  rtems_cpu_usage_report_with_plugin( &printer );

  ctx->line = FindThreadLine( ctx );
  T_assert_not_null( ctx->line );
  ctx->total = strstr( ctx->output, TOTAL_LINE_PREFIX );
  T_assert_not_null( ctx->total );

  status = clock_gettime( ctx->clock_id, &ctx->used_time );
  T_eq_int( status, 0 );
  status = clock_gettime( CLOCK_PROCESS_CPUTIME_ID, &ctx->elapsed_time );
  T_eq_int( status, 0 );
test-brief: null
test-cleanup: |
  rtems_cpu_usage_reset();
