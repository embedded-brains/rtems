transition-map:
- enabled-by: true
  post-conditions:
    Name:
    - if:
        pre-conditions:
          Name: Fits
      then: Complete
    - else: Truncated
    Seconds: Used
    Percent:
    - if:
        pre-conditions:
          Elapsed: Zero
      then: Zero
    - else: Ratio
    Total: Elapsed
  pre-conditions:
    Name: all
    Elapsed: all
    Used: all
- enabled-by: true
  post-conditions: NoElapsedTime
  pre-conditions:
    Name: all
    Elapsed:
    - Zero
    Used:
    - Part
    - All
type: requirement
