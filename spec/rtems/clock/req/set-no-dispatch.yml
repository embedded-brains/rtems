enabled-by: true
links:
- role: interface-function
  uid: ../if/set
functional-type: function
rationale: |
  A service routine of a realtime watchdog runs outside the lock of the
  collection.  A thread dispatch in that window gives the processor to another
  thread while the tickle is in progress.  The other thread may then end a wait
  or a schedule which a service routine of the same tickle still reads.
references: []
requirement-type: functional
text: |
  While ${../if/set:/name} expires the realtime watchdogs, the system shall
  not carry out a thread dispatch.
type: requirement
