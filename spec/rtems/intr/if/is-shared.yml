brief: |
  Checks if the interrupt handler shared option is set.
copyrights:
- Copyright (C) 2008, 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: |
      ( ( ( ${.:/params[0]/name} ) & ${option-unique:/name} ) == 0 )
    params:
    - ${../../option/if/option:/name} ${.:/params[0]/name}
    return: ${/c/if/bool:/name}
  variants: []
description: |
  The interrupt handler shared option ${option-shared:/name} has the value zero.
  It excludes the interrupt handler unique option ${option-unique:/name}. The
  macro therefore checks that the unique option is cleared.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup-hidden
  uid: group
name: RTEMS_INTERRUPT_IS_SHARED
notes: null
params:
- description: |
    is the interrupt handler option set to check.
  dir: null
  name: _options
return:
  return: |
    Returns true, if the interrupt handler shared option ${option-shared:/name} is
    set, otherwise false.
  return-values: []
type: interface
