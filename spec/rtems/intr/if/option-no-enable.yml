brief: |
  This interrupt entry and handler install option prevents that an interrupt
  vector is enabled through an entry or handler installation.
copyrights:
- Copyright (C) 2025 embedded brains GmbH & Co. KG
definition:
  default: ( (${../../option/if/option:/name}) 0x00000004 )
  variants: []
description: |
  The default behaviour is to enable an interrupt vector when the first entry
  or handler is installed.  This install option alters the default behaviour.
enabled-by: true
index-entries: []
interface-type: define
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: RTEMS_INTERRUPT_NO_ENABLE
notes: null
type: interface
