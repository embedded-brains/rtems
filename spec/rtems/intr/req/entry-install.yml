- name: Vector
  states:
  - name: Valid
    test-code: |
      ctx->vector = ctx->test_vector;
    text: |
      While the ${../if/entry-install:/params[0]/name} parameter is associated with
      an interrupt vector.
  - name: Invalid
    test-code: |
      ctx->vector = BSP_INTERRUPT_VECTOR_COUNT;
    text: |
      While the ${../if/entry-install:/params[0]/name} parameter is not associated
      with an interrupt vector.
  test-epilogue: null
  test-prologue: null
- name: InstallOptions
  states:
  - name: Unique
