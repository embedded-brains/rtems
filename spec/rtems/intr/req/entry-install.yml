      ctx->options = RTEMS_INTERRUPT_UNIQUE;
    text: |
      While the ${../if/entry-install:/params[1]/name} parameter has the
      ${../if/option-unique:/name} option set.
  - name: Shared
    test-code: |
      ctx->options = RTEMS_INTERRUPT_SHARED;
    text: |
      While the ${../if/entry-install:/params[1]/name} parameter has the
      ${../if/option-unique:/name} option and the ${../if/option-replace:/name}
      option cleared.
  - name: Replace
    test-code: |
      ctx->options = RTEMS_INTERRUPT_REPLACE;
    text: |
      While the ${../if/entry-install:/params[1]/name} parameter has the
      ${../if/option-replace:/name} option set.
  test-epilogue: null
  test-prologue: null
- name: EnableOption
  states:
  - name: Enable
    test-code: |
      ctx->options |= RTEMS_INTERRUPT_ENABLE;
    text: |
      While the ${../if/entry-install:/params[1]/name} parameter has the
      ${../if/option-no-enable:/name} option cleared.
  - name: NoEnable
    test-code: |
      ctx->options |= RTEMS_INTERRUPT_NO_ENABLE;
    text: |
      While the ${../if/entry-install:/params[1]/name} parameter has the
      ${../if/option-no-enable:/name} option set.
  test-epilogue: null
  test-prologue: null
- name: Entry
  states:
  - name: Obj
    test-code: |
      ctx->entry = &ctx->entry_obj;
    text: |
      While the ${../if/entry-install:/params[2]/name} parameter references an object
      of type ${../if/entry:/name}.
  - name: 'Null'
    test-code: |
      ctx->entry = NULL;
    text: |
      While the ${../if/entry-install:/params[2]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Routine
  states:
  - name: Valid
    test-code: |
      rtems_interrupt_entry_initialize(
        &ctx->entry_obj,
        EntryRoutine,
        &entry_arg,
        entry_info
      );
    text: |
      While the handler routine of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter is valid.
  - name: 'Null'
    test-code: |
      rtems_interrupt_entry_initialize(
        &ctx->entry_obj,
        NULL,
        &entry_arg,
        entry_info
      );
    text: |
      While the handler routine of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter is equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Init
  states:
  - name: 'Yes'
    test-code: |
      ctx->initialized = true;
    text: |
      While the service is initialized.
  - name: 'No'
    test-code: |
      ctx->initialized = false;
    text: |
      While the service is not initialized.
  test-epilogue: null
  test-prologue: null
- name: ISR
  states:
  - name: 'Yes'
    test-code: |
      ctx->isr = true;
    text: |
      While ${../if/entry-install:/name} is called from within interrupt context.
  - name: 'No'
    test-code: |
      ctx->isr = false;
    text: |
      While ${../if/entry-install:/name} is not called from within interrupt context.
  test-epilogue: null
  test-prologue: null
- name: CanEnable
  states:
  - name: 'Yes'
    test-code: |
      if ( !ctx->can_enable ) {
        ${.:skip}
      }
    text: |
      While ${../if/vector-enable:/name} enables the interrupt vector associated with
      the ${../if/entry-install:/params[0]/name} parameter.
  - name: 'No'
    test-code: |
      if ( ctx->can_enable ) {
        ${.:skip}
      }
    text: |
      While ${../if/vector-enable:/name} does not enable the interrupt vector
      associated with the ${../if/entry-install:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: CanRaise
  states:
  - name: 'Yes'
    test-code: |
      if ( !ctx->attributes->can_raise ) {
        ${.:skip}
      }
    text: |
      While the ${../if/attributes:/definition[5]/default/name} member of the
      ${../if/attributes:/name} object of the interrupt vector associated with the
      ${../if/entry-install:/params[0]/name} parameter is true.
  - name: 'No'
    test-code: |
      if ( ctx->attributes->can_raise ) {
        ${.:skip}
      }
    text: |
      While the ${../if/attributes:/definition[5]/default/name} member of the
      ${../if/attributes:/name} object of the interrupt vector associated with the
      ${../if/entry-install:/params[0]/name} parameter is false.
  test-epilogue: null
  test-prologue: null
- name: Installed
  states:
  - name: None
    test-code: |
      /* Nothing to do */
    text: |
      While no entry is installed at the interrupt vector specified by the
      ${../if/entry-install:/params[0]/name} parameter.
  - name: Unique
    test-code: |
      Install( ctx, RTEMS_INTERRUPT_UNIQUE, EntryRoutine, &entry_arg );
    text: |
      While a unique entry is installed at the interrupt vector specified by the
      ${../if/entry-install:/params[0]/name} parameter.
  - name: Other
    test-code: |
      Install( ctx, RTEMS_INTERRUPT_SHARED, OtherRoutine, &other_arg );
      InstallThird( ctx );
    text: |
      While at least one non-unique entry is installed at the interrupt vector
      specified by the ${../if/entry-install:/params[0]/name} parameter, while all
      entries installed at the interrupt vector specified by the
      ${../if/entry-install:/params[0]/name} parameter have a handler routine which
      is not equal to the handler routine of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter, while all entries installed
      at the interrupt vector specified by the ${../if/entry-install:/params[0]/name}
      parameter have a handler argument which is not equal to the handler argument of
      the object referenced by the ${../if/entry-install:/params[2]/name} parameter.
  - name: EqRoutine
    test-code: |
      Install( ctx, RTEMS_INTERRUPT_SHARED, EntryRoutine, &other_arg );
    text: |
      While at least one non-unique entry is installed at the interrupt vector
      specified by the ${../if/entry-install:/params[0]/name} parameter, while at
      least one entry installed at the interrupt vector specified by the
      ${../if/entry-install:/params[0]/name} parameter has a handler routine which is
      equal to the handler routine of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter, while all entries installed
      at the interrupt vector specified by the ${../if/entry-install:/params[0]/name}
      parameter have a handler argument which is not equal to the handler argument of
      the object referenced by the ${../if/entry-install:/params[2]/name} parameter.
  - name: EqArg
    test-code: |
      Install( ctx, RTEMS_INTERRUPT_SHARED, OtherRoutine, &other_arg );
    text: |
      While at least one non-unique entry is installed at the interrupt vector
      specified by the ${../if/entry-install:/params[0]/name} parameter, while all
      entries installed at the interrupt vector specified by the
      ${../if/entry-install:/params[0]/name} parameter have a handler routine which
      is not equal to the handler routine of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter, while at least one entry
      installed at the interrupt vector specified by the
      ${../if/entry-install:/params[0]/name} parameter has a handler argument which
      is equal to the handler argument of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter.
  - name: Match
    test-code: |
      Install( ctx, RTEMS_INTERRUPT_SHARED, EntryRoutine, &entry_arg );
    text: |
      While at least one non-unique entry with a handler routine which is equal to
      the handler routine of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter and with a handler argument
      which is equal to the handler argument of the object referenced by the
      ${../if/entry-install:/params[2]/name} parameter is installed at the interrupt
      vector specified by the ${../if/entry-install:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: IsEnabled
  states:
  - name: 'Yes'
    test-code: |
      if ( !SetEnabled( ctx, true ) ) {
        ${.:skip}
      }
    text: |
      While the interrupt vector associated with the
      ${../if/entry-install:/params[0]/name} parameter is enabled.
  - name: 'No'
    test-code: |
      if ( !SetEnabled( ctx, false ) ) {
        ${.:skip}
      }
    text: |
      While the interrupt vector associated with the
      ${../if/entry-install:/params[0]/name} parameter is disabled.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Init covers the initialization state of the interrupt service, 2
  states.

  Dimension ISR covers the execution context of the caller, 2 states.

  Dimension CanEnable covers the effect of an enable on the interrupt vector, 2
  states.

  Dimension CanRaise covers the raise attribute of the interrupt vector, 2
  states.

  Dimension Installed covers the entries installed at the interrupt vector, 6
  states.

  Dimension IsEnabled covers the enabled status of the interrupt vector before
  the call, 2 states.

  The interrupt vector of a test run selects one state of CanEnable and one state
  of CanRaise. The other states skip. Where the attributes state that an enable
  may take effect, the test setup enables the interrupt vector once and reads the
  enabled status back. The vector of a test run selects the reachable state of
  IsEnabled. The arrangement of IsEnabled follows the arrangement of Installed,
  because an installed entry enables the interrupt vector.

  The test action raises the interrupt vector after a successful call. The
  dispatch of the entries observes the installation order. Where the test cannot
  raise the interrupt vector, the device decides the dispatch. The check of the
  state No of Dispatch reads the counters of the entries. Only a raise changes
  them, so only a test run with the state Yes of CanRaise verifies the state No.
  Whether an interrupt which the test raised while the interrupt vector was
  disabled is pending after a later enable depends on the interrupt controller.
  The test does not check it.

  The validation test of the interrupt manager runs this item for each interrupt
  vector which is maskable and which carries no entry. The test skips an
  interrupt vector which it can enable but cannot disable. It skips an interrupt
  vector which shows an active source of its own. An interrupt which no entry
  handles counts as a failure of the test run.

  The vehicles of the package reach no interrupt vector which an enable leaves
  disabled. There, the state No of CanEnable skips.
requirement-type: functional
skip-reasons: {}
test-action: |
  if ( ctx->isr ) {
    CallWithinISR( Action, ctx );
  } else {
    Action( ctx );
  }
test-brief: null
test-cleanup: |
  rtems_status_code sc;

  if ( ctx->raised ) {
    if ( ctx->attributes->can_clear ) {
      (void) ClearSoftwareInterrupt( ctx->test_vector );
    } else {
      /*
       * The interrupt controller decides whether the enable dispatches the
       * raised interrupt.  A dispatch through the installed entries
       * acknowledges it.
       */
      (void) rtems_interrupt_vector_enable( ctx->test_vector );
    }
  }

  if ( ctx->third_installed ) {
    sc = rtems_interrupt_entry_remove( ctx->test_vector, &ctx->third_entry );
    T_rsc_success( sc );
  }

  if ( ctx->other_installed ) {
    sc = rtems_interrupt_entry_remove( ctx->test_vector, &ctx->other_entry );
    T_rsc_success( sc );
  }

  if ( ctx->status == RTEMS_SUCCESSFUL ) {
    sc = rtems_interrupt_entry_remove( ctx->test_vector, ctx->entry );
    T_rsc_success( sc );
  }
