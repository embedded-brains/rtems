post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->status );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/successful:/name}.
  - name: InvAddr
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ADDRESS );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/invalid-address:/name}.
  - name: IncStat
    test-code: |
      T_rsc( ctx->status, RTEMS_INCORRECT_STATE );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/incorrect-state:/name}.
  - name: InvId
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_ID );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/invalid-id:/name}.
  - name: InvNum
    test-code: |
      T_rsc( ctx->status, RTEMS_INVALID_NUMBER );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/invalid-number:/name}.
  - name: CalledFromISR
    test-code: |
      T_rsc( ctx->status, RTEMS_CALLED_FROM_ISR );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/called-from-isr:/name}.
  - name: InUse
    test-code: |
      T_rsc( ctx->status, RTEMS_RESOURCE_IN_USE );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/resource-in-use:/name}.
  - name: TooMany
    test-code: |
      T_rsc( ctx->status, RTEMS_TOO_MANY );
    text: |
      The return status of ${../if/entry-install:/name} shall be
      ${../../status/if/too-many:/name}.
  test-epilogue: null
  test-prologue: null
- name: Enabled
  states:
  - name: Nop
    test-code: |
      T_eq( ctx->enabled_after, ctx->enabled_before );
    text: |
      The enabled status of the interrupt vector specified by
      ${../if/entry-install:/params[0]/name} shall not be modified by the
      ${../if/entry-install:/name} call.
  - name: 'Yes'
    test-code: |
      T_true( ctx->enabled_after );
    text: |
      The interrupt vector specified by ${../if/entry-install:/params[0]/name} shall
      be enabled.
  test-epilogue: null
  test-prologue: null
- name: Installed
  states:
  - name: 'No'
    test-code: |
      if ( ctx->other_installed && ctx->third_installed ) {
        T_eq_u32( ctx->visited_entries, 2 );
      } else if ( ctx->other_installed ) {
        T_eq_u32( ctx->visited_entries, 1 );
      } else {
        T_eq_u32( ctx->visited_entries, 0 );
      }
    text: |
      The entry referenced by ${../if/entry-install:/params[2]/name} shall not be
      installed at the interrupt vector specified by
      ${../if/entry-install:/params[0]/name}.
  - name: Last
    test-code: |
      if ( ctx->other_installed && ctx->third_installed ) {
        T_eq_u32( ctx->visited_entries, 3 );
      } else if ( ctx->other_installed ) {
        T_eq_u32( ctx->visited_entries, 2 );
      } else {
        T_eq_u32( ctx->visited_entries, 1 );
      }
    text: |
      The entry referenced by ${../if/entry-install:/params[2]/name} shall be
      installed as the last entry at the interrupt vector specified by
      ${../if/entry-install:/params[0]/name}.
  test-epilogue: null
  test-prologue: |
    rtems_status_code sc;

    ctx->visited_entries = 0;
    sc = rtems_interrupt_handler_iterate(
      ctx->test_vector,
      VisitInstalled,
      ctx
    );
    T_rsc_success( sc );
- name: Dispatch
  states:
  - name: InOrder
    test-code: |
      uint32_t counter;

      counter = 1;

      if ( ctx->other_installed ) {
        T_eq_u32( ctx->counter_by_entry[ 1 ], counter );
        ++counter;
      }

      if ( ctx->third_installed ) {
        T_eq_u32( ctx->counter_by_entry[ 2 ], counter );
        ++counter;
      }

      T_eq_u32( ctx->counter_by_entry[ 0 ], counter );
    text: |
      The ${/glossary/interruptservice:/term} shall dispatch each entry installed at
      the interrupt vector specified by ${../if/entry-install:/params[0]/name} once
      in the order of installation.
  - name: 'No'
    test-code: |
      T_eq_u32( ctx->counter_by_entry[ 0 ], 0 );
      T_eq_u32( ctx->counter_by_entry[ 1 ], 0 );
      T_eq_u32( ctx->counter_by_entry[ 2 ], 0 );
    text: |
      The ${/glossary/interruptservice:/term} shall dispatch no entry installed at
      the interrupt vector specified by ${../if/entry-install:/params[0]/name}.
  - name: Device
    test-code: |
      /* The test cannot raise the interrupt vector. */
    text: |
      The ${/glossary/interruptservice:/term} shall dispatch the entries installed at
      the interrupt vector specified by ${../if/entry-install:/params[0]/name} as the
      device which drives the interrupt vector requests it.
  test-epilogue: null
  test-prologue: null
