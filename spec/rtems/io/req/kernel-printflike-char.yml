  uid: kernel-printflike-conversion
functional-type: function
rationale: null
references: []
requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while a 'c' character is consumed from the format
  string, the directive shall output the next argument as a character, one
  argument shall be consumed, the current ${../glossary/conversion-specification:/term} processing
  shall stop.
type: requirement
