requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while a '%' character is
  consumed from the ${../glossary/format-string:/term}, the directive shall
  print a '%' character, the current conversion specification processing shall
  stop.
type: requirement
