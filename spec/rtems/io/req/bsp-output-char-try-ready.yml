  uid: ../if/bsp-output-char
rationale: null
references: []
requirement-type: functional
text: |
  Where the ${/glossary/bsp:/term} supports ${../if/output-char-try:/name}, while
  the kernel character output device can accept a character without a wait, when
  the function referenced by ${../if/bsp-output-char:/name} is called with a
  parameter in which ${../if/output-char-try:/name} is set and
  ${../if/output-char-drain:/name} is cleared, the function shall output the
  character specified by the parameter to the kernel character output device and
  return zero.
type: requirement
