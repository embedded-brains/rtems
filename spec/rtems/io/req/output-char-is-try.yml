post-conditions:
- name: Result
  states:
  - name: 'True'
    test-code: |
      T_true( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/output-char-is-try:/name} shall
      be true.
  - name: 'False'
    test-code: |
      T_false( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/output-char-is-try:/name} shall
      be false.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Sign
  states:
  - name: NonNegative
    representatives:
    - name: Zero
      test-code: |
        ctx->c = 0;
    - name: Char
      test-code: |
        ctx->c = 'c';
    - name: Max
      test-code: |
        ctx->c = INT_MAX;
    test-code: null
    text: |
      While the ${../if/output-char-is-try:/params[0]/name} parameter is
      non-negative.
  - name: Negative
    representatives:
    - name: Min
      test-code: |
        ctx->c = INT_MIN;
    - name: MinusOne
      test-code: |
        ctx->c = -1;
    test-code: null
    text: |
      While the ${../if/output-char-is-try:/params[0]/name} parameter is negative.
  test-epilogue: null
  test-prologue: null
- name: Try
  states:
  - name: Set
    test-code: |
      ctx->c |= RTEMS_OUTPUT_CHAR_TRY;
    text: |
      While the ${../if/output-char-is-try:/params[0]/name} parameter sets
      ${../if/output-char-try:/name}.
  - name: Cleared
    test-code: |
      ctx->c &= ~RTEMS_OUTPUT_CHAR_TRY;
    text: |
      While the ${../if/output-char-is-try:/params[0]/name} parameter clears
      ${../if/output-char-try:/name}.
  test-epilogue: null
  test-prologue: null
- name: Drain
  states:
  - name: Set
    test-code: |
      ctx->c |= RTEMS_OUTPUT_CHAR_DRAIN;
    text: |
      While the ${../if/output-char-is-try:/params[0]/name} parameter sets
      ${../if/output-char-drain:/name}.
  - name: Cleared
    test-code: |
      ctx->c &= ~RTEMS_OUTPUT_CHAR_DRAIN;
    text: |
      While the ${../if/output-char-is-try:/params[0]/name} parameter clears
      ${../if/output-char-drain:/name}.
  test-epilogue: null
  test-prologue: null
