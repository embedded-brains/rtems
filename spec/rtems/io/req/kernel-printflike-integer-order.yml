text: |
  The order from the highest priority to the lowest priority of the integer
  mode of a conversion of a ${../glossary/kernel-printflike:/term} directive
  shall be maximum integer, long long integer, pointer difference integer, size
  integer, long integer, integer, short integer, and character integer.
