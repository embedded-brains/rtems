text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while no '.' was consumed so
  far in the current conversion processing, while a leading '0' is consumed
  from the ${../glossary/format-string:/term} the padding character of the
  current conversions shall be set to '0'.
