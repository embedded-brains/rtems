  uid: kernel-printflike-conversion
functional-type: function
rationale: null
references: []
requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while a 'y' character is consumed from the format
  string, the directive shall print the next argument as a signed integer in
  lower case hexadecimal notation, one argument shall be consumed, the current
  ${../glossary/conversion-specification:/term} processing shall stop.
type: requirement
