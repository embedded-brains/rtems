- role: requirement-refinement
  uid: kernel-printflike-width
functional-type: function
rationale: null
references: []
requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while no '.' was consumed so
  far in the current conversion processing, while a '1', '2', '3', '4', '5',
  '6', '7', '8', '9', or a non-leading '0' is consumed from the
  ${../glossary/format-string:/term}, the decimal number at the current format
  string location shall define the width of the current conversion.
type: requirement
