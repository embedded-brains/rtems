requirement-type: functional
text: |
  While a ${../glossary/kernel-printflike:/term} directive processes a
  ${../glossary/conversion-specification:/term}, while a '.' was consumed so
  far in the current conversion processing, while a '*' character is consumed
  from the ${../glossary/format-string:/term}, the precision of the current
  conversion shall be set to the integer value of the next argument, one
  argument shall be consumed.
type: requirement
