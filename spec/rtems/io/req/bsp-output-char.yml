text: |
  When the function referenced by ${../if/bsp-output-char:/name} is called with a
  parameter in which ${../if/output-char-drain:/name} and
  ${../if/output-char-try:/name} are cleared, the function shall output the
  character specified by the parameter to the kernel character output device and
  return zero.
