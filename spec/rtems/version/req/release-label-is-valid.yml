enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/release-label-is-valid
post-conditions:
- name: Result
  states:
  - name: 'True'
    test-code: |
      T_true( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/release-label-is-valid:/name}
      shall be ${/c/if/true:/name}.
  - name: 'False'
    test-code: |
      T_false( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/release-label-is-valid:/name}
      shall be ${/c/if/false:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Label
  states:
  - name: Empty
    test-code: |
      SetReleaseLabel( "" );
    text: |
      While the ${/glossary/releaselabel:/term} is empty.
  - name: NonEmpty
    test-code: |
      SetReleaseLabel( "x" );
    text: |
      While the ${/glossary/releaselabel:/term} is not empty.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Label covers the length of the ${/glossary/releaselabel:/term}, 2
  states. The states partition the length into zero and greater than zero. The
  state NonEmpty arranges a label of length one, which is the bound of the
  partition. The test arranges the label through `SetReleaseLabel()` of the test
  support, which wraps ${../if/release-label:/name} by the linker option
  `--wrap`. Outside the action, the wrapper returns the label of the build.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->result = rtems_version_release_label_is_valid();
test-brief: null
test-cleanup: |
  SetReleaseLabel( NULL );
