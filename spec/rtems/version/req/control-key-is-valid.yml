enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/control-key-is-valid
post-conditions:
- name: Result
  states:
  - name: 'True'
    test-code: |
      T_true( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/control-key-is-valid:/name} shall
      be ${/c/if/true:/name}.
  - name: 'False'
    test-code: |
      T_false( ctx->result );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/control-key-is-valid:/name} shall
      be ${/c/if/false:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Key
  states:
  - name: Empty
    test-code: |
      ctx->key = "";
    text: |
      While the ${../if/control-key-is-valid:/params[0]/name} parameter references an
      empty string.
  - name: NonEmpty
    test-code: |
      ctx->key = "x";
    text: |
      While the ${../if/control-key-is-valid:/params[0]/name} parameter references a
      string which is not empty.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Key covers the length of the string which the
  ${../if/control-key-is-valid:/params[0]/name} parameter references, 2 states.
  The states partition the length into zero and greater than zero. The state
  NonEmpty arranges a string of length one, which is the bound of the partition.
  The interface requires that the parameter references a string.
