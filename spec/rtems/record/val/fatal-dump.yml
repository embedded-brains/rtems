test-actions:
- action-brief: |
    The test action is carried out by the system initialization. It replaces the
    kernel character output by a handler which collects the output and triggers a
    fatal error. A fatal extension which runs after the fatal extension of the
    event recording restores the kernel character output.
  action-code: |
    rtems_fatal_source source;
    rtems_fatal_code   code;
    size_t             begin_size;
    size_t             end_size;
    rtems_record_item  last[ 4 ];
    bool               has_last;

    source = ctx->source;
    code = ctx->code;
    begin_size = sizeof( BEGIN_LINE ) - 1;
    end_size = sizeof( END_LINE ) - 1;
    decoded_size = SIZE_MAX;
    memset( last, 0, sizeof( last ) );
    has_last = false;

    if ( output_size >= begin_size + end_size ) {
      decoded_size = Base64Decode(
        &output[ begin_size ],
        output_size - begin_size - end_size
      );
    }

    if ( decoded_size != SIZE_MAX ) {
      has_last = GetLastItemsOfDump( decoded_size, fatal_cpu_index, last );
    }
  checks:
  - brief: |
      Check that the fatal error has the expected source and code.
    code: |
      T_eq_int( source, RTEMS_FATAL_SOURCE_APPLICATION );
      T_eq_ulong( code, FATAL_CODE );
    links: []
  - brief: |
      Check that the system output the begin line, a base64 encoding of a record
      dump, and the end line.
    code: |
      T_ge_sz( output_size, begin_size + end_size );
      T_eq_mem( &output[ 0 ], BEGIN_LINE, begin_size );
      T_eq_mem( &output[ output_size - end_size ], END_LINE, end_size );
      T_ne_sz( decoded_size, SIZE_MAX );
      T_true( has_last );
    links:
    - role: validation
      uid: ../req/fatal-dump
  - brief: |
      Check that the last items of the processor in the dump are the uptime items
      followed by the fatal source item and the fatal code item.
    code: |
      CheckFatalItems( last, source, code, uptime_before, uptime_after );
    links:
    - role: validation
      uid: ../req/fatal-items
  links: []
- action-brief: |
    Wait until each other processor produced the items of its fatal error, which is
    the SMP shutdown response.
  action-code: |
    uint32_t cpu_index;
    uint32_t cpu_max;
    size_t   responses;

    cpu_max = rtems_scheduler_get_processor_maximum();
    responses = 0;

    for ( cpu_index = 0; cpu_index < cpu_max; ++cpu_index ) {
      rtems_record_item last[ 4 ];

      if ( cpu_index == fatal_cpu_index ) {
        continue;
      }

      if ( WaitForShutdownResponse( cpu_index, last ) ) {
        CheckFatalItems(
          last,
          last[ 2 ].data,
          last[ 3 ].data,
          uptime_before,
          _Timecounter_Sbinuptime()
        );
        ++responses;
      }
    }
  checks:
  - brief: |
      Check that each other processor produced the uptime items, the fatal source
      item, and the fatal code item of the SMP shutdown response.
    code: |
      T_eq_sz( responses, cpu_max - 1 );
    links:
    - role: validation
      uid: ../req/fatal-items
  links: []
- action-brief: |
    Call the fatal extension of the event recording a second time with another
    fatal code.
  action-code: |
    rtems_fatal_source source;
    rtems_fatal_code   code;
    sbintime_t         before;
    sbintime_t         after;
    rtems_record_item  last[ 4 ];
    bool               has_last;

    source = ctx->source;
    code = ctx->code;
    memset( last, 0, sizeof( last ) );
    before = _Timecounter_Sbinuptime();
    StartCapture();
    _Record_Fatal_dump_base64( source, false, code + 1 );
    StopCapture();
    after = _Timecounter_Sbinuptime();
    has_last = GetLastItemsOfBuffer( fatal_cpu_index, last );
  checks:
  - brief: |
      Check that the system produced no output for the second fatal error.
    code: |
      T_eq_sz( output_size, 0 );
    links:
    - role: validation
      uid: ../req/fatal-dump
  - brief: |
      Check that the system produced the uptime items, the fatal source item, and the
      fatal code item for the second fatal error.
    code: |
      T_true( has_last );
      CheckFatalItems( last, source, code + 1, before, after );
    links:
    - role: validation
      uid: ../req/fatal-items
  links: []
- action-brief: |
    Call the fatal extension of the event recording with a fatal error of the SMP
    source which is not the SMP shutdown response. The action covers the branch of
    the fatal extension for the SMP source. The dump of the first action suppresses
    the output of this fatal error.
  action-code: |
    rtems_fatal_source source;
    rtems_fatal_code   code;
    sbintime_t         before;
    sbintime_t         after;
    rtems_record_item  last[ 4 ];
    bool               has_last;

    source = RTEMS_FATAL_SOURCE_SMP;
    code = SMP_FATAL_SHUTDOWN;
    memset( last, 0, sizeof( last ) );
    before = _Timecounter_Sbinuptime();
    StartCapture();
    _Record_Fatal_dump_base64( source, false, code );
    StopCapture();
    after = _Timecounter_Sbinuptime();
    has_last = GetLastItemsOfBuffer( fatal_cpu_index, last );
  checks:
  - brief: |
      Check that the system produced no output for this fatal error.
    code: |
      T_eq_sz( output_size, 0 );
    links: []
  - brief: |
      Check that the system produced the uptime items, the fatal source item, and the
      fatal code item of this fatal error.
    code: |
      T_true( has_last );
      CheckFatalItems( last, source, code, before, after );
    links:
    - role: validation
      uid: ../req/fatal-items
  links: []
test-brief: |
  Tests the fatal error dump of the event recording.
test-context: []
test-context-support: null
test-description: null
test-header:
  code: |
    /**
     * @brief Stops the capture of the kernel character output.
     *
     * @param source is the fatal source.
     *
     * @param always_set_to_false is always false.
     *
     * @param code is the fatal code.
     */
    void RtemsRecordValFatalDump_StopCapture(
      rtems_fatal_source source,
      bool               always_set_to_false,
      rtems_fatal_code   code
    );
  freestanding: true
  includes:
  - rtems.h
  local-includes: []
  run-params:
  - description: |
      is fatal source.
    dir: null
    name: source
    specifier: ${/rtems/userext/if/fatal-source:/name} ${.:name}
  - description: |
      is fatal code.
    dir: null
    name: code
    specifier: ${/rtems/userext/if/fatal-code:/name} ${.:name}
  target: testsuites/validation/tr-record-fatal-dump.h
test-includes:
- rtems.h
- rtems/bspIo.h
- rtems/record.h
- rtems/sysinit.h
- rtems/score/smpimpl.h
- rtems/score/timecounter.h
- string.h
test-local-includes:
- tr-record-fatal-dump.h
test-setup: null
test-stop: null
test-support: |
  #define FATAL_CODE 0x12345678

  #define BEGIN_LINE "\n*** BEGIN OF RECORDS BASE64 ***\n"

  #define END_LINE "\n*** END OF RECORDS BASE64 ***\n"

  typedef struct {
    const uint8_t *data;
    size_t         size;
    size_t         pos;
  } Stream;

  static BSP_output_char_function_type output_char;

  static char output[ 8192 ];

  static size_t output_size;

  static uint8_t dump[ 4096 ];

  static sbintime_t uptime_before;

  static size_t decoded_size;

  static uint32_t fatal_cpu_index;

  static void CaptureChar( char c )
  {
    if ( c != '\r' && output_size < sizeof( output ) ) {
      output[ output_size ] = c;
      ++output_size;
    }
  }

  static void StartCapture( void )
  {
    output_size = 0;
    output_char = BSP_output_char;
    BSP_output_char = CaptureChar;
  }

  static void StopCapture( void )
  {
    BSP_output_char = output_char;
  }

  static sbintime_t uptime_after;

  void RtemsRecordValFatalDump_StopCapture(
    rtems_fatal_source source,
    bool               always_set_to_false,
    rtems_fatal_code   code
  )
  {
    (void) always_set_to_false;

  #if defined( RTEMS_SMP )
    if ( source == RTEMS_FATAL_SOURCE_SMP && code == SMP_FATAL_SHUTDOWN_RESPONSE ) {
      /*
       * The other processors stop here, so that the processor of the fatal
       * error alone stops the capture and runs the test.
       */
      while ( true ) {
        /* Wait for the end of the test */
      }
    }
  #else
    (void) source;
    (void) code;
  #endif

    StopCapture();
    uptime_after = _Timecounter_Sbinuptime();
  }

  static void Trigger( void )
  {
    fatal_cpu_index = rtems_scheduler_get_processor();
    uptime_before = _Timecounter_Sbinuptime();
    StartCapture();
    rtems_fatal( RTEMS_FATAL_SOURCE_APPLICATION, FATAL_CODE );
  }

  RTEMS_SYSINIT_ITEM(
    Trigger,
    RTEMS_SYSINIT_DEVICE_DRIVERS,
    RTEMS_SYSINIT_ORDER_LAST
  );

  static int Base64Value( char c )
  {
    if ( c >= 'A' && c <= 'Z' ) {
      return c - 'A';
    }

    if ( c >= 'a' && c <= 'z' ) {
      return c - 'a' + 26;
    }

    if ( c >= '0' && c <= '9' ) {
      return c - '0' + 52;
    }

    if ( c == '+' ) {
      return 62;
    }

    if ( c == '/' ) {
      return 63;
    }

    return -1;
  }

  static size_t Base64Decode( const char *in, size_t in_size )
  {
    uint32_t value;
    int      bits;
    size_t   i;
    size_t   n;

    value = 0;
    bits = 0;
    n = 0;

    for ( i = 0; i < in_size; ++i ) {
      int v;

      if ( in[ i ] == '\n' ) {
        continue;
      }

      if ( in[ i ] == '=' ) {
        break;
      }

      v = Base64Value( in[ i ] );

      if ( v < 0 ) {
        return SIZE_MAX;
      }

      value = ( value << 6 ) | (uint32_t) v;
      bits += 6;

      if ( bits >= 8 ) {
        bits -= 8;

        if ( n >= sizeof( dump ) ) {
          return SIZE_MAX;
        }

        dump[ n ] = (uint8_t) ( value >> bits );
        ++n;
      }
    }

    return n;
  }

  static bool StreamNext( Stream *stream, rtems_record_item *item )
  {
    if ( stream->pos + sizeof( *item ) > stream->size ) {
      return false;
    }

    memcpy( item, &stream->data[ stream->pos ], sizeof( *item ) );
    stream->pos += sizeof( *item );
    return true;
  }

  static void PushLast( rtems_record_item *last, const rtems_record_item *item )
  {
    last[ 0 ] = last[ 1 ];
    last[ 1 ] = last[ 2 ];
    last[ 2 ] = last[ 3 ];
    last[ 3 ] = *item;
  }

  static void CheckFatalItems(
    const rtems_record_item *items,
    rtems_fatal_source       source,
    rtems_fatal_code         code,
    sbintime_t               before,
    sbintime_t               after
  )
  {
    sbintime_t uptime;

    T_eq_u32( RTEMS_RECORD_GET_EVENT( items[ 0 ].event ), RTEMS_RECORD_UPTIME_LOW );
    T_eq_u32(
      RTEMS_RECORD_GET_EVENT( items[ 1 ].event ),
      RTEMS_RECORD_UPTIME_HIGH
    );
    T_eq_u32(
      RTEMS_RECORD_GET_EVENT( items[ 2 ].event ),
      RTEMS_RECORD_FATAL_SOURCE
    );
    T_eq_ulong( items[ 2 ].data, source );
    T_eq_u32( RTEMS_RECORD_GET_EVENT( items[ 3 ].event ), RTEMS_RECORD_FATAL_CODE );
    T_eq_ulong( items[ 3 ].data, code );
    uptime = (sbintime_t) ( ( (uint64_t) items[ 1 ].data << 32 ) |
                            (uint32_t) items[ 0 ].data );
    T_ge_ull( (unsigned long long) uptime, (unsigned long long) before );
    T_le_ull( (unsigned long long) uptime, (unsigned long long) after );
  }

  /*
   * Get the last four items of the section of the processor in the record
   * stream of the dump.
   */
  static bool GetLastItemsOfDump(
    size_t             size,
    uint32_t           cpu_index,
    rtems_record_item *last
  )
  {
    Stream            stream;
    rtems_record_item item;
    uint32_t          magic;
    size_t            count;
    bool              in_section;

    stream.data = dump;
    stream.size = size;
    stream.pos = 2 * sizeof( uint32_t );

    if ( size < stream.pos ) {
      return false;
    }

    memcpy( &magic, &dump[ sizeof( uint32_t ) ], sizeof( magic ) );

    if ( magic != RTEMS_RECORD_MAGIC ) {
      return false;
    }

    count = 0;
    in_section = false;

    while ( StreamNext( &stream, &item ) ) {
      if ( item.event == RTEMS_RECORD_PROCESSOR ) {
        in_section = item.data == cpu_index;
        continue;
      }

      if ( in_section ) {
        PushLast( last, &item );
        ++count;
      }
    }

    return count >= 4;
  }

  static bool IsShutdownResponse( const rtems_record_item *last )
  {
  #if defined( RTEMS_SMP )
    return RTEMS_RECORD_GET_EVENT( last[ 2 ].event ) == RTEMS_RECORD_FATAL_SOURCE &&
           last[ 2 ].data == RTEMS_FATAL_SOURCE_SMP &&
           RTEMS_RECORD_GET_EVENT( last[ 3 ].event ) == RTEMS_RECORD_FATAL_CODE &&
           last[ 3 ].data == SMP_FATAL_SHUTDOWN_RESPONSE;
  #else
    (void) last;
    return false;
  #endif
  }

  static bool GetLastItemsOfBuffer( uint32_t cpu_index, rtems_record_item *last );

  /*
   * Wait until the processor produced the items of the SMP shutdown response.
   * They are in the dump or in the record buffer of the processor.
   */
  static bool WaitForShutdownResponse(
    uint32_t           cpu_index,
    rtems_record_item *last
  )
  {
    uint32_t i;

    memset( last, 0, 4 * sizeof( *last ) );

    if (
      decoded_size != SIZE_MAX &&
      GetLastItemsOfDump( decoded_size, cpu_index, last ) &&
      IsShutdownResponse( last )
    ) {
      return true;
    }

    for ( i = 0; i < 1000000; ++i ) {
      if ( GetLastItemsOfBuffer( cpu_index, last ) && IsShutdownResponse( last ) ) {
        return true;
      }
    }

    return false;
  }

  static bool GetLastItemsOfBuffer( uint32_t cpu_index, rtems_record_item *last )
  {
    rtems_record_fetch_control control;
    rtems_record_item          items[ 64 ];
    rtems_record_fetch_status  status;
    size_t                     count;

    rtems_record_fetch_initialize( &control, items, RTEMS_ARRAY_SIZE( items ) );
    count = 0;

    do {
      uint32_t current;
      size_t   i;

      status = rtems_record_fetch( &control );
      current = (uint32_t) control.fetched_items[ 0 ].data;

      for ( i = 1; i < control.fetched_count; ++i ) {
        const rtems_record_item *item;

        item = &control.fetched_items[ i ];

        if (
          current != cpu_index || item->event == RTEMS_RECORD_PER_CPU_OVERFLOW
        ) {
          continue;
        }

        PushLast( last, item );
        ++count;
      }
    } while ( status == RTEMS_RECORD_FETCH_CONTINUE );

    return count >= 4;
  }
test-target: testsuites/validation/tr-record-fatal-dump.c
test-teardown: null
type: test-case
