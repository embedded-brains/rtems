test-actions:
- action-brief: |
    Install an interrupt entry for a testable interrupt vector. The handler
    produces an item. Enable the vector and raise it. Remove the interrupt entry.
  action-code: |
    rtems_status_code     sc;
    rtems_interrupt_entry entry;

    rtems_interrupt_entry_initialize( &entry, InterruptHandler, ctx, "Test" );
    sc = rtems_interrupt_entry_install(
      ctx->vector,
      RTEMS_INTERRUPT_SHARED,
      &entry
    );
    T_rsc_success( sc );
    ClearRecords();
    (void) rtems_interrupt_vector_enable( ctx->vector );
    sc = RaiseSoftwareInterrupt( ctx->vector );
    T_rsc_success( sc );
    (void) rtems_interrupt_vector_disable( ctx->vector );
    CollectRecords( ctx );
    KeepTestItems( ctx );
    sc = rtems_interrupt_entry_remove( ctx->vector, &entry );
    T_rsc_success( sc );
  checks:
  - brief: |
      Check that the system produced an interrupt entry item with the vector number
      before the item of the handler and an interrupt exit item with the vector
      number after it.
    code: |
      size_t i;

      T_eq_u32( ctx->handler_counter, 1 );
      T_eq_ulong( ctx->overflow, 0 );
      i = FindItem( ctx, 0, RTEMS_RECORD_USER( 1 ), ctx->vector );
      T_ne_sz( i, SIZE_MAX );
      T_ge_sz( i, 1 );

      if ( i != SIZE_MAX && i >= 1 ) {
        T_true( IsItem( ctx, i - 1, RTEMS_RECORD_INTERRUPT_ENTRY, ctx->vector ) );
        T_true( IsItem( ctx, i + 1, RTEMS_RECORD_INTERRUPT_EXIT, ctx->vector ) );
      }
    links:
    - role: validation
      uid: ../req/interrupt-entry-exit
  links: []
- action-brief: |
    Enable the testable interrupt vector, which has no interrupt entry, and raise
    it. The default interrupt handler of the test replaces the spurious interrupt
    fatal error.
  action-code: |
    rtems_status_code sc;

    ClearRecords();
    default_handler_context = ctx;
    (void) rtems_interrupt_vector_enable( ctx->vector );
    sc = RaiseSoftwareInterrupt( ctx->vector );
    T_rsc_success( sc );
    (void) rtems_interrupt_vector_disable( ctx->vector );
    default_handler_context = NULL;
    CollectRecords( ctx );
    KeepTestItems( ctx );
  checks:
  - brief: |
      Check that the system produced an interrupt entry item and an interrupt exit
      item with the vector number around the call of the default interrupt handler.
    code: |
      size_t i;

      T_eq_u32( ctx->default_handler_counter, 1 );
      T_eq_ulong( ctx->overflow, 0 );
      i = FindItem( ctx, 0, RTEMS_RECORD_INTERRUPT_ENTRY, ctx->vector );
      T_ne_sz( i, SIZE_MAX );
      T_true( IsItem( ctx, i + 1, RTEMS_RECORD_INTERRUPT_EXIT, ctx->vector ) );
    links:
    - role: validation
      uid: ../req/interrupt-entry-exit
  links: []
