links: []
test-actions:
- action-brief: |
    Call ${../if/produce:/name} once in a helper function with the maskable
    interrupts disabled.
  action-code: |
    static const rtems_record_item expected[] = {
      { RTEMS_RECORD_USER( 1 ), DATA( 0 ) },
    };
    void *ra;

    Begin( ctx );
    ra = Produce( ctx );
    End( ctx );
  checks:
  - brief: |
      Check that the call of ${../if/produce:/name} produced the expected items in
      the record buffer of the processor.
    code: |
      CheckSegment( ctx, 0, expected, RTEMS_ARRAY_SIZE( expected ), ra, Produce );
    links:
    - role: validation
      uid: ../req/produce
    - role: validation
      uid: ../req/buffer-append
  - brief: |
      Check that the items produced by ${../if/produce:/name} have the time stamp
      read before the first item.
    code: |
      CheckTime( ctx, 0 );
    links:
    - role: validation
      uid: ../req/buffer-time-stamp
  links: []
