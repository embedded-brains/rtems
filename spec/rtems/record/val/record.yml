      uid: ../req/buffer-time-stamp
  - brief: |
      Check that ${../if/interrupt-enable:/name} restored the interrupt level.
    code: |
      T_true( ctx->enabled_after_enable );
    links:
    - role: validation
      uid: ../req/interrupt-enable
  - brief: |
      Check that ${../if/interrupt-enable:/name} produced the expected item directly
      after the item of ${../if/interrupt-disable:/name}.
    code: |
      CheckSegment(
        ctx,
        1,
        interrupt_enable_items,
        RTEMS_ARRAY_SIZE( interrupt_enable_items ),
        ra,
        InterruptDisableEnable
      );
      CheckTime( ctx, 1 );
    links:
    - role: validation
      uid: ../req/interrupt-enable-item
    - role: validation
      uid: ../req/buffer-time-stamp
  links: []
- action-brief: |
    Prepare a record context with ${../if/prepare:/name} while the maskable
    interrupts are enabled. Add two items with ${../if/add:/name}. Fetch the items
    of the processor. Commit the record context with ${../if/commit:/name}. Fetch
    the items of the processor again.
  action-code: |
    rtems_record_context context;
    rtems_counter_ticks  before;
    rtems_counter_ticks  after;
    Record_Control      *control;
    uint32_t             cpu_index;
    bool                 enabled_before;
    bool                 enabled_after_prepare;
    bool                 enabled_after_commit;
    size_t               hidden_count;

    enabled_before = _ISR_Get_level() == 0;
    before = rtems_counter_read();
    rtems_record_prepare( &context );
    after = rtems_counter_read();
    enabled_after_prepare = _ISR_Get_level() == 0;
    cpu_index = rtems_scheduler_get_processor();
    control = _Per_CPU_Get()->record;
    control->tail = _Record_Head( control );
    rtems_record_add( &context, RTEMS_RECORD_USER( 5 ), DATA( 0 ) );
    rtems_record_add( &context, RTEMS_RECORD_USER( 6 ), DATA( 1 ) );
    hidden_count = Fetch( ctx, cpu_index, FETCH_STORAGE_COUNT );
    rtems_record_commit( &context );
    enabled_after_commit = _ISR_Get_level() == 0;
    (void) Fetch( ctx, cpu_index, FETCH_STORAGE_COUNT );
  checks:
  - brief: |
      Check that ${../if/prepare:/name} disabled the maskable interrupts. Check that
      it initialized the record context with the record buffer of the current
      processor, the previous interrupt level, and the time stamp of the counter.
      This shows that ${../if/context:/name} provided the storage of the record
      context.
    code: |
      T_true( enabled_before );
      T_false( enabled_after_prepare );
      T_eq_ptr( context.control, control );
      T_true( _ISR_Is_enabled( context.level ) );
      T_eq_u32( RTEMS_RECORD_GET_EVENT( context.now ), 0 );
      CheckTimeStamp( RTEMS_RECORD_GET_TIME( context.now ), before, after );
    links:
    - role: validation
      uid: ../req/prepare
    - role: validation
      uid: ../req/context
  - brief: |
      Check that the items which ${../if/add:/name} appended were invisible to
      ${../if/fetch:/name} before the commit.
    code: |
      T_eq_sz( hidden_count, 0 );
    links:
    - role: validation
      uid: ../req/add-hidden
  - brief: |
      Check that ${../if/commit:/name} made the items visible to ${../if/fetch:/name}
      and restored the interrupt level.
    code: |
      T_true( enabled_after_commit );
      T_ge_sz( ctx->fetch.fetched_count, 3 );
    links:
    - role: validation
      uid: ../req/commit
  - brief: |
      Check that ${../if/add:/name} appended the items with the time stamp of the
      record context, the event, and the event data.
    code: |
      if ( ctx->fetch.fetched_count >= 3 ) {
        const rtems_record_item *items;

        items = &ctx->fetch.fetched_items[ 1 ];
        T_eq_u32( items[ 0 ].event, context.now | RTEMS_RECORD_USER( 5 ) );
        T_eq_ulong( items[ 0 ].data, DATA( 0 ) );
        T_eq_u32( items[ 1 ].event, context.now | RTEMS_RECORD_USER( 6 ) );
        T_eq_ulong( items[ 1 ].data, DATA( 1 ) );
      }
    links:
    - role: validation
      uid: ../req/add
  links: []
- action-brief: |
    Disable the maskable interrupts. Prepare a record context with
    ${../if/prepare-critical:/name} for the processor with the highest index. Add
    an item with ${../if/add:/name}. Fetch the items of the processor. Commit the
    record context with ${../if/commit-critical:/name}. Fetch the items of the
    processor again. Enable the maskable interrupts.
  action-code: |
    rtems_record_context   context;
    rtems_interrupt_level  level;
    rtems_counter_ticks    before;
    rtems_counter_ticks    after;
    const Per_CPU_Control *cpu;
    Record_Control        *control;
    uint32_t               cpu_index;
    bool                   enabled_after_commit;
    size_t                 hidden_count;
    size_t                 visible_count;
    rtems_record_item      item;

    cpu_index = rtems_scheduler_get_processor_maximum() - 1;
    cpu = _Per_CPU_Get_by_index( cpu_index );
    control = cpu->record;
    memset( &item, 0, sizeof( item ) );

    rtems_interrupt_local_disable( level );
    control->tail = _Record_Head( control );
    before = rtems_counter_read();
    rtems_record_prepare_critical( &context, cpu );
    after = rtems_counter_read();
    rtems_record_add( &context, RTEMS_RECORD_USER( 7 ), DATA( 0 ) );
    hidden_count = Fetch( ctx, cpu_index, FETCH_STORAGE_COUNT );
    rtems_record_commit_critical( &context );
    enabled_after_commit = _ISR_Get_level() == 0;
    visible_count = Fetch( ctx, cpu_index, FETCH_STORAGE_COUNT );

    if ( visible_count > 0 ) {
      item = ctx->fetch.fetched_items[ 1 ];
    }

    rtems_interrupt_local_enable( level );
  checks:
  - brief: |
      Check that ${../if/prepare-critical:/name} initialized the record context with
      the record buffer of the processor and the time stamp of the counter.
    code: |
      T_eq_ptr( context.control, control );
      T_eq_u32( RTEMS_RECORD_GET_EVENT( context.now ), 0 );
      CheckTimeStamp( RTEMS_RECORD_GET_TIME( context.now ), before, after );
    links:
    - role: validation
      uid: ../req/prepare-critical
    - role: validation
      uid: ../req/context
  - brief: |
      Check that the item which ${../if/add:/name} appended was invisible to
      ${../if/fetch:/name} before the commit.
    code: |
      T_eq_sz( hidden_count, 0 );
    links:
    - role: validation
      uid: ../req/add-hidden
  - brief: |
      Check that ${../if/commit-critical:/name} made the item visible to
      ${../if/fetch:/name} and left the maskable interrupts disabled.
    code: |
      T_false( enabled_after_commit );
      T_eq_sz( visible_count, 1 );
      T_eq_u32( item.event, context.now | RTEMS_RECORD_USER( 7 ) );
      T_eq_ulong( item.data, DATA( 0 ) );
    links:
    - role: validation
      uid: ../req/commit-critical
    - role: validation
      uid: ../req/add
  links: []
- action-brief: |
    Get the record buffer of each configured processor. Disable the maskable
    interrupts. Produce three items more than the capacity of the record buffer of
    the current processor. Copy the record buffer. Enable the maskable interrupts.
  action-code: |
    rtems_interrupt_level  level;
    const Per_CPU_Control *cpu;
    Record_Control        *control;
    unsigned int           capacity;
    unsigned int           head;
    unsigned int           i;
    uint32_t               cpu_index;
    uint32_t               cpu_max;
    bool                   distinct;

    cpu_max = rtems_scheduler_get_processor_maximum();
    distinct = true;

    for ( cpu_index = 0; cpu_index < cpu_max; ++cpu_index ) {
      uint32_t other;

      ctx->capacity[ cpu_index ] = GetControl( cpu_index )->mask + 1;

      for ( other = 0; other < cpu_index; ++other ) {
        if ( GetControl( other ) == GetControl( cpu_index ) ) {
          distinct = false;
        }
      }
    }

    rtems_interrupt_local_disable( level );
    cpu = _Per_CPU_Get();
    control = cpu->record;
    capacity = control->mask + 1;

    for ( i = 0; i < capacity + 3; ++i ) {
      rtems_record_context context;

      rtems_record_prepare_critical( &context, cpu );
      rtems_record_add( &context, RTEMS_RECORD_USER( 8 ), DATA( i ) );
      rtems_record_commit_critical( &context );
    }

    head = _Record_Head( control );

    for ( i = 0; i < capacity && i < RTEMS_ARRAY_SIZE( ctx->items ); ++i ) {
      ctx->items[ i ] = control->Items[ _Record_Index( control, head + i ) ];
    }

    control->tail = head;
    rtems_interrupt_local_enable( level );
  checks:
  - brief: |
      Check that each configured processor has a record buffer of its own with a
      capacity of ${/acfg/if/record-per-processor-items:/name} items.
    code: |
      T_true( distinct );

      for ( cpu_index = 0; cpu_index < cpu_max; ++cpu_index ) {
        T_eq_uint( ctx->capacity[ cpu_index ], TEST_RECORD_PER_PROCESSOR_ITEMS );
      }
    links:
    - role: validation
      uid: ../req/buffer
  - brief: |
      Check that the record buffer contains the last items in the order of their
      production. The first three items replaced the oldest items of the full record
      buffer.
    code: |
      T_eq_uint( capacity, TEST_RECORD_PER_PROCESSOR_ITEMS );

      for ( i = 0; i < capacity && i < RTEMS_ARRAY_SIZE( ctx->items ); ++i ) {
        T_eq_u32(
          RTEMS_RECORD_GET_EVENT( ctx->items[ i ].event ),
          RTEMS_RECORD_USER( 8 )
        );
        T_eq_ulong( ctx->items[ i ].data, DATA( i + 3 ) );
      }
    links:
    - role: validation
      uid: ../req/buffer-overwrite
  links: []
- action-brief: |
    Produce an item in the record buffer of the processor with index zero. Fill a
    record fetch control with a pattern and initialize it with
    ${../if/fetch-initialize:/name}. Fetch the items.
  action-code: |
    rtems_interrupt_level     level;
    const Per_CPU_Control    *cpu;
    rtems_record_fetch_status status;
    rtems_record_context      context;

    cpu = _Per_CPU_Get_by_index( 0 );
    rtems_interrupt_local_disable( level );
    cpu->record->tail = _Record_Head( cpu->record );
    rtems_record_prepare_critical( &context, cpu );
    rtems_record_add( &context, RTEMS_RECORD_USER( 9 ), DATA( 0 ) );
    rtems_record_commit_critical( &context );
    rtems_interrupt_local_enable( level );

    memset( &ctx->fetch, 0xa5, sizeof( ctx->fetch ) );
    memset( ctx->fetch_storage, 0, sizeof( ctx->fetch_storage ) );
    rtems_record_fetch_initialize( &ctx->fetch, ctx->fetch_storage, 4 );
    status = rtems_record_fetch( &ctx->fetch );
  checks:
  - brief: |
      Check that the call of ${../if/fetch:/name} fetched the item of the processor
      with index zero into the array of the record fetch control. This shows that
      ${../if/fetch-control:/name} provided the storage of the record fetch control.
    code: |
      T_ne_int( status, RTEMS_RECORD_FETCH_INVALID_ITEM_COUNT );
      T_eq_sz( ctx->fetch.fetched_count, 2 );
      T_ge_uptr(
        (uintptr_t) ctx->fetch.fetched_items,
        (uintptr_t) &ctx->fetch_storage[ 0 ]
      );
      T_le_uptr(
        (uintptr_t) ( ctx->fetch.fetched_items + ctx->fetch.fetched_count ),
        (uintptr_t) &ctx->fetch_storage[ 4 ]
      );

      if ( ctx->fetch.fetched_count == 2 ) {
        T_eq_u32( ctx->fetch.fetched_items[ 0 ].event, RTEMS_RECORD_PROCESSOR );
        T_eq_ulong( ctx->fetch.fetched_items[ 0 ].data, 0 );
        T_eq_u32(
          RTEMS_RECORD_GET_EVENT( ctx->fetch.fetched_items[ 1 ].event ),
          RTEMS_RECORD_USER( 9 )
        );
        T_eq_ulong( ctx->fetch.fetched_items[ 1 ].data, DATA( 0 ) );
      }
    links:
    - role: validation
      uid: ../req/fetch-initialize
    - role: validation
      uid: ../req/fetch-control
  links: []
- action-brief: |
    Get the item count for a fetch with ${../if/get-item-count-for-fetch:/name}.
    Fill the record buffer of the processor with index zero beyond its capacity.
    Fetch the items with this item count. Fill the record buffer again. Fetch the
    items with the item count minus one.
  action-code: |
    size_t          count;
    Record_Control *control;
    unsigned int    head_all;
    unsigned int    tail_all;
    unsigned int    head_less;
    unsigned int    tail_less;

    count = rtems_record_get_item_count_for_fetch();
    control = GetControl( 0 );

    Fill( 0 );
    (void) Fetch( ctx, 0, count );
    head_all = _Record_Head( control );
    tail_all = control->tail;

    Fill( 0 );
    (void) Fetch( ctx, 0, count - 1 );
    head_less = _Record_Head( control );
    tail_less = control->tail;
    control->tail = head_less;
  checks:
  - brief: |
      Check that one fetch with the item count fetched all items of the record
      buffer. Check that one fetch with the item count minus one left items in the
      record buffer.
    code: |
      T_le_sz( count, FETCH_STORAGE_COUNT );
      T_eq_uint( tail_all, head_all );
      T_ne_uint( tail_less, head_less );
    links:
    - role: validation
      uid: ../req/get-item-count-for-fetch
  links: []
- action-brief: |
    Produce three items in the record buffer of the current processor. Call
    ${../if/dump:/name} with a handler which collects the output.
  action-code: |
    ProduceDumpItems( ctx );
    ctx->dump_size = 0;
    ctx->dump_calls = 0;
    ctx->dump_arg_ok = true;
    rtems_record_dump( DumpChunk, ctx );
    StreamInit( &ctx->stream, ctx->dump, ctx->dump_size );
  checks:
  - brief: |
      Check that ${../if/dump:/name} called the handler with the argument.
    code: |
      T_gt_sz( ctx->dump_calls, 0 );
      T_true( ctx->dump_arg_ok );
    links:
    - role: validation
      uid: ../req/dump-argument
  - brief: |
      Check that the output starts with the stream header.
    code: |
      CheckFormatAndMagic( &ctx->stream );
    links:
    - role: validation
      uid: ../req/dump-stream-header
  - brief: |
      Check the content of the stream header.
    code: |
      CheckHeaderItems( &ctx->stream );
    links:
    - role: validation
      uid: ../req/dump-stream-header-content
  - brief: |
      Check that the thread names follow the stream header. The name of the runner
      spans more than one item.
    code: |
      CheckThreadNames( &ctx->stream );
    links:
    - role: validation
      uid: ../req/dump-thread-names
  - brief: |
      Check that the fetched items of all processors follow the thread names.
    code: |
      CheckDumpItems( ctx, &ctx->stream );
    links:
    - role: validation
      uid: ../req/dump-items
  links: []
- action-brief: |
    Produce three items in the record buffer of the current processor. Call
    ${../if/dump-base64:/name} with a handler which collects the output.
  action-code: |
    size_t i;
    size_t column;
    bool   lines_ok;

    ProduceDumpItems( ctx );
    ctx->base64_size = 0;
    ctx->base64_arg_ok = true;
    rtems_record_dump_base64( Base64PutChar, ctx );
    lines_ok = true;
    column = 0;

    for ( i = 0; i < ctx->base64_size; ++i ) {
      if ( ctx->base64[ i ] == '\n' ) {
        if ( column != 76 ) {
          lines_ok = false;
        }

        column = 0;
      } else {
        ++column;

        if ( column > 76 ) {
          lines_ok = false;
        }
      }
    }

    ctx->dump_size = Base64Decode(
      ctx->base64,
      ctx->base64_size,
      ctx->dump,
      sizeof( ctx->dump )
    );
    StreamInit( &ctx->stream, ctx->dump, ctx->dump_size );
  checks:
  - brief: |
      Check that ${../if/dump-base64:/name} output a newline character after each 76
      characters.
    code: |
      T_gt_sz( ctx->base64_size, 76 );
      T_true( lines_ok );
      T_lt_sz( column, 76 );
    links:
    - role: validation
      uid: ../req/dump-base64-line
  - brief: |
      Check that ${../if/dump-base64:/name} called the handler with the argument and
      output the base64 encoding of the data of ${../if/dump:/name}.
    code: |
      T_true( ctx->base64_arg_ok );
      T_ne_sz( ctx->dump_size, SIZE_MAX );
      CheckFormatAndMagic( &ctx->stream );
      CheckHeaderItems( &ctx->stream );
      CheckThreadNames( &ctx->stream );
      CheckDumpItems( ctx, &ctx->stream );
    links:
    - role: validation
      uid: ../req/dump-base64
  links: []
- action-brief: |
    Get the text of each enumerator of ${../if/event:/name} with
    ${../if/event-text:/name}.
  action-code: |
    int i;
  checks:
  - brief: |
      Check that the text is the name of the enumerator without the `RTEMS_RECORD_`
      prefix.
    code: |
      for ( i = 0; i <= RTEMS_RECORD_LAST; ++i ) {
        const char *text;

        text = rtems_record_event_text( (rtems_record_event) i );
        T_not_null( text );

        if ( text == NULL ) {
          continue;
        }

        if ( i < RTEMS_RECORD_USER_0 ) {
          T_eq_str( text, system_event_names[ i ] );
        } else {
          char user[ 16 ];

          UserEventName( user, i - RTEMS_RECORD_USER_0 );
          T_eq_str( text, user );
        }
      }
    links:
    - role: validation
      uid: ../req/event-text
  links: []
- action-brief: |
    Evaluate the constants of the event recording.
  action-code: |
    /* No action */
  checks:
  - brief: |
      Check the value of ${../if/event-bits:/name}.
    code: |
      T_eq_int( RTEMS_RECORD_EVENT_BITS, 10 );
    links:
    - role: validation
      uid: ../req/event-bits
  - brief: |
      Check the value of ${../if/time-bits:/name}.
    code: |
      T_eq_int( RTEMS_RECORD_TIME_BITS, 22 );
    links:
    - role: validation
      uid: ../req/time-bits
  - brief: |
      Check the value of ${../if/the-version:/name}.
    code: |
      T_eq_int( RTEMS_RECORD_THE_VERSION, 10 );
    links:
    - role: validation
      uid: ../req/the-version
  - brief: |
      Check the value of ${../if/magic:/name}.
    code: |
      T_eq_u32( RTEMS_RECORD_MAGIC, 0x82e14ec1 );
    links:
    - role: validation
      uid: ../req/magic
  - brief: |
      Check the value of ${../if/format-be-32:/name}.
    code: |
      T_eq_u32( RTEMS_RECORD_FORMAT_BE_32, 0x33333333 );
    links:
    - role: validation
      uid: ../req/format-be-32
  - brief: |
      Check the value of ${../if/format-be-64:/name}.
    code: |
      T_eq_u32( RTEMS_RECORD_FORMAT_BE_64, 0x44444444 );
    links:
    - role: validation
      uid: ../req/format-be-64
  - brief: |
      Check the value of ${../if/format-le-32:/name}.
    code: |
      T_eq_u32( RTEMS_RECORD_FORMAT_LE_32, 0x11111111 );
    links:
    - role: validation
      uid: ../req/format-le-32
  - brief: |
      Check the value of ${../if/format-le-64:/name}.
    code: |
      T_eq_u32( RTEMS_RECORD_FORMAT_LE_64, 0x22222222 );
    links:
    - role: validation
      uid: ../req/format-le-64
  - brief: |
      Check the value of ${../if/last:/name}.
    code: |
      T_eq_int( RTEMS_RECORD_LAST, RTEMS_RECORD_USER_511 );
    links:
    - role: validation
      uid: ../req/last
  - brief: |
      Check the value of ${../if/no-time-last:/name}.
    code: |
      T_eq_int( RTEMS_RECORD_NO_TIME_LAST, RTEMS_RECORD_VERSION_CONTROL_KEY );
    links:
    - role: validation
      uid: ../req/no-time-last
  - brief: |
      Check the value of ${../if/event:/enumerators[0]/name}.
    code: |
      T_eq_int( RTEMS_RECORD_EMPTY, 0 );
    links:
    - role: validation
      uid: ../req/event-empty
  - brief: |
      Check the value of ${../if/event:/enumerators[42]/name}.
    code: |
      T_eq_int( RTEMS_RECORD_CONNECT_ENTRY, 42 );
    links:
    - role: validation
      uid: ../req/event-connect-entry
  - brief: |
      Check the value of ${../if/event:/enumerators[1023]/name}.
    code: |
      T_eq_int( RTEMS_RECORD_USER_511, 1023 );
    links:
    - role: validation
      uid: ../req/event-user-511
  links: []
- action-brief: |
    Evaluate the macros of the event recording.
  action-code: |
    uint32_t time_event;

    time_event = RTEMS_RECORD_TIME_EVENT(
      UINT32_C( 0x2abcde ),
      RTEMS_RECORD_USER( 5 )
    );
  checks:
  - brief: |
      Check that ${../if/time-event:/name} evaluated to the time event with the time
      stamp in the upper bits and the event in the lower bits.
    code: |
      T_eq_u32( time_event, 0xaaf37a05 );
    links:
    - role: validation
      uid: ../req/time-event
  - brief: |
      Check that ${../if/get-time:/name} evaluates to the time stamp of the time
      event.
    code: |
      T_eq_u32( RTEMS_RECORD_GET_TIME( UINT32_C( 0xaaf37a05 ) ), 0x2abcde );
    links:
    - role: validation
      uid: ../req/get-time
  - brief: |
      Check that ${../if/get-event:/name} evaluates to the event of the time event.
    code: |
      T_eq_u32( RTEMS_RECORD_GET_EVENT( UINT32_C( 0xaaf37a05 ) ), 0x205 );
    links:
    - role: validation
      uid: ../req/get-event
  - brief: |
      Check that ${../if/user:/name} evaluates to the user event of the index.
    code: |
      T_eq_int( RTEMS_RECORD_USER( 0 ), RTEMS_RECORD_USER_0 );
      T_eq_int( RTEMS_RECORD_USER( 5 ), 517 );
      T_eq_int( RTEMS_RECORD_USER( 511 ), RTEMS_RECORD_USER_511 );
    links:
    - role: validation
      uid: ../req/user
  links: []
- action-brief: |
    Evaluate the types of the event recording.
  action-code: |
    rtems_record_fetch_status status[ 3 ];

    status[ 0 ] = RTEMS_RECORD_FETCH_DONE;
    status[ 1 ] = RTEMS_RECORD_FETCH_CONTINUE;
    status[ 2 ] = RTEMS_RECORD_FETCH_INVALID_ITEM_COUNT;
  checks:
  - brief: |
      Check that ${../if/data:/name} is an unsigned integer type which can hold a
      value of the type `uintptr_t`.
    code: |
      T_ge_sz( sizeof( rtems_record_data ), sizeof( uintptr_t ) );
      T_gt_ulong( (rtems_record_data) -1, 0 );
      T_eq_uptr( (uintptr_t) (rtems_record_data) UINTPTR_MAX, UINTPTR_MAX );
    links:
    - role: validation
      uid: ../req/data
  - brief: |
      Check the members and the layout of ${../if/item:/name}.
    code: |
      T_true( IS_TYPE( ( (rtems_record_item *) 0 )->event, uint32_t ) );
      T_true( IS_TYPE( ( (rtems_record_item *) 0 )->data, rtems_record_data ) );
      T_eq_sz( offsetof( rtems_record_item, event ), 0 );
      T_eq_sz( offsetof( rtems_record_item, data ), 4 );
      T_eq_sz( sizeof( rtems_record_item ), 4 + sizeof( rtems_record_data ) );
    links:
    - role: validation
      uid: ../req/item
  - brief: |
      Check the members and the layout of ${../if/item-32:/name}.
    code: |
      T_true( IS_TYPE( ( (rtems_record_item_32 *) 0 )->event, uint32_t ) );
      T_true( IS_TYPE( ( (rtems_record_item_32 *) 0 )->data, uint32_t ) );
      T_eq_sz( offsetof( rtems_record_item_32, event ), 0 );
      T_eq_sz( offsetof( rtems_record_item_32, data ), 4 );
      T_eq_sz( sizeof( rtems_record_item_32 ), 8 );
    links:
    - role: validation
      uid: ../req/item-32
  - brief: |
      Check the members and the layout of ${../if/item-64:/name}.
    code: |
      T_true( IS_TYPE( ( (rtems_record_item_64 *) 0 )->event, uint32_t ) );
      T_true( IS_TYPE( ( (rtems_record_item_64 *) 0 )->data, uint64_t ) );
      T_eq_sz( offsetof( rtems_record_item_64, event ), 0 );
      T_eq_sz( offsetof( rtems_record_item_64, data ), 4 );
      T_eq_sz( sizeof( rtems_record_item_64 ), 12 );
    links:
    - role: validation
      uid: ../req/item-64
  - brief: |
      Check that ${../if/dump-chunk:/name} is a pointer to a function with the
      specified parameters which returns no value.
    code: |
      T_true( IS_TYPE(
        (rtems_record_dump_chunk) NULL,
        void ( * )( void *, const void *, size_t )
      ) );
    links:
    - role: validation
      uid: ../req/dump-chunk
  - brief: |
      Check that the enumerators of ${../if/fetch-status:/name} have distinct values.
    code: |
      T_ne_int( status[ 0 ], status[ 1 ] );
      T_ne_int( status[ 0 ], status[ 2 ] );
      T_ne_int( status[ 1 ], status[ 2 ] );
    links:
    - role: validation
      uid: ../req/fetch-status
  links: []
- action-brief: |
    Get the items which the system produced during the initialization of the device
    drivers.
  action-code: |
    /* The system initialization collected the items */
  checks:
  - brief: |
      Check that the system produced the uptime items with an uptime between the
      uptimes before and after the production.
    code: |
      T_eq_sz( uptime_init.count, 2 );

      if ( uptime_init.count == 2 ) {
        CheckUptimePair(
          &uptime_init.items[ 0 ],
          uptime_init.before,
          uptime_init.after
        );
      }
    links:
    - role: validation
      uid: ../req/uptime-initialization
  links: []
- action-brief: |
    Insert the uptime watchdogs again. Wait for two times the specified interval of
    the periodic uptime items plus two clock ticks. Remove the uptime watchdogs.
    Fetch the items of each processor.
  action-code: |
    sbintime_t     before;
    sbintime_t     after;
    rtems_interval interval;
    uint32_t       cpu_index;
    uint32_t       cpu_max;

    cpu_max = rtems_scheduler_get_processor_maximum();

    for ( cpu_index = 0; cpu_index < cpu_max; ++cpu_index ) {
      Record_Control *control;

      control = GetControl( cpu_index );
      control->tail = _Record_Head( control );
    }

    interval = UptimeInterval();

    before = _Timecounter_Sbinuptime();
    InsertUptimeWatchdogs( ctx );
    (void) rtems_task_wake_after( 2 * interval + 2 );
    RemoveUptimeWatchdogs( ctx );
    after = _Timecounter_Sbinuptime();
  checks:
  - brief: |
      Check that each processor produced at least two uptime item pairs. Check that
      the uptimes of consecutive pairs differ by the specified interval.
    code: |
      for ( cpu_index = 0; cpu_index < cpu_max; ++cpu_index ) {
        CheckPeriodicUptime( ctx, cpu_index, before, after );
      }
    links:
    - role: validation
      uid: ../req/uptime-periodic
  links: []
