  ${../if/caller-4:/params[1]/name} parameter and a
  ${../glossary/recorditem:/term} with the event specified by the
  ${../if/caller-4:/params[2]/name} parameter and the event data specified by the
  ${../if/caller-4:/params[3]/name} parameter.
