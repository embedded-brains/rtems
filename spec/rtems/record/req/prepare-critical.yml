text: |
  The ${../if/prepare-critical:/name} directive shall initialize the record
  context referenced by the ${../if/prepare-critical:/params[0]/name} parameter
  with the ${../glossary/recordbuffer:/term} of the processor referenced by the
  ${../if/prepare-critical:/params[1]/name} parameter and the value of the
  ${/glossary/rtemscounter:/term} as ${../glossary/timestamp:/term}.
