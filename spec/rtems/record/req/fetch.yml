test-context-support: |
  #define ITEM_COUNT_INVALID 0

  #define ITEM_COUNT_SMALL 1

  #define ITEM_COUNT_ENOUGH 2

  #define ITEM_COUNT_ENOUGH_MAX 64

  #define BUFFER_EMPTY 0

  #define BUFFER_PARTIAL 1

  #define BUFFER_OVERFLOW 2

  #define BUFFER_LOST 3

  #define PRODUCER_IDLE 0

  #define PRODUCER_SOME 1

  #define PRODUCER_ALL 2

  #define PRODUCER_UNCOMMITTED 3
test-description: |
  The setup removes the uptime watchdog of each processor, so that only the test
  produces items. The test produces the items of a processor through
  ${../if/prepare-critical:/name} with the control of that processor. The data of
  the produced items increments by one for each item. A second call of
  ${../if/fetch:/name} after the action observes the processor which the record
  fetch control selected. For the producer states, an interrupt produces items
  while the call copies them. The interrupt produces only after the call moved
  the tail of the record buffer and before the call returned. The test repeats
  the interrupt test until the fetched items show the overwrite. For the
  uncommitted production, the interrupt writes the items without a commit, and
  the test commits them after the call returned. This emulates a producer on
  another processor. The call copies the items byte by byte, so the test does not
  check the data of the items which were in the copy at the interrupt.
