enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/fetch
- role: requirement-refinement
  uid: buffer
post-conditions:
- name: Status
  states:
  - name: Done
    test-code: |
      T_eq_int( ctx->status, RTEMS_RECORD_FETCH_DONE );
    text: |
      The return status of ${../if/fetch:/name} shall be ${../if/fetch-done:/name}.
  - name: Continue
    test-code: |
      T_eq_int( ctx->status, RTEMS_RECORD_FETCH_CONTINUE );
    text: |
      The return status of ${../if/fetch:/name} shall be
      ${../if/fetch-continue:/name}.
  - name: InvalidItemCount
    test-code: |
      T_eq_int( ctx->status, RTEMS_RECORD_FETCH_INVALID_ITEM_COUNT );
    text: |
      The return status of ${../if/fetch:/name} shall be
      ${../if/fetch-invalid-item-count:/name}.
  test-epilogue: null
  test-prologue: null
- name: Fetched
  states:
  - name: None
    test-code: |
      T_null( ctx->fetched_items );
    text: |
      The `fetched_items` member of the record fetch control shall be
      ${/c/if/null:/name}.
  - name: Header
    test-code: |
      CheckFetched( ctx, false, 0 );
    text: |
      The record fetch control shall reference exactly one fetched
      ${../glossary/recorditem:/term} with the event
      ${../if/event:/enumerators[9]/name} and the index of the processor as event
      data.
  - name: All
    test-code: |
      CheckFetched( ctx, false, ctx->expected_count );
    text: |
      The record fetch control shall reference a ${../glossary/recorditem:/term} with
      the event ${../if/event:/enumerators[9]/name} and the index of the processor as
      event data, followed by all ${../glossary/recorditem:/plural} which the
      ${../glossary/recordbuffer:/term} of the processor provided, from the oldest to
      the newest.
  - name: Part
    test-code: |
      T_eq_sz( ctx->expected_count, ctx->count - 2 );
      CheckFetched( ctx, false, ctx->expected_count );
    text: |
      The record fetch control shall reference a ${../glossary/recorditem:/term} with
      the event ${../if/event:/enumerators[9]/name} and the index of the processor as
      event data, followed by the oldest ${../glossary/recorditem:/plural} which the
      ${../glossary/recordbuffer:/term} of the processor provided with a count of the
      item count of the record fetch control minus two.
  - name: Overflow
    test-code: |
      CheckFetched( ctx, true, ctx->expected_count );
    text: |
      The record fetch control shall reference a ${../glossary/recorditem:/term} with
      the event ${../if/event:/enumerators[9]/name} and the index of the processor as
      event data, followed by a ${../glossary/recorditem:/term} with the event
      ${../if/event:/enumerators[8]/name} and the count of the lost
      ${../glossary/recorditem:/plural} as event data, followed by the oldest
      ${../glossary/recorditem:/plural} of the fetch which the
      ${../glossary/recordbuffer:/term} of the processor still provided.
  - name: OverflowOnly
    test-code: |
      T_eq_sz( ctx->expected_count, 0 );
      CheckFetched( ctx, true, 0 );
    text: |
      The record fetch control shall reference a ${../glossary/recorditem:/term} with
      the event ${../if/event:/enumerators[9]/name} and the index of the processor as
      event data, followed by a ${../glossary/recorditem:/term} with the event
      ${../if/event:/enumerators[8]/name} and the count of the lost
      ${../glossary/recorditem:/plural} as event data, and no other
      ${../glossary/recorditem:/term}.
  test-epilogue: null
  test-prologue: null
- name: Copy
  states:
  - name: Provided
    test-code: |
      CheckProvided( ctx );
    text: |
      Each ${../glossary/recorditem:/term} which the record fetch control references
      after the ${../if/event:/enumerators[9]/name} item and the optional
      ${../if/event:/enumerators[8]/name} item shall be a
      ${../glossary/recorditem:/term} which the ${../glossary/recordbuffer:/term} of
      the processor provided at the start of the call.
  - name: Replaced
    test-code: |
      CheckReplaced( ctx );
    text: |
      For each ${../glossary/recorditem:/term} which the call copied after the
      producer overwrote it, the record fetch control shall reference the
      ${../glossary/recorditem:/term} which the producer wrote in place of the
      overwritten ${../glossary/recorditem:/term}, and the count of the lost
      ${../glossary/recorditem:/plural} shall not include it.
  test-epilogue: null
  test-prologue: null
- name: Next
  states:
  - name: Same
    test-code: |
      T_eq_u32( ctx->next_cpu_index, ctx->cpu_index );

      if ( ctx->next_data_valid ) {
        T_eq_ulong( ctx->next_first_data, ctx->expected_next_data );
      }
    text: |
      The next call of ${../if/fetch:/name} with the record fetch control shall fetch
      the remaining ${../glossary/recorditem:/plural} of the same processor.
  - name: Following
    test-code: |
      T_eq_u32( ctx->next_cpu_index, ctx->cpu_index + 1 );
    text: |
      The next call of ${../if/fetch:/name} with the record fetch control shall fetch
      the ${../glossary/recorditem:/plural} of the processor with the next index.
  - name: First
    test-code: |
      T_eq_u32( ctx->next_cpu_index, 0 );
    text: |
      The next call of ${../if/fetch:/name} with the record fetch control shall fetch
      the ${../glossary/recorditem:/plural} of the processor with index zero.
  - name: Rejected
    test-code: |
      T_eq_int( ctx->next_status, RTEMS_RECORD_FETCH_INVALID_ITEM_COUNT );
    text: |
      The next call of ${../if/fetch:/name} with the record fetch control shall
      return ${../if/fetch-invalid-item-count:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: LastProcessor
  states:
  - name: 'Yes'
    test-code: |
      ctx->cpu_index = rtems_scheduler_get_processor_maximum() - 1;
    text: |
      While the index of the processor of the record fetch control is one less than
      the value returned by ${/rtems/scheduler/if/get-processor-maximum:/name}.
  - name: 'No'
    test-code: |
      if ( rtems_scheduler_get_processor_maximum() < 2 ) {
        ${.:skip}
      } else {
        ctx->cpu_index = 0;
      }
    text: |
      While the index of the processor of the record fetch control is less than the
      value returned by ${/rtems/scheduler/if/get-processor-maximum:/name} minus one.
  test-epilogue: null
  test-prologue: null
- name: Resume
  states:
  - name: 'No'
    test-code: |
      ctx->resume = false;
    text: |
      While the previous call of ${../if/fetch:/name} with the record fetch control
      fetched all ${../glossary/recorditem:/plural} of the processor which the
      ${../glossary/recordbuffer:/term} provided, or while no call of
      ${../if/fetch:/name} used the record fetch control.
  - name: 'Yes'
    test-code: |
      ctx->resume = true;
    text: |
      While the previous call of ${../if/fetch:/name} with the record fetch control
      left ${../glossary/recorditem:/plural} of the processor, because the item count
      of the record fetch control was less than the count of the provided
      ${../glossary/recorditem:/plural} plus two.
  test-epilogue: null
  test-prologue: null
- name: ItemCount
  states:
  - name: Invalid
    test-code: |
      ctx->item_count = ITEM_COUNT_INVALID;
    text: |
      While the item count of the record fetch control is less than three.
  - name: Small
    test-code: |
      ctx->item_count = ITEM_COUNT_SMALL;
    text: |
      While the item count of the record fetch control is at least three, while the
      item count is less than the count of the ${../glossary/recorditem:/plural}
      which the ${../glossary/recordbuffer:/term} of the processor provides plus two.
  - name: Enough
    test-code: |
      ctx->item_count = ITEM_COUNT_ENOUGH;
    text: |
      While the item count of the record fetch control is greater than or equal to
      the count of the ${../glossary/recorditem:/plural} which the
      ${../glossary/recordbuffer:/term} of the processor provides plus two.
  test-epilogue: null
  test-prologue: null
- name: Buffer
  states:
  - name: Empty
    test-code: |
      ctx->buffer = BUFFER_EMPTY;
    text: |
      While the ${../glossary/recordbuffer:/term} of the processor provides no
      ${../glossary/recorditem:/term}.
  - name: Partial
    test-code: |
      ctx->buffer = BUFFER_PARTIAL;
    text: |
      While the ${../glossary/recordbuffer:/term} of the processor provides at least
      one ${../glossary/recorditem:/term}, while no ${../glossary/recorditem:/term}
      was lost since the previous call of ${../if/fetch:/name} with the record fetch
      control.
  - name: Overflow
    test-code: |
      ctx->buffer = BUFFER_OVERFLOW;
    text: |
      While ${../glossary/recorditem:/plural} of the
      ${../glossary/recordbuffer:/term} of the processor were lost since the previous
      call of ${../if/fetch:/name} with the record fetch control, while the
      ${../glossary/recordbuffer:/term} still provides at least one
      ${../glossary/recorditem:/term} of the fetch.
  - name: Lost
    test-code: |
      ctx->buffer = BUFFER_LOST;
    text: |
      While all remaining ${../glossary/recorditem:/plural} of a continued fetch were
      lost since the previous call of ${../if/fetch:/name} with the record fetch
      control.
  test-epilogue: null
  test-prologue: null
- name: Producer
  states:
  - name: Idle
    test-code: |
      ctx->producer = PRODUCER_IDLE;
    text: |
      While no producer writes a ${../glossary/recorditem:/term} to the
      ${../glossary/recordbuffer:/term} of the processor during the call.
  - name: Some
    test-code: |
      ctx->producer = PRODUCER_SOME;
    text: |
      While a producer writes and commits ${../glossary/recorditem:/plural} during
      the call which overwrite some of the ${../glossary/recorditem:/plural} which
      the call copies from the ${../glossary/recordbuffer:/term} of the processor.
  - name: All
    test-code: |
      ctx->producer = PRODUCER_ALL;
    text: |
      While a producer writes and commits ${../glossary/recorditem:/plural} during
      the call which overwrite all ${../glossary/recorditem:/plural} which the call
      copies from the ${../glossary/recordbuffer:/term} of the processor and at least
      one more ${../glossary/recorditem:/term}.
  - name: Uncommitted
    test-code: |
      ctx->producer = PRODUCER_UNCOMMITTED;
    text: |
      While a producer on another processor writes ${../glossary/recorditem:/plural}
      during the call which overwrite ${../glossary/recorditem:/plural} which the
      call copies from the ${../glossary/recordbuffer:/term} of the processor after
      the write, while the producer commits these ${../glossary/recorditem:/plural}
      after the call.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension LastProcessor covers the index of the processor of the record fetch
  control, 2 states. Dimension Resume covers the calls with the record fetch
  control, 2 states. Dimension ItemCount covers the item count of the record
  fetch control, 3 states. Dimension Buffer covers the
  ${../glossary/recorditem:/plural} of the ${../glossary/recordbuffer:/term} of
  the processor since the previous call, 4 states. Dimension Producer covers the
  ${../glossary/recorditem:/plural} which a producer writes during the call, 4
  states.

  A record fetch control holds one item for the
  ${../if/event:/enumerators[9]/name} event and one item for the optional
  ${../if/event:/enumerators[8]/name} event. An item count of less than three
  leaves no room for a ${../glossary/recorditem:/term} of the
  ${../glossary/recordbuffer:/term}.

  In SMP configurations, a producer on another processor writes the
  ${../glossary/recorditem:/plural} of a production to the
  ${../glossary/recordbuffer:/term} before it commits them. ${../if/fetch:/name}
  sees only committed ${../glossary/recorditem:/plural}. It does not copy the
  ${../glossary/recorditem:/term} after the newest committed
  ${../glossary/recorditem:/term}, so a production of one
  ${../glossary/recorditem:/term} does not overwrite a copied
  ${../glossary/recorditem:/term}. The ${../glossary/recordbuffer:/term}
  therefore provides at most its capacity minus one
  ${../glossary/recorditem:/plural} to ${../if/fetch:/name}.

  A production of more than one ${../glossary/recorditem:/term} can overwrite the
  oldest ${../glossary/recorditem:/plural} which ${../if/fetch:/name} copies, and
  ${../if/fetch:/name} does not count them as lost. Producer state Uncommitted
  covers this case. A host program judges through the time stamps whether such a
  production replaced the oldest fetched ${../glossary/recorditem:/plural}.
requirement-type: functional
skip-reasons:
  Unreachable: |
    An empty ${../glossary/recordbuffer:/term} provides no
    ${../glossary/recorditem:/term}, so every item count of at least three is
    enough for it. A continued fetch has remaining
    ${../glossary/recorditem:/plural}, so the ${../glossary/recordbuffer:/term} is
    not empty. The item count of a record fetch control does not change, so a
    continued fetch has an item count of at least three. Only a continued fetch has
    remaining ${../glossary/recorditem:/plural} which can be lost. After the loss
    of all remaining ${../glossary/recorditem:/plural}, no item count is too small
    for them. Where the system was built with SMP support disabled, the only
    processor is the processor with the highest index. Where the system was built
    with SMP support disabled, a production runs with interrupts disabled from its
    first write to its commit, so it does not overlap with a call. A call which
    copies no ${../glossary/recorditem:/term} because of an invalid item count, an
    empty ${../glossary/recordbuffer:/term}, or the loss of all remaining
    ${../glossary/recorditem:/plural} gives a producer no copied
    ${../glossary/recorditem:/term} to overwrite.
test-action: |
  if ( ctx->producer == PRODUCER_IDLE || ctx->Map.entry.Skip ) {
    Arrange( ctx );
    ctx->status = rtems_record_fetch( &ctx->control );
  } else {
    InterruptFetch( ctx );
  }

  if ( ctx->producer == PRODUCER_UNCOMMITTED && !ctx->Map.entry.Skip ) {
    CommitUncommitted( ctx );
  }

  ctx->fetched_items = ctx->control.fetched_items;

  if ( ctx->fetched_items != NULL ) {
    T_quiet_le_sz( ctx->control.fetched_count, RTEMS_ARRAY_SIZE( ctx->fetched ) );
    memcpy(
      ctx->fetched,
      ctx->control.fetched_items,
      ctx->control.fetched_count * sizeof( ctx->fetched[ 0 ] )
    );
    ctx->fetched_count = ctx->control.fetched_count;
  }

  ctx->next_status = rtems_record_fetch( &ctx->control );

  if ( ctx->control.fetched_items != NULL ) {
    ctx->next_cpu_index = (uint32_t) ctx->control.fetched_items[ 0 ].data;
    ctx->next_first_data = FirstUserData( &ctx->control );
  }
