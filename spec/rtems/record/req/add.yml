- role: requirement-refinement
  uid: buffer-append
rationale: null
requirement-type: functional
text: |
  The ${../if/add:/name} directive shall append a ${../glossary/recorditem:/term}
  with the ${../glossary/timestamp:/term} of the record context referenced by the
  ${../if/add:/params[0]/name} parameter, the event specified by the
  ${../if/add:/params[1]/name} parameter, and the event data specified by the
  ${../if/add:/params[2]/name} parameter to the ${../glossary/recordbuffer:/term}
  of the record context.
type: requirement
