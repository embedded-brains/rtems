functional-type: function
links:
- role: requirement-refinement
  uid: buffer
rationale: |
  A host program can then extend the time stamps to the uptime without ambiguity.
requirement-type: functional
text: |
  Where the ${/acfg/if/record-per-processor-items:/name} application
  configuration option is greater than zero, while the system runs, the system
  shall produce on each processor with an index less than the value returned by
  ${/rtems/scheduler/if/get-processor-maximum:/name} an
  ${../if/event:/enumerators[323]/name} ${../glossary/recorditem:/term} with the
  lower 32 bits of the uptime as event data followed by an
  ${../if/event:/enumerators[322]/name} ${../glossary/recorditem:/term} with the
  upper 32 bits of the uptime as event data at an interval of the largest count
  of ${/glossary/clock-tick:/plural} which lasts at most two to the power of
  ${../if/time-bits:/name} ${/glossary/countertick:/plural}, and of at least one
  ${/glossary/clock-tick:/term}.
type: requirement
