- role: interface-function
  uid: ../if/prepare
rationale: null
requirement-type: functional
text: |
  The ${../if/prepare:/name} directive shall disable the maskable interrupts on
  the current processor and initialize the record context referenced by the
  ${../if/prepare:/params[0]/name} parameter with the
  ${../glossary/recordbuffer:/term} of the current processor, the previous
  ${/glossary/interruptlevel:/term}, and the value of the
  ${/glossary/rtemscounter:/term} as ${../glossary/timestamp:/term}.
type: requirement
