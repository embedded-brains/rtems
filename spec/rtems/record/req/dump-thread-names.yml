text: |
  After the stream header, the ${../if/dump:/name} directive shall output for
  each thread an ${../if/event:/enumerators[11]/name}
  ${../glossary/recorditem:/term} with the thread identifier as event data
  followed by ${../if/event:/enumerators[12]/name}
  ${../glossary/recorditem:/plural} which contain the name of the thread through
  the handler specified by the ${../if/dump:/params[0]/name} parameter.
