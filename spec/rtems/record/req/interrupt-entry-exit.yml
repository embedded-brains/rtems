rationale: null
requirement-type: functional
text: |
  Where the ${/acfg/if/record-interrupts-enabled:/name} application configuration
  option is defined and the ${/acfg/if/record-per-processor-items:/name}
  application configuration option is greater than zero, when an interrupt vector
  is dispatched, the system shall produce an ${../if/event:/enumerators[71]/name}
  ${../glossary/recorditem:/term} with the vector number as event data before the
  interrupt handlers of the vector are called and an
  ${../if/event:/enumerators[72]/name} ${../glossary/recorditem:/term} with the
  vector number as event data after the interrupt handlers of the vector return.
type: requirement
