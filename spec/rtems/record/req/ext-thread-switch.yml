  uid: /acfg/req/record-extensions-enabled
- role: requirement-refinement
  uid: buffer-append
rationale: null
requirement-type: functional
text: |
  Where the ${/acfg/if/record-extensions-enabled:/name} application configuration
  option is defined and the ${/acfg/if/record-per-processor-items:/name}
  application configuration option is greater than zero, when a processor
  switches from one thread to another thread, the system shall produce an
  ${../if/event:/enumerators[306]/name} ${../glossary/recorditem:/term} with the
  identifier of the thread which the processor leaves as event data, followed by
  an ${../if/event:/enumerators[299]/name} ${../glossary/recorditem:/term} with
  the stack usage of this thread as event data, followed by an
  ${../if/event:/enumerators[305]/name} ${../glossary/recorditem:/term} with the
  identifier of the thread which the processor enters as event data.
type: requirement
