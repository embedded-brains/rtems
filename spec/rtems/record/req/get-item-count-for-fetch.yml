text: |
  The ${../if/get-item-count-for-fetch:/name} directive shall return the smallest
  item count of a record fetch control with which one call of
  ${../if/fetch:/name} fetches all ${../glossary/recorditem:/plural} which a
  ${../glossary/recordbuffer:/term} provides.
