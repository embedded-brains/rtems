rationale: null
requirement-type: functional
text: |
  Where the ${/acfg/if/record-extensions-enabled:/name} application configuration
  option is defined and the ${/acfg/if/record-per-processor-items:/name}
  application configuration option is greater than zero, when a thread is
  created, the system shall produce an ${../if/event:/enumerators[276]/name}
  ${../glossary/recorditem:/term} with the identifier of the created thread as
  event data followed by ${../if/event:/enumerators[12]/name}
  ${../glossary/recorditem:/plural} which contain the name of the created thread
  as specified by ${string-to-items:/spec} where the item array has as many items
  as the string needs or more items than the string needs.
type: requirement
