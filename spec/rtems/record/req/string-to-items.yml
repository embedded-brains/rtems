post-conditions:
- name: Items
  states:
  - name: Packed
    test-code: |
      CheckPacked( ctx );
    text: |
      Each item which the event recording wrote shall hold the event and the next
      characters of the string in the bytes of its event data, the first character in
      the least significant byte, and zero bytes after the last character.
  test-epilogue: null
  test-prologue: null
- name: Count
  states:
  - name: Needed
    test-code: |
      T_eq_sz( ctx->count, ctx->needed );
    text: |
      The event recording shall return the count of items which the string needs.
  - name: Capacity
    test-code: |
      T_eq_sz( ctx->count, ctx->item_count );
    text: |
      The event recording shall return the count of items of the item array.
  test-epilogue: null
  test-prologue: null
- name: Rest
  states:
  - name: Unchanged
    test-code: |
      CheckRest( ctx );
    text: |
      The items of the item array after the written items shall be unchanged.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Length
  states:
  - name: Empty
    test-code: |
      ctx->length = 0;
    text: |
      While the string is empty.
  - name: PartialItem
    test-code: |
      ctx->length = 2 * DATA_SIZE + 1;
    text: |
      While the length of the string is not a multiple of the size of the event data.
  - name: FullItems
    test-code: |
      ctx->length = 2 * DATA_SIZE;
    text: |
      While the length of the string is a positive multiple of the size of the event
      data.
  test-epilogue: null
  test-prologue: null
- name: Capacity
  states:
  - name: Less
    test-code: |
      ctx->item_count = Needed( ctx->length ) - 1;
    text: |
      While the item array has less items than the string needs.
  - name: Equal
    test-code: |
      ctx->item_count = Needed( ctx->length );
    text: |
      While the item array has as many items as the string needs.
  - name: Greater
    test-code: |
      ctx->item_count = Needed( ctx->length ) + 2;
    text: |
      While the item array has more items than the string needs.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Length covers the length of the string, 3 states. Dimension Capacity
  covers the count of items of the item array, 3 states. The state of Length
  decides how many items the string needs, so it comes before Capacity in the
  arrangement.
requirement-type: functional
skip-reasons:
  Unreachable: |
    An empty string needs no item, so no item array has less items than it needs.
test-action: |
  size_t i;

  if ( ctx->Map.entry.Skip ) {
    return;
  }

  for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->items ); ++i ) {
    ctx->items[ i ].event = FILL_EVENT;
    ctx->items[ i ].data = FILL_DATA;
  }

  ctx->needed = Needed( ctx->length );
  T_quiet_le_sz( ctx->item_count, RTEMS_ARRAY_SIZE( ctx->items ) );
  ctx->count = _Record_String_to_items(
    RTEMS_RECORD_USER( 3 ),
    string,
    ctx->length,
    ctx->items,
    ctx->item_count
  );
