- role: requirement-refinement
  uid: /acfg/req/record-fatal-dump-base64
- role: requirement-refinement
  uid: buffer-append
rationale: null
requirement-type: functional
text: |
  Where the ${/acfg/if/record-fatal-dump-base64:/name} application configuration
  option is defined and the ${/acfg/if/record-per-processor-items:/name}
  application configuration option is greater than zero, when a fatal error
  occurs, the system shall produce an ${../if/event:/enumerators[323]/name}
  ${../glossary/recorditem:/term} with the lower 32 bits of the uptime as event
  data and an ${../if/event:/enumerators[322]/name}
  ${../glossary/recorditem:/term} with the upper 32 bits of the uptime as event
  data, followed by an ${../if/event:/enumerators[48]/name}
  ${../glossary/recorditem:/term} with the fatal source as event data and an
  ${../if/event:/enumerators[47]/name} ${../glossary/recorditem:/term} with the
  fatal code as event data.
type: requirement
