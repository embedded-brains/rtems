text: |
  After the thread names, the ${../if/dump:/name} directive shall output the
  ${../glossary/recorditem:/plural} which ${../if/fetch:/name} fetches from all
  processors with an index less than the value returned by
  ${/rtems/scheduler/if/get-processor-maximum:/name} through the handler
  specified by the ${../if/dump:/params[0]/name} parameter.
