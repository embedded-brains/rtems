brief: |
  This enumeration defines the record events.
copyrights:
- Copyright (C) 2018, 2026 embedded brains GmbH & Co. KG
definition-kind: typedef-only
description: |
  The system owns the events from ${.:/enumerators[0]/name} up to and including
  ${.:/enumerators[511]/name}. The application owns the events from
  ${.:/enumerators[512]/name} up to and including ${.:/enumerators[1023]/name}.
enabled-by: true
enumerators:
- comment: |
    There are 512 events reserved for the system.  The system events from
    RTEMS_RECORD_EMPTY up to and including RTEMS_RECORD_NO_TIME_LAST, may not
    have a time stamp.
  name: RTEMS_RECORD_EMPTY
- name: RTEMS_RECORD_VERSION
- comment: |
    Keep the following system events in lexicographical order, increment
    RTEMS_RECORD_THE_VERSION after each change.  The events below may not have
    a time stamp.  Update RTEMS_RECORD_NO_TIME_LAST after changes if
    necessary.
  name: RTEMS_RECORD_ARCH
