brief: |
  Produces an ${event:/enumerators[35]/name} event, an
  ${event:/enumerators[101]/name} event, and four argument events.
copyrights:
- Copyright (C) 2018, 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: |
      _Record_Caller_arg_4(
        ${/rtems/basedefs/if/return-address:/name}(),
        data_0,
        data_1,
        data_2,
        data_3
      )
    params:
    - ${.:/params[0]/name}
    - ${.:/params[1]/name}
    - ${.:/params[2]/name}
    - ${.:/params[3]/name}
    return: null
  variants: []
description: |
  The event data of the ${event:/enumerators[35]/name} event is the return
  address of the function which calls the macro. The event data of the
  ${event:/enumerators[101]/name} event is the address of the macro call.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: rtems_record_caller_arg_4
notes: null
params:
- description: |
    is the event data of the ${event:/enumerators[22]/name} event.
  dir: in
  name: data_0
- description: |
    is the event data of the ${event:/enumerators[23]/name} event.
  dir: in
  name: data_1
- description: |
    is the event data of the ${event:/enumerators[24]/name} event.
  dir: in
  name: data_2
- description: |
    is the event data of the ${event:/enumerators[25]/name} event.
  dir: in
  name: data_3
return: null
type: interface
