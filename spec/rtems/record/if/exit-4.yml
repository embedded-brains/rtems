brief: |
  Produces the exit event and four return events.
copyrights:
- Copyright (C) 2018, 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: |
      _Record_Exit_4(
        ${/rtems/basedefs/if/return-address:/name}(),
        event,
        data_0,
        data_1,
        data_2,
        data_3
      )
    params:
    - ${.:/params[0]/name}
    - ${.:/params[1]/name}
    - ${.:/params[2]/name}
    - ${.:/params[3]/name}
    - ${.:/params[4]/name}
    return: null
  variants: []
description: |
  The event data of the exit event is the return address of the function which
  calls the macro.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: rtems_record_exit_4
notes: null
params:
- description: |
    is the exit event.
  dir: in
  name: event
- description: |
    is the event data of the ${event:/enumerators[142]/name} event.
  dir: in
  name: data_0
- description: |
    is the event data of the ${event:/enumerators[143]/name} event.
  dir: in
  name: data_1
- description: |
    is the event data of the ${event:/enumerators[144]/name} event.
  dir: in
  name: data_2
- description: |
    is the event data of the ${event:/enumerators[145]/name} event.
  dir: in
  name: data_3
return: null
type: interface
