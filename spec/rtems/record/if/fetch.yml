brief: |
  Fetches record items from the record buffers of the processors.
copyrights:
- Copyright (C) 2018, 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${fetch-control:/name} *${.:/params[0]/name}
    return: ${fetch-status:/name}
  variants: []
description: |
  The function returns the fetched items and their count through the record fetch
  control.
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: rtems_record_fetch
notes: null
params:
- description: |
    is the record fetch control which ${fetch-initialize:/name} initialized.
  dir: inout
  name: control
return:
  return: null
  return-values:
  - description: |
      The current round of record fetches for all configured processors is done.
    value: ${fetch-done:/name}
  - description: |
      The current round of record fetches for all configured processors has to
      continue.
    value: ${fetch-continue:/name}
  - description: |
      The item count of the record fetch control is invalid.
    value: ${fetch-invalid-item-count:/name}
type: interface
