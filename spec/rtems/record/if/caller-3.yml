brief: |
  Produces an ${event:/enumerators[35]/name} event, an
  ${event:/enumerators[101]/name} event, and an extra event.
copyrights:
- Copyright (C) 2018, 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: |
      _Record_Caller_3( ${/rtems/basedefs/if/return-address:/name}(), event, data )
    params:
    - ${.:/params[0]/name}
    - ${.:/params[1]/name}
    return: null
  variants: []
description: |
  The event data of the ${event:/enumerators[35]/name} event is the return
  address of the function which calls the macro. The event data of the
  ${event:/enumerators[101]/name} event is the address of the macro call.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: rtems_record_caller_3
notes: null
params:
- description: |
    is the event without a time stamp of the third item.
  dir: in
  name: event
- description: |
    is the event data of the third item.
  dir: in
  name: data
return: null
type: interface
