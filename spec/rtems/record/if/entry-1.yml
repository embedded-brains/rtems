brief: |
  Produces the entry event and an argument event.
copyrights:
- Copyright (C) 2018, 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: |
      ${produce-2:/name}(
        event,
        (${data:/name}) ${/rtems/basedefs/if/return-address:/name}(),
        ${event:/enumerators[22]/name},
        data
      )
    params:
    - ${.:/params[0]/name}
    - ${.:/params[1]/name}
    return: null
  variants: []
description: |
  The event data of the entry event is the return address of the function which
  calls the macro.
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: rtems_record_entry_1
notes: null
params:
- description: |
    is the entry event.
  dir: in
  name: event
- description: |
    is the event data of the ${event:/enumerators[22]/name} event.
  dir: in
  name: data
return: null
type: interface
