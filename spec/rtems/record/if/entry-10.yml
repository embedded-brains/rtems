definition:
  default:
    attributes: null
    body: |
      _Record_Entry_10(
        ${/rtems/basedefs/if/return-address:/name}(),
        event,
        data_0,
        data_1,
        data_2,
        data_3,
        data_4,
        data_5,
        data_6,
        data_7,
        data_8,
        data_9
      )
    params:
    - ${.:/params[0]/name}
    - ${.:/params[1]/name}
    - ${.:/params[2]/name}
    - ${.:/params[3]/name}
    - ${.:/params[4]/name}
    - ${.:/params[5]/name}
    - ${.:/params[6]/name}
    - ${.:/params[7]/name}
    - ${.:/params[8]/name}
    - ${.:/params[9]/name}
    - ${.:/params[10]/name}
    return: null
  variants: []
description: |
  The event data of the entry event is the return address of the function which
  calls the macro.
