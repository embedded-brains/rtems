post-conditions:
- name: Encoding
  states:
  - name: Base64
    test-code: |
      size_t i;
      size_t n;

      n = 0;

      for ( i = 0; i < ctx->out_count; ++i ) {
        if ( strchr( WORD_BREAK, ctx->out[ i ] ) == NULL ) {
          T_quiet_lt_sz( n, sizeof( ctx->stripped ) );
          ctx->stripped[ n ] = ctx->out[ i ];
          ++n;
        }
      }

      T_eq_sz( n, ctx->expected_count );
      T_eq_nstr( ctx->stripped, ctx->expected, ctx->expected_count );
    text: |
      The characters which the base64 encoder outputs, apart from the characters of
      the word breaks, shall be the base64 encoding with padding of the source
      buffer.
  - name: Base64url
    test-code: |
      size_t i;
      size_t n;

      n = 0;

      for ( i = 0; i < ctx->out_count; ++i ) {
        if ( strchr( WORD_BREAK, ctx->out[ i ] ) == NULL ) {
          T_quiet_lt_sz( n, sizeof( ctx->stripped ) );
          ctx->stripped[ n ] = ctx->out[ i ];
          ++n;
        }
      }

      T_eq_sz( n, ctx->expected_count );
      T_eq_nstr( ctx->stripped, ctx->expected, ctx->expected_count );
    text: |
      The characters which the base64 encoder outputs, apart from the characters of
      the word breaks, shall be the base64url encoding with padding of the source
      buffer.
  test-epilogue: null
  test-prologue: null
- name: WordBreaks
  states:
  - name: None
    test-code: |
      T_eq_sz( ctx->out_count, ctx->expected_count );
      T_eq_nstr( ctx->out, ctx->expected, ctx->expected_count );
    text: |
      The base64 encoder shall output no word break.
  - name: BetweenWords
    test-code: |
      CheckWordBreaks( ctx );
    text: |
      The base64 encoder shall output the word break string after each word which
      more output follows.
  test-epilogue: null
  test-prologue: null
- name: Count
  states:
  - name: Output
    test-code: |
      T_eq_int( ctx->count, (int) ctx->out_count );
    text: |
      The base64 encoder shall return the count of characters which it output,
      including the characters of the word breaks.
  test-epilogue: null
  test-prologue: null
- name: Argument
  states:
  - name: Passed
    test-code: |
      T_true( ctx->argument_passed );
    text: |
      The base64 encoder shall pass the argument to each call of the put character
      function.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Alphabet
  states:
  - name: Base64
    test-code: |
      ctx->encode = _Base64_Encode;
      ctx->alphabet = base64_alphabet;
    text: |
      While the encoder uses the base64 alphabet.
  - name: Base64url
    test-code: |
      ctx->encode = _Base64url_Encode;
      ctx->alphabet = base64url_alphabet;
    text: |
      While the encoder uses the base64url alphabet.
  test-epilogue: null
  test-prologue: null
- name: Source
  states:
  - name: Empty
    test-code: |
      ctx->remainder = REMAINDER_EMPTY;
    text: |
      While the source buffer is empty.
  - name: Triplets
    test-code: |
      ctx->remainder = 0;
    text: |
      While the length of the source buffer is a positive multiple of three.
  - name: OneByteLeft
    test-code: |
      ctx->remainder = 1;
    text: |
      While the length of the source buffer divided by three leaves a remainder of
      one.
  - name: TwoBytesLeft
    test-code: |
      ctx->remainder = 2;
    text: |
      While the length of the source buffer divided by three leaves a remainder of
      two.
  test-epilogue: null
  test-prologue: null
- name: WordLength
  states:
  - name: UpToFour
    test-code: |
      ctx->word_length = 2;
      ctx->word_groups = 1;
    text: |
      While the word length is less than or equal to four.
  - name: AboveFour
    test-code: |
      ctx->word_length = 12;
      ctx->word_groups = 2;
    text: |
      While the word length is greater than four.
  test-epilogue: null
  test-prologue: null
- name: Words
  states:
  - name: None
    test-code: |
      ctx->groups = 0;
    text: |
      While the output consists of no word.
  - name: One
    test-code: |
      ctx->groups = 1;
    text: |
      While the output consists of one word.
  - name: Several
    test-code: |
      ctx->groups = 3;
    text: |
      While the output consists of more than one word.
  test-epilogue: null
  test-prologue: null
- name: WordBreak
  states:
  - name: Empty
    test-code: |
      ctx->word_break = "";
    text: |
      While the word break string is empty.
  - name: NonEmpty
    test-code: |
      ctx->word_break = WORD_BREAK;
    text: |
      While the word break string is not empty.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Alphabet covers the alphabets of the base64 encoder, 2 states.
  Dimension Source covers the length of the source buffer, 4 states. Dimension
  WordLength covers every value of the word length, 2 states. Dimension Words
  covers the count of words of the output, 3 states. Dimension WordBreak covers
  every word break string, 2 states. The state of WordLength decides how many
  groups a word holds, so it comes before Words in the arrangement.
requirement-type: functional
skip-reasons:
  Unreachable: |
    An empty source buffer gives an output of no word. A source buffer which is not
    empty gives an output of at least one word.
test-action: |
  size_t i;

  if ( ctx->Map.entry.Skip ) {
    return;
  }

  if ( ctx->remainder == REMAINDER_EMPTY ) {
    ctx->source_size = 0;
  } else if ( ctx->remainder == 0 ) {
    ctx->source_size = 3 * ctx->groups;
  } else {
    ctx->source_size = 3 * ( ctx->groups - 1 ) + (size_t) ctx->remainder;
  }

  T_quiet_le_sz( ctx->source_size, sizeof( ctx->source ) );

  for ( i = 0; i < ctx->source_size; ++i ) {
    ctx->source[ i ] = (uint8_t) ( 37 * i + 11 );
  }

  /* These bytes give the indices 62 and 63 of the alphabet. */
  for ( i = 0; i < ctx->source_size && i < sizeof( alphabet_end ); ++i ) {
    ctx->source[ i ] = alphabet_end[ i ];
  }

  ctx->expected_count = Encode(
    ctx->alphabet,
    ctx->expected,
    sizeof( ctx->expected ),
    ctx->source,
    ctx->source_size
  );
  ctx->out_count = 0;
  ctx->argument_passed = true;
  ctx->count = ( *ctx->encode )(
    PutChar,
    ctx,
    ctx->source,
    ctx->source_size,
    ctx->word_break,
    ctx->word_length
  );
