test-support: |
  static void CheckFatal(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    T_eq_int( source, RTEMS_FATAL_SOURCE_APPLICATION );
    T_eq_ulong( code, 123 );
    T_null( arg );
  }

  static void CallFatal( void *arg )
  {
    T_null( arg );
    rtems_fatal( RTEMS_FATAL_SOURCE_APPLICATION, 123 );
  }
