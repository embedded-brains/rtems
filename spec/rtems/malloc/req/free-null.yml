  uid: /c/if/free
rationale: |
  A free of ${/c/if/null:/name} may happen before the system initialization
  creates the ${/score/heap/glossary/c-program-heap:/term}.
requirement-type: functional
text: |
  When ${/c/if/free:/name} is called with a ${/c/if/null:/name} pointer, the
  function shall return without an access to the
  ${/score/heap/glossary/c-program-heap:/term}.
