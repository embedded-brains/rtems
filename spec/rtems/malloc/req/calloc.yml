enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/calloc
- role: requirement-refinement
  uid: /score/heap/req/disjoint
post-conditions:
- name: Status
  states:
  - name: Block
    test-code: |
      T_not_null( ctx->ptr );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/calloc:/name} shall be the begin
      address of a ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  - name: 'Null'
    test-code: |
      T_null( ctx->ptr );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/calloc:/name} shall be equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Heap
    test-code: |
      T_eq_uptr( (uintptr_t) ctx->ptr % CPU_HEAP_ALIGNMENT, 0 );
    text: |
      The begin address of the ${/score/heap/glossary/used-block:/term} shall be an
      integral multiple of the heap alignment of the ${/glossary/target-arch:/term}.
  test-epilogue: null
  test-prologue: null
- name: Content
  states:
  - name: Zero
    test-code: |
      T_true( _RBHeap_Size_of_block( &ctx->heap.heap, ctx->ptr, &size ) );
      T_ge_uptr( size, ctx->nelem * ctx->elsize );
      T_true( IsZero( ctx->ptr, ctx->nelem * ctx->elsize ) );
    text: |
      The ${/score/heap/glossary/used-block:/term} shall begin with `nelem` times
      `elsize` bytes of zero.
  test-epilogue: null
  test-prologue: |
    uintptr_t size;
- name: Heap
  states:
  - name: Allocated
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks + 1 );
    text: |
      The ${/score/heap/glossary/c-program-heap:/term} shall have one more
      ${/score/heap/glossary/used-block:/term}.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks );
      T_eq_u32( ctx->after.free_blocks, ctx->before.free_blocks );
      T_eq_uptr( ctx->after.free_size, ctx->before.free_size );
    text: |
      The ${/score/heap/glossary/used-block:/plural} and the
      ${/score/heap/glossary/free-block:/plural} of the
      ${/score/heap/glossary/c-program-heap:/term} shall not be changed by the
      ${../if/calloc:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: ElementCount
  states:
  - name: Zero
    test-code: |
      ctx->nelem = 0;
    text: |
      While the `nelem` parameter is equal to zero.
  - name: NonZero
    test-code: |
      ctx->nelem = 2;
    text: |
      While the `nelem` parameter is not equal to zero.
  test-epilogue: null
  test-prologue: null
- name: ElementSize
  states:
  - name: Zero
    test-code: |
      ctx->elsize = 0;
    text: |
      While the `elsize` parameter is equal to zero.
  - name: NonZero
    test-code: |
      ctx->elsize = 3;
    text: |
      While the `elsize` parameter is not equal to zero.
  test-epilogue: null
  test-prologue: null
- name: Product
  states:
  - name: Valid
    test-code: |
      /* The product of the parameters is small */
    text: |
      While the product of the `nelem` and the `elsize` parameters is less than or
      equal to ${/c/if/size_max:/name}.
  - name: Overflow
    test-code: |
      ctx->elsize = SIZE_MAX / ctx->nelem + 1;
    text: |
      While the product of the `nelem` and the `elsize` parameters is greater than
      ${/c/if/size_max:/name}.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: 'Yes'
    test-code: |
      /* The heap is empty */
    text: |
      While the ${/score/heap/glossary/c-program-heap:/term} has a
      ${/score/heap/glossary/free-block:/term} which satisfies the request.
  - name: 'No'
    test-code: |
      HeapExhaust( &ctx->heap.heap );
    text: |
      While the ${/score/heap/glossary/c-program-heap:/term} has no
      ${/score/heap/glossary/free-block:/term} which satisfies the request.
  test-epilogue: null
  test-prologue: null
rationale: |
  The ${/score/heap/glossary/c-program-heap:/term} returns ${/c/if/null:/name}
  for a request of size zero.

  The state code of Product reads the `nelem` parameter value, so Product follows
  ElementCount.

  Dimension Product covers the product of the `nelem` and the `elsize`
  parameters, 2 states.

  Dimension Fit covers the free blocks of the
  ${/score/heap/glossary/c-program-heap:/term}, 2 states.
requirement-type: functional
skip-reasons:
  ZeroProduct: |
    The product of the `nelem` and the `elsize` parameters is zero if one of the
    two parameters is zero, so the product cannot exceed ${/c/if/size_max:/name}.
test-action: |
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->before );
  ctx->ptr = rtems_calloc( ctx->nelem, ctx->elsize );
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->after );
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member contains the heap of the test.
  description: null
  member: |
    HeapContext heap
- brief: |
    This member contains the snapshot of the heap before the call.
  description: null
  member: |
    HeapSnapshot before
- brief: |
    This member contains the snapshot of the heap after the call.
  description: null
  member: |
    HeapSnapshot after
- brief: |
    This member contains the ${/glossary/returnvalue:/term} of the
    ${../if/calloc:/name} call.
  description: null
  member: |
    void *ptr
- brief: |
    This member specifies the `nelem` parameter value.
  description: null
  member: |
    size_t nelem
- brief: |
    This member specifies the `elsize` parameter value.
  description: null
  member: |
    size_t elsize
test-context-support: null
test-description: null
test-header: null
test-includes:
- stdint.h
- rtems/malloc.h
- string.h
test-local-includes:
- tx-heap.h
test-prepare: |
  memset( HeapGetArea(), 0xff, HEAP_AREA_SIZE );
  HeapReset( &ctx->heap );
test-setup:
  brief: null
  code: |
    HeapInstall( &ctx->heap );
  description: null
test-stop: null
test-support: |
  static bool IsZero( const void *ptr, size_t size )
  {
    const unsigned char *bytes;
    size_t               i;

    bytes = ptr;

    for ( i = 0; i < size; ++i ) {
      if ( bytes[ i ] != 0 ) {
        return false;
      }
    }

    return true;
  }
test-target: testsuites/validation/tc-mem-rtems-calloc.c
test-teardown:
  brief: null
  code: |
    HeapRestore( &ctx->heap );
  description: null
