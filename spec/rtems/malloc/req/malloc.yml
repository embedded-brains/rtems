enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/malloc
- role: requirement-refinement
  uid: /score/heap/req/disjoint
post-conditions:
- name: Status
  states:
  - name: Block
    test-code: |
      T_not_null( ctx->ptr );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/malloc:/name} shall be the begin
      address of a ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  - name: 'Null'
    test-code: |
      T_null( ctx->ptr );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/malloc:/name} shall be equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Heap
    test-code: |
      T_eq_uptr( (uintptr_t) ctx->ptr % CPU_HEAP_ALIGNMENT, 0 );
    text: |
      The begin address of the ${/score/heap/glossary/used-block:/term} shall be an
      integral multiple of the heap alignment of the ${/glossary/target-arch:/term}.
  test-epilogue: null
  test-prologue: null
- name: Size
  states:
  - name: Valid
    test-code: |
      T_true( _RBHeap_Size_of_block( &ctx->heap.heap, ctx->ptr, &size ) );
      T_ge_uptr( size, ctx->size );
    text: |
      The size of the ${/score/heap/glossary/used-block:/term} shall be greater than
      or equal to the `size` parameter.
  test-epilogue: null
  test-prologue: |
    uintptr_t size;
- name: Heap
  states:
  - name: Allocated
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks + 1 );
    text: |
      The ${/score/heap/glossary/c-program-heap:/term} shall have one more
      ${/score/heap/glossary/used-block:/term}.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks );
      T_eq_u32( ctx->after.free_blocks, ctx->before.free_blocks );
      T_eq_uptr( ctx->after.free_size, ctx->before.free_size );
    text: |
      The ${/score/heap/glossary/used-block:/plural} and the
      ${/score/heap/glossary/free-block:/plural} of the
      ${/score/heap/glossary/c-program-heap:/term} shall not be changed by the
      ${../if/malloc:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Size
  states:
  - name: Zero
    test-code: |
      ctx->size = 0;
    text: |
      While the `size` parameter is equal to zero.
  - name: NonZero
    representatives:
    - name: One
      test-code: |
        ctx->size = 1;
    - name: MinMinusOne
      test-code: |
        ctx->size = RBHEAP_MIN_SIZE - 1;
    - name: Min
      test-code: |
        ctx->size = RBHEAP_MIN_SIZE;
    - name: MinPlusOne
      test-code: |
        ctx->size = RBHEAP_MIN_SIZE + 1;
    - name: UnitMinusOne
      test-code: |
        ctx->size = RBHEAP_MIN_SIZE + RBHEAP_ALIGNMENT - 1;
    - name: Unit
      test-code: |
        ctx->size = RBHEAP_MIN_SIZE + RBHEAP_ALIGNMENT;
    - name: UnitPlusOne
      test-code: |
        ctx->size = RBHEAP_MIN_SIZE + RBHEAP_ALIGNMENT + 1;
    - name: Slab
      test-code: |
        ctx->size = RBHEAP_SLAB_SIZE;
    - name: Max
      test-code: |
        ctx->size = RBHEAP_MAX_SIZE;
    - name: AboveMax
      test-code: |
        ctx->size = RBHEAP_MAX_SIZE + 1;
    - name: SizeMax
      test-code: |
        ctx->size = SIZE_MAX;
    test-code: null
    text: |
      While the `size` parameter is not equal to zero.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: 'Yes'
    representatives:
    - name: Empty
      test-code: |
        if ( ctx->size > HeapGetLargestAllocatableSize( &ctx->heap.heap ) ) {
          ${.:skip}
        }
    - name: Exact
      test-code: |
        if ( ctx->size > HeapGetLargestAllocatableSize( &ctx->heap.heap ) ) {
          ${.:skip}
        } else {
          HeapLeaveFreeBlock( &ctx->heap.heap, ctx->size, RBHEAP_ALIGNMENT );
        }
    test-code: null
    text: |
      While the ${/score/heap/glossary/c-program-heap:/term} has a
      ${/score/heap/glossary/free-block:/term} which satisfies the request.
  - name: 'No'
    representatives:
    - name: Exhausted
      test-code: |
        HeapExhaust( &ctx->heap.heap );
    - name: Short
      test-code: |
        if (
          ctx->size >= RBHEAP_MIN_SIZE + RBHEAP_ALIGNMENT &&
          ctx->size <= HeapGetLargestAllocatableSize( &ctx->heap.heap )
        ) {
          HeapLeaveFreeBlock(
            &ctx->heap.heap,
            ctx->size - RBHEAP_ALIGNMENT,
            RBHEAP_ALIGNMENT
          );
        } else {
          HeapExhaust( &ctx->heap.heap );
        }
    test-code: null
    text: |
      While the ${/score/heap/glossary/c-program-heap:/term} has no
      ${/score/heap/glossary/free-block:/term} which satisfies the request.
  test-epilogue: null
  test-prologue: null
rationale: |
  The ${/score/heap/glossary/c-program-heap:/term} returns ${/c/if/null:/name}
  for a request of size zero.

  Dimension Fit covers the free blocks of the
  ${/score/heap/glossary/c-program-heap:/term}, 2 states.
requirement-type: functional
skip-reasons: {}
test-action: |
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->before );
  ctx->ptr = rtems_malloc( ctx->size );
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->after );
test-brief: null
test-cleanup: null
