test-description: null
test-header: null
test-includes:
- rtems/malloc.h
- stdint.h
test-local-includes:
- tx-heap.h
test-prepare: |
  HeapReset( &ctx->heap );
test-setup:
  brief: null
  code: |
    HeapInstall( &ctx->heap );
  description: null
test-stop: null
