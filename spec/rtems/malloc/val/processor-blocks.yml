test-actions:
- action-brief: |
    Allocate a block of a size class of the processor blocks, free it and allocate
    a block of the same size class again.
  action-code: |
    void     *ptr;
    uintptr_t addr;

    ptr = malloc( 24 );
    T_assert_not_null( ptr );
    addr = (uintptr_t) ptr;
    free( ptr );
    ctx->ptr = malloc( 24 );
  checks:
  - brief: |
      Check that the second allocation returned the block of the first one.
    code: |
      T_eq_uptr( (uintptr_t) ctx->ptr, addr );
      free( ctx->ptr );
    links:
    - role: validation
      uid: ../req/processor-blocks
  links: []
- action-brief: |
    Allocate more blocks of one size class than a bin holds and free them. Allocate
    them again.
  action-code: |
    size_t i;

    for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->blocks ); ++i ) {
      ctx->blocks[ i ] = malloc( 40 );
      T_quiet_not_null( ctx->blocks[ i ] );
    }

    for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->blocks ); ++i ) {
      free( ctx->blocks[ i ] );
    }

    for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->blocks ); ++i ) {
      ctx->blocks[ i ] = malloc( 40 );
      T_quiet_not_null( ctx->blocks[ i ] );
    }
  checks:
  - brief: |
      Check that each block is a used block of the C Program Heap and free the
      blocks.
    code: |
      for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->blocks ); ++i ) {
        T_quiet_ge_sz( malloc_usable_size( ctx->blocks[ i ] ), 40 );
        free( ctx->blocks[ i ] );
      }
    links:
    - role: validation
      uid: ../req/processor-blocks
  links: []
- action-brief: |
    Resize a processor block within its size class and beyond it.
  action-code: |
    void     *ptr;
    uintptr_t addr;

    ptr = malloc( 60 );
    T_assert_not_null( ptr );
    free( ptr );
    ptr = malloc( 60 );
    T_assert_not_null( ptr );
    addr = (uintptr_t) ptr;
    ctx->ptr = realloc( ptr, 58 );
    T_eq_uptr( (uintptr_t) ctx->ptr, addr );
    ctx->ptr = realloc( ctx->ptr, 2 );
  checks:
  - brief: |
      Check that the shrink beyond the size class moved the block.
    code: |
      T_not_null( ctx->ptr );
      free( ctx->ptr );
    links:
    - role: validation
      uid: /c/req/realloc
  links: []
- action-brief: |
    Allocate blocks of sizes beyond the processor blocks and free them.
  action-code: |
    ctx->ptr = malloc( 8192 );
    T_assert_not_null( ctx->ptr );
    free( ctx->ptr );
    ctx->ptr = aligned_alloc( 64, 16 );
    T_assert_not_null( ctx->ptr );
    free( ctx->ptr );
  checks: []
  links: []
- action-brief: |
    Free a processor block of this processor on another processor. Allocate blocks
    on this processor afterwards.
  action-code: |
    uint32_t cpu_count;

    cpu_count = rtems_scheduler_get_processor_maximum();
    ctx->ptr = malloc( 24 );
    T_assert_not_null( ctx->ptr );
    free( ctx->ptr );
    ctx->ptr = malloc( 24 );
    T_assert_not_null( ctx->ptr );

    if ( cpu_count > 1 ) {
      FreeOnOtherProcessor( ctx );
    } else {
      free( ctx->ptr );
    }

    ctx->blocks[ 0 ] = malloc( 24 );
    ctx->blocks[ 1 ] = malloc( 24 );
  checks:
  - brief: |
      Check that the allocations succeeded and free the blocks.
    code: |
      T_not_null( ctx->blocks[ 0 ] );
      T_not_null( ctx->blocks[ 1 ] );
      free( ctx->blocks[ 0 ] );
      free( ctx->blocks[ 1 ] );
    links:
    - role: validation
      uid: ../req/processor-blocks
  links: []
- action-brief: |
    Get the statistics of the C Program Heap with blocks in the bins.
  action-code: |
    rtems_heap_statistics before;
    rtems_heap_statistics after;
    void                 *ptr;
    int                   status;

    status = malloc_get_statistics( &before );
    T_eq_int( status, 0 );
    ptr = malloc( 24 );
    T_assert_not_null( ptr );
    free( ptr );
    status = malloc_get_statistics( &after );
    T_eq_int( status, 0 );
  checks:
  - brief: |
      Check that a block in a bin counts as a free block.
    code: |
      T_eq_u32( after.used_blocks, before.used_blocks );
    links:
    - role: validation
      uid: ../req/get-statistics
  links: []
test-brief: |
  Tests the processor blocks of the C Program Heap.
