- malloc.h
- rtems.h
- rtems/malloc.h
- rtems/score/smpimpl.h
- rtems/score/threaddispatch.h
- stdlib.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  typedef RtemsMallocValProcessorBlocks_Context Context;

  #if defined( RTEMS_SMP )
  static void FreeBlock( void *arg )
  {
    Context *ctx;

    ctx = arg;
    free( ctx->ptr );
  }
  #endif

  static void FreeOnOtherProcessor( Context *ctx )
  {
  #if defined( RTEMS_SMP )
    Per_CPU_Control *cpu_self;

    cpu_self = _Thread_Dispatch_disable();
    _SMP_Unicast_action(
      ( _Per_CPU_Get_index( cpu_self ) + 1 ) %
        rtems_scheduler_get_processor_maximum(),
      FreeBlock,
      ctx
    );
    _Thread_Dispatch_enable( cpu_self );
  #else
    free( ctx->ptr );
  #endif
  }
test-target: testsuites/validation/tc-mem-processor-blocks.c
