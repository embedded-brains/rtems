term: helping scheduler
text: |
  A helping scheduler of a ${task:/term} is a ${scheduler:/term} which is a
  ${scheduler-eligible:/term} and which is not the ${scheduler-home:/term} of the
  task. The helping schedulers of a task are numbered in the order in which they
  became helping schedulers of the task.
type: glossary
