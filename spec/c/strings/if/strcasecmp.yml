brief: |
  Perform a byte-by-byte comparison of the strings referenced by
  ${.:/params[0]/name} and ${.:/params[1]/name}, ignoring the case of the
  characters.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    - const char *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: strcasecmp
notes: |
  See [POSIX.1-2024, System Interfaces, strcasecmp()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/strcasecmp.html).
params:
- description: |
    is the pointer to the first string to be compared.
  dir: in
  name: s1
- description: |
    is the pointer to the second string to be compared.
  dir: in
  name: s2
return:
  return: |
    Returns an integer less than, equal to, or greater than zero if
    ${.:/params[0]/name} is, after ignoring case, found to be less than, to match,
    or be greater than ${.:/params[1]/name}, respectively.
  return-values: []
type: interface
