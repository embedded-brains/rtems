definition:
  default:
    attributes: null
    body: null
    params:
    - long long ${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: ffsll
notes: |
  See [POSIX.1-2024, System Interfaces, ffs()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/ffs.html).
params:
- description: |
    is the value to find the first set bit in.
  dir: null
  name: i
return:
  return: |
    Returns the index of the first bit set, or zero if no bits are set. Bits
    are numbered starting at one.
  return-values: []
type: interface
