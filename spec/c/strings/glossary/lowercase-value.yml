term: lowercase value
text: |
  The lowercase value of a byte is the value of the byte as type `unsigned char`,
  where an ${/c/ctype/glossary/uppercase:/term} is first converted to the
  corresponding ${/c/ctype/glossary/lowercase:/term}.
