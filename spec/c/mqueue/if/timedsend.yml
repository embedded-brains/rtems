brief: |
  Send the ${/glossary/message:/term} specified by ${.:/params[1]/name} bounded
  by the size in bytes specified by ${.:/params[2]/name} to the
  ${/glossary/messagequeue:/term} specified by ${.:/params[0]/name} with the
  ${../glossary/msgprio:/term} specified by ${.:/params[3]/name} and a
  ${/glossary/timeout:/term} referenced by ${.:/params[4]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/mqd_t:/name} ${.:/params[0]/name}
    - const char *${.:/params[1]/name}
    - ${/c/if/size_t:/name} ${.:/params[2]/name}
    - unsigned int ${.:/params[3]/name}
    - const ${/c/if/timespec:/name} *${.:/params[4]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${/glossary/messagequeue:/term} was full, and the
    ${/c/fcntl/if/o-nonblock:/name} flag was set for the
    ${/glossary/messagequeue:/term} description.
  role: errno
  uid: /c/errno/if/eagain
- description: |
    This error number indicates the following error conditions:

    - The ${../glossary/mqdes:/term} specified by ${.:/params[0]/name} was invalid.
    - The ${../glossary/mqdes:/term} specified by ${.:/params[0]/name} was not
      opened for writing.
  role: errno
  uid: /c/errno/if/ebadf
- description: |
    The call was interrupted by a signal handler.
  role: errno
  uid: /c/errno/if/eintr
- description: |
    The call would have blocked, and ${.:/params[4]/name} was invalid.
  role: errno
  uid: /c/errno/if/einval
name: mq_timedsend
notes: |
  See [POSIX.1-2024, System Interfaces, mq_timedsend()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/mq_timedsend.html).
params:
- description: |
    is the ${../glossary/mqdes:/term}.
  dir: null
  name: mqdes
- description: |
    is the pointer to the message to be sent.
  dir: in
  name: msg_ptr
- description: |
    is the length of the message to be sent.
  dir: null
  name: msg_len
- description: |
    is the ${../glossary/msgprio:/term}.
  dir: null
  name: msg_prio
- description: |
    is the absolute time at which the send operation will time out.
  dir: in
  name: abstime
return: null
type: interface
