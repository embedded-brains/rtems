enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/getname-np
- role: requirement-refinement
  uid: ../../req/group-posix-api
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The return value of ${../if/getname-np:/name} shall be equal to
      zero.
  - name: ESRCH
    test-code: |
      T_eq_int( ctx->status, ESRCH );
    text: |
      The return value of ${../if/getname-np:/name} shall be equal to
      ${/c/errno/if/esrch:/name}.
  - name: ERANGE
    test-code: |
      T_eq_int( ctx->status, ERANGE );
    text: |
      The return value of ${../if/getname-np:/name} shall be equal to
      ${/c/errno/if/erange:/name}.
  test-epilogue: null
  test-prologue: null
- name: Name
  states:
  - name: Empty
    test-code: |
      T_eq_str( ctx->name_buf, "" );
    text: |
      The string referenced by the ``name`` parameter shall contain the empty
      string.
  - name: PartialObject
    test-code: |
      T_eq_str( ctx->name_buf, "W" );
    text: |
      The string referenced by the ``name`` parameter shall contain the first
      up to ``len`` parameter value minus one characters of the thread object
      name.
  - name: FullObject
    test-code: |
      T_eq_str( ctx->name_buf, "WORK" );
    text: |
      The string referenced by the ``name`` parameter shall contain the thread
      object name.
  - name: PartialString
    test-code: |
      T_eq_str( ctx->name_buf, "s" );
    text: |
      The string referenced by the ``name`` parameter shall contain the first
      up to ``len`` parameter value minus one characters of the thread string
      name.
  - name: FullString
    test-code: |
      T_eq_str( ctx->name_buf, "string" );
    text: |
      The string referenced by the ``name`` parameter shall contain the thread
      string name.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Thread
  states:
  - name: NoObj
    test-code: |
      ctx->thread = 0xffffffff;
    text: |
      While the ``thread`` parameter is not associated with a thread.
  - name: Valid
    test-code: |
      ctx->thread = ctx->worker_id;
    text: |
      While the ``thread`` parameter is associated with a thread.
  test-epilogue: null
  test-prologue: null
- name: ThreadName
  states:
  - name: Empty
    test-code: |
      eno = pthread_setname_np( ctx->worker_id, "" );
      T_eno_success( eno );
    text: |
      While the thread has the empty string name.
  - name: NonEmpty
    test-code: |
      eno = pthread_setname_np( ctx->worker_id, "string" );
      T_eno_success( eno );
    text: |
      While the thread has a non-empty string name.
  test-epilogue: null
  test-prologue: |
    int eno;
- name: NameLen
  states:
  - name: NullZero
    test-code: |
      ctx->name = NULL;
      ctx->len = 0;
    text: |
      While the ``name`` parameter is
      ${/c/if/null:/name},
      while the ``len`` parameter is zero.
  - name: ValidZero
    test-code: |
      ctx->name = ctx->name_buf;
      ctx->len = 0;
    text: |
      While the ``name`` parameter references a
      buffer,
      while the ``len`` parameter is zero.
  - name: Valid
    test-code: |
      ctx->name = ctx->name_buf;
      ctx->len = RTEMS_ARRAY_SIZE( ctx->name_buf );
    text: |
      While the ``name`` parameter references a
      buffer,
      while the ``len`` parameter is greater than
      zero,
      while the ``len`` parameter is equal to the
      size in bytes of the buffer referenced by the
      ``name`` parameter.
  test-epilogue: null
  test-prologue: null
- name: ThreadNameLength
  states:
  - name: Fits
    test-code: |
      /* Already prepared */
    text: |
      While the thread name fits into the buffer referenced by the
      ``name`` parameter.
  - name: TooLong
    test-code: |
      if ( ctx->len > 0 ) {
        ctx->len = 2;
      }
    text: |
      While the thread name does not fit into the buffer referenced by the
      ``name`` parameter.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
