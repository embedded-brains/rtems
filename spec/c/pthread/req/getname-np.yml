text: ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Thread: NoObj
      then: ESRCH
    - if:
        pre-conditions:
          NameLen: Valid
          Thread: Valid
          ThreadNameLength: Fits
      then: Zero
    - else: ERANGE
    Name:
    - if:
        pre-conditions:
          NameLen: Valid
          Thread: NoObj
      then: Empty
    - if:
        pre-conditions:
          NameLen: Valid
          Thread: Valid
          ThreadName: Empty
          ThreadNameLength: TooLong
      then: PartialObject
    - if:
        pre-conditions:
          NameLen: Valid
          Thread: Valid
          ThreadName: NonEmpty
          ThreadNameLength: TooLong
      then: PartialString
    - if:
        pre-conditions:
          Thread: Valid
          ThreadName: Empty
          ThreadNameLength: Fits
      then: FullObject
    - if:
        pre-conditions:
          Thread: Valid
          ThreadName: NonEmpty
          ThreadNameLength: Fits
      then: FullString
    - else: N/A
  pre-conditions:
    Thread: all
    ThreadName:
      applicable:
        pre-conditions:
          Thread: Valid
    NameLen: all
    ThreadNameLength:
      applicable:
      - pre-conditions:
          Thread: Valid
          ThreadNameLength: TooLong
      - pre-conditions:
          NameLen: Valid
          Thread: Valid
type: requirement
