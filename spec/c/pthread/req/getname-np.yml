test-prepare: memset( ctx->name_buf, 0xff, sizeof( ctx->name_buf ) );
test-setup:
  brief: null
  code: |
    ctx->worker_id = CreateTask( "WORK", GetSelfPriority() );
  description: null
test-stop: null
test-support: null
