enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/mutexattr-getpshared
post-conditions:
- name: Status
  states:
  - name: Ok
    test-code: |
      T_rsc_success( ctx->retval );
    text: |
      The return status shall be zero.
  - name: Einval
    test-code: |
      T_rsc( ctx->retval, EINVAL );
    text: |
      The return status shall be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: PsharedObj
  states:
  - name: Set
    test-code: |
      T_eq_int( ctx->pshared_value, ctx->pshared_obj );
    text: |
      The value of the object referenced by the ${../if/mutexattr-getpshared:/params[1]/name} parameter shall be set to the process-shared attribute of the mutex attributes object referenced by the ${../if/mutexattr-getpshared:/params[0]/name} parameter.
  - name: Nop
    test-code: |
      T_eq_int( ctx->pshared_value, -1 );
    text: |
      The value of the object referenced by the ${../if/mutexattr-getpshared:/params[1]/name} parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Attr
  states:
  - name: Valid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      pthread_mutexattr_init( &ctx->attr_obj );
      pthread_mutexattr_setpshared( &ctx->attr_obj, ctx->pshared_obj );
    text: |
      While the mutex attributes object referenced by ${../if/mutexattr-getpshared:/params[0]/name} is valid.
  - name: 'Null'
    test-code: |
      ctx->attr = NULL;
    text: |
      While the ${../if/mutexattr-getpshared:/params[0]/name} parameter is NULL.
  - name: Invalid
    test-code: |
      ctx->attr = &ctx->attr_obj;
      memset( &ctx->attr_obj, 0x0, sizeof( ctx->attr_obj ) );
    text: |
      While the mutex attributes object referenced by ${../if/mutexattr-getpshared:/params[0]/name} is invalid.
  test-epilogue: null
  test-prologue: null
- name: Pshared
  states:
  - name: Valid
    test-code: |
      ctx->pshared_value = -1;
      ctx->pshared = &ctx->pshared_value;
    text: |
      While the ${../if/mutexattr-getpshared:/params[1]/name} parameter references an object of type `int`.
  - name: 'Null'
    test-code: |
      ctx->pshared = NULL;
    text: |
      While the ${../if/mutexattr-getpshared:/params[1]/name} parameter is NULL.
  test-epilogue: null
  test-prologue: null
rationale: null
