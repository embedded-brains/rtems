transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Einval
    - if:
        pre-conditions:
          Pshared: 'Null'
      then: Einval
    - else: Ok
    PsharedObj:
    - if:
        pre-conditions:
          Pshared: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Attr:
          - 'Null'
          - Invalid
      then: Nop
