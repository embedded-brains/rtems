rationale: |
  In RTEMS, ${../if/spin-trylock:/name} is an alias of ${../if/spin-lock:/name}.
  The spin lock is a ticket lock, which has no try variant, so the function does
  not return ${/c/errno/if/ebusy:/name} for a spin lock which is owned by another
  thread. It waits until the owner releases the spin lock and returns zero, which
  state UntilReleased of post-condition Wait specifies. The requirement has the
  post-conditions of ${spin-lock:/spec}, and the test calls
  ${../if/spin-trylock:/name}.

  ${../if/spin-trylock:/name} disables the maskable interrupts. The release of
  the spin lock restores their status from before the call, see
  ${spin-unlock:/spec}. RTEMS returns zero in every case, so post-condition
  Status has a single state.

  In SMP configurations, a spin lock is a ticket lock. Post-condition Owner reads
  its two counters from the members of ${/c/if/pthread_spinlock_t:/name}, since
  no function reports the owner. The action records these values before the spin
  lock is released, since the maskable interrupts stay disabled while the spin
  lock is owned and the checks shall not run in this state. In uniprocessor
  configurations, a spin lock only disables the maskable interrupts and has no
  owner.

  A call which waits for the owner cannot be observed by its caller. For the
  owned spin lock, the runner is therefore the owner and a worker on a second
  processor is the calling thread. The runner releases the spin lock only after
  the worker took its ticket, so the worker cannot acquire it in between.

  A call by the owner of the spin lock is not a state, since the behaviour is
  undefined. In uniprocessor configurations, the call overwrites the stored state
  of the maskable interrupts. In SMP configurations, the owner waits for itself
  forever.
requirement-type: functional
skip-reasons:
  NeedsSMP: |
    Where the system was built with SMP support disabled, the owner of a spin lock
    executes with maskable interrupts disabled, so no other thread can call the
    function while the spin lock is owned.
test-action: |
  if ( ctx->owned ) {
  #if defined( RTEMS_SMP )
    LockOnOtherProcessor( ctx );
  #endif
  } else {
    Lock( ctx );
  }
