links:
- role: interface-function
  uid: ../if/spin-lock
post-conditions:
- name: Result
  states:
  - name: Ok
    test-code: |
      T_eq_int( ctx->retval, 0 );
    text: |
      The return value shall be 0.
  test-epilogue: null
  test-prologue: null
- name: LockState
  states:
  - name: Acquired
    test-code: |
      /* The lock state cannot be verified using public APIs without concurrent
       * execution. As a last resort, we verify that the ISR level is non-zero,
       * indicating the spin lock has successfully disabled interrupts. */
      T_true( _ISR_Get_level() != 0 );
    text: |
      The spin lock shall be acquired by the calling thread.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: SpinLock
  states:
  - name: Valid
    test-code: |
      /* lock is initialized in test-prepare */
      T_true( _ISR_Get_level() == 0 );
    text: |
      While the spin lock object referenced by ${../if/spin-lock:/params[0]/name} is initialized.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
