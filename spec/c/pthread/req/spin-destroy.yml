      While the object referenced by the ${../if/spin-destroy:/params[0]/name}
      parameter is an initialized spin lock which is unlocked.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-spin-destroy:/name} lists no error for
  ${../if/spin-destroy:/name}. ${../if/spin-destroy:/name} performs no validation
  of its parameters and has no error path, so no error state is specified.

  The standard leaves the results undefined where a thread holds the spin lock,
  so the item covers a spin lock which is not locked. The call changes nothing
  which can be observed, so only the return value is specified.
