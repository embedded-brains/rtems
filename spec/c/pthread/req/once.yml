    text: |
      The ${/glossary/returnvalue:/term} of ${../if/once:/name} shall be zero.
  - name: Inval
    test-code: |
      T_eq_int( ctx->retval, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/once:/name} shall be
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, ERRNO_PATTERN );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be changed by the
      ${../if/once:/name} call.
  test-epilogue: null
  test-prologue: null
- name: Routine
  states:
  - name: Once
    test-code: |
      T_eq_u32( ctx->calls[ CALLS_ROUTINE ], 1 );
      T_eq_u32( ctx->routine_id, ctx->caller_id );
    text: |
      The initialization routine referenced by the ${../if/once:/params[1]/name}
      parameter shall be called once by the calling thread, before the
      ${../if/once:/name} call returns.
  - name: None
    test-code: |
      T_eq_u32( ctx->calls[ CALLS_ROUTINE ], 0 );
    text: |
      The initialization routine referenced by the ${../if/once:/params[1]/name}
      parameter shall not be called.
  test-epilogue: null
  test-prologue: null
- name: Completed
  states:
  - name: 'Yes'
    test-code: |
      T_true( ctx->seen_completed );
    text: |
      When the ${../if/once:/name} call returns, the initialization routine
      associated with the once-control object referenced by the
      ${../if/once:/params[0]/name} parameter shall have completed.
  test-epilogue: null
  test-prologue: null
- name: Effects
  states:
  - name: Visible
    test-code: |
      T_eq_u32( ctx->seen_data, DATA_DONE );
    text: |
      When the ${../if/once:/name} call returns, the effects of the initialization
      routine shall be visible to the calling thread.
  test-epilogue: null
  test-prologue: null
- name: Control
  states:
  - name: Done
    test-code: |
      CheckControl( ctx, 0 );
    text: |
      A later ${../if/once:/name} call for the once-control object referenced by the
      ${../if/once:/params[0]/name} parameter shall not call its initialization
      routine.
  - name: Nop
    test-code: |
      CheckControl( ctx, 1 );
    text: |
      A later ${../if/once:/name} call for the once-control object referenced by the
      ${../if/once:/params[0]/name} parameter shall call its initialization routine
      once, as if ${../if/once:/name} was never called for this object.
  test-epilogue: null
  test-prologue: null
- name: Caller
  states:
  - name: Returned
    test-code: |
      T_true( ctx->returned );
    text: |
      The ${../if/once:/name} call shall return to the calling thread.
  test-epilogue: null
  test-prologue: null
- name: Request
  states:
  - name: Kept
    test-code: |
      if ( ctx->request || ( ctx->cancel && ctx->state == STATE_PENDING ) ) {
        T_false( ctx->survived );
        T_eq_ptr( ctx->caller_exit, PTHREAD_CANCELED );
      }

      if ( ctx->cancel && ctx->state == STATE_RUNNING ) {
        T_eq_ptr( ctx->other_exit, PTHREAD_CANCELED );
      }
    text: |
      The ${../glossary/thread-cancel-request:/term} shall stay pending for the
      thread to which it was made, so that the thread is terminated at its next call
      of ${../if/testcancel:/name} after the ${../if/once:/name} call returned.
  test-epilogue: null
  test-prologue: null
- name: Waiters
  states:
  - name: Released
    test-code: |
      T_eq_u32( ctx->waiters_returned, WAITER_COUNT );
      T_eq_u32( ctx->waiters_after_routine, WAITER_COUNT );
      T_eq_u32( ctx->waiters_failed, 0 );
      T_eq_u32( ctx->calls[ CALLS_WAITER ], 0 );
    text: |
      Each other thread which calls ${../if/once:/name} for the once-control object
      referenced by the ${../if/once:/params[0]/name} parameter while the
      initialization routine executes shall return zero from its call after the
      initialization routine completed, without a call of its own initialization
      routine.
  test-epilogue: null
  test-prologue: null
