  - name: Running
    test-code: |
      ctx->state = STATE_RUNNING;
    text: |
      While another thread executes the initialization routine associated with the
      once-control object referenced by the ${../if/once:/params[0]/name} parameter.
  - name: Done
    test-code: |
      ctx->state = STATE_DONE;
    text: |
      While the initialization routine associated with the once-control object
      referenced by the ${../if/once:/params[0]/name} parameter has completed.
  test-epilogue: null
  test-prologue: null
- name: Request
  states:
  - name: None
    test-code: |
      ctx->request = false;
    text: |
      While no ${../glossary/thread-cancel-request:/term} is pending for the calling
      thread.
  - name: Pending
    test-code: |
      ctx->request = true;
    text: |
      While a ${../glossary/thread-cancel-request:/term} is pending for the calling
      thread, while the ${../glossary/thread-cancel-state:/term} of the calling
      thread is ${../if/cancel-enable:/name} and its
      ${../glossary/thread-cancel-type:/term} is ${../if/cancel-deferred:/name}.
  test-epilogue: null
  test-prologue: null
- name: Cancel
  states:
  - name: None
    test-code: |
      ctx->cancel = false;
    text: |
      While the initialization routine does not call ${../if/testcancel:/name}.
  - name: Point
    test-code: |
      ctx->cancel = true;
    text: |
      While the initialization routine calls ${../if/testcancel:/name}, while a
      ${../glossary/thread-cancel-request:/term} is pending for the thread which
      executes it, while the ${../glossary/thread-cancel-state:/term} of this thread
      is ${../if/cancel-enable:/name} and its ${../glossary/thread-cancel-type:/term}
      is ${../if/cancel-deferred:/name}.
  test-epilogue: null
  test-prologue: null
- name: Waiters
  states:
  - name: None
    test-code: |
      ctx->waiters = false;
    text: |
      While no other thread calls ${../if/once:/name} for the once-control object
      referenced by the ${../if/once:/params[0]/name} parameter during the execution
      of the initialization routine.
  - name: Some
    test-code: |
      ctx->waiters = true;
    text: |
      While other threads call ${../if/once:/name} for the once-control object
      referenced by the ${../if/once:/params[0]/name} parameter during the execution
      of the initialization routine.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/pthread-once:/name} specifies ${../if/once:/name}.

  Dimension State covers the once-control object, 3 states. The standard requires
  that the first call calls the routine, that later calls do not call it, and
  that the routine has completed on return. Pending is the first call, Done a
  later call, and Running a call while another thread executes the routine. The
  caller then returns after the completion. Where the system has more than one
  processor, the caller of the states Running and Done runs on another processor
  than the thread which executes the routine, so that the test checks the
  visibility of the effects of the routine.

  Dimension Request covers the statement that the function is not a cancellation
  point. A pending request of the calling thread does not end the call.

  Dimension Cancel covers a routine which calls ${../if/testcancel:/name} with a
  pending request. RTEMS delays the request of the thread until the call returns,
  so the routine completes, the once-control object is complete, and a waiting
  caller does not call its routine. The request stays pending. This follows the
  constraint ${../constraint/once-cancel:/spec}. This deviates from the standard.

  Dimension Waiters covers other threads which call the function while the
  routine executes. They return after the completion without a call of their
  routine.

  The standard requires the return value zero and forbids EINTR. RTEMS extends
  the standard with ${/c/errno/if/einval:/name} for a ${/c/if/null:/name}
  parameter. This holds for every state. Dimension Control and Routine cover the
  extension. The function does not change ${/c/errno/if/errno:/name}.

  The constraints of the interface cover the behaviour which the standard leaves
  undefined, and the recursive call, which does not return.
requirement-type: functional
skip-reasons: {}
test-action: |
  Prepare( ctx );
  ctx->caller_id = CreateTask( "CALL", PRIO_HIGH );

  if ( ctx->caller_cpu != 0 ) {
    /* The processor with the index one belongs to the scheduler B. */
    SetScheduler( ctx->caller_id, SCHEDULER_B_ID, PRIO_HIGH );
  }

  SetAffinityOne( ctx->caller_id, ctx->caller_cpu );
  StartTask( ctx->caller_id, Caller, ctx );

  if ( ctx->state == STATE_RUNNING ) {
    if ( ctx->once_control != NULL && ctx->init_routine != NULL ) {
      T_true( WaitForBlockedState(
        ctx->caller_id,
        STATES_WAITING_FOR_CONDITION_VARIABLE,
        &ctx->caller_done
      ) );
      T_eq_uint( GetFlag( &ctx->caller_done ), 0 );
    }

    SendEvents( ctx->other_id, RTEMS_EVENT_0 );
    T_eq_int( pthread_join( (pthread_t) ctx->other_id, &ctx->other_exit ), 0 );
  }

  T_eq_int( pthread_join( (pthread_t) ctx->caller_id, &ctx->caller_exit ), 0 );
test-brief: null
test-cleanup: |
  if ( ctx->waiters ) {
    size_t i;

    for ( i = 0; i < WAITER_COUNT; ++i ) {
      DeleteTask( ctx->waiter_id[ i ] );
    }
  }
