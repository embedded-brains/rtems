test-context-support: |
  #define WAITER_COUNT 2

  #define DATA_DONE 0x600dd00d

  typedef enum {
    CALLS_ROUTINE,
    CALLS_OTHER,
    CALLS_PROBE,
    CALLS_WAITER,
    CALLS_COUNT
  } Calls;

  typedef enum { STATE_PENDING, STATE_RUNNING, STATE_DONE } State;
