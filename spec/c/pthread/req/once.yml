text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Control: 'Null'
      then: Inval
    - if:
        pre-conditions:
          Routine: 'Null'
      then: Inval
    - else: Ok
    Errno: Nop
    Routine:
    - if:
        pre-conditions:
          Control: 'Null'
      then: None
    - if:
        pre-conditions:
          Routine: 'Null'
      then: None
    - if:
        pre-conditions:
          State: Pending
      then: Once
    - else: None
    Completed:
    - if:
        pre-conditions:
          Control: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Routine: 'Null'
      then: N/A
    - else: 'Yes'
    Effects:
    - if:
        pre-conditions:
          Control: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Routine: 'Null'
      then: N/A
    - else: Visible
    Control:
    - if:
        pre-conditions:
          Control: 'Null'
      then: N/A
    - if:
        pre-conditions:
          Routine: 'Null'
          State: Pending
      then: Nop
    - else: Done
    Caller: Returned
    Request:
    - if:
        pre-conditions:
          Request: Pending
      then: Kept
    - if:
        pre-conditions:
          Cancel: Point
      then: Kept
    - else: N/A
    Waiters:
    - if:
        pre-conditions:
          Waiters: Some
      then: Released
    - else: N/A
  pre-conditions:
    Control: all
