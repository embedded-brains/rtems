brief: |
  Get the ${/c/sched/glossary/parameter:/term} of the ${../glossary/thread:/term}
  attributes object referenced by ${.:/params[0]/name} and store it in the object
  referenced by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_attr_t:/name} *restrict ${.:/params[0]/name}
    - ${/c/if/sched_param:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The priority specified in ${.:/params[1]/name} does not make sense for the
    current scheduling policy of ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/einval
name: pthread_attr_getschedparam
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_attr_getschedparam()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getschedparam.html).
params:
- description: |
    is the pointer to the thread attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to the location where the scheduling parameters will be stored.
  dir: out
  name: param
return:
  return: |
    Returns zero on success.
  return-values: []
type: interface
