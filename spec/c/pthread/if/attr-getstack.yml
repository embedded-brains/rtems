brief: |
  Get the ${../glossary/thread-stack:/term} of the ${../glossary/thread:/term}
  attributes object referenced by ${.:/params[0]/name} and store it in the
  objects referenced by ${.:/params[1]/name} and ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_attr_t:/name} *restrict ${.:/params[0]/name}
    - void **restrict ${.:/params[1]/name}
    - ${/c/if/size_t:/name} *restrict ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_attr_getstack
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_attr_getstack()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getstack.html).
params:
- description: |
    is the pointer to the thread attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to the location where the stack address will be stored.
  dir: out
  name: stackaddr
- description: |
    is the pointer to the location where the stack size will be stored.
  dir: out
  name: stacksize
return:
  return: |
    Returns zero on success.
  return-values: []
type: interface
