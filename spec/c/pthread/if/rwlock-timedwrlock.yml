brief: |
  Lock the ${../glossary/read-write-lock:/term} object referenced by
  ${.:/params[0]/name} for writing with a timeout referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_rwlock_t:/name} *restrict ${.:/params[0]/name}
    - const ${/c/if/timespec:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_rwlock_timedwrlock
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_rwlock_timedwrlock()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_rwlock_timedwrlock.html).
params:
- description: |
    is the read-write lock
  dir: inout
  name: rwlock
- description: |
    is the absolute timeout time
  dir: in
  name: abstime
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The lock could not be acquired before the specified timeout expired.
    value: ${/c/errno/if/etimedout:/name}
  - description: |
      This error number indicates the following error conditions:

      - The current thread already owns the rwlock for reading.
      - The current thread already owns the rwlock for writing.
    value: ${/c/errno/if/edeadlk:/name}
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is invalid.
      - The ${.:/params[1]/name} parameter is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
