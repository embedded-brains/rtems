definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_spinlock_t:/name} *${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: reference
  uid: /ref/std/posix-2024/pthread-spin-lock
name: pthread_spin_trylock
notes: |
  ${/ref/std/posix-2024/pthread-spin-lock:/name} specifies that the function
  returns ${/c/errno/if/ebusy:/name} if another thread owns the spin lock. In
  RTEMS, ${.:/name} is an alias of ${spin-lock:/name}. It waits until the spin
  lock is available, acquires it and returns zero. It never returns
  ${/c/errno/if/ebusy:/name}.
params:
- description: |
    is the pointer to the spin lock.
  dir: inout
  name: lock
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
type: interface
