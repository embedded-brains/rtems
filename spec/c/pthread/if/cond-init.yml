brief: |
  Initialize the ${../glossary/condition-variable:/term} object referenced by
  ${.:/params[0]/name} using the attributes object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_cond_t:/name} *restrict ${.:/params[0]/name}
    - const ${/c/if/pthread_condattr_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_cond_init
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_cond_init()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_cond_init.html).
params:
- description: |
    is the condition variable object to initialize.
  dir: out
  name: cond
- description: |
    is the condition variable attributes object.
  dir: in
  name: attr
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The system lacked the necessary resources (other than memory) to initialize
      another condition variable.
    value: ${/c/errno/if/eagain:/name}
  - description: |
      Insufficient memory exists to initialize the condition variable.
    value: ${/c/errno/if/enomem:/name}
  - description: |
      The implementation has detected an attempt to reinitialize the object
      referenced by ${.:/params[0]/name}, a previously initialized, but not yet
      destroyed, condition variable.
    value: ${/c/errno/if/ebusy:/name}
  - description: |
      The value specified by ${.:/params[1]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
