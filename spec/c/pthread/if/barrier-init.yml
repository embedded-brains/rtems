SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
brief: |
  Initialize the ${../glossary/barrier:/term} object referenced by
  ${.:/params[0]/name} using the attributes object referenced by
  ${.:/params[1]/name} and the ${../glossary/barrier:/term} count specified by
  ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_barrier_t:/name} *restrict ${.:/params[0]/name}
    - const ${/c/if/pthread_barrierattr_t:/name} *restrict ${.:/params[1]/name}
    - unsigned ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_barrier_init
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_barrier_init()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_barrier_init.html).
params:
- description: |
    is the barrier object to initialize.
  dir: out
  name: barrier
- description: |
    is the barrier attributes object.
  dir: in
  name: attr
- description: |
    is the barrier count.
  dir: null
  name: count
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The system lacks the necessary resources to initialize another barrier.
    value: ${/c/errno/if/eagain:/name}
  - description: |
      This error number indicates the following error conditions:

      - The value specified by ${.:/params[2]/name} is equal to zero.
      - The value specified by ${.:/params[1]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
  - description: |
      Insufficient memory exists to initialize the barrier.
    value: ${/c/errno/if/enomem:/name}
type: interface
