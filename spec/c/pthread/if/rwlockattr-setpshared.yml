brief: |
  Set the ${../glossary/process-shared:/term} of the
  ${../glossary/read-write-lock:/term} attributes object referenced by
  ${.:/params[0]/name} to the value specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_rwlockattr_t:/name} *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_rwlockattr_setpshared
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_rwlockattr_setpshared()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_rwlockattr_setpshared.html).
params:
- description: |
    is the read-write lock attributes object
  dir: inout
  name: attr
- description: |
    is the ${../glossary/process-shared:/term} value
  dir: null
  name: pshared
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The value specified by ${.:/params[0]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
