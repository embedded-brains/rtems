brief: |
  Create a thread-specific data key, store it in the object referenced by
  ${.:/params[0]/name}, and associate it with the destructor function specified
  by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_key_t:/name} *${.:/params[0]/name}
    - void (*${.:/params[1]/name})(void *)
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The system lacked the necessary resources to create another thread-specific
    data key.
  role: errno
  uid: /c/errno/if/eagain
name: pthread_key_create
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_key_create()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_key_create.html).
params:
- description: |
    is the pointer to an object where the created key will be stored.
  dir: out
  name: key
- description: |
    is the pointer to the destructor function to be associated with the key.
  dir: null
  name: destructor
return:
  return: null
  return-values:
  - description: |
      The successful completion returns zero.
    value: 0
  - description: |
      This error number indicates the following error conditions:

      - The system lacked the necessary resources to create another thread- specific
        data key.
      - The system-imposed limit on the total number of keys per process would be
        exceeded.
    value: ${/c/errno/if/eagain:/name}
  - description: |
      Insufficient memory exists to create the key.
    value: ${/c/errno/if/enomem:/name}
type: interface
