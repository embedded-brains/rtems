brief: |
  Get the ${../glossary/thread-stack-address:/term} of the
  ${../glossary/thread:/term} attributes object referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_attr_t:/name} *restrict ${.:/params[0]/name}
    - void **restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_attr_getstackaddr
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_attr_getstackaddr()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getstackaddr.html).
params:
- description: |
    is the pointer to the thread attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to the location where the stack address will be stored.
  dir: out
  name: stackaddr
return:
  return: |
    Returns zero on success.
  return-values: []
type: interface
