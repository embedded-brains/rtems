brief: |
  Initialize the ${../glossary/read-write-lock:/term} object referenced by
  ${.:/params[0]/name} using the attributes object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_rwlock_t:/name} *restrict ${.:/params[0]/name}
    - const ${/c/if/pthread_rwlockattr_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_rwlock_init
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_rwlock_init()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_rwlock_init.html).
params:
- description: |
    is the read-write lock
  dir: out
  name: rwlock
- description: |
    is the read-write lock attributes object
  dir: out
  name: attr
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The system lacked the necessary resources to initialize another read-write
      lock.
    value: ${/c/errno/if/eagain:/name}
  - description: |
      Insufficient memory exists to initialize the read-write lock.
    value: ${/c/errno/if/enomem:/name}
  - description: |
      The value specified by ${.:/params[1]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
