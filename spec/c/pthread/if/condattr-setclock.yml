brief: |
  Set the ${../glossary/cond-clock:/term} of the
  ${../glossary/condition-variable:/term} attributes object referenced by
  ${.:/params[0]/name} to the value specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_condattr_t:/name} *${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_condattr_setclock
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_condattr_setclock()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_condattr_setclock.html).
params:
- description: |
    is the condition variable attributes object.
  dir: inout
  name: attr
- description: |
    is the ${../glossary/cond-clock:/term}.
  dir: null
  name: clock_id
return:
  return: null
  return-values:
  - description: |
      The successful completion returns zero.
    value: 0
  - description: |
      This error number indicates the following error conditions:

      - The value specified by ${.:/params[0]/name} is invalid.
      - The value specified by ${.:/params[1]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
