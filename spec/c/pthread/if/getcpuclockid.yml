brief: |
  Get the CPU-time clock of the ${../glossary/thread:/term} specified by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_t:/name} ${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    Per-thread CPU time clocks are not supported by the system.
  role: errno
  uid: /c/errno/if/enoent
- description: |
    No thread with the ID ${.:/params[0]/name} could be found.
  role: errno
  uid: /c/errno/if/esrch
name: pthread_getcpuclockid
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_getcpuclockid()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_getcpuclockid.html).
params:
- description: |
    is the thread to get the CPU clock ID for.
  dir: null
  name: thread
- description: |
    is the pointer to an object where the CPU clock ID will be stored.
  dir: out
  name: clock_id
return:
  return: null
  return-values:
  - description: |
      The successful completion returns zero.
    value: 0
  - description: |
      No thread could be found corresponding to that specified by the given
      ${.:/params[0]/name} ID.
    value: ${/c/errno/if/esrch:/name}
type: interface
