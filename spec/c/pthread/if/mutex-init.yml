brief: |
  Initialize the ${../glossary/mutex:/term} object referenced by
  ${.:/params[0]/name} using the attributes object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_mutex_t:/name} *restrict ${.:/params[0]/name}
    - const ${/c/if/pthread_mutexattr_t:/name} *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${/c/pthread/glossary/mutex:/term} has not been properly initialized.
  role: errno
  uid: /c/errno/if/einval
name: pthread_mutex_init
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_mutex_init()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutex_init.html).
params:
- description: |
    is the mutex to initialize.
  dir: out
  name: mutex
- description: |
    is the pointer to the mutex attributes object.
  dir: in
  name: attr
return:
  return: null
  return-values:
  - description: |
      The successful completion.
    value: 0
  - description: |
      The system lacked the necessary resources (other than memory) to initialize
      another mutex.
    value: ${/c/errno/if/eagain:/name}
  - description: |
      Insufficient memory exists to initialize the mutex.
    value: ${/c/errno/if/enomem:/name}
  - description: |
      The caller does not have the privilege to perform the operation.
    value: ${/c/errno/if/eperm:/name}
  - description: |
      The implementation has detected an attempt to reinitialize the object
      referenced by ${.:/params[0]/name}, a previously initialized, but not yet
      destroyed, mutex.
    value: ${/c/errno/if/ebusy:/name}
  - description: |
      The value specified by ${.:/params[1]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
