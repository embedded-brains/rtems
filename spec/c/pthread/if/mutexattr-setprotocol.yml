brief: |
  Set the ${../glossary/mutex-protocol:/term} of the ${../glossary/mutex:/term}
  attributes object referenced by ${.:/params[0]/name} to the value specified by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_mutexattr_t:/name} *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_mutexattr_setprotocol
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_mutexattr_setprotocol()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutexattr_setprotocol.html).
params:
- description: |
    is the mutex attributes object to set the protocol for.
  dir: inout
  name: attr
- description: |
    is the new protocol.
  dir: null
  name: protocol
return:
  return: null
  return-values:
  - description: |
      The successful completion.
    value: 0
  - description: |
      This error number indicates the following error conditions:

      - The value specified by ${.:/params[0]/name} is invalid.
      - The value specified by ${.:/params[1]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
  - description: |
      The value specified by ${.:/params[1]/name} is an unsupported value.
    value: ${/c/errno/if/enotsup:/name}
type: interface
