SPDX-License-Identifier: CC-BY-SA-4.0 OR BSD-2-Clause
brief: |
  Lock the ${../glossary/read-write-lock:/term} object referenced by
  ${.:/params[0]/name} for reading with an absolute timeout referenced by
  ${.:/params[2]/name} against the clock specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_rwlock_t:/name} *restrict ${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} ${.:/params[1]/name}
    - const ${/c/if/timespec:/name} *restrict ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_rwlock_clockrdlock
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_rwlock_clockrdlock()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_rwlock_clockrdlock.html).
params:
- description: |
    is the read-write lock to apply a read lock to.
  dir: inout
  name: rwlock
- description: |
    is the clock to use for the timeout.
  dir: null
  name: clock_id
- description: |
    is the pointer to a timespec structure specifying the absolute timeout time.
  dir: in
  name: abstime
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The read lock could not be acquired before the timeout expired.
    value: ${/c/errno/if/etimedout:/name}
  - description: |
      The maximum number of read locks for the rwlock has been exceeded.
    value: ${/c/errno/if/eagain:/name}
  - description: |
      The current thread already owns the rwlock for writing.
    value: ${/c/errno/if/edeadlk:/name}
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is invalid.
      - The ${.:/params[2]/name} parameter is invalid.
      - The ${.:/params[1]/name} parameter is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
