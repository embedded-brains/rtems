brief: |
  Get the ${../glossary/mutex-robust:/term} of the ${../glossary/mutex:/term}
  attributes object referenced by ${.:/params[0]/name} and store it in the object
  referenced by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_mutexattr_t:/name} *restrict ${.:/params[0]/name}
    - int *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- description: |
    The value specified by ${.:/params[0]/name} is invalid.
  role: errno
  uid: /c/errno/if/einval
name: pthread_mutexattr_getrobust
notes: See [POSIX.1-2024, System Interfaces, pthread_mutexattr_getrobust()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutexattr_getrobust.html).
params:
- description: |
    is the pointer to the mutex attributes object.
  dir: in
  name: attr
- description: |
    is the pointer to the robust attribute value.
  dir: out
  name: robust
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: '0'
  - description: |
      The value specified by ${.:/params[0]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
