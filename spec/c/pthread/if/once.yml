brief: |
  Dynamically initialize a package using the once-control object referenced by
  ${.:/params[0]/name} and the initialization routine specified by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pthread_once_t:/name} *${.:/params[0]/name}
    - void ( *${.:/params[1]/name} )( void )
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_once
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_once()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_once.html).
params:
- description: |
    is the once-control object used to ensure the initialization routine is called
    only once.
  dir: inout
  name: once_control
- description: |
    is the pointer to the initialization routine.
  dir: null
  name: init_routine
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      This error number indicates the following error conditions:

      - The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
      - The ${.:/params[1]/name} parameter is ${/c/if/null:/name}.
    value: ${/c/errno/if/einval:/name}
type: interface
