brief: |
  Get the ${../glossary/process-shared:/term} of the ${../glossary/barrier:/term}
  attributes object referenced by ${.:/params[0]/name} and store it in the object
  referenced by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/pthread_barrierattr_t:/name} *restrict ${.:/params[0]/name}
    - int *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: pthread_barrierattr_getpshared
notes: |
  See [POSIX.1-2024, System Interfaces, pthread_barrierattr_getpshared()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_barrierattr_getpshared.html).
params:
- description: |
    is the barrier attributes object.
  dir: in
  name: attr
- description: |
    is the ${../glossary/process-shared:/term}.
  dir: out
  name: pshared
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      The value specified by ${.:/params[0]/name} is invalid.
    value: ${/c/errno/if/einval:/name}
type: interface
