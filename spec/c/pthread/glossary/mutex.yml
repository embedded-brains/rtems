term: mutex
text: |
  A synchronization object used to allow multiple threads to serialize their
  access to shared data. See
  [POSIX.1-2024, Base Definitions, Section 3.256 Mutex](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_04_256).
