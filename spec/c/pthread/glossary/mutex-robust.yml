term: robust attribute
text: |
  The ${mutex:/term} robust attribute defines the behavior when a thread
  terminates while holding the mutex. See
  [POSIX.1-2024, Base Definitions, Section 3.315 Robust Mutex](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_03_315).
