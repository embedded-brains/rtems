term: thread contention scope attribute
text: |
  An attribute of a ${thread:/term} that specifies its contention scope. See
  [POSIX.1-2024, System Interfaces, pthread_attr_getscope](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getscope.html).
  This attribute can be set to ${../if/scope-system:/name} or
  ${../if/scope-process:/name}.
type: glossary
