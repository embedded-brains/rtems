term: thread stack size attribute
text: |
  An attribute of a ${thread:/term} that specifies the minimum size of its stack.
  See
  [POSIX.1-2024, System Interfaces, pthread_attr_getstacksize](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getstacksize.html).
