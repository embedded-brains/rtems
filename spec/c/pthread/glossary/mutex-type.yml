term: mutex type attribute
text: |
  An attribute of a ${mutex:/term} that specifies its behavior. See
  [POSIX.1-2024, System Interfaces, pthread_mutexattr_gettype](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutexattr_gettype.html).
  This attribute can be set to ${../if/mutex-normal:/name},
  ${../if/mutex-errorcheck:/name}, ${../if/mutex-recursive:/name}, or
  ${../if/mutex-default:/name}.
type: glossary
