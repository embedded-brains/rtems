term: barrier
text: |
  A synchronization object that allows multiple threads to wait until all threads
  have reached a particular point of execution. See
  [POSIX.1-2024, Base Definitions, Section 3.65 Barrier](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_04_65).
