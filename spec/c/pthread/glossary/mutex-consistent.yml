term: consistent
text: |
  Describes the state of a ${mutex-robust:/term} that protects a consistent
  state. See
  [POSIX.1-2024, System Interfaces, pthread_mutex_consistent](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutex_consistent.html).
