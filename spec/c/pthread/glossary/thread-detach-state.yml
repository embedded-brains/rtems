term: thread detach state attribute
text: |
  An attribute of a ${thread:/term} that specifies whether the thread is created
  in a detached state. See
  [POSIX.1-2024, System Interfaces, pthread_attr_getdetachstate](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getdetachstate.html).
  This attribute can be set to ${../if/create-detached:/name} or
  ${../if/create-joinable:/name}.
type: glossary
