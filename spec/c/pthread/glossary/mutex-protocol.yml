term: mutex protocol attribute
text: |
  An attribute of a ${mutex:/term} that specifies its scheduling protocol. See
  [POSIX.1-2024, System Interfaces, pthread_mutexattr_getprotocol](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_mutexattr_getprotocol.html).
  This attribute can be set to ${../if/prio-none:/name},
  ${../if/prio-inherit:/name}, or ${../if/prio-protect:/name}.
type: glossary
