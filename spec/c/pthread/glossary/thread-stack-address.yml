term: thread stack address attribute
text: |
  An attribute of a ${thread:/term} that specifies the lowest address of its
  stack. See
  [POSIX.1-2024, System Interfaces, pthread_attr_getstack](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getstack.html).
type: glossary
