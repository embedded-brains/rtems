term: thread cancel type attribute
text: |
  An attribute of a ${thread:/term} that specifies its cancelability type. See
  [POSIX.1-2024, System Interfaces, pthread_setcanceltype](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_setcanceltype.html).
  This attribute can be set to ${../if/cancel-deferred:/name} or
  ${../if/cancel-asynchronous:/name}.
type: glossary
