term: thread guard size attribute
text: |
  An attribute of a ${thread:/term} that specifies the size of the guard area for
  its stack. See
  [POSIX.1-2024, System Interfaces, pthread_attr_getguardsize](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_attr_getguardsize.html).
