term: thread cancel state attribute
text: |
  An attribute of a ${thread:/term} that specifies its cancelability state. See
  [POSIX.1-2024, System Interfaces, pthread_setcancelstate](https://pubs.opengroup.org/onlinepubs/9799919799/functions/pthread_setcancelstate.html).
  This attribute can be set to ${../if/cancel-enable:/name} or
  ${../if/cancel-disable:/name}.
type: glossary
