test-actions:
- action-brief: |
    Call ${/c/string/if/memchr:/name} for a sample set of buffers and characters to
    locate.
  action-code: |
    uint8_t  mem[ sizeof( long ) * 10 ];
    uint8_t *aligned_mem;
    size_t   offset_mem;

    aligned_mem = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) mem, sizeof( long ) );

    for ( offset_mem = 0; offset_mem < sizeof( long ); ++offset_mem  ) {
      size_t size;

      for ( size = 0; size < sizeof( long ) * 8; ++size ) {
        unsigned char chr;
        uint8_t      *m;
        uint8_t      *e;
        void         *p;

        m = aligned_mem + offset_mem;
        e = m + size;
        Fill( m, e );

        for ( chr = 0; chr < size; ++chr ) {
          p = memchr( m, chr + 1, size );
          T_eq_ptr( p, m + chr );
        }

        p = memchr( m, size + 1, size );
        T_null( p );
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/memchr
- action-brief: |
    Call ${/c/string/if/strchr:/name} for a sample set of buffers and characters to
    locate.
  action-code: |
    char    mem[ sizeof( long ) * 11 ];
    char   *aligned_mem;
    size_t  offset_mem;

    aligned_mem = (char *) RTEMS_ALIGN_UP( (uintptr_t) mem, sizeof( long ) );

    for ( offset_mem = 0; offset_mem < sizeof( long ); ++offset_mem  ) {
      size_t size;

      for ( size = 0; size < sizeof( long ) * 8; ++size ) {
        char  chr;
        char *m;
        char *e;
        void *p;

        m = aligned_mem + offset_mem;
        e = m + size;
        Fill( m, e );
        *e = '\0';

        for ( chr = 0; (unsigned char) chr < size; ++chr ) {
          p = strchr( m, chr + 1 );
          T_eq_ptr( p, m + chr );
        }

        p = strchr( m, size + 1 );
        T_null( p );

        p = strchr( m, 0 );
        T_eq_ptr( p, e );
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/strchr
