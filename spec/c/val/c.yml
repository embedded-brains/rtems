- action-brief: |
    Call ${/c/string/if/memcmp:/name} for a sample set of buffers.
  action-code: |
    uint8_t  mem_a[ sizeof( long ) * 10 ];
    uint8_t  mem_b[ sizeof( long ) * 10 ];
    uint8_t *aligned_mem_a;
    uint8_t *aligned_mem_b;
    size_t   offset_mem_a;

    memset( mem_a, 0x85, sizeof( mem_a ) );
    memset( mem_b, 0x85, sizeof( mem_b ) );
    aligned_mem_a = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) mem_a, sizeof( long ) );
    aligned_mem_b = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) mem_b, sizeof( long ) );

    for ( offset_mem_a = 0; offset_mem_a < sizeof( long ); ++offset_mem_a  ) {
      size_t offset_mem_b;

      for ( offset_mem_b = 0; offset_mem_b < sizeof( long ); ++offset_mem_b  ) {
        size_t size;

        for ( size = 0; size < sizeof( long ) * 8; ++size ) {
          uint8_t *a;
          uint8_t *b;
          int      c;
          size_t   defect;

          a = aligned_mem_a + offset_mem_a;
          b = aligned_mem_b + offset_mem_b;
          Fill( a, a + size );
          Fill( b, b + size );

          c = memcmp( a, b, size );
          T_eq_int( c, 0 );

          for ( defect = 1; defect < size; ++defect ) {
            Fill( b, b + size );
            b[ defect ] += defect;

            c = memcmp( a, b, size );
            T_lt_int( c, 0 );
          }

          for ( defect = 1; defect < size; ++defect ) {
            Fill( b, b + size );
            b[ defect ] -= defect;

            c = memcmp( a, b, size );
            T_gt_int( c, 0 );
          }
        }
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/memcmp
- action-brief: |
    Call ${/c/string/if/strcmp:/name} for a sample set of buffers.
  action-code: |
    char    str_a[ sizeof( long ) * 10 ];
    char    str_b[ sizeof( long ) * 10 ];
    char   *aligned_str_a;
    char   *aligned_str_b;
    size_t  offset_str_a;

    memset( str_a, 0x85, sizeof( str_a ) );
    memset( str_b, 0x85, sizeof( str_b ) );
    aligned_str_a = (char *) RTEMS_ALIGN_UP( (uintptr_t) str_a, sizeof( long ) );
    aligned_str_b = (char *) RTEMS_ALIGN_UP( (uintptr_t) str_b, sizeof( long ) );

    for ( offset_str_a = 0; offset_str_a < sizeof( long ); ++offset_str_a  ) {
      size_t offset_str_b;

      for ( offset_str_b = 0; offset_str_b < sizeof( long ); ++offset_str_b  ) {
        size_t size_a;

        for ( size_a = 0; size_a < sizeof( long ) * 8; ++size_a ) {
          size_t size_b;

          for ( size_b = 0; size_b < sizeof( long ) * 8; ++size_b ) {
            char   *a;
            char   *b;
            int    c;
            size_t defect;

            a = aligned_str_a + offset_str_a;
            b = aligned_str_b + offset_str_b;
            Fill( a, a + size_a );
            a[ size_a ] = '\0';
            Fill( b, b + size_b );
            b[ size_b ] = '\0';

            c = strcmp( a, b );

            if ( size_a < size_b ) {
              T_lt_int( c, 0 );
            } else if ( size_a == size_b ) {
              T_eq_int( c, 0 );

              for ( defect = 1; defect < size_b; ++defect ) {
                Fill( b, b + size_b );
                b[ defect ] += defect;

                c = strcmp( a, b );
                T_lt_int( c, 0 );
              }

              for ( defect = 1; defect < size_b; ++defect ) {
                Fill( b, b + size_b );
                b[ defect ] -= defect;

                c = strcmp( a, b );
                T_gt_int( c, 0 );
              }
            } else {
              T_gt_int( c, 0 );
            }
          }
        }
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/strcmp
- action-brief: |
    Call ${/c/string/if/strncmp:/name} for a sample set of buffers.
  action-code: |
    char    str_a[ sizeof( long ) * 10 ];
    char    str_b[ sizeof( long ) * 10 ];
    char   *aligned_str_a;
    char   *aligned_str_b;
    size_t  offset_str_a;

    memset( str_a, 0x85, sizeof( str_a ) );
    memset( str_b, 0x85, sizeof( str_b ) );
    aligned_str_a = (char *) RTEMS_ALIGN_UP( (uintptr_t) str_a, sizeof( long ) );
    aligned_str_b = (char *) RTEMS_ALIGN_UP( (uintptr_t) str_b, sizeof( long ) );

    for ( offset_str_a = 0; offset_str_a < sizeof( long ); ++offset_str_a  ) {
      size_t offset_str_b;

      for ( offset_str_b = 0; offset_str_b < sizeof( long ); ++offset_str_b  ) {
        size_t size_a;

        for ( size_a = 0; size_a < sizeof( long ) * 8; ++size_a ) {
          size_t size_b;

          for ( size_b = 0; size_b < sizeof( long ) * 8; ++size_b ) {
            char   *a;
            char   *b;
            int    c;
            size_t defect;

            a = aligned_str_a + offset_str_a;
            b = aligned_str_b + offset_str_b;
            Fill( a, a + size_a );
            a[ size_a ] = '\0';
            Fill( b, b + size_b );
            b[ size_b ] = '\0';

            c = strncmp( a, b, size_a );

            if ( size_a > size_b ) {
              T_gt_int( c, 0 );
              T_eq_int( strncmp( a, b, size_b ), 0 );

              for ( defect = 1; defect < size_b; ++defect ) {
                Fill( b, b + size_b );
                b[ defect ] += defect;

                c = strncmp( a, b, size_a );
                T_lt_int( c, 0 );
              }

              for ( defect = 1; defect < size_b; ++defect ) {
                Fill( b, b + size_b );
                b[ defect ] -= defect;

                c = strncmp( a, b, size_a );
                T_gt_int( c, 0 );
              }
            } else if ( size_a == size_b ) {
              T_eq_int( c, 0 );
              T_eq_int( strncmp( a, b, size_a + sizeof(long) ), 0 );
            } else {
              T_eq_int( c, 0 );
              T_lt_int( strncmp( a, b, size_b ), 0 );

              for ( defect = 1; defect < size_a; ++defect ) {
                Fill( a, a + size_a );
                a[ defect ] += defect;

                c = strncmp( a, b, size_b );
                T_gt_int( c, 0 );
              }

              for ( defect = 1; defect < size_a; ++defect ) {
                Fill( a, a + size_a );
                a[ defect ] -= defect;

                c = strncmp( a, b, size_b );
                T_lt_int( c, 0 );
              }
            }
          }
        }
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/strncmp
- action-brief: |
    Call ${/c/string/if/memcpy:/name} for a sample set of buffers.
  action-code: |
    uint8_t  src[ sizeof( long ) * 10 ];
    uint8_t  dst[ sizeof( long ) * 10 ];
    uint8_t *begin;
    uint8_t *end;
    uint8_t *aligned_src;
    uint8_t *aligned_dst;
    size_t   offset_src;

    memset( src, 0x85, sizeof( src ) );
    begin = dst;
    end = begin + sizeof( dst );
    aligned_src = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) src, sizeof( long ) );
    aligned_dst = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) dst, sizeof( long ) );

    for ( offset_src = 0; offset_src < sizeof( long ); ++offset_src  ) {
      size_t offset_dst;

      for ( offset_dst = 0; offset_dst < sizeof( long ); ++offset_dst  ) {
        size_t size;

        for ( size = 0; size < sizeof( long ) * 8; ++size ) {
          uint8_t *s;
          uint8_t *d;
          uint8_t *e;

          s = aligned_src + offset_src;
          d = aligned_dst + offset_dst;
          e = d + size;

          Clear( begin, end );
          memcpy( d, s, size );
          T_true( Compare( begin, d, 0 ) );
          T_true( Compare( d, e, 0x85 ) );
          T_true( Compare( e, end, 0 ) );
        }
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/memcpy
- action-brief: |
    Call ${/c/string/if/memmove:/name} for a sample set of buffers.
  action-code: |
    uint8_t  src[ sizeof( long ) * 18 ];
    uint8_t  dst[ sizeof( long ) * 10 ];
    uint8_t *begin;
    uint8_t *end;
    uint8_t *aligned_src;
    uint8_t *aligned_dst;
    size_t   offset_src;

    /* Non-overlapping memory areas */

    memset( src, 0x85, sizeof( src ) );
    begin = dst;
    end = begin + sizeof( dst );
    aligned_src = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) src, sizeof( long ) );
    aligned_dst = (uint8_t *) RTEMS_ALIGN_UP( (uintptr_t) dst, sizeof( long ) );

    for ( offset_src = 0; offset_src < sizeof( long ); ++offset_src  ) {
      size_t offset_dst;

      for ( offset_dst = 0; offset_dst < sizeof( long ); ++offset_dst  ) {
        size_t size;

        for ( size = 0; size < sizeof( long ) * 8; ++size ) {
          uint8_t *s;
          uint8_t *d;
          uint8_t *e;

          s = aligned_src + offset_src;
          d = aligned_dst + offset_dst;
          e = d + size;

          Clear( begin, end );
          memmove( d, s, size );
          T_true( Compare( begin, d, 0 ) );
          T_true( Compare( d, e, 0x85 ) );
          T_true( Compare( e, end, 0 ) );
        }
      }
    }

    /* Overlapping memory areas */

    begin = src;
    end = begin + sizeof( src );
    aligned_dst = aligned_src;

    for ( offset_src = 0; offset_src < sizeof( long ); ++offset_src  ) {
      size_t offset_dst;

      for ( offset_dst = 0; offset_dst < sizeof( long ); ++offset_dst  ) {
        size_t size;

        for ( size = 0; size < sizeof( long ) * 8; ++size ) {
          uint8_t *s;
          uint8_t *d;
          uint8_t *es;
          uint8_t *ed;

          s = aligned_src + offset_src;
          d = aligned_dst + offset_dst;
          es = s + size;
          ed = d + size;

          Clear( begin, end );
          memset( s, 0x85, size );
          memmove( d, s, size );

          T_true( Compare( d, ed, 0x85 ) );
          T_true( Compare( s, es, 0x85 ) );

          if ( offset_src <= offset_dst ) {
            T_true( Compare( begin, s, 0 ) );
            T_true( Compare( ed, end, 0 ) );

            if ( (uintptr_t) ed < (uintptr_t) s ) {
              T_true( Compare( ed, s, 0 ) );
            }
          } else {
            T_true( Compare( begin, d, 0 ) );
            T_true( Compare( es, end, 0 ) );

            if ( (uintptr_t) es < (uintptr_t) d ) {
              T_true( Compare( es, d, 0 ) );
            }
          }
        }
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/memmove
