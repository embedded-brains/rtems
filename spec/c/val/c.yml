- action-brief: |
    Call ${/c/string/if/strlen:/name} for a sample set of strings.
  action-code: |
    char    str[ sizeof( long ) * 10 ];
    char   *aligned_str;
    size_t  offset;

    aligned_str = (char *) RTEMS_ALIGN_UP( (uintptr_t) str, sizeof( long ) );

    for ( offset = 0; offset < sizeof( long ); ++offset  ) {
      size_t size;

      for ( size = 0; size < sizeof( long ) * 8; ++size ) {
        char *s;

        s = aligned_str + offset;

        memset( s, 0x85, size );
        s[ size ] = '\0';
        RTEMS_OBFUSCATE_VARIABLE( s );
        T_eq_sz( strlen( s ), size );
      }
    }
  checks: []
  links:
  - role: validation
    uid: /c/string/req/strlen
- action-brief: |
    Call ${/c/string/if/strlcpy:/name} for a sample set of strings.
  action-code: |
    char   dst[ 4 ];

    memset( dst, 0xff, sizeof( dst ) );
    T_eq_sz( strlcpy( dst, "1", 0 ), 1 );
    T_eq_int( (unsigned char) dst[ 0 ], 0xff );

    memset( dst, 0xff, sizeof( dst ) );
    T_eq_sz( strlcpy( dst, "1", 1 ), 1 );
    T_eq_str( dst, "" );

    memset( dst, 0xff, sizeof( dst ) );
    T_eq_sz( strlcpy( dst, "12", 1 ), 2 );
    T_eq_str( dst, "" );

    memset( dst, 0xff, sizeof( dst ) );
    T_eq_sz( strlcpy( dst, "12", 3 ), 2 );
    T_eq_str( dst, "12" );

    memset( dst, 0xff, sizeof( dst ) );
    T_eq_sz( strlcpy( dst, "12", 4 ), 2 );
    T_eq_str( dst, "12" );
  checks: []
  links:
  - role: validation
    uid: /c/string/req/strlcpy
