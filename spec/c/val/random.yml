test-actions:
- action-brief: |
    Call ${/c/unistd/if/getentropy:/name} for a sample set of buffers.
  action-code: |
    uint8_t  buf[ 32 ];
    uint32_t same;
    size_t   i;

    same = 0;

    for ( i = 0; i < RTEMS_ARRAY_SIZE( buf ); ++i ) {
      size_t j;

      memset( buf, 0xff, sizeof( buf ) );
      T_eq_int( getentropy( buf, i ), 0 );

      for ( j = 0; j < i ; ++j ) {
        if ( buf[ j ] == 0xff ) {
          ++same;
        }
      }

      for ( j = i; j < RTEMS_ARRAY_SIZE( buf ) ; ++j ) {
        T_eq_u8( buf[ j ], 0xff );
      }
    }
  checks:
  - brief: |
      Check that the buffer was filled with data.
    code: |
      /* Failure should be unlikely */
      T_lt_u32( same, 10 );
    links:
    - role: validation
      uid: /c/unistd/req/getentropy
  links:
  - role: validation
    uid: /c/unistd/req/getentropy-success
- action-brief: |
    Call ${/c/stdlib/if/arc4random:/name} a couple of times.
  action-code: |
    uint32_t expected_counter;
    uint32_t last;
    uint32_t same;

    expected_counter = getentropy_counter + 2;
    same = 0;
    last = 0;

    do {
      uint32_t now;

      now = arc4random();

      if ( now == last ) {
        ++same;
      }

      last = now;
    } while ( expected_counter != getentropy_counter );
  checks:
  - brief: |
      Check that the not always the same data was produced.
    code: |
      /* Failure should be unlikely */
      T_lt_u32( same, 10 );
    links:
    - role: validation
      uid: /c/stdlib/req/arc4random
  links:
  - role: validation
    uid: /c/stdlib/req/arc4random-reinit
- action-brief: |
    Allocate a buffer which has a length of twice the maximum reinitialization
    count.  Call ${/c/stdlib/if/arc4random-buf:/name} with the buffer.  Perform a very
    simple randomness test.
  action-code: |
    size_t    len;
    uint32_t *buf;
    uint32_t  counter;
    uint32_t  same;
    uint32_t  last;
    size_t    i;

    len = 2 * 1024 * 1024;
    buf = T_malloc( len );
    T_assert_not_null( buf );
    counter = getentropy_counter;
    arc4random_buf( buf, len );
    T_ne_u32( getentropy_counter, counter );

    same = 0;
    last = 0;

    for ( i = 0; i < len / sizeof( *buf ); ++i ) {
      uint32_t now;

      now = buf[ i ];

      if ( now == last ) {
        ++same;
      }

      last = now;
    }
  checks:
  - brief: |
      Check that the not always the same data was produced.
    code: |
      /* Failure should be unlikely */
      T_lt_u32( same, 10 );
    links:
    - role: validation
      uid: /c/stdlib/req/arc4random-buf
  links:
  - role: validation
    uid: /c/stdlib/req/arc4random-reinit
- action-brief: |
    Let the ${/c/unistd/if/getentropy:/name} function fail while the
    ${/c/stdlib/if/arc4random:/name} support uses it to reinitialize the pseudo-random
    number generator.  After this test, the internal mutex is still locked.
  action-code: |
    getentropy_status = -1;
    ProduceAndCheckFatalError(
      ExhaustPseudoRandomNumbers,
      CheckGetentropyFail,
      NULL
    );
  checks: []
  links:
  - role: validation
    uid: /c/stdlib/req/fatal-arc4random-getentropy-fail
test-brief: |
  Tests C library functions providing random numbers.
test-context: []
test-context-support: null
test-description: null
test-header: null
test-includes:
- stdlib.h
- unistd.h
test-local-includes:
- tx-support.h
test-setup: null
test-stop: null
test-support: |
  static void CheckGetentropyFail(
    rtems_fatal_source source,
    rtems_fatal_code   code,
    void              *arg
  )
  {
    T_eq_int( source, INTERNAL_ERROR_CORE );
    T_eq_ulong( code, INTERNAL_ERROR_ARC4RANDOM_GETENTROPY_FAIL );
    T_null( arg );
  }

  static void ExhaustPseudoRandomNumbers( void *arg )
  {
    T_null( arg );

    while ( true ) {
      (void) arc4random();
    }
  }

  static uint32_t getentropy_counter;

  static int getentropy_status;

  int __real_getentropy( void *ptr, size_t n );

  int __wrap_getentropy( void *ptr, size_t n );

  int __wrap_getentropy( void *ptr, size_t n )
  {
    int status;

    ++getentropy_counter;
    status = getentropy_status;

    if ( status != 0 ) {
      getentropy_status = 0;
      return status;
    }

    return __real_getentropy( ptr, n );
  }
test-target: testsuites/validation/tc-random.c
test-teardown: null
type: test-case
