test-actions:
- action-brief: |
    Call ${../if/getentropy:/name} for a sample set of buffers.
  action-code: |
    uint8_t  buf[ 32 ];
    uint32_t same;
    size_t   i;

    same = 0;

    for ( i = 0; i < RTEMS_ARRAY_SIZE( buf ); ++i ) {
      size_t j;

      memset( buf, 0xff, sizeof( buf ) );
      T_eq_int( getentropy( buf, i ), 0 );

      for ( j = 0; j < i ; ++j ) {
        if ( buf[ j ] == 0xff ) {
          ++same;
        }
      }

      for ( j = i; j < RTEMS_ARRAY_SIZE( buf ) ; ++j ) {
        T_eq_u8( buf[ j ], 0xff );
      }
    }
  checks:
  - brief: |
      Check that the buffer was filled with data.
    code: |
      /* Failure should be unlikely */
      T_lt_u32( same, 10 );
    links:
    - role: validation
      uid: ../req/getentropy
  links:
  - role: validation
    uid: ../req/getentropy-success
