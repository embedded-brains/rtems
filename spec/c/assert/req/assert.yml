test-action: |
  ctx->invocation.evaluations = 0;
  ctx->invocation.file = NULL;
  ctx->invocation.line = 0;
  ctx->invocation.expression = NULL;
  ctx->returned = false;
  ctx->fatal = false;
  ctx->source = 0;
  ctx->output_count = 0;
  ctx->output[ 0 ] = '\0';
  memset( &ctx->assert_context, 0, sizeof( ctx->assert_context ) );
  SetFatalHandler( Fatal, ctx );
  ctx->output_char = BSP_output_char;
  BSP_output_char = OutputChar;

  if ( setjmp( ctx->before_fatal ) == 0 ) {
    AssertInvoke( ctx->ndebug, ctx->assert_func, &ctx->invocation );
    BSP_output_char = ctx->output_char;
    SetFatalHandler( NULL, NULL );
    ctx->returned = true;
  }
