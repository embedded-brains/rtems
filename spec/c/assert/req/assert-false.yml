text: |
  Where ${/user/if/ndebug:/name} is not defined, while the expression passed as
  the first and only parameter to the ${../if/assert:/name} macro evaluates to
  ``false``, the macro expansion shall terminate the system with a fatal source
  of ${/score/interr/if/source-assert:/name} and a fatal code containing a
  reference to an object of type ${/rtems/fatal/if/assert-context:/name}.
