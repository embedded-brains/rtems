brief: |
  Get the value of the ${../glossary/semaphore:/term} referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/sem_t:/name} *restrict ${.:/params[0]/name}
    - int *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} argument is not a valid
    ${../glossary/semaphore:/term}.
  role: errno
  uid: /c/errno/if/einval
name: sem_getvalue
notes: |
  See [POSIX.1-2024, System Interfaces, sem_getvalue()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sem_getvalue.html).
params:
- description: |
    is the pointer to the ${../glossary/semaphore:/term}.
  dir: inout
  name: sem
- description: |
    is the pointer to an integer where the ${../glossary/semaphore:/term} value
    will be stored.
  dir: out
  name: sval
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
