brief: |
  Get the value of the ${/glossary/countingsemaphore:/term} referenced by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 OHB System AG
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/sem_t:/name} *restrict ${.:/params[0]/name}
    - int *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: /c/if/semaphore
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} parameter is ${/c/if/null:/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The object referenced by the ${.:/params[0]/name} parameter is not an
    initialized ${/glossary/countingsemaphore:/term}.
  role: errno
  uid: /c/errno/if/einval
- role: reference
  uid: /ref/std/posix-2024/sem-getvalue
name: sem_getvalue
notes: |
  See ${/ref/std/posix-2024/sem-getvalue:/name}.
params:
- description: |
    is the pointer to the ${/glossary/countingsemaphore:/term}.
  dir: in
  name: sem
- description: |
    is the pointer to the location where the value of the
    ${/glossary/countingsemaphore:/term} will be stored.
  dir: out
  name: sval
return:
  return: null
  return-values:
  - description: |
      The requested operation was successful.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
