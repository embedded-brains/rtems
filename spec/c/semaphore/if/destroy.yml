definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/sem_t:/name} *${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The ${.:/params[0]/name} argument is not a valid
    ${../glossary/semaphore:/term}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    There are threads currently blocked on the ${../glossary/semaphore:/term}
    referenced by ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/ebusy
name: sem_destroy
notes: |
