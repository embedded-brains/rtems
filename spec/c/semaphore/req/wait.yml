enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/wait
- role: requirement-refinement
  uid: /c/req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/sem-wait
post-conditions:
- name: Status
  states:
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/wait:/name} shall be minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The value of ${/c/errno/if/errno:/name} shall be ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Sem
  states:
  - name: Nop
    test-code: |
      sem_t expected;

      memcpy( &expected, &ctx->sem_before, sizeof( expected ) );
      ExpectReleasedLock( ctx, &expected );
      T_eq_mem( &ctx->sem_obj, &expected, sizeof( ctx->sem_obj ) );
    text: |
      The object referenced by the ${../if/wait:/params[0]/name} parameter shall not
      be modified.
  test-epilogue: null
  test-prologue: null
- name: Action
  states:
  - name: SemSeizeWait
    test-code: |
      T_eq_int( sem_post( ctx->sem ), 0 );
      ctx->tq_sem_ctx.base.thread_queue_object = &ctx->sem_obj;
      ctx->tq_sem_ctx.base.wait = TQ_WAIT_FOREVER;
      ${/score/sem/req/seize-wait:/test-run}( &ctx->tq_sem_ctx );
    text: |
      The calling thread shall wait to seize the ${/glossary/countingsemaphore:/term}
      referenced by the ${../if/wait:/params[0]/name} parameter as specified by
      ${/score/sem/req/seize-wait:/spec} where the thread queue of the semaphore uses
      the priority discipline and the directive waits without a timeout.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Sem
  states:
  - name: Obj
    test-code: |
      T_eq_int( sem_init( &ctx->sem_obj, 0, 1 ), 0 );
      ctx->sem = &ctx->sem_obj;
    text: |
      While the ${../if/wait:/params[0]/name} parameter references an object of type
      ${/c/if/sem_t:/name}.
  - name: 'Null'
    test-code: |
      ctx->sem = NULL;
    text: |
      While the ${../if/wait:/params[0]/name} parameter is ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Initialized
  states:
  - name: 'Yes'
    test-code: |
      /* The object was initialized by the arrangement of pre-condition Sem */
    text: |
      While the object referenced by the ${../if/wait:/params[0]/name} parameter is
      an initialized ${/glossary/countingsemaphore:/term} with a value of one.
  - name: 'No'
    test-code: |
      T_eq_int( sem_destroy( &ctx->sem_obj ), 0 );
    text: |
      While the object referenced by the ${../if/wait:/params[0]/name} parameter is
      not an initialized ${/glossary/countingsemaphore:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  RTEMS checks the ${../if/wait:/params[0]/name} parameter before the semaphore
  is seized. It returns minus one and sets ${/c/errno/if/errno:/name} to
  ${/c/errno/if/einval:/name} if the parameter is ${/c/if/null:/name} or
  references no initialized semaphore. These cases are specified here, since
  ${/score/sem/req/seize-wait:/spec} has no pre-condition for the validity of the
  object. A destroyed semaphore gives state No of pre-condition Initialized.

  For an initialized semaphore, post-condition Action alone specifies the call.
  Post-condition Action delegates the seize with all values and waiting threads
  to ${/score/sem/req/seize-wait:/spec}, which sets the value of the semaphore
  itself.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->sem_before, &ctx->sem_obj, sizeof( ctx->sem_before ) );
  errno = ERRNO_POISON;
  ctx->status = sem_wait( ctx->sem );
  ctx->errno_value = errno;
test-brief: null
test-cleanup: |
  if ( ctx->sem_obj._flags != 0 ) {
    T_eq_int( sem_destroy( &ctx->sem_obj ), 0 );
  }
