text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Sem: 'Null'
      then: Error
    - if:
        pre-conditions:
          Value: TooBig
      then: Error
    - else: Ok
    Errno:
    - if:
        post-conditions:
          Status: Ok
      then: Nop
    - else: Inval
    Object:
    - if:
        pre-conditions:
          Sem: 'Null'
      then: N/A
    - if:
        post-conditions:
          Status: Ok
      then: Initialized
    - else: Nop
    Count:
    - if:
        post-conditions:
          Status: Ok
      then-specified-by: Value
    - else: N/A
    Queue:
    - if:
        post-conditions:
          Status: Ok
      then: Empty
    - else: N/A
  pre-conditions:
    Sem: all
    Pshared: all
    Value:
      applicable:
        pre-conditions:
          Sem: Valid
type: requirement
