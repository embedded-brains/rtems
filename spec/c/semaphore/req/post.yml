enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/post
- role: requirement-refinement
  uid: ../../req/group-posix-api
- role: reference
  uid: /ref/std/posix-2024/sem-post
- role: function-implementation
  uid: /score/sem/req/surrender
post-conditions:
- name: Status
  states:
  - name: Error
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/post:/name} shall be -1.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The ${/c/errno/if/errno:/name} shall be equal to ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Object
  states:
  - name: Nop
    test-code: |
      T_eq_mem( &ctx->sem_storage, &ctx->sem_before, sizeof( ctx->sem_before ) );
    text: |
      The object referenced by the ${../if/post:/params[0]/name} parameter shall not
      be modified.
  test-epilogue: null
  test-prologue: null
- name: Action
  states:
  - name: SemSurrender
    test-code: |
      ctx->tq_sem_ctx.base.thread_queue_object = ctx->sem;
      ${/score/sem/req/surrender:/test-run}( &ctx->tq_sem_ctx );
    text: |
      The calling thread shall surrender the ${/glossary/countingsemaphore:/term}
      referenced by the ${../if/post:/params[0]/name} parameter as specified by
      ${/score/sem/req/surrender:/spec} where the semaphore is a
      ${/glossary/countingsemaphore:/term} and the thread queue of the semaphore uses
      the priority discipline.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Sem
  states:
  - name: 'Null'
    test-code: |
      ctx->sem = NULL;
      ctx->sem_initialized = false;
    text: |
      While the ${../if/post:/params[0]/name} parameter is ${/c/if/null:/name}.
  - name: Invalid
    test-code: |
      T_eq_int( sem_init( &ctx->sem_storage, 0, 1 ), 0 );
      T_eq_int( sem_destroy( &ctx->sem_storage ), 0 );
      ctx->sem = &ctx->sem_storage;
      ctx->sem_initialized = false;
    text: |
      While the ${/glossary/countingsemaphore:/term} referenced by the
      ${../if/post:/params[0]/name} parameter is invalid.
  - name: Init
    test-code: |
      T_eq_int( sem_init( &ctx->sem_storage, 0, 1 ), 0 );
      ctx->sem = &ctx->sem_storage;
      ctx->sem_initialized = true;

      ctx->tq_sem_ctx.base.discipline = TQ_PRIORITY;
      ctx->tq_sem_ctx.variant = TQ_SEM_COUNTING;
    text: |
      While the object referenced by the ${../if/post:/params[0]/name} parameter is
      an initialized ${/glossary/countingsemaphore:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/posix-2024/sem-post:/name} allows ${/c/errno/if/einval:/name} for a
  ${../if/post:/params[0]/name} parameter which does not refer to a valid
  semaphore. The standard leaves the behaviour undefined for a
  ${../if/post:/params[0]/name} parameter which is equal to ${/c/if/null:/name}.
  The states Invalid and Null of pre-condition Sem specify that RTEMS returns -1
  and sets ${/c/errno/if/einval:/name}. State Nop of post-condition Object
  specifies that RTEMS does not modify an invalid object.

  All other effects of a successful call are specified by the thread queue
  requirement /score/sem/req/surrender through post-condition Action and are not
  repeated here. This includes the failure with ${/c/errno/if/eoverflow:/name} at
  the maximum count.

  The state of post-condition Action names the variant and the discipline of the
  thread queue requirement. A POSIX semaphore is a counting semaphore with the
  maximum count ${/c/if/sem_value_max:/name} and the priority discipline.
requirement-type: functional
skip-reasons: {}
test-action: |
  memcpy( &ctx->sem_before, &ctx->sem_storage, sizeof( ctx->sem_before ) );
  errno = -1;
  ctx->status = sem_post( ctx->sem );
  ctx->errno_value = errno;
test-brief: null
test-cleanup: |
  if ( ctx->sem_initialized ) {
    T_eq_int( sem_destroy( &ctx->sem_storage ), 0 );
  }
test-context:
- brief: |
    This member specifies the ${../if/post:/params[0]/name} parameter value.
  description: null
  member: sem_t *sem
- brief: |
    This member contains the return value of the ${../if/post:/name} call.
  description: null
  member: int status
- brief: |
    This member contains the value of ${/c/errno/if/errno:/name} after the
    ${../if/post:/name} call.
  description: null
  member: int errno_value
- brief: |
    This member provides the storage for a semaphore.
  description: null
  member: sem_t sem_storage
- brief: |
    This member contains a copy of the object referenced by the
    ${../if/post:/params[0]/name} parameter before the call.
  description: null
  member: sem_t sem_before
- brief: |
    This member is true, if the sem_storage member contains an initialized
    semaphore.
  description: null
  member: bool sem_initialized
- brief: |
    This member contains the thread queue test context.
  description: null
  member: TQSemContext tq_sem_ctx
