    TQDestroy( &ctx->tq_sem_ctx.base );
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          Sem:
          - 'Null'
          - Invalid
      then: Error
    - else: N/A
    Errno:
    - if:
        pre-conditions:
          Sem:
          - 'Null'
          - Invalid
      then: Inval
    - else: N/A
    Object:
    - if:
        pre-conditions:
          Sem: Invalid
      then: Nop
    - else: N/A
    Action:
    - if:
        pre-conditions:
          Sem: Init
      then: SemSurrender
    - else: N/A
  pre-conditions:
    Sem: all
type: requirement
