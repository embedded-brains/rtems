definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/size_t:/name} ${.:/params[0]/name}
    - ${/c/if/size_t:/name} ${.:/params[1]/name}
    return: void *
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: stdlib
- role: interface-ingroup
  uid: group
- role: reference
  uid: /ref/std/c23/aligned-alloc
- path: functions/aligned_alloc.html
  role: reference
  uid: /ref/std/posix-2024
name: aligned_alloc
notes: null
params:
- description: |
    is the alignment in bytes of the memory area.
  dir: null
  name: alignment
- description: |
    is the size in bytes of the memory area to allocate.
  dir: null
  name: size
return:
  return: |
    Returns the begin address of the allocated memory area, otherwise
    ${/c/if/null:/name}. For an invalid alignment, the function sets
    ${/c/errno/if/errno:/name} to ${/c/errno/if/einval:/name}. If no memory area
    can be allocated, the function sets ${/c/errno/if/errno:/name} to
    ${/c/errno/if/enomem:/name}.
  return-values: []
type: interface
