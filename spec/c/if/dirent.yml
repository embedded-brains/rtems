definition:
- default:
    brief: |
      This member represents the file serial number.
    definition: ${/c/if/ino_t:/name} ${.:name}
    description: null
    kind: member
    name: d_fileno
  variants: []
- default:
    brief: |
      This member represents the offset to the next directory entry.
    definition: ${/c/if/off_t:/name} ${.:name}
    description: null
    kind: member
    name: d_off
  variants: []
- default:
    brief: |
      This member represents the length of this directory entry.
    definition: ${/c/if/uint16_t:/name} ${.:name}
    description: null
    kind: member
    name: d_reclen
  variants: []
- default:
    brief: |
      This member represents the type of the file.
    definition: ${/c/if/uint8_t:/name} ${.:name}
    description: null
    kind: member
    name: d_type
  variants: []
- default:
    brief: |
      This member represents the length of the string in the d_name member.
    definition: ${/c/if/uint16_t:/name} ${.:name}
    description: null
    kind: member
    name: d_namlen
  variants: []
- default:
    brief: |
      This member represents the name of the directory entry.
    definition: char ${.:name}[]
    description: null
    kind: member
    name: d_name
  variants: []
