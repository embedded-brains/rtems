enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/islower
post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      T_true( ctx->all_nonzero );
      T_false( ctx->all_zero );
    text: The return value shall be non-zero.
  - name: Zero
    test-code: |
      T_true( ctx->all_zero );
      T_false( ctx->all_nonzero );
    text: The return value shall be zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Char
  states:
  - name: Upper
    test-code: |
      ctx->c_array = upper_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( upper_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is an
      uppercase letter.
  - name: Lower
    test-code: |
      ctx->c_array = lower_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( lower_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is a lowercase
      letter.
  - name: Digit
    test-code: |
      ctx->c_array = digit_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( digit_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is a digit.
  - name: Control
    test-code: |
      ctx->c_array = control_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( control_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is a control
      character.
  - name: Punct
    test-code: |
      ctx->c_array = punct_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( punct_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is a punctuation
      character.
  - name: Space
    test-code: |
      ctx->c_array = space_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( space_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is a space
      character.
  - name: Other
    test-code: |
      ctx->c_array = other_chars;
      ctx->c_count = RTEMS_ARRAY_SIZE( other_chars );
    text: While the character specified by ${../if/islower:/params[0]/name} is another
      character.
  - name: EOF
    test-code: |
      ctx->c_count = 0;
      ctx->c = EOF;
    text: While the character specified by ${../if/islower:/params[0]/name} is equal
      to EOF.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |-
  size_t i;

  ctx->all_nonzero = true;
  ctx->all_zero = true;

  if ( ctx->c_count > 0 ) {
    for ( i = 0; i < ctx->c_count; ++i ) {
      ctx->c = ctx->c_array[ i ];
      ctx->retval = islower( ctx->c );

      if ( ctx->retval == 0 ) {
        ctx->all_nonzero = false;
      } else {
        ctx->all_zero = false;
      }
    }
  } else {
    ctx->retval = islower( ctx->c );

    if ( ctx->retval == 0 ) {
      ctx->all_nonzero = false;
    } else {
      ctx->all_zero = false;
    }
  }
