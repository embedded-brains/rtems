links:
- role: interface-function
  uid: ../if/isxdigit
post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      size_t i;

      for ( i = 0; i < ctx->chars_len; ++i ) {
        T_ne_int( ctx->retval[ i ], 0 );
      }
    text: The return value shall be non-zero.
  - name: Zero
    test-code: |
      size_t i;

      for ( i = 0; i < ctx->chars_len; ++i ) {
        T_eq_int( ctx->retval[ i ], 0 );
      }
    text: The return value shall be zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Char
  states:
  - name: HexLetter
    test-code: |
      ctx->chars = hex_letters;
      ctx->chars_len = RTEMS_ARRAY_SIZE( hex_letters );
    text: While the character specified by ${../if/isxdigit:/params[0]/name} is a
      ${../glossary/hex-letter:/term}.
  - name: Digit
    test-code: |
      ctx->chars = digits;
      ctx->chars_len = RTEMS_ARRAY_SIZE( digits );
    text: While the character specified by ${../if/isxdigit:/params[0]/name} is a
      ${../glossary/digit:/term}.
  - name: Other
    test-code: |
      ctx->chars = others;
      ctx->chars_len = RTEMS_ARRAY_SIZE( others );
    text: While the character specified by ${../if/isxdigit:/params[0]/name} is not
      a ${../glossary/hex-letter:/term}, while the character specified by ${../if/isxdigit:/params[0]/name}
      is not a ${../glossary/digit:/term}.
  test-epilogue: null
  test-prologue: null
