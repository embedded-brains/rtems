enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/isdigit
post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      size_t i;

      for ( i = 0; i < RTEMS_ARRAY_SIZE( digits ); ++i ) {
        T_ne_int( isdigit( digits[ i ] ), 0 );
      }
    text: |
      The return value of the function shall be non-zero.
  - name: Zero
    test-code: |
      size_t i;

      for ( i = 0; i < RTEMS_ARRAY_SIZE( non_digits ); ++i ) {
        T_eq_int( isdigit( non_digits[ i ] ), 0 );
      }
    text: |
      The return value of the function shall be zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Char
  states:
  - name: Digit
    test-code: |
      /* Handled by the post-condition loop */
    text: |
      While the character specified by ${../if/isdigit:/params[0]/name} is a digit.
  - name: NonDigit
    test-code: |
      /* Handled by the post-condition loop */
    text: |
      While the character specified by ${../if/isdigit:/params[0]/name} is not a digit.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
