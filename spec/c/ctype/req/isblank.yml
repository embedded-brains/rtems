post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      size_t i;

      for ( i = 0; i < ctx->n; ++i ) {
        T_ne_int( ctx->retval[ i ], 0 );
      }
    text: The return value shall be non-zero.
  - name: Zero
    test-code: |
      size_t i;

      for ( i = 0; i < ctx->n; ++i ) {
        T_eq_int( ctx->retval[ i ], 0 );
      }
    text: The return value shall be zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Character
  states:
  - name: Blank
    test-code: |
      ctx->chars = blank_chars;
      ctx->n = RTEMS_ARRAY_SIZE( blank_chars );
    text: While the character specified by ${../if/isblank:/params[0]/name} is a blank
      character.
  - name: NonBlank
    test-code: |
      ctx->chars = non_blank_chars;
      ctx->n = RTEMS_ARRAY_SIZE( non_blank_chars );
    text: While the character specified by ${../if/isblank:/params[0]/name} is not
      a blank character.
  test-epilogue: null
  test-prologue: null
