enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/isascii
- role: reference
  uid: /ref/std/posix-2024/removed-functions
post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      CheckNonZero( ctx );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/isascii:/name} shall be non-zero.
  - name: Zero
    test-code: |
      CheckZero( ctx );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/isascii:/name} shall be equal to
      zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Form
  states:
  - name: Macro
    test-code: |
      ctx->macro = true;
    text: |
      While the call of ${../if/isascii:/name} uses the macro definition of
      ${../if/header:/path}.
  - name: Function
    test-code: |
      ctx->macro = false;
    text: |
      While the call of ${../if/isascii:/name} suppresses the macro definition of
      ${../if/header:/path}.
  test-epilogue: null
  test-prologue: null
- name: C
  states:
  - name: Negative
    test-code: |
      Add( ctx, INT_MIN );
      Add( ctx, -2 );
      Add( ctx, -1 );
    text: |
      While the value of the ${../if/isascii:/params[0]/name} parameter is less than
      zero.
  - name: Ascii
    test-code: |
      AddRange( ctx, 0, 127 );
    text: |
      While the value of the ${../if/isascii:/params[0]/name} parameter is greater
      than or equal to zero and less than or equal to 127.
  - name: Above
    test-code: |
      AddRange( ctx, 128, UCHAR_MAX + 1 );
      Add( ctx, INT_MAX );
    text: |
      While the value of the ${../if/isascii:/params[0]/name} parameter is greater
      than 127.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Form covers the way of the call, 2 states. A call either uses the
  macro definition or suppresses it, which reaches the function.

  Dimension C covers the value of the parameter, 3 states. No current standard
  defines ${../if/isascii:/name}. ${/ref/std/posix-2024/removed-functions:/name}
  records the removal of the function. The requirement therefore defines the
  result itself. The function accepts each value of the type `int`. The states
  partition this type at zero and at 127, the bounds of the ASCII values.
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  size_t i;

  for ( i = 0; i < ctx->count; ++i ) {
    if ( ctx->macro ) {
      ctx->results[ i ] = isascii( ctx->values[ i ] );
    } else {
      ctx->results[ i ] = ( isascii )( ctx->values[ i ] );
    }
  }
test-brief: null
test-cleanup: null
test-context:
- brief: |
    If this member is true, then the call uses the macro definition, otherwise the
    call reaches the function.
  description: null
  member: |
    bool macro
- brief: |
    This member contains the ${../if/isascii:/params[0]/name} parameter values.
  description: null
  member: |
    int values[ UCHAR_MAX + 2 ]
- brief: |
    This member contains the ${/glossary/returnvalue:/term} of each call.
  description: null
  member: |
    int results[ UCHAR_MAX + 2 ]
- brief: |
    This member contains the count of parameter values.
  description: null
  member: |
    size_t count
test-context-support: null
test-description: |
  Each state of the value dimension provides a set of parameter values. The
  action calls the function once for each value of the set. The sets hold the
  bounds of the states and the limits of the type `int`. The test case is
  compiled without the builtin functions of the compiler, so a call which
  suppresses the macro definition reaches the function of the library.
test-header: null
test-includes:
- ctype.h
- limits.h
test-local-includes: []
test-prepare: |
  ctx->count = 0;
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void Add( Context *ctx, int c )
  {
    ctx->values[ ctx->count ] = c;
    ++ctx->count;
  }

  static void AddRange( Context *ctx, int first, int last )
  {
    int c;

    for ( c = first; c <= last; ++c ) {
      Add( ctx, c );
    }
  }

  static void CheckNonZero( const Context *ctx )
  {
    size_t i;

    T_gt_sz( ctx->count, 0 );

    for ( i = 0; i < ctx->count; ++i ) {
      T_quiet_ne_int( ctx->results[ i ], 0 );
    }
  }

  static void CheckZero( const Context *ctx )
  {
    size_t i;

    T_gt_sz( ctx->count, 0 );

    for ( i = 0; i < ctx->count; ++i ) {
      T_quiet_eq_int( ctx->results[ i ], 0 );
    }
  }
test-target: testsuites/validation/tc-ctype-isascii.c
test-teardown: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Result: NonZero
  pre-conditions:
    Form: all
    C:
    - Ascii
- enabled-by: true
  post-conditions:
    Result: Zero
  pre-conditions:
    Form: all
    C:
    - Negative
    - Above
type: requirement
