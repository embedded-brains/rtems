post-conditions:
- name: Result
  states:
  - name: Upper
    test-code: |
      CheckMapped( ctx, lower, upper );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/toupper:/name} shall be the
      ${../glossary/uppercase:/term} which corresponds to the value of the
      ${../if/toupper:/params[0]/name} parameter.
  - name: Unchanged
    test-code: |
      CheckUnchanged( ctx );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/toupper:/name} shall be the value
      of the ${../if/toupper:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Form
  states:
  - name: Macro
    test-code: |
      ctx->macro = true;
    text: |
      While the call of ${../if/toupper:/name} uses the macro definition of
      ${../if/header:/path}.
  - name: Function
    test-code: |
      ctx->macro = false;
    text: |
      While the call of ${../if/toupper:/name} suppresses the macro definition of
      ${../if/header:/path}.
  test-epilogue: null
  test-prologue: null
- name: C
  states:
  - name: Lower
    test-code: |
      AddSet( ctx, lower );
    text: |
      While the value of the ${../if/toupper:/params[0]/name} parameter is a
      ${../glossary/lowercase:/term}.
  - name: Other
    test-code: |
      AddOther( ctx );
    text: |
      While the value of the ${../if/toupper:/params[0]/name} parameter is a value of
      the type `unsigned char`, while the value is not a
      ${../glossary/lowercase:/term}.
  - name: EOF
    test-code: |
      Add( ctx, EOF );
    text: |
      While the value of the ${../if/toupper:/params[0]/name} parameter is equal to
      EOF.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Form covers the way of the call, 2 states. A call either uses the
  macro definition or suppresses it, which reaches the function.

  Dimension C covers the value of the character, 3 states.
  ${/ref/std/c23/ctype-general:/name} defines the call for each value of the type
  `unsigned char` and for EOF. Any other value is outside the domain. The
  pre-qualified library provides the "C" locale only. According to
  ${/ref/std/c23/toupper:/name}, each lowercase letter has one corresponding
  uppercase letter in this locale.
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  size_t i;

  for ( i = 0; i < ctx->count; ++i ) {
    if ( ctx->macro ) {
      ctx->results[ i ] = toupper( ctx->values[ i ] );
    } else {
      ctx->results[ i ] = ( toupper )( ctx->values[ i ] );
    }
  }
