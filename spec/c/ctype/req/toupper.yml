test-includes:
- ctype.h
- limits.h
- stdio.h
- string.h
test-local-includes: []
test-prepare: |
  ctx->count = 0;
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static const char upper[] = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  static const char lower[] = "abcdefghijklmnopqrstuvwxyz";

  static void Add( Context *ctx, int c )
  {
    ctx->values[ ctx->count ] = c;
    ++ctx->count;
  }

  static void AddSet( Context *ctx, const char *set )
  {
    while ( *set != '\0' ) {
      Add( ctx, (unsigned char) *set );
      ++set;
    }
  }

  static bool InSet( const char *set, int c )
  {
    return c != '\0' && strchr( set, c ) != NULL;
  }

  static bool IsNamed( int c )
  {
    return InSet( lower, c );
  }

  static void AddOther( Context *ctx )
  {
    int c;

    for ( c = 0; c <= UCHAR_MAX; ++c ) {
      if ( !IsNamed( c ) ) {
        Add( ctx, c );
      }
    }
  }

  static void CheckMapped( const Context *ctx, const char *from, const char *to )
  {
    size_t i;

    T_gt_sz( ctx->count, 0 );

    for ( i = 0; i < ctx->count; ++i ) {
      const char *p;

      p = strchr( from, ctx->values[ i ] );
      T_quiet_not_null( p );
      T_quiet_eq_int( ctx->results[ i ], (unsigned char) to[ p - from ] );
    }
  }

  static void CheckUnchanged( const Context *ctx )
  {
    size_t i;

    T_gt_sz( ctx->count, 0 );

    for ( i = 0; i < ctx->count; ++i ) {
      T_quiet_eq_int( ctx->results[ i ], ctx->values[ i ] );
    }
  }
test-target: testsuites/validation/tc-ctype-toupper.c
test-teardown: null
