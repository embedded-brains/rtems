test-context-support: null
test-description: |
  Each state of the character dimension provides a set of parameter values. The
  action calls the function once for each value of the set. The set of the other
  values contains each value of the type `unsigned char` which no other state of
  the dimension holds. The test case is compiled without the builtin functions of
  the compiler, so a call which suppresses the macro definition reaches the
  function of the library.
