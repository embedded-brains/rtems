test-cleanup: null
test-context:
- brief: |
    If this member is true, then the call uses the macro definition, otherwise the
    call reaches the function.
  description: null
  member: |
    bool macro
- brief: |
    This member contains the ${../if/toupper:/params[0]/name} parameter values.
  description: null
  member: |
