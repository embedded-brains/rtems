enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/toupper
post-conditions:
- name: Result
  states:
  - name: Upper
    test-code: |
      for ( size_t i = 0; i < ctx->c_array_size; ++i ) {
        int retval;

        retval = toupper( ctx->c_array[ i ] );
        T_eq_int( retval, ctx->c_array[ i ] - 'a' + 'A' );
      }
    text: |
      The return value shall be the corresponding uppercase letter of the character specified by ${../if/toupper:/params[0]/name}.
  - name: Original
    test-code: |
      for ( size_t i = 0; i < ctx->c_array_size; ++i ) {
        int retval;

        retval = toupper( ctx->c_array[ i ] );
        T_eq_int( retval, ctx->c_array[ i ] );
      }
    text: |
      The return value shall be the original character specified by ${../if/toupper:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Character
  states:
  - name: Lower
    test-code: |
      ctx->c_array = lower_cases;
      ctx->c_array_size = sizeof( lower_cases ) / sizeof( lower_cases[ 0 ] );
    text: |
      While the character specified by ${../if/toupper:/params[0]/name} is a lowercase letter.
  - name: Other
    test-code: |
      ctx->c_array = other_cases;
      ctx->c_array_size = sizeof( other_cases ) / sizeof( other_cases[ 0 ] );
    text: |
      While the character specified by ${../if/toupper:/params[0]/name} is not a lowercase letter.
  test-epilogue: null
  test-prologue: null
