post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      CheckNonZero( ctx );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/isprint:/name} shall be non-zero.
  - name: Zero
    test-code: |
      CheckZero( ctx );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/isprint:/name} shall be equal to
      zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Form
  states:
  - name: Macro
    test-code: |
      ctx->macro = true;
    text: |
      While the call of ${../if/isprint:/name} uses the macro definition of
      ${../if/header:/path}.
  - name: Function
    test-code: |
      ctx->macro = false;
    text: |
      While the call of ${../if/isprint:/name} suppresses the macro definition of
      ${../if/header:/path}.
  test-epilogue: null
  test-prologue: null
- name: C
  states:
  - name: Upper
    test-code: |
      AddSet( ctx, upper );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is an
      ${../glossary/uppercase:/term}.
  - name: Lower
    test-code: |
      AddSet( ctx, lower );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is a
      ${../glossary/lowercase:/term}.
  - name: Digit
    test-code: |
      AddSet( ctx, digit );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is a
      ${../glossary/digit:/term}.
  - name: Punct
    test-code: |
      AddSet( ctx, punct );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is a
      ${../glossary/punctuation:/term}.
  - name: Space
    test-code: |
      Add( ctx, ' ' );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is the space
      character.
  - name: Other
    test-code: |
      AddOther( ctx );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is a value of
      the type `unsigned char`, while the value is neither an
      ${../glossary/uppercase:/term}, a ${../glossary/lowercase:/term}, a
      ${../glossary/digit:/term}, a ${../glossary/punctuation:/term} nor the space
      character.
  - name: EOF
    test-code: |
      Add( ctx, EOF );
    text: |
      While the value of the ${../if/isprint:/params[0]/name} parameter is equal to
      EOF.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension Form covers the way of the call, 2 states. A call either uses the
  macro definition or suppresses it, which reaches the function.

  Dimension C covers the value of the character, 7 states.
  ${/ref/std/c23/ctype-general:/name} defines the call for each value of the type
  `unsigned char` and for EOF. Any other value is outside the domain. The
  pre-qualified library provides the "C" locale only. According to
  ${/ref/std/c23/isprint:/name}, the class holds the uppercase letters, the
  lowercase letters, the digits, the punctuation characters and the space
  character in this locale.
references: []
requirement-type: functional
