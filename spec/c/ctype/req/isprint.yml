enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/isprint
post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      size_t i;
      for ( i = 0; i < ctx->len; ++i ) {
        T_ne_int( ctx->results[ i ], 0 );
      }
    text: |
      The return value shall be non-zero.
  - name: Zero
    test-code: |
      size_t i;
      for ( i = 0; i < ctx->len; ++i ) {
        T_eq_int( ctx->results[ i ], 0 );
      }
    text: |
      The return value shall be zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Char
  states:
  - name: Print
    test-code: |
      ctx->chars = valid_print;
      ctx->len = sizeof( valid_print );
    text: |
      While the character specified by ${../if/isprint:/params[0]/name} is a
      printable character.
  - name: NotPrint
    test-code: |
      ctx->chars = valid_not_print;
      ctx->len = sizeof( valid_not_print );
    text: |
      While the character specified by ${../if/isprint:/params[0]/name} is not
      a printable character.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  size_t i;
  for ( i = 0; i < ctx->len; ++i ) {
    ctx->results[ i ] = isprint( ctx->chars[ i ] );
  }
