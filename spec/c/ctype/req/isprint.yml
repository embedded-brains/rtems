test-action: |
  size_t i;

  for ( i = 0; i < ctx->count; ++i ) {
    if ( ctx->macro ) {
      ctx->results[ i ] = isprint( ctx->values[ i ] );
    } else {
      ctx->results[ i ] = ( isprint )( ctx->values[ i ] );
    }
  }
