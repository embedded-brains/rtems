enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/isgraph
post-conditions:
- name: Result
  states:
  - name: NonZero
    test-code: |
      size_t i;
      for ( i = 0; i < ctx->num_chars; ++i ) {
        T_step_ne_int( 0, isgraph( ctx->chars[ i ] ), 0 );
      }
    text: |
      The return value shall be a non-zero value.
  - name: Zero
    test-code: |
      size_t i;
      for ( i = 0; i < ctx->num_chars; ++i ) {
        T_step_eq_int( 0, isgraph( ctx->chars[ i ] ), 0 );
      }
    text: |
      The return value shall be zero.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Char
  states:
  - name: IsGraph
    test-code: |
      ctx->chars = isgraph_chars;
      ctx->num_chars = RTEMS_ARRAY_SIZE( isgraph_chars );
    text: |
      While the character specified by ${../if/isgraph:/params[0]/name} is an uppercase letter, lowercase letter, digit, or punctuation character.
  - name: NotGraph
    test-code: |
      ctx->chars = notgraph_chars;
      ctx->num_chars = RTEMS_ARRAY_SIZE( notgraph_chars );
    text: |
      While the character specified by ${../if/isgraph:/params[0]/name} is neither an uppercase letter, lowercase letter, digit, nor a punctuation character.
  test-epilogue: null
  test-prologue: null
