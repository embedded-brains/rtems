term: punctuation character
text: |
  A punctuation character is one of the 32 characters with a value from `0x21`
  through `0x2F`, from `0x3A` through `0x40`, from `0x5B` through `0x60`, or from
  `0x7B` through `0x7E`.
type: glossary
