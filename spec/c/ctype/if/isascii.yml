brief: |
  Check whether the character specified by ${.:/params[0]/name} is a 7-bit
  unsigned char value that fits into the ASCII character set.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - int ${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: isascii
notes: |
  See [POSIX.1-2024, System Interfaces, isascii()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/isascii.html).
params:
- description: |
    is the character to be classified.
  dir: null
  name: c
return:
  return: |
    Returns a nonzero value, if the character specified by ${.:/params[0]/name}
    is greater than or equal to 0 and less than or equal to 127.
  return-values:
  - description: |
      Returns zero, otherwise.
    value: 0
type: interface
