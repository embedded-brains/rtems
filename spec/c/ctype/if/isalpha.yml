name: isalpha
notes: |
  See [C23, <ctype.h>, isalpha()](https://en.cppreference.com/w/c/string/byte/isalpha).
params:
- description: |
    is the character to be classified.
  dir: null
  name: c
return:
  return: |
    Returns a nonzero value, if the character specified by ${.:/params[0]/name}
    is an ${../glossary/uppercase:/term} or a ${../glossary/lowercase:/term}.
  return-values:
  - description: |
      Returns zero, if the character specified by ${.:/params[0]/name} is not
      an ${../glossary/uppercase:/term}, and the character specified by
      ${.:/params[0]/name} is not a ${../glossary/lowercase:/term}.
    value: 0
