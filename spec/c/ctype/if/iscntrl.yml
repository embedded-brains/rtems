brief: |
  Check whether the character specified by ${.:/params[0]/name} is a ${../glossary/control:/term}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - int ${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: iscntrl
notes: |
  See [C23, <ctype.h>, iscntrl()](https://en.cppreference.com/w/c/string/byte/iscntrl).
params:
- description: |
    is the character to be classified.
  dir: null
  name: c
return:
  return: |
    Returns a nonzero value, in case the character specified by
    ${.:/params[0]/name} is a control character.
  return-values:
  - description: |
      Returns zero, in case the character specified by ${.:/params[0]/name} is
      an 8-bit character that is not a control character, or the character
      specified by ${.:/params[0]/name} is EOF.
    value: 0
type: interface
