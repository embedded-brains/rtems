brief: |
  Change the permissions of the file specified by ${.:/params[0]/name} to the
  file mode specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    - ${/c/if/mode_t:/name} ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- description: |
    Search permission is denied for a component of the path prefix.
  role: errno
  uid: /c/errno/if/eacces
- description: |
    ${.:/params[0]/name} points outside your accessible address space.
  role: errno
  uid: /c/errno/if/efault
- description: |
    An I/O error occurred.
  role: errno
  uid: /c/errno/if/eio
- description: |
    Too many symbolic links were encountered in resolving ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/eloop
- description: |
    ${.:/params[0]/name} is too long.
  role: errno
  uid: /c/errno/if/enametoolong
- description: |
    The file does not exist.
  role: errno
  uid: /c/errno/if/enoent
- description: |
    Insufficient kernel memory was available.
  role: errno
  uid: /c/errno/if/enomem
- description: |
    A component of the path prefix is not a directory.
  role: errno
  uid: /c/errno/if/enotdir
- description: |
    The effective UID does not match the owner of the file, and the process is not
    privileged.
  role: errno
  uid: /c/errno/if/eperm
- description: |
    The named file resides on a read-only file system.
  role: errno
  uid: /c/errno/if/erofs
name: chmod
notes: |
  See [POSIX.1-2024, System Interfaces, chmod()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/chmod.html).
params:
- description: |
    is the path to the file.
  dir: in
  name: path
- description: |
    is the file mode to set.
  dir: null
  name: mode
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
