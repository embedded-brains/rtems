brief: |
  Create a directory, special file, or regular file at the path specified by
  ${.:/params[0]/name} with the file mode specified by ${.:/params[1]/name} and
  the device number specified by ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    - ${/c/if/mode_t:/name} ${.:/params[1]/name}
    - ${/c/if/dev_t:/name} ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- description: |
    This error number indicates the following error conditions:

    - The parent directory does not allow write permission to the process.
    - One of the directories in the ${.:/params[0]/name} prefix of
      ${.:/params[0]/name} did not allow search permission.
  role: errno
  uid: /c/errno/if/eacces
- description: |
    ${.:/params[0]/name} already exists.
  role: errno
  uid: /c/errno/if/eexist
- description: |
    ${.:/params[0]/name} points outside your accessible address space.
  role: errno
  uid: /c/errno/if/efault
- description: |
    ${.:/params[1]/name} requested creation of something other than a regular file,
    device special file, FIFO or socket.
  role: errno
  uid: /c/errno/if/einval
- description: |
    Too many symbolic links were encountered in resolving ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/eloop
- description: |
    ${.:/params[0]/name} was too long.
  role: errno
  uid: /c/errno/if/enametoolong
- description: |
    This error number indicates the following error conditions:

    - A directory component in ${.:/params[0]/name} does not exist.
    - A directory component in ${.:/params[0]/name} is a dangling symbolic link.
  role: errno
  uid: /c/errno/if/enoent
- description: |
    Insufficient kernel memory was available.
  role: errno
  uid: /c/errno/if/enomem
- description: |
    The device containing ${.:/params[0]/name} has no room for the new node.
  role: errno
  uid: /c/errno/if/enospc
- description: |
    A component used as a directory in ${.:/params[0]/name} is not, in fact, a
    directory.
  role: errno
  uid: /c/errno/if/enotdir
- description: |
    ${.:/params[1]/name} requested creation of something other than a regular file,
    FIFO (named pipe), or UNIX domain socket, and the caller is not privileged.
  role: errno
  uid: /c/errno/if/eperm
- description: |
    ${.:/params[0]/name} refers to a read-only filesystem.
  role: errno
  uid: /c/errno/if/erofs
name: mknod
notes: |
  See [POSIX.1-2024, System Interfaces, mknod()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/mknod.html).
params:
- description: |
    is the path to the node to be created.
  dir: in
  name: path
- description: |
    is the file mode for the new node.
  dir: null
  name: mode
- description: |
    is the device number for the new node.
  dir: null
  name: dev
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
