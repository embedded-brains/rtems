enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strpbrk
post-conditions:
- name: Result
  states:
  - name: Found
    test-code: |
      T_eq_ptr( ctx->retval, ctx->s1_buf + ctx->match_pos );
    text: |
      The return value of ${../if/strpbrk:/name} shall be a pointer to the
      first character of the string referenced by
      ${../if/strpbrk:/params[0]/name} which occurs in the string
      referenced by ${../if/strpbrk:/params[1]/name}.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The return value of ${../if/strpbrk:/name} shall be equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: S1
  states:
  - name: Empty
    test-code: |
      ctx->s1_buf[ 0 ] = '\0';
    text: |
      While the string referenced by ${../if/strpbrk:/params[0]/name} is
      empty.
  - name: NonEmpty
    test-code: |
      strcpy( ctx->s1_buf, "XXXXX" );
    text: |
      While the string referenced by ${../if/strpbrk:/params[0]/name} is
      not empty.
  test-epilogue: null
  test-prologue: null
- name: S2
  states:
  - name: Empty
    test-code: |
      ctx->s2_buf[ 0 ] = '\0';
    text: |
      While the string referenced by ${../if/strpbrk:/params[1]/name} is
      empty.
  - name: NonEmpty
    test-code: |
      strcpy( ctx->s2_buf, "ZZZ" );
    text: |
      While the string referenced by ${../if/strpbrk:/params[1]/name} is
      not empty.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: Found
    test-code: |
      ctx->s1_buf[ 0 ] = 'Y';
      ctx->s2_buf[ 0 ] = 'Y';
      ctx->match_pos = 0;
    text: |
      While a character of the string referenced by
      ${../if/strpbrk:/params[0]/name} occurs in the string referenced by
      ${../if/strpbrk:/params[1]/name}.
  - name: NotFound
    test-code: |
      /* The default fill values of the buffers do not overlap */
    text: |
      While no character of the string referenced by
      ${../if/strpbrk:/params[0]/name} occurs in the string referenced by
      ${../if/strpbrk:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
- name: MatchPosition
  states:
  - name: First
    test-code: |
      /* Already set up generically by Match: Found */
    text: |
      While the first character of the string referenced by
      ${../if/strpbrk:/params[0]/name} matches the first character of the
      string referenced by ${../if/strpbrk:/params[1]/name}.
  - name: S1Later
    test-code: |
      ctx->s1_buf[ 0 ] = 'X';
      ctx->s1_buf[ 2 ] = 'Y';
      ctx->match_pos = 2;
    text: |
      While a character other than the first character of the string
      referenced by ${../if/strpbrk:/params[0]/name} is the first
      character of that string to match the first character of the string
      referenced by ${../if/strpbrk:/params[1]/name}.
  - name: S2Later
    test-code: |
      ctx->s2_buf[ 0 ] = 'Z';
      ctx->s2_buf[ 2 ] = 'Y';
    text: |
      While the first character of the string referenced by
      ${../if/strpbrk:/params[0]/name} matches a character other than the
      first character of the string referenced by
      ${../if/strpbrk:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = strpbrk( ctx->s1, ctx->s2 );
