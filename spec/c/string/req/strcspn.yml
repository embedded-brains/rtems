transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          S1: Empty
      then: Zero
    - if:
        pre-conditions:
          S2: Empty
      then: Full
    - if:
        pre-conditions:
          Match: NotFound
      then: Full
    - if:
        pre-conditions:
          MatchPosition: S1Later
      then: Partial
    - else: Zero
  pre-conditions:
    S1: all
    S2:
      applicable:
        pre-conditions:
          S1: NonEmpty
    Match:
      applicable:
        pre-conditions:
          S1: NonEmpty
          S2: NonEmpty
    MatchPosition:
      applicable:
        pre-conditions:
          Match: Found
          S1: NonEmpty
          S2: NonEmpty
