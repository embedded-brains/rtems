enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strcspn
post-conditions:
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_uint( ctx->retval, 0 );
    text: |
      The return value of ${../if/strcspn:/name} shall be equal to zero.
  - name: Partial
    test-code: |
      T_eq_uint( ctx->retval, ctx->expected_len );
      T_gt_uint( ctx->retval, 0 );
      T_lt_uint( ctx->retval, strlen( ctx->s1 ) );
    text: |
      The return value of ${../if/strcspn:/name} shall be greater than
      zero, while the return value of ${../if/strcspn:/name} is less than
      the length of the string referenced by
      ${../if/strcspn:/params[0]/name}.
  - name: Full
    test-code: |
      T_eq_uint( ctx->retval, strlen( ctx->s1 ) );
    text: |
      The return value of ${../if/strcspn:/name} shall be equal to the
      length of the string referenced by ${../if/strcspn:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: S1
  states:
  - name: Empty
    test-code: |
      ctx->s1_buf[ 0 ] = '\0';
    text: |
      While the string referenced by ${../if/strcspn:/params[0]/name} is
      empty.
  - name: NonEmpty
    test-code: |
      strcpy( ctx->s1_buf, "XXXXX" );
    text: |
      While the string referenced by ${../if/strcspn:/params[0]/name} is
      not empty.
  test-epilogue: null
  test-prologue: null
- name: S2
  states:
  - name: Empty
    test-code: |
      ctx->s2_buf[ 0 ] = '\0';
    text: |
      While the string referenced by ${../if/strcspn:/params[1]/name} is
      empty.
  - name: NonEmpty
    test-code: |
      strcpy( ctx->s2_buf, "ZZZ" );
    text: |
      While the string referenced by ${../if/strcspn:/params[1]/name} is
      not empty.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: Found
    test-code: |
      ctx->s1_buf[ 0 ] = 'Y';
      ctx->s2_buf[ 0 ] = 'Y';
    text: |
      While a character of the string referenced by
      ${../if/strcspn:/params[0]/name} occurs in the string referenced by
      ${../if/strcspn:/params[1]/name}.
  - name: NotFound
    test-code: |
      /* The default fill values of the buffers do not overlap */
    text: |
      While no character of the string referenced by
      ${../if/strcspn:/params[0]/name} occurs in the string referenced by
      ${../if/strcspn:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
- name: MatchPosition
  states:
  - name: First
    test-code: |
      /* Already set up generically by Match: Found */
    text: |
      While the first character of the string referenced by
      ${../if/strcspn:/params[0]/name} matches the first character of the
      string referenced by ${../if/strcspn:/params[1]/name}.
  - name: S1Later
    test-code: |
      ctx->s1_buf[ 0 ] = 'X';
      ctx->s1_buf[ 2 ] = 'Y';
      ctx->expected_len = 2;
    text: |
      While a character other than the first character of the string
      referenced by ${../if/strcspn:/params[0]/name} is the first
      character of that string to match the first character of the string
      referenced by ${../if/strcspn:/params[1]/name}.
  - name: S2Later
    test-code: |
      ctx->s2_buf[ 0 ] = 'Z';
      ctx->s2_buf[ 2 ] = 'Y';
    text: |
      While the first character of the string referenced by
      ${../if/strcspn:/params[0]/name} matches a character other than the
      first character of the string referenced by
      ${../if/strcspn:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
