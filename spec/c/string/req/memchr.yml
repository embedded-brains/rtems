test-description: |
  The memory area starts inside a buffer filled with a byte which differs from
  the byte to locate. Where the memory area holds more than two bytes, a second
  match at the second byte lies in the first block of an aligned memory area and
  before the first block of an unaligned one. Otherwise the first byte holds it.
  A memory area without a match has the byte to locate immediately before and
  after it. A size beyond the object places the matches as the long size does.
