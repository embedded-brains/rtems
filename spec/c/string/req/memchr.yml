enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/memchr
- role: reference
  uid: /ref/std/c23/memchr
- role: reference
  uid: /ref/std/posix-2024/memchr
post-conditions:
- name: Result
  states:
  - name: First
    test-code: |
      T_eq_ptr( ctx->retval, ctx->expected );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/memchr:/name} shall be the
      address of the first byte of the memory area referenced by the
      ${../if/memchr:/params[0]/name} parameter which is equal to the value of the
      ${../if/memchr:/params[1]/name} parameter converted to `unsigned char`.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/memchr:/name} shall be
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Area
  states:
  - name: Nop
    test-code: |
      T_eq_mem( ctx->buf, ctx->before, sizeof( ctx->buf ) );
    text: |
      The bytes of the memory area referenced by the ${../if/memchr:/params[0]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is equal to zero.
  - name: One
    test-code: |
      ctx->n = 1;
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is equal to one.
  - name: Short
    test-code: |
      ctx->n = 2;
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is greater than
      one, while the size specified by ${../if/memchr:/params[2]/name} is less than
      the size of type long minus one.
  - name: BelowWord
    test-code: |
      ctx->n = sizeof( long ) - 1;
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is equal to the
      size of type long minus one.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is equal to the
      size of type long.
  - name: AboveWord
    test-code: |
      ctx->n = sizeof( long ) + 1;
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is equal to the
      size of type long plus one.
  - name: Long
    test-code: |
      ctx->n = 5 * sizeof( long ) + 1;
      ctx->len = ctx->n;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is greater than the
      size of type long plus one.
  test-epilogue: null
  test-prologue: null
- name: Bound
  states:
  - name: Inside
    test-code: |
      /* The N pre-condition sets the size. */
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is less than or
      equal to the count of bytes from the address specified by the
      ${../if/memchr:/params[0]/name} parameter to the end of the object which
      contains it.
  - name: Beyond
    test-code: |
      ctx->n = SIZE_MAX;
    text: |
      While the size specified by ${../if/memchr:/params[2]/name} is greater than the
      count of bytes from the address specified by the
      ${../if/memchr:/params[0]/name} parameter to the end of the object which
      contains it.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->s = &ctx->buf[ sizeof( long ) ];
    text: |
      While the memory area referenced by the ${../if/memchr:/params[0]/name}
      parameter starts at an address which is aligned to the size of type long.
  - name: Unaligned
    test-code: |
      ctx->s = &ctx->buf[ sizeof( long ) + 1 ];
    text: |
      While the memory area referenced by the ${../if/memchr:/params[0]/name}
      parameter starts at an address which is not aligned to the size of type long.
  test-epilogue: null
  test-prologue: null
- name: C
  states:
  - name: InRange
    test-code: |
      ctx->c = TARGET;
    text: |
      While the value of the ${../if/memchr:/params[1]/name} parameter is in the
      range of the type `unsigned char`.
  - name: Negative
    test-code: |
      ctx->c = TARGET - ( UCHAR_MAX + 1 );
    text: |
      While the value of the ${../if/memchr:/params[1]/name} parameter is less than
      zero.
  - name: Greater
    test-code: |
      ctx->c = TARGET + ( UCHAR_MAX + 1 );
    text: |
      While the value of the ${../if/memchr:/params[1]/name} parameter is greater
      than the maximum value of the type `unsigned char`.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: None
    test-code: |
      ctx->s[ -1 ] = TARGET;
      ctx->s[ ctx->len ] = TARGET;
    text: |
      While no byte of the memory area referenced by the
      ${../if/memchr:/params[0]/name} parameter is equal to the value of the
      ${../if/memchr:/params[1]/name} parameter converted to `unsigned char`.
  - name: One
    test-code: |
      ctx->s[ ctx->len - 1 ] = TARGET;
      ctx->expected = &ctx->s[ ctx->len - 1 ];
    text: |
      While exactly one byte of the memory area referenced by the
      ${../if/memchr:/params[0]/name} parameter is equal to the value of the
      ${../if/memchr:/params[1]/name} parameter converted to `unsigned char`.
  - name: Several
    test-code: |
      if ( ctx->len > 2 ) {
        ctx->s[ 1 ] = TARGET;
        ctx->expected = &ctx->s[ 1 ];
      } else {
        ctx->s[ 0 ] = TARGET;
        ctx->expected = &ctx->s[ 0 ];
      }

      ctx->s[ ctx->len - 1 ] = TARGET;
    text: |
      While more than one byte of the memory area referenced by the
      ${../if/memchr:/params[0]/name} parameter is equal to the value of the
      ${../if/memchr:/params[1]/name} parameter converted to `unsigned char`.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension N covers the size, 7 states. ${/ref/std/c23/memchr:/name} searches
  the bytes of the memory area. A size of zero leaves no byte to search. The
  implementation of the pre-qualified library compares the size against zero and
  the size of type long. The states Zero and One hold the boundary zero and the
  value above it. The other boundary has a state for the value below it, at it
  and above it. The states Short and Long hold the values between and after these
  states.

  Dimension Bound covers the size relative to the end of the object which
  contains the memory area, 2 states. The search reads the bytes in sequence and
  stops at the first match. A size beyond the end of the object is therefore
  defined, if a match precedes that end.

  Dimension Alignment covers the start address of the memory area, 2 states. The
  implementation searches the bytes before the first aligned address one at a
  time.

  Dimension C covers the value of the character, 3 states.
  ${/ref/std/c23/memchr:/name} converts it to `unsigned char`. The conversion
  keeps a value of that range. It changes a negative value and a value beyond the
  maximum of the type.

  Dimension Match covers the count of matching bytes, 3 states.
  ${/ref/std/c23/memchr:/name} locates the first occurrence. Several matches
  select one of them. A memory area of size zero holds no match.

  ${/ref/std/posix-2024/memchr:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.
references: []
requirement-type: functional
skip-reasons:
  BeyondNeedsMatch: |
    A size beyond the end of the object is defined only if a match precedes that
    end.
  BeyondStopsAtMatch: |
    The search stops at the first match, so the bytes beyond the match do not
    change the result. The Long state covers a size beyond the end of the object.
  OneByteHoldsOneMatch: |
    A memory area of size one holds at most one match.
  ZeroIsInside: |
    A size of zero does not exceed the count of bytes to the end of the object.
  ZeroSizeHasNoByte: |
    A memory area of size zero holds no byte.
test-action: |
  memcpy( ctx->before, ctx->buf, sizeof( ctx->buf ) );
  errno = -1;
  ctx->retval = memchr( ctx->s, ctx->c, ctx->n );
  ctx->errno_value = errno;
