transition-map:
- enabled-by: true
  post-conditions:
    Result: SameAsDst
    DstArea:
    - if:
        pre-conditions:
          N: Zero
      then: Unchanged
    - if:
        pre-conditions:
          Fit: Fits
      then: AppendedFull
    - else: AppendedTruncated
  pre-conditions:
    Alignment: all
    DstLength: all
    DstMatchPosition:
      applicable:
        pre-conditions:
          Alignment: Aligned
          DstLength: NonEmpty
    N: all
    Fit:
      applicable:
        pre-conditions:
          N: Positive
