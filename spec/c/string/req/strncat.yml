enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strncat
post-conditions:
- name: Result
  states:
  - name: SameAsDst
    test-code: |
      T_eq_ptr( ctx->retval, ctx->dest_buf + ctx->offset );
    text: |
      The return value of ${../if/strncat:/name} shall be equal to the
      initial value of ${../if/strncat:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
- name: DstArea
  states:
  - name: Unchanged
    test-code: |
      T_eq_uint( ctx->dest_buf[ ctx->term_pos ], 0 );
      ctx->content_end = ctx->term_pos + 1;
    text: |
      The string referenced by ${../if/strncat:/params[0]/name} shall not
      be modified.
  - name: AppendedFull
    test-code: |
      size_t len = strlen( ctx->src );

      T_eq_nstr(
        (const char *) &ctx->dest_buf[ ctx->term_pos ],
        ctx->src,
        len + 1
      );
      ctx->content_end = ctx->term_pos + len + 1;
    text: |
      The string referenced by ${../if/strncat:/params[1]/name}, including
      its terminating null character, shall be appended to the string
      referenced by ${../if/strncat:/params[0]/name}, overwriting its
      terminating null character.
  - name: AppendedTruncated
    test-code: |
      T_eq_nstr(
        (const char *) &ctx->dest_buf[ ctx->term_pos ],
        ctx->src,
        ctx->n
      );
      T_eq_uint( ctx->dest_buf[ ctx->term_pos + ctx->n ], 0 );
      ctx->content_end = ctx->term_pos + ctx->n + 1;
    text: |
      The first bytes specified by ${../if/strncat:/params[2]/name} of the
      string referenced by ${../if/strncat:/params[1]/name} shall be
      appended to the string referenced by
      ${../if/strncat:/params[0]/name}, overwriting its terminating null
      character, followed by a terminating null character.
  test-epilogue: |
    for ( size_t i = 0; i < ctx->offset; ++i ) {
      T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
    }

    for ( size_t i = ctx->content_end; i < sizeof( ctx->dest_buf ); ++i ) {
      T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
    }
  test-prologue: null
pre-conditions:
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = sizeof( long );
      ctx->dest = (char *) ( ctx->dest_buf + ctx->offset );
    text: |
      While the ${../if/strncat:/params[0]/name} parameter is aligned on a
      `long` integer boundary of the target architecture.
  - name: Unaligned
    test-code: |
      ctx->offset = sizeof( long ) + 1;
      ctx->dest = (char *) ( ctx->dest_buf + ctx->offset );
    text: |
      While the ${../if/strncat:/params[0]/name} parameter is not aligned
      on a `long` integer boundary of the target architecture.
  test-epilogue: null
  test-prologue: null
- name: DstLength
  states:
  - name: Empty
    test-code: |
      ctx->dest_buf[ ctx->offset ] = 0;
      ctx->term_pos = ctx->offset;
    text: |
      While the string referenced by ${../if/strncat:/params[0]/name} is
      empty.
  - name: NonEmpty
    test-code: |
      ctx->dest_buf[ ctx->offset ] = 'P';
      ctx->dest_buf[ ctx->offset + 1 ] = 'P';
      ctx->dest_buf[ ctx->offset + 2 ] = 0;
      ctx->term_pos = ctx->offset + 2;
    text: |
      While the string referenced by ${../if/strncat:/params[0]/name} is
      not empty.
  test-epilogue: null
  test-prologue: null
- name: DstMatchPosition
  states:
  - name: FirstChunk
    test-code: |
      ctx->dest_buf[ ctx->term_pos ] = 'P';
      ctx->term_pos = ctx->offset + 3;
      ctx->dest_buf[ ctx->term_pos ] = 0;
    text: |
      While the terminating null character occurs within the first
      aligned `long` integer sized chunk of the string referenced by
      ${../if/strncat:/params[0]/name}.
  - name: SecondChunk
    test-code: |
      for ( size_t i = 2; i < sizeof( long ) + 3; ++i ) {
        ctx->dest_buf[ ctx->offset + i ] = 'P';
      }
      ctx->term_pos = ctx->offset + sizeof( long ) + 3;
      ctx->dest_buf[ ctx->term_pos ] = 0;
    text: |
      While the terminating null character occurs within the second
      aligned `long` integer sized chunk of the string referenced by
      ${../if/strncat:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
    text: |
      While the size specified by ${../if/strncat:/params[2]/name} is
      equal to zero.
  - name: Positive
    test-code: |
      /* The exact positive value is determined by the Fit pre-condition */
    text: |
      While the size specified by ${../if/strncat:/params[2]/name} is
      greater than zero.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: Fits
    test-code: |
      strcpy( ctx->src_buf, "AB" );
      ctx->n = 8;
    text: |
      While the length of the string referenced by
      ${../if/strncat:/params[1]/name} is less than the size specified by
      ${../if/strncat:/params[2]/name}.
  - name: Truncate
    test-code: |
      strcpy( ctx->src_buf, "ABCDE" );
      ctx->n = 3;
    text: |
      While the length of the string referenced by
      ${../if/strncat:/params[1]/name} is greater than or equal to the
      size specified by ${../if/strncat:/params[2]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
