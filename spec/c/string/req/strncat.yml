test-prepare: |
  memset( ctx->dest_buf, 0xaa, sizeof( ctx->dest_buf ) );
  memset( ctx->src_buf, 0, sizeof( ctx->src_buf ) );
  ctx->offset = sizeof( long );
  ctx->dest = (char *) ( ctx->dest_buf + ctx->offset );
  ctx->src = ctx->src_buf;
  ctx->retval = NULL;
  ctx->n = 0;
  ctx->term_pos = ctx->offset;
  ctx->content_end = ctx->offset;
