enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strlen
post-conditions:
- name: Result
  states:
  - name: Length
    test-code: |
      T_eq_uint( ctx->retval, ctx->expected_len );
    text: |
      The return value of ${../if/strlen:/name} shall be equal to the
      length of the string referenced by ${../if/strlen:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = sizeof( long );
      ctx->s = (const char *) ( ctx->s_buf + ctx->offset );
    text: |
      While the ${../if/strlen:/params[0]/name} parameter is aligned on a
      `long` integer boundary of the target architecture.
  - name: Unaligned
    test-code: |
      ctx->offset = sizeof( long ) + 1;
      ctx->s = (const char *) ( ctx->s_buf + ctx->offset );
    text: |
      While the ${../if/strlen:/params[0]/name} parameter is not aligned
      on a `long` integer boundary of the target architecture.
  test-epilogue: null
  test-prologue: null
- name: MatchPosition
  states:
  - name: FirstChunk
    test-code: |
      ctx->s_buf[ ctx->offset ] = 0;
      ctx->expected_len = 0;
    text: |
      While the terminating null character occurs within the first
      aligned `long` integer sized chunk of the string referenced by
      ${../if/strlen:/params[0]/name}.
  - name: SecondChunk
    test-code: |
      ctx->s_buf[ ctx->offset + sizeof( long ) ] = 0;
      ctx->expected_len = sizeof( long );
    text: |
      While the terminating null character occurs within the second
      aligned `long` integer sized chunk of the string referenced by
      ${../if/strlen:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
