enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strchr
post-conditions:
- name: Result
  states:
  - name: Found
    test-code: |
      T_eq_ptr( ctx->retval, (char *) ( ctx->s_buf + ctx->match_pos ) );
    text: |
      The return value of ${../if/strchr:/name} shall be a pointer to the
      notable byte in the string referenced by
      ${../if/strchr:/params[0]/name}.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The return value of ${../if/strchr:/name} shall be equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: C
  states:
  - name: Zero
    test-code: |
      ctx->c = 0;
    text: |
      While the byte specified by ${../if/strchr:/params[1]/name} is equal
      to the terminating null character.
  - name: NonZero
    test-code: |
      ctx->c = 0x42;
    text: |
      While the byte specified by ${../if/strchr:/params[1]/name} is not
      equal to the terminating null character.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = sizeof( long );
      ctx->s = (const char *) ( ctx->s_buf + ctx->offset );
    text: |
      While the ${../if/strchr:/params[0]/name} parameter is aligned on a
      `long` integer boundary of the target architecture.
  - name: Unaligned
    test-code: |
      ctx->offset = sizeof( long ) + 1;
      ctx->s = (const char *) ( ctx->s_buf + ctx->offset );
    text: |
      While the ${../if/strchr:/params[0]/name} parameter is not aligned
      on a `long` integer boundary of the target architecture.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: Found
    test-code: |
      ctx->match_pos = ctx->offset;
      ctx->s_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
      ctx->s_buf[ ctx->offset + 2 * sizeof( long ) ] = 0;
    text: |
      While the byte specified by ${../if/strchr:/params[1]/name} occurs
      in the string referenced by ${../if/strchr:/params[0]/name} before
      its terminating null character.
  - name: NotFound
    test-code: |
      ctx->s_buf[ ctx->offset + 2 * sizeof( long ) ] = 0;
      ctx->s_buf[ ctx->offset + 2 * sizeof( long ) + 1 ] =
        (unsigned char) ctx->c;
    text: |
      While the byte specified by ${../if/strchr:/params[1]/name} does not
      occur in the string referenced by ${../if/strchr:/params[0]/name}
      before its terminating null character, while the string referenced
      by ${../if/strchr:/params[0]/name} is not empty.
  - name: Empty
    test-code: |
      ctx->s_buf[ ctx->offset ] = 0;
      ctx->s_buf[ ctx->offset + 1 ] = (unsigned char) ctx->c;
    text: |
      While the string referenced by ${../if/strchr:/params[0]/name} is
      empty.
  test-epilogue: null
  test-prologue: null
- name: MatchPosition
  states:
  - name: FirstChunk
    test-code: |
      ctx->s_buf[ ctx->match_pos ] = 0x41;
      ctx->match_pos = ctx->offset;
      ctx->s_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
    text: |
      While the notable byte occurs within the first aligned `long`
      integer sized chunk of the string referenced by
      ${../if/strchr:/params[0]/name}.
  - name: SecondChunk
    test-code: |
      ctx->s_buf[ ctx->match_pos ] = 0x41;
      ctx->match_pos = ctx->offset + sizeof( long );
      ctx->s_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
    text: |
      While the notable byte occurs within the second aligned `long`
      integer sized chunk of the string referenced by
      ${../if/strchr:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
