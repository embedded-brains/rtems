transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          S1: Empty
      then: Zero
    - if:
        pre-conditions:
          S2: Empty
      then: Zero
    - if:
        pre-conditions:
          Match: None
      then: Zero
    - if:
        pre-conditions:
          Match: Partial
      then: Partial
    - else: Length
  pre-conditions:
    S1: all
    S2: all
    Match:
      applicable:
        pre-conditions:
          S1: NotEmpty
          S2: NotEmpty
