enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strspn
post-conditions:
- name: Result
  states:
  - name: Zero
    test-code: |
      T_eq_sz( ctx->retval, 0 );
    text: |
      The return value shall be equal to zero.
  - name: Partial
    test-code: |
      T_eq_sz( ctx->retval, 1 );
    text: |
      The return value shall be equal to the number of initial characters of the string specified by ${../if/strspn:/params[0]/name} which are present in the string specified by ${../if/strspn:/params[1]/name}.
  - name: Length
    test-code: |
      T_eq_sz( ctx->retval, strlen( ctx->s1 ) );
    text: |
      The return value shall be equal to the length of the string specified by ${../if/strspn:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: S1
  states:
  - name: Empty
    test-code: |
      ctx->s1 = "";
    text: |
      While the length of the string specified by ${../if/strspn:/params[0]/name} is equal to zero.
  - name: NotEmpty
    test-code: |
      ctx->s1 = "bc";
    text: |
      While the length of the string specified by ${../if/strspn:/params[0]/name} is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: S2
  states:
  - name: Empty
    test-code: |
      ctx->s2 = "";
    text: |
      While the length of the string specified by ${../if/strspn:/params[1]/name} is equal to zero.
  - name: NotEmpty
    test-code: |
      ctx->s2 = "ab";
    text: |
      While the length of the string specified by ${../if/strspn:/params[1]/name} is greater than zero.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: None
    test-code: |
      ctx->s1 = "c";
    text: |
      While the first character of the string specified by ${../if/strspn:/params[0]/name} is not present in the string specified by ${../if/strspn:/params[1]/name}.
  - name: Partial
    test-code: |
      ctx->s1 = "bc";
    text: |
      While the first character of the string specified by ${../if/strspn:/params[0]/name} is present in the string specified by ${../if/strspn:/params[1]/name}, while the string specified by ${../if/strspn:/params[0]/name} contains at least one character not present in the string specified by ${../if/strspn:/params[1]/name}.
  - name: Full
    test-code: |
      ctx->s1 = "b";
    text: |
      While all characters of the string specified by ${../if/strspn:/params[0]/name} are present in the string specified by ${../if/strspn:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->retval = strspn( ctx->s1, ctx->s2 );
test-brief: null
test-cleanup: null
