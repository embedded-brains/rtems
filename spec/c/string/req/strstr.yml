transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          S2StringLength: Zero
      then: PointerToS1
    - if:
        pre-conditions:
          Contains: 'Yes'
      then: PointerToMatch
    - else: 'Null'
  pre-conditions:
    S2StringLength: all
    Contains:
      applicable:
        pre-conditions:
          S2StringLength:
