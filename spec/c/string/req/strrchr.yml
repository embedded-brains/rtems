enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strrchr
post-conditions:
- name: Result
  states:
  - name: Found
    test-code: |
      T_eq_ptr( ctx->retval, ctx->s_buf + ctx->match_pos );
    text: |
      The return value of ${../if/strrchr:/name} shall be a pointer to
      the last occurrence of the notable byte in the string referenced by
      ${../if/strrchr:/params[0]/name}.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The return value of ${../if/strrchr:/name} shall be equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: C
  states:
  - name: Zero
    test-code: |
      strcpy( ctx->s_buf, "ABC" );
      ctx->c = 0;
      ctx->match_pos = 3;
    text: |
      While the byte specified by ${../if/strrchr:/params[1]/name} is
      equal to the terminating null character.
  - name: NonZero
    test-code: |
      ctx->c = 'X';
    text: |
      While the byte specified by ${../if/strrchr:/params[1]/name} is not
      equal to the terminating null character.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: NotFound
    test-code: |
      strcpy( ctx->s_buf, "ABC" );
    text: |
      While the byte specified by ${../if/strrchr:/params[1]/name} does
      not occur in the string referenced by
      ${../if/strrchr:/params[0]/name} before its terminating null
      character.
  - name: FoundOnce
    test-code: |
      strcpy( ctx->s_buf, "ABXCD" );
      ctx->match_pos = 2;
    text: |
      While the byte specified by ${../if/strrchr:/params[1]/name} occurs
      exactly once in the string referenced by
      ${../if/strrchr:/params[0]/name} before its terminating null
      character.
  - name: FoundMultiple
    test-code: |
      strcpy( ctx->s_buf, "AXBXC" );
      ctx->match_pos = 3;
    text: |
      While the byte specified by ${../if/strrchr:/params[1]/name} occurs
      more than once in the string referenced by
      ${../if/strrchr:/params[0]/name} before its terminating null
      character.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
