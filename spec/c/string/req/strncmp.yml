transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          N: Zero
      then: Equal
    - specified-by: Compare
  pre-conditions:
    N: all
    Compare:
      applicable:
        pre-conditions:
          N:
          - Small
          - Word
          - MultiWord
    EqualCause:
      applicable:
        pre-conditions:
          Compare: Equal
          N:
          - Small
          - Word
          - MultiWord
    Alignment:
      applicable:
        pre-conditions:
          N: MultiWord
    MatchPosition:
      applicable:
        pre-conditions:
          Compare:
          - Less
          - Greater
          N: MultiWord
