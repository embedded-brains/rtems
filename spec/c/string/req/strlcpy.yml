test-prepare: |
  memset( ctx->dst_buf, 0xaa, sizeof( ctx->dst_buf ) );
  memset( ctx->src_buf, 0, sizeof( ctx->src_buf ) );
  ctx->offset = 4;
  ctx->dst = (char *) ( ctx->dst_buf + ctx->offset );
  ctx->src = ctx->src_buf;
  ctx->retval = 0;
  ctx->size = 0;
