transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          N: Zero
      then: Truncated
    - if:
        pre-conditions:
          Fit: Fits
      then: NotTruncated
    - else: Truncated
    DstArea:
    - if:
        pre-conditions:
          N: Zero
      then: Unmodified
    - if:
        pre-conditions:
          Fit: Fits
      then: CopiedFull
    - else: CopiedTruncated
  pre-conditions:
    N: all
    Fit:
      applicable:
        pre-conditions:
          N: Positive
