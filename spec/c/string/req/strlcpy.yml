enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strlcpy
post-conditions:
- name: Result
  states:
  - name: Truncated
    test-code: |
      T_ge_uint( ctx->retval, ctx->size );
      T_eq_uint( ctx->retval, strlen( ctx->src ) );
    text: |
      The return value of ${../if/strlcpy:/name} shall be greater than or
      equal to the size specified by ${../if/strlcpy:/params[2]/name}.
  - name: NotTruncated
    test-code: |
      T_lt_uint( ctx->retval, ctx->size );
      T_eq_uint( ctx->retval, strlen( ctx->src ) );
    text: |
      The return value of ${../if/strlcpy:/name} shall be less than the
      size specified by ${../if/strlcpy:/params[2]/name}.
  test-epilogue: null
  test-prologue: null
- name: DstArea
  states:
  - name: Unmodified
    test-code: |
      for ( size_t i = 0; i < sizeof( ctx->dst_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      The memory area referenced by ${../if/strlcpy:/params[0]/name} shall
      not be modified.
  - name: CopiedFull
    test-code: |
      size_t len = strlen( ctx->src );

      T_eq_nstr( ctx->dst, ctx->src, len + 1 );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }

      for (
        size_t i = ctx->offset + len + 1;
        i < sizeof( ctx->dst_buf );
        ++i
      ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      The string referenced by ${../if/strlcpy:/params[1]/name}, including
      its terminating null character, shall be copied to the memory area
      referenced by ${../if/strlcpy:/params[0]/name}. The remaining bytes
      of the memory area referenced by ${../if/strlcpy:/params[0]/name} up
      to the size specified by ${../if/strlcpy:/params[2]/name} shall not
      be modified.
  - name: CopiedTruncated
    test-code: |
      T_eq_nstr( ctx->dst, ctx->src, ctx->size - 1 );
      T_eq_uint( ctx->dst[ ctx->size - 1 ], 0 );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }

      for (
        size_t i = ctx->offset + ctx->size;
        i < sizeof( ctx->dst_buf );
        ++i
      ) {
        T_quiet_eq_uint( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      The first bytes of the string referenced by
      ${../if/strlcpy:/params[1]/name}, up to one less than the size
      specified by ${../if/strlcpy:/params[2]/name}, shall be copied to
      the memory area referenced by ${../if/strlcpy:/params[0]/name},
      followed by a terminating null character.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->size = 0;
    text: |
      While the size specified by ${../if/strlcpy:/params[2]/name} is
      equal to zero.
  - name: Positive
    test-code: |
      /* The exact positive value is determined by the Fit pre-condition */
    text: |
      While the size specified by ${../if/strlcpy:/params[2]/name} is
      greater than zero.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: Fits
    test-code: |
      strcpy( ctx->src_buf, "AB" );
      ctx->size = 8;
    text: |
      While the length of the string referenced by
      ${../if/strlcpy:/params[1]/name} is less than the size specified by
      ${../if/strlcpy:/params[2]/name}.
  - name: Truncate
    test-code: |
      strcpy( ctx->src_buf, "ABCDE" );
      ctx->size = 3;
    text: |
      While the length of the string referenced by
      ${../if/strlcpy:/params[1]/name} is greater than or equal to the
      size specified by ${../if/strlcpy:/params[2]/name}.
  test-epilogue: null
  test-prologue: null
rationale: null
references: []
