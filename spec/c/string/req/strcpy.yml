test-description: |
  The source string holds the letters of the alphabet in turn. A character which
  is not a null character follows its terminating null character. The bytes of
  the destination buffer hold the value 0xaa before the call.
test-header: null
test-includes:
- errno.h
- string.h
test-local-includes: []
test-prepare: |
  memset( ctx->dst_buf, 0xaa, sizeof( ctx->dst_buf ) );
  memset( ctx->src_buf, 0, sizeof( ctx->src_buf ) );
  ctx->dst_offset = 0;
  ctx->src_offset = 0;
  ctx->length = 0;
  ctx->dst = (char *) ctx->dst_buf;
  ctx->src = ctx->src_buf;
  ctx->retval = NULL;
test-setup: null
test-stop: null
test-support: |
  typedef ${.:/test-context-type} Context;

  static void Arrange( Context *ctx )
  {
    char  *src;
    size_t i;

    src = ctx->src_buf + ctx->src_offset;

    for ( i = 0; i < ctx->length; ++i ) {
      src[ i ] = (char) ( 'A' + i % 26 );
    }

    src[ ctx->length ] = '\0';
    src[ ctx->length + 1 ] = 'Z';
    ctx->src = src;
    ctx->dst = (char *) ( ctx->dst_buf + ctx->dst_offset );
  }
