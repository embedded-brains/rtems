post-conditions:
- name: Result
  states:
  - name: S1
    test-code: |
      T_eq_ptr( ctx->retval, ctx->dst );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/strcpy:/name} shall be the value
      of the ${../if/strcpy:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Dst
  states:
  - name: Copy
    test-code: |
      size_t i;

      T_eq_nstr( ctx->dst, ctx->src, ctx->length + 1 );

      for ( i = 0; i < ctx->dst_offset; ++i ) {
        T_quiet_eq_u8( ctx->dst_buf[ i ], 0xaa );
      }

      for (
        i = ctx->dst_offset + ctx->length + 1; i < sizeof( ctx->dst_buf ); ++i
      ) {
        T_quiet_eq_u8( ctx->dst_buf[ i ], 0xaa );
      }
    text: |
      Only the string referenced by the ${../if/strcpy:/params[1]/name} parameter,
      including its terminating null character, shall be copied to the array
      referenced by the ${../if/strcpy:/params[0]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Src
  states:
  - name: Nop
    test-code: |
      size_t i;

      for ( i = 0; i < sizeof( ctx->src_buf ); ++i ) {
        T_quiet_eq_u8( ctx->src_buf[ i ], ctx->src_before[ i ] );
      }
    text: |
      The bytes of the string referenced by the ${../if/strcpy:/params[1]/name}
      parameter shall not be modified.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The value of ${/c/errno/if/errno:/name} shall not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->src_offset = 0;
      ctx->dst_offset = 0;
    text: |
      While the ${../if/strcpy:/params[0]/name} and ${../if/strcpy:/params[1]/name}
      parameters are aligned to the size of type size_t.
  - name: Unaligned
    test-code: |
      ctx->src_offset = 1;
      ctx->dst_offset = 1;
    text: |
      While the ${../if/strcpy:/params[0]/name} and ${../if/strcpy:/params[1]/name}
      parameters are not aligned to the size of type size_t, while the
      ${../if/strcpy:/params[0]/name} and ${../if/strcpy:/params[1]/name} parameters
      have the same remainder of the division by the size of type size_t.
  - name: Mismatch
    test-code: |
      ctx->src_offset = 1;
      ctx->dst_offset = 2;
    text: |
      While the ${../if/strcpy:/params[0]/name} and ${../if/strcpy:/params[1]/name}
      parameters have different remainders of the division by the size of type
      size_t.
  test-epilogue: null
  test-prologue: null
- name: Length
  states:
  - name: Short
    test-code: |
      ctx->length = 1;
    text: |
      While the length of the string referenced by the
      ${../if/strcpy:/params[1]/name} parameter is less than the size of type size_t
      minus one.
  - name: Medium
    test-code: |
      ctx->length = sizeof( size_t ) - 1;
    text: |
      While the length of the string referenced by the
      ${../if/strcpy:/params[1]/name} parameter is greater than or equal to the size
      of type size_t minus one, while the length of the string referenced by the
      ${../if/strcpy:/params[1]/name} parameter is less than two times the size of
      type size_t.
  - name: Long
    test-code: |
      ctx->length = 2 * sizeof( size_t ) + sizeof( size_t ) / 2;
    text: |
      While the length of the string referenced by the
      ${../if/strcpy:/params[1]/name} parameter is greater than or equal to two times
      the size of type size_t.
  test-epilogue: null
  test-prologue: null
rationale: |
  ${/ref/std/c23/strcpy:/name} defines that the function copies the string
  referenced by the ${../if/strcpy:/params[1]/name} parameter with its
  terminating null character. The function returns the value of the
  ${../if/strcpy:/params[0]/name} parameter. It defines no error. It leaves the
  behaviour undefined where the objects overlap or where a parameter references
  no array or string, so the item states neither case.
  ${/ref/std/posix-2024/strcpy:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.

  The implementation of the pre-qualified library has a prefix loop, a word loop
  and a byte loop. The prefix loop copies the bytes before the first aligned
  address of the source. The prefix loop and the word loop need the same
  remainder of the division by the size of type size_t for both addresses. The
  word loop copies one word of the size of type size_t at a time. It ends before
  a word which contains a null character. The byte loop copies the rest.
  Dimension Alignment selects the prefix loop and the word loop, 3 states.
  Dimension Length ends the copy in the prefix, at the end of the prefix or after
  two words, 3 states.
