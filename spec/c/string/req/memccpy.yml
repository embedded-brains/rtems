test-prepare: |
  memset( ctx->dest_buf, 0xaa, sizeof( ctx->dest_buf ) );
  memset( ctx->src_buf, 0x11, sizeof( ctx->src_buf ) );
  ctx->offset = sizeof( long );
  ctx->dest = ctx->dest_buf + ctx->offset;
  ctx->src = ctx->src_buf + ctx->offset;
  ctx->c = 0x5a;
  ctx->retval = NULL;
  ctx->match_pos = 0;
