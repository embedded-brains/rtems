  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Result:
    - if:
        pre-conditions:
          N: Zero
      then: 'Null'
    - if:
        pre-conditions:
          Match: NotFound
      then: 'Null'
    - else: AfterChar
    MemoryArea:
    - if:
        pre-conditions:
          N: Zero
      then: Nop
    - if:
        pre-conditions:
          Match: NotFound
      then: CopiedAll
    - else: CopiedToMatch
  pre-conditions:
    N: all
    Match:
      applicable:
        pre-conditions:
          N:
          - Small
          - Word
          - MultiWord
    MatchPosition:
      applicable:
        pre-conditions:
          Alignment: Aligned
          Match: Found
          N: MultiWord
    Alignment:
      applicable:
        pre-conditions:
          N: MultiWord
type: requirement
