enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/memccpy
post-conditions:
- name: Result
  states:
  - name: AfterChar
    test-code: |
      T_eq_ptr( ctx->retval, ctx->dest_buf + ctx->match_pos + 1 );
    text: |
      The return value of ${../if/memccpy:/name} shall be a pointer to the
      byte immediately following the copied byte specified by
      ${../if/memccpy:/params[2]/name} in the memory area referenced by
      ${../if/memccpy:/params[0]/name}.
  - name: 'Null'
    test-code: |
      T_null( ctx->retval );
    text: |
      The return value of ${../if/memccpy:/name} shall be equal to
      ${/c/if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: MemoryArea
  states:
  - name: CopiedToMatch
    test-code: |
      T_eq_mem(
        ctx->dest_buf + ctx->offset,
        ctx->src_buf + ctx->offset,
        ctx->match_pos + 1 - ctx->offset
      );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }

      for ( size_t i = ctx->match_pos + 1; i < sizeof( ctx->dest_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }
    text: |
      The bytes of the memory area referenced by
      ${../if/memccpy:/params[0]/name} up to and including the byte matching
      ${../if/memccpy:/params[2]/name} shall be copied from the memory area
      referenced by ${../if/memccpy:/params[1]/name}. The remaining bytes of
      the memory area referenced by ${../if/memccpy:/params[0]/name} shall
      not be modified.
  - name: CopiedAll
    test-code: |
      T_eq_mem(
        ctx->dest_buf + ctx->offset,
        ctx->src_buf + ctx->offset,
        ctx->n
      );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }

      for ( size_t i = ctx->offset + ctx->n; i < sizeof( ctx->dest_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }
    text: |
      The bytes specified by ${../if/memccpy:/params[3]/name} of the memory
      area referenced by ${../if/memccpy:/params[0]/name} shall be copied
      from the memory area referenced by ${../if/memccpy:/params[1]/name}.
      The remaining bytes of the memory area referenced by
      ${../if/memccpy:/params[0]/name} shall not be modified.
  - name: Nop
    test-code: |
      for ( size_t i = 0; i < sizeof( ctx->dest_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }
    text: |
      The memory area referenced by ${../if/memccpy:/params[0]/name} shall
      not be modified.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
    text: |
      While the size specified by ${../if/memccpy:/params[3]/name} is equal
      to zero.
  - name: Small
    test-code: |
      ctx->n = sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memccpy:/params[3]/name} is
      greater than zero, while the size specified by
      ${../if/memccpy:/params[3]/name} is less than the size of a `long`
      integer on the target architecture.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
    text: |
      While the size specified by ${../if/memccpy:/params[3]/name} is equal
      to the size of a `long` integer on the target architecture.
  - name: MultiWord
    test-code: |
      ctx->n = 2 * sizeof( long ) + 3;
    text: |
      While the size specified by ${../if/memccpy:/params[3]/name} is
      greater than twice the size of a `long` integer on the target
      architecture, while the size specified by
      ${../if/memccpy:/params[3]/name} is not evenly divisible by the size
      of a `long` integer on the target architecture.
  test-epilogue: null
  test-prologue: null
- name: Match
  states:
  - name: Found
    test-code: |
      ctx->match_pos = ctx->offset + 2;
      ctx->src_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
    text: |
      While the byte specified by ${../if/memccpy:/params[2]/name} occurs
      within the first bytes specified by ${../if/memccpy:/params[3]/name}
      of the memory area referenced by ${../if/memccpy:/params[1]/name}.
  - name: NotFound
    test-code: |
      /* The default fill value of the source buffer does not match c */
    text: |
      While the byte specified by ${../if/memccpy:/params[2]/name} does not
      occur within the first bytes specified by
      ${../if/memccpy:/params[3]/name} of the memory area referenced by
      ${../if/memccpy:/params[1]/name}.
  test-epilogue: null
  test-prologue: null
- name: MatchPosition
  states:
  - name: FirstChunk
    test-code: |
      ctx->src_buf[ ctx->match_pos ] = 0x11;
      ctx->match_pos = ctx->offset + 3;
      ctx->src_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
    text: |
      While the byte specified by ${../if/memccpy:/params[2]/name} occurs
      within the first aligned `long` integer sized chunk of the memory area
      referenced by ${../if/memccpy:/params[1]/name}.
  - name: SecondChunk
    test-code: |
      ctx->src_buf[ ctx->match_pos ] = 0x11;
      ctx->match_pos = ctx->offset + sizeof( long ) + 3;
      ctx->src_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
    text: |
      While the byte specified by ${../if/memccpy:/params[2]/name} occurs
      within the second aligned `long` integer sized chunk of the memory
      area referenced by ${../if/memccpy:/params[1]/name}.
  - name: Remainder
    test-code: |
      ctx->src_buf[ ctx->match_pos ] = 0x11;
      ctx->match_pos = ctx->offset + 2 * sizeof( long ) + 1;
      ctx->src_buf[ ctx->match_pos ] = (unsigned char) ctx->c;
    text: |
      While the byte specified by ${../if/memccpy:/params[2]/name} occurs
      within the trailing bytes of the memory area referenced by
      ${../if/memccpy:/params[1]/name} which remain after all aligned `long`
      integer sized chunks have been processed.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = sizeof( long );
      ctx->dest = ctx->dest_buf + ctx->offset;
      ctx->src = ctx->src_buf + ctx->offset;
    text: |
      While the ${../if/memccpy:/params[0]/name} parameter and the
      ${../if/memccpy:/params[1]/name} parameter are aligned on a `long`
      integer boundary of the target architecture.
  - name: Unaligned
    test-code: |
      ctx->offset = sizeof( long ) + 1;
      ctx->dest = ctx->dest_buf + ctx->offset;
      ctx->src = ctx->src_buf + ctx->offset;
    text: |
      While the ${../if/memccpy:/params[0]/name} parameter or the
      ${../if/memccpy:/params[1]/name} parameter are not aligned on a `long`
      integer boundary of the target architecture.
  test-epilogue: null
  test-prologue: null
rationale: null
