test-description: |
  The memory areas lie in one buffer, so the offsets of the two areas arrange
  their relative position. An unaligned memory area starts one byte below an
  aligned address. Two overlapping areas differ by the least distance which the
  alignment of their start addresses permits. Unaligned memory areas with a size
  of one more than a multiple of the size of type long end at aligned addresses,
  so the copy towards lower addresses runs its block loop. The long size runs the
  loop of four blocks twice. The test fills the buffer with a pattern of distinct
  bytes before each call and records the source bytes with a loop of its own.
