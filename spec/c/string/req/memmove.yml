  - name: DisjointAbove
    test-code: |
      ctx->src_offset = 2 * sizeof( long ) + ctx->src_misalign;
      ctx->dest_offset = 14 * sizeof( long ) + ctx->dest_misalign;
    text: |
      While the memory areas referenced by the ${../if/memmove:/params[0]/name} and
      ${../if/memmove:/params[1]/name} parameters do not overlap, while the
      ${../if/memmove:/params[0]/name} parameter is greater than the
      ${../if/memmove:/params[1]/name} parameter.
  - name: Same
    test-code: |
      ctx->dest_offset = 2 * sizeof( long ) + ctx->dest_misalign;
      ctx->src_offset = ctx->dest_offset;
    text: |
      While the ${../if/memmove:/params[0]/name} parameter is equal to the
      ${../if/memmove:/params[1]/name} parameter.
  - name: DestBelow
    test-code: |
      ctx->dest_offset = 2 * sizeof( long ) + ctx->dest_misalign;
      ctx->src_offset = ctx->dest_offset +
                        Distance( ctx->src_misalign, ctx->dest_misalign );
    text: |
      While the memory areas referenced by the ${../if/memmove:/params[0]/name} and
      ${../if/memmove:/params[1]/name} parameters overlap, while the
      ${../if/memmove:/params[0]/name} parameter is less than the
      ${../if/memmove:/params[1]/name} parameter.
  - name: DestAbove
    test-code: |
      ctx->src_offset = 2 * sizeof( long ) + ctx->src_misalign;
      ctx->dest_offset = ctx->src_offset +
                         Distance( ctx->dest_misalign, ctx->src_misalign );
    text: |
      While the memory areas referenced by the ${../if/memmove:/params[0]/name} and
      ${../if/memmove:/params[1]/name} parameters overlap, while the
      ${../if/memmove:/params[0]/name} parameter is greater than the
      ${../if/memmove:/params[1]/name} parameter.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension N covers the size, 11 states. ${/ref/std/c23/memmove:/name} defines
  the copy for each size. A size of zero copies no byte. The implementation of
  the pre-qualified library compares the size against zero, the size of type long
  and four times this size. The states Zero and One hold the boundary zero and
  the value above it. Each other boundary has a state for the value below it, at
  it and above it. The states Short, Medium and Long hold the values between and
  after these states. A size beyond the memory areas is outside the domain, so N
  has no state for the last value of the type.

  Dimension DestAlignment covers the start address of the destination memory
  area, 2 states. Dimension SrcAlignment covers the start address of the source
  memory area, 2 states. The block loops of the implementation need aligned
  addresses of both memory areas at the side where the copy starts. Otherwise the
  byte loop copies all bytes. A copy towards lower addresses starts at the end of
  the memory areas.

  Dimension Overlap covers the relative position of the two memory areas, 5
  states. ${/ref/std/c23/memmove:/name} defines the copy also for overlapping
  areas. Two disjoint areas and two overlapping areas differ by the side of the
  destination. Two equal pointers overlap in every byte.

  ${/ref/std/posix-2024/memmove:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.
