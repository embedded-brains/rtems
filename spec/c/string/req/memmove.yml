      the size of type long plus one, while the size specified by
      ${../if/memmove:/params[2]/name} is less than four times the size of type long
      minus one.
  - name: BelowBlock
    test-code: |
      ctx->n = 4 * sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memmove:/params[2]/name} is equal to four
      times the size of type long minus one.
  - name: Block
    test-code: |
      ctx->n = 4 * sizeof( long );
    text: |
      While the size specified by ${../if/memmove:/params[2]/name} is equal to four
      times the size of type long.
  - name: AboveBlock
    test-code: |
      ctx->n = 4 * sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memmove:/params[2]/name} is equal to four
      times the size of type long plus one.
  - name: Long
    test-code: |
      ctx->n = 9 * sizeof( long ) + 1;
    text: |
      While the size specified by ${../if/memmove:/params[2]/name} is greater than
