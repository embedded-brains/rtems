      parameter starts at an address which is aligned to the size of type long.
  - name: Unaligned
    test-code: |
      ctx->dest_misalign = sizeof( long ) - 1;
    text: |
      While the memory area referenced by the ${../if/memmove:/params[0]/name}
      parameter starts at an address which is not aligned to the size of type long.
  test-epilogue: null
  test-prologue: null
- name: SrcAlignment
