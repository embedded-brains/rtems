  - name: BelowWord
    test-code: |
      ctx->n = sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/memmove:/params[2]/name} is equal to the
      size of type long minus one.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
