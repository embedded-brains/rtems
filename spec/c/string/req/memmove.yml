requirement-type: functional
skip-reasons:
  OverlapNeedsDistance: |
    The alignment of the start addresses sets the least distance between two
    overlapping memory areas. A size which is less than or equal to this distance
    leaves the memory areas disjoint.
  SameNeedsEqualAlignment: |
    Two equal pointers have the same alignment.
