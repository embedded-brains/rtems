rationale: |
  Dimension N covers the size, 2 states. ${/ref/std/c23/memcpy:/name} defines the
  copy for each size. A size of zero copies no byte. The implementation of the
  pre-qualified library compares the size against zero, the size of type long and
  four times this size. The Positive state takes the sizes one and two, the size
  of type long and four times this size. It also takes the sizes one and two
  below and above each of these two sizes. Nine times the size of type long plus
  one runs the loop of four blocks twice. The last size is the largest which the
  buffers hold. A size beyond the memory areas is outside the domain, so N has no
  state for the last value of the type.

  Dimension DestAlignment covers the start address of the destination memory
  area, 2 states. Dimension SrcAlignment covers the start address of the source
  memory area, 2 states. The block loops of the implementation need two aligned
  start addresses. Otherwise the byte loop copies all bytes. The offset of a
  start address to the preceding aligned address ranges from zero to the size of
  type long minus one. The Unaligned states take the offsets one and two and the
  offsets two and one below the size of type long. Two overlapping memory areas
  are outside the domain, so no dimension covers their relative position.

  The representative product of N, DestAlignment and SrcAlignment runs each size
  with each pair of offsets. The block loops of the implementation need the size
  and both start addresses at the same time.

  ${/ref/std/posix-2024/memcpy:/name} states that the function does not change
  ${/c/errno/if/errno:/name} on valid input.
