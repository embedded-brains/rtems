transition-map:
- enabled-by: true
  post-conditions:
    Result: SameAsDst
    DstArea:
    - if:
        pre-conditions:
          N: Zero
      then: Unmodified
    - if:
        pre-conditions:
          Fit: Fits
      then: CopiedWithPadding
    - else: CopiedFull
  pre-conditions:
    N: all
    Alignment:
      applicable:
        pre-conditions:
          N: MultiWord
    Fit:
      applicable:
        pre-conditions:
          N:
          - Small
          - Word
          - MultiWord
    MatchPosition:
      applicable:
        pre-conditions:
          Fit: Fits
          N: MultiWord
