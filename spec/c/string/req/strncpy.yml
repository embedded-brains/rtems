enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/strncpy
post-conditions:
- name: Result
  states:
  - name: SameAsDst
    test-code: |
      T_eq_ptr( ctx->retval, ctx->dest_buf + ctx->offset );
    text: |
      The return value of ${../if/strncpy:/name} shall be equal to the
      initial value of ${../if/strncpy:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
- name: DstArea
  states:
  - name: Unmodified
    test-code: |
      for ( size_t i = 0; i < sizeof( ctx->dest_buf ); ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }
    text: |
      The memory area referenced by ${../if/strncpy:/params[0]/name} shall
      not be modified.
  - name: CopiedWithPadding
    test-code: |
      size_t copy_len = ctx->match_pos - ctx->offset + 1;

      T_eq_nstr(
        (const char *) &ctx->dest_buf[ ctx->offset ],
        (const char *) &ctx->src_buf[ ctx->offset ],
        copy_len
      );

      for (
        size_t i = ctx->offset + copy_len;
        i < ctx->offset + ctx->n;
        ++i
      ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0 );
      }

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }

      for (
        size_t i = ctx->offset + ctx->n;
        i < sizeof( ctx->dest_buf );
        ++i
      ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }
    text: |
      The string referenced by ${../if/strncpy:/params[1]/name}, including
      its terminating null character, shall be copied to the memory area
      referenced by ${../if/strncpy:/params[0]/name}. The remaining bytes
      of the memory area referenced by ${../if/strncpy:/params[0]/name} up
      to the size specified by ${../if/strncpy:/params[2]/name} shall be
      set to the terminating null character.
  - name: CopiedFull
    test-code: |
      T_eq_mem(
        ctx->dest_buf + ctx->offset,
        ctx->src_buf + ctx->offset,
        ctx->n
      );

      for ( size_t i = 0; i < ctx->offset; ++i ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }

      for (
        size_t i = ctx->offset + ctx->n;
        i < sizeof( ctx->dest_buf );
        ++i
      ) {
        T_quiet_eq_uint( ctx->dest_buf[ i ], 0xaa );
      }
    text: |
      The bytes specified by ${../if/strncpy:/params[2]/name} of the
      string referenced by ${../if/strncpy:/params[1]/name} shall be
      copied to the memory area referenced by
      ${../if/strncpy:/params[0]/name}.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: N
  states:
  - name: Zero
    test-code: |
      ctx->n = 0;
    text: |
      While the size specified by ${../if/strncpy:/params[2]/name} is
      equal to zero.
  - name: Small
    test-code: |
      ctx->n = sizeof( long ) - 1;
    text: |
      While the size specified by ${../if/strncpy:/params[2]/name} is
      greater than zero, while the size specified by
      ${../if/strncpy:/params[2]/name} is less than the size of a `long`
      integer on the target architecture.
  - name: Word
    test-code: |
      ctx->n = sizeof( long );
    text: |
      While the size specified by ${../if/strncpy:/params[2]/name} is
      equal to the size of a `long` integer on the target architecture.
  - name: MultiWord
    test-code: |
      ctx->n = 2 * sizeof( long ) + 3;
    text: |
      While the size specified by ${../if/strncpy:/params[2]/name} is
      greater than twice the size of a `long` integer on the target
      architecture, while the size specified by
      ${../if/strncpy:/params[2]/name} is not evenly divisible by the
      size of a `long` integer on the target architecture.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Aligned
    test-code: |
      ctx->offset = sizeof( long );
      ctx->dest = (char *) ( ctx->dest_buf + ctx->offset );
      ctx->src = (const char *) ( ctx->src_buf + ctx->offset );
    text: |
      While the ${../if/strncpy:/params[0]/name} parameter and the
      ${../if/strncpy:/params[1]/name} parameter are aligned on a `long`
      integer boundary of the target architecture.
  - name: Unaligned
    test-code: |
      ctx->offset = sizeof( long ) + 1;
      ctx->dest = (char *) ( ctx->dest_buf + ctx->offset );
      ctx->src = (const char *) ( ctx->src_buf + ctx->offset );
    text: |
      While the ${../if/strncpy:/params[0]/name} parameter or the
      ${../if/strncpy:/params[1]/name} parameter are not aligned on a
      `long` integer boundary of the target architecture.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: Fits
    test-code: |
      ctx->match_pos = ctx->offset + 2;
      ctx->src_buf[ ctx->match_pos ] = 0;
    text: |
      While the length of the string referenced by
      ${../if/strncpy:/params[1]/name} is less than the size specified by
      ${../if/strncpy:/params[2]/name}.
  - name: Truncate
    test-code: |
      /* The default fill value of the source buffer does not contain a
         null character within the first n bytes */
    text: |
      While the length of the string referenced by
      ${../if/strncpy:/params[1]/name} is greater than or equal to the
      size specified by ${../if/strncpy:/params[2]/name}.
  test-epilogue: null
  test-prologue: null
- name: MatchPosition
  states:
  - name: FirstChunk
    test-code: |
      ctx->src_buf[ ctx->match_pos ] = 0x41;
      ctx->match_pos = ctx->offset + 3;
      ctx->src_buf[ ctx->match_pos ] = 0;
    text: |
      While the terminating null character occurs within the first
      aligned `long` integer sized chunk of the string referenced by
      ${../if/strncpy:/params[1]/name}.
  - name: SecondChunk
    test-code: |
      ctx->src_buf[ ctx->match_pos ] = 0x41;
      ctx->match_pos = ctx->offset + sizeof( long ) + 3;
      ctx->src_buf[ ctx->match_pos ] = 0;
    text: |
      While the terminating null character occurs within the second
      aligned `long` integer sized chunk of the string referenced by
      ${../if/strncpy:/params[1]/name}.
  - name: Remainder
    test-code: |
      ctx->src_buf[ ctx->match_pos ] = 0x41;
      ctx->match_pos = ctx->offset + 2 * sizeof( long ) + 1;
      ctx->src_buf[ ctx->match_pos ] = 0;
    text: |
      While the terminating null character occurs within the trailing
      bytes of the string referenced by ${../if/strncpy:/params[1]/name}
      which remain after all aligned `long` integer sized chunks have
      been processed.
  test-epilogue: null
  test-prologue: null
rationale: null
