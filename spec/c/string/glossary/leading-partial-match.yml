term: leading partial match
text: |
  A leading partial match of a string in another string is a
  ${partial-match:/term} of the string in the other string whose first character
  has an index less than the index of the first character of each occurrence of
  the string in the other string. Where the string does not occur in the other
  string, each partial match is a leading partial match.
type: glossary
