term: search area
text: |
  The search area of a call to ${../if/memchr:/name} is the sequence of bytes
  which lie in the first ${../if/memchr:/params[2]/name} bytes of the memory area
  referenced by the ${../if/memchr:/params[0]/name} parameter and in the object
  which contains this memory area.
