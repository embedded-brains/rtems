brief: |
  Locate the last occurrence of the character specified by ${.:/params[1]/name}
  in the string referenced by ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    return: char *
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: strrchr
notes: |
  See [C23, <string.h>, strrchr()](https://en.cppreference.com/w/c/string/byte/strrchr).
params:
- description: |
    is the pointer to the string to be searched.
  dir: in
  name: s
- description: |
    is the character to search for.
  dir: null
  name: c
return:
  return: |
    Returns a pointer to the located character in the string referenced by
    ${.:/params[0]/name}, including its terminating null character.
  return-values:
  - description: |
      Returns ${/c/if/null:/name}, if the character specified by ${.:/params[1]/name}
      does not occur in the string referenced by ${.:/params[0]/name}.
    value: ${/c/if/null:/name}
type: interface
