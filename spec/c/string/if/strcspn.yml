name: strcspn
notes: |
  See ${/ref/std/c23/strcspn:/name}.
params:
- description: |
    is the pointer to the string to be scanned.
  dir: in
  name: s1
- description: |
    is the pointer to the string which holds the characters which end the segment.
  dir: in
  name: s2
