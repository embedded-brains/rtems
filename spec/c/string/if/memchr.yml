brief: |
  Scan the memory area referenced by ${.:/params[0]/name} for the character
  specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const void *${.:/params[0]/name}
    - int ${.:/params[1]/name}
    - ${/c/if/size_t:/name} ${.:/params[2]/name}
    return: void *
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: memchr
notes: |
  See [C23, <string.h>, memchr()](https://en.cppreference.com/w/c/string/byte/memchr).
params:
- description: |
    is the pointer to the object to be searched.
  dir: in
  name: s
- description: |
    is the character to search for.
  dir: null
  name: c
- description: |
    is the maximum number of bytes to examine.
  dir: null
  name: n
return:
  return: |
    Returns a pointer to the byte matching ${.:/params[1]/name}, if the byte occurs
    within the first bytes specified by ${.:/params[2]/name}.
  return-values:
  - description: |
      Returns ${/c/if/null:/name}, if the byte specified by ${.:/params[1]/name} does
      not occur within the first bytes specified by ${.:/params[2]/name}.
    value: ${/c/if/null:/name}
type: interface
