brief: |
  Copy the memory area referenced by ${.:/params[1]/name} to the memory area
  referenced by ${.:/params[0]/name} for the number of bytes specified by
  ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - void *${.:/params[0]/name}
    - const void *${.:/params[1]/name}
    - ${/c/if/size_t:/name} ${.:/params[2]/name}
    return: void *
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: memmove
notes: |
  See [C23, <string.h>, memmove()](https://en.cppreference.com/w/c/string/byte/memmove).
params:
- description: |
    is the pointer to the destination memory area.
  dir: out
  name: dest
- description: |
    is the pointer to the source memory area.
  dir: in
  name: src
- description: |
    is the number of bytes to copy.
  dir: null
  name: n
return:
  return: |
    Returns a pointer to the memory area referenced by ${.:/params[0]/name}.
  return-values: []
type: interface
