brief: |
  Compare the memory areas referenced by ${.:/params[0]/name} and
  ${.:/params[1]/name} for the number of bytes specified by ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const void *${.:/params[0]/name}
    - const void *${.:/params[1]/name}
    - ${/c/if/size_t:/name} ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: memcmp
notes: |
  See [C23, <string.h>, memcmp()](https://en.cppreference.com/w/c/string/byte/memcmp).
params:
- description: |
    is the pointer to the first object to be compared.
  dir: in
  name: s1
- description: |
    is the pointer to the second object to be compared.
  dir: in
  name: s2
- description: |
    is the number of bytes to compare.
  dir: null
  name: n
return:
  return: |
    Returns an integer less than, equal to, or greater than zero if the first
    ${.:/params[2]/name} bytes of ${.:/params[0]/name} is found, respectively, to
    be less than, to match, or be greater than the first ${.:/params[2]/name} bytes
    of ${.:/params[1]/name}.
  return-values: []
type: interface
