brief: |
  Locate the first occurrence in the string specified by ${.:/params[0]/name} of
  the sequence of characters from the string specified by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char * ${.:/params[0]/name}
    - const char * ${.:/params[1]/name}
    return: char *
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: strstr
notes: |
  See [C23, <string.h>, strstr()](https://en.cppreference.com/w/c/string/byte/strstr).
params:
- description: |
    is the s1 parameter.
  dir: in
  name: s1
- description: |
    is the s2 parameter.
  dir: in
  name: s2
return:
  return: |
    Returns a pointer to the first character of the string specified by the
    ${.:/params[0]/name} parameter if the string specified by the
    ${.:/params[1]/name} parameter is an empty string.  Returns a pointer to
    the first occurrence of the string specified by the ${.:/params[1]/name}
    parameter in the string specified by the ${.:/params[0]/name} parameter.
    Returns a null pointer if the sequence of characters from the string
    specified by the ${.:/params[1]/name} parameter does not occur in the
    string specified by the ${.:/params[0]/name} parameter.
  return-values: []
type: interface
