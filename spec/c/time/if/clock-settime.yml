brief: |
  Set the time of the clock specified by ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/clockid_t:/name} ${.:/params[0]/name}
    - const ${/c/if/timespec:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[0]/name} is not valid.
    - The time value is invalid.
  role: errno
  uid: /c/errno/if/einval
- description: |
    ${.:/params[1]/name} points outside the accessible address space.
  role: errno
  uid: /c/errno/if/efault
- description: |
    The caller does not have the privilege to set the time of the specified clock.
  role: errno
  uid: /c/errno/if/eperm
name: clock_settime
notes: |
  See [POSIX.1-2024, System Interfaces, clock_settime()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/clock_settime.html).
params:
- description: |
    is the clock identifier.
  dir: null
  name: clock_id
- description: |
    is the pointer to the timespec object containing the new time.
  dir: in
  name: tp
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
