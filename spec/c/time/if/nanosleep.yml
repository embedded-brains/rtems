brief: |
  Suspend execution of the current thread for the time interval referenced by
  ${.:/params[0]/name} and store the remaining time in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/timespec:/name} *${.:/params[0]/name}
    - ${/c/if/timespec:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    The sleep was interrupted by a signal handler.
  role: errno
  uid: /c/errno/if/eintr
- description: |
    The nanoseconds field of ${.:/params[0]/name} was invalid.
  role: errno
  uid: /c/errno/if/einval
name: nanosleep
notes: |
  See [POSIX.1-2024, System Interfaces, nanosleep()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/nanosleep.html).
params:
- description: |
    is the pointer to the timespec object specifying the sleep duration.
  dir: in
  name: rqtp
- description: |
    is the pointer to the timespec object to store the remaining time if
    interrupted.
  dir: out
  name: rmtp
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
