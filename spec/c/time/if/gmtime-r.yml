brief: |
  Convert the time referenced by ${.:/params[0]/name} into a broken-down time
  expressed as ${/glossary/utc:/term} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const ${/c/if/time_t:/name} *${.:/params[0]/name}
    - ${/c/time/if/tm:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
name: gmtime_r
notes: |
  See [POSIX.1-2024, System Interfaces, gmtime_r()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/gmtime_r.html).
params:
- description: |
    is the pointer to the time object.
  dir: in
  name: timer
- description: |
    is the pointer to the tm object to store the result.
  dir: out
  name: result
return:
  return: null
  return-values: []
type: interface
