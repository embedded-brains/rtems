brief: |
  Set the time of the per-process timer specified by ${.:/params[0]/name} to the
  value referenced by ${.:/params[2]/name} and store the previous time in the
  object referenced by ${.:/params[3]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/timer_t:/name} ${.:/params[0]/name}
    - int ${.:/params[1]/name}
    - const ${/c/time/if/itimerspec:/name} *${.:/params[2]/name}
    - ${/c/time/if/itimerspec:/name} *${.:/params[3]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
name: timer_settime
notes: |
  See [POSIX.1-2024, System Interfaces, timer_settime()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/timer_settime.html).
params:
- description: |
    is the timer ID.
  dir: null
  name: timerid
- description: |
    is the flags.
  dir: null
  name: flags
- description: |
    is the pointer to the itimerspec object containing the new time.
  dir: in
  name: value
- description: |
    is the pointer to the itimerspec object to store the previous time if not NULL.
  dir: out
  name: ovalue
return:
  return: null
  return-values: []
type: interface
