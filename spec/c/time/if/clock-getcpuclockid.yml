brief: |
  Get the CPU-time clock ID of the process specified by ${.:/params[0]/name} and
  store it in the object referenced by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pid_t:/name} ${.:/params[0]/name}
    - ${/c/if/clockid_t:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: clock_getcpuclockid
notes: |
  See [POSIX.1-2024, System Interfaces, clock_getcpuclockid()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/clock_getcpuclockid.html).
params:
- description: |
    is the process ID.
  dir: null
  name: pid
- description: |
    is the pointer to the clock ID object.
  dir: out
  name: clock_id
return:
  return: null
  return-values: []
type: interface
