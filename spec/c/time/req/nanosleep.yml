transition-map:
- enabled-by: true
  post-conditions:
    Status: Zero
    Errno: Nop
    Timer:
    - if:
        pre-conditions:
          RQTpNSec: Zero
          RQTpSec: Zero
      then: Inactive
    - else: Monotonic
    Expire:
    - if:
        pre-conditions:
          RQTpNSec: Zero
          RQTpSec: Zero
      then: N/A
    - if:
        pre-conditions:
          RQTpSec: FarFuture
      then: Last
    - else: Relative
    Scheduler:
    - if:
        pre-conditions:
          RQTpNSec: Zero
          RQTpSec: Zero
      then: BlockUnblock
    - else: Block
    RMTp:
    - if:
        pre-conditions:
          RMTp: Valid
      then: Zero
    - else: N/A
  pre-conditions:
    RQTp:
    - Valid
    RQTpNSec:
    - Zero
    - Positive
    RQTpSec:
    - Zero
    - Future
    - FarFuture
    RMTp: all
- enabled-by: true
  post-conditions:
    Status: MinusOne
    Errno: Inval
    Timer: Inactive
    Expire: N/A
    Scheduler: BlockUnblock
    RMTp:
    - if:
        pre-conditions:
          RMTp: Valid
      then: Zero
    - else: N/A
  pre-conditions:
    RQTp:
    - 'Null'
    RQTpNSec: N/A
    RQTpSec: N/A
    RMTp: all
- enabled-by: true
  post-conditions:
    Status: MinusOne
    Errno: Inval
    Timer: Inactive
    Expire: N/A
    Scheduler: BlockUnblock
    RMTp:
    - if:
        pre-conditions:
          RMTp: Valid
      then: Zero
    - else: N/A
  pre-conditions:
    RQTp:
    - Valid
    RQTpNSec:
    - Invalid
    RQTpSec: all
    RMTp: all
- enabled-by: true
  post-conditions:
    Status: MinusOne
    Errno: Inval
    Timer: Inactive
    Expire: N/A
    Scheduler: BlockUnblock
    RMTp:
    - if:
        pre-conditions:
          RMTp: Valid
      then: Zero
    - else: N/A
  pre-conditions:
    RQTp:
    - Valid
    RQTpNSec:
    - Zero
    - Positive
    RQTpSec:
    - Negative
    RMTp: all
