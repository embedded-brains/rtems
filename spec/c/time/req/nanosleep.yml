enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/nanosleep
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The return value of ${../if/nanosleep:/name} shall be equal to zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The return value of ${../if/nanosleep:/name} shall be equal to minus one.
  test-epilogue: null
  test-prologue: null
- name: Errno
  states:
  - name: Nop
    test-code: |
      T_eq_int( ctx->errno_value, -1 );
    text: |
      The ${/c/errno/if/errno:/name} value shall not be changed by the
      ${../if/nanosleep:/name} call.
  - name: Inval
    test-code: |
      T_eq_int( ctx->errno_value, EINVAL );
    text: |
      The ${/c/errno/if/errno:/name} value shall be equal to
      ${/c/errno/if/einval:/name}.
  test-epilogue: null
  test-prologue: null
- name: Timer
  states:
  - name: Inactive
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_INACTIVE );
    text: |
      The timer of the calling task shall be inactive.
  - name: Monotonic
    test-code: |
      T_eq_int( ctx->timer_info.state, TASK_TIMER_MONOTONIC );
    text: |
      The timer of the calling task shall be active using the
      ${/glossary/clock-monotonic:/term}.
  test-epilogue: null
  test-prologue: null
- name: Expire
  states:
  - name: Last
    test-code: |
      T_eq_u64( ctx->timer_info.expire_ticks, 0xffffffffffffffff );
    text: |
      The timer of the calling task shall expire at the last valid time point of the
      ${/glossary/clock-monotonic:/term}.
  - name: Relative
    test-code: |
      expire = ctx->now_monotonic;
      expire.tv_sec += ctx->rqtp_obj.tv_sec;
      expire.tv_nsec += ctx->rqtp_obj.tv_nsec;

      if ( expire.tv_nsec >= 1000000000 ) {
        ++expire.tv_sec;
        expire.tv_nsec -= 1000000000;
      }

      T_eq_i64( ctx->timer_info.expire_timespec.tv_sec, expire.tv_sec );
      T_eq_long( ctx->timer_info.expire_timespec.tv_nsec, expire.tv_nsec );
    text: |
      The timer of the calling task shall expire at the time point specified by the
      sum of the current time of the ${/glossary/clock-monotonic:/term} and the
      interval specified by the `rqtp` parameter.
  test-epilogue: null
  test-prologue: |
    struct timespec expire;
- name: Scheduler
  states:
  - name: Block
    test-code: |
      T_eq_sz( ctx->scheduler_log.header.recorded, 1 );
      T_eq_int( ctx->scheduler_log.events[ 0 ].operation, T_SCHEDULER_BLOCK );
    text: |
      The calling task shall be blocked by the scheduler exactly once by the
      ${../if/nanosleep:/name} call.
  - name: BlockUnblock
    test-code: |
      T_eq_sz( ctx->scheduler_log.header.recorded, 2 );
      T_eq_int( ctx->scheduler_log.events[ 0 ].operation, T_SCHEDULER_BLOCK );
      T_eq_int( ctx->scheduler_log.events[ 1 ].operation, T_SCHEDULER_UNBLOCK );
    text: |
      The calling task shall be blocked exactly once by the scheduler and then
      unblocked in the same thread dispatch critical section by the
      ${../if/nanosleep:/name} call.
  test-epilogue: null
  test-prologue: null
- name: RMTp
  states:
  - name: Zero
    test-code: |
      T_eq_i64( ctx->rmtp_obj.tv_sec, 0 );
      T_eq_long( ctx->rmtp_obj.tv_nsec, 0 );
    text: |
      The object referenced by the `rmtp` parameter shall be cleared to zero after
      the return of the ${../if/nanosleep:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: RQTp
  states:
  - name: Valid
    test-code: |
      ctx->rqtp = &ctx->rqtp_obj;
    text: |
      While the `rqtp` parameter references an object of type
      ${../../if/timespec:/name}.
  - name: 'Null'
    test-code: |
      ctx->rqtp = NULL;
    text: |
      While the `rqtp` parameter is equal to ${../../if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: RQTpNSec
  states:
  - name: Zero
    test-code: |
      ctx->rqtp_obj.tv_nsec = 0;
    text: |
      While the `tv_nsec` member of the object referenced by the `rqtp` parameter is
      equal to zero.
  - name: Positive
    representatives:
    - name: One
      test-code: |
        ctx->rqtp_obj.tv_nsec = 1;
    - name: Max
      test-code: |
        ctx->rqtp_obj.tv_nsec = 999999999;
    test-code: null
    text: |
      While the `tv_nsec` member of the object referenced by the `rqtp` parameter is
      greater than zero and less than one billion.
  - name: Invalid
    representatives:
    - name: MinusOne
      test-code: |
        ctx->rqtp_obj.tv_nsec = -1;
    - name: OneBillion
      test-code: |
        ctx->rqtp_obj.tv_nsec = 1000000000;
    test-code: null
    text: |
      While the `tv_nsec` member of the object referenced by the `rqtp` parameter is
      less than zero or greater than or equal to one billion.
  test-epilogue: null
  test-prologue: null
- name: RQTpSec
  states:
  - name: Negative
    test-code: |
      ctx->rqtp_obj.tv_sec = -1;
    text: |
      While the `tv_sec` member of the object referenced by the `rqtp` parameter is
      negative.
  - name: Zero
    test-code: |
      ctx->rqtp_obj.tv_sec = 0;
    text: |
      While the `tv_sec` member of the object referenced by the `rqtp` parameter is
      equal to zero.
  - name: Future
    representatives:
    - name: One
      test-code: |
        ctx->rqtp_obj.tv_sec = 1;
    - name: Limit
      test-code: |
        ctx->rqtp_sec_at_limit = true;
        ctx->rqtp_sec_beyond_limit = 0;
    test-code: null
    text: |
      While the `tv_sec` member of the object referenced by the `rqtp` parameter is
      positive and specifies an interval which ends at a time point which is within
      the implementation limits.
  - name: FarFuture
    representatives:
    - name: Limit
      test-code: |
        ctx->rqtp_sec_at_limit = true;
        ctx->rqtp_sec_beyond_limit = 1;
    - name: Max
      test-code: |
        ctx->rqtp_obj.tv_sec = INT64_MAX;
    test-code: null
    text: |
      While the `tv_sec` member of the object referenced by the `rqtp` parameter
      specifies an interval which ends at a time point which is past the
      implementation limit.
  test-epilogue: null
  test-prologue: null
- name: RMTp
  states:
  - name: Valid
    test-code: |
      ctx->rmtp = &ctx->rmtp_obj;
    text: |
      While the `rmtp` parameter references an object of type
      ${../../if/timespec:/name}.
  - name: 'Null'
    test-code: |
      ctx->rmtp = NULL;
    text: |
      While the `rmtp` parameter is equal to ${../../if/null:/name}.
  test-epilogue: null
  test-prologue: null
rationale: |
  POSIX.1-2024 specifies that the function suspends the calling thread until the
  time interval specified by the `rqtp` parameter has elapsed, measured using the
  ${/glossary/clock-realtime:/term}, and that a relative interval is not affected
  by a change of that clock. The function therefore uses the watchdog of the
  ${/glossary/clock-monotonic:/term} for the interval, which the timer and its
  expiration time show. An interval of zero ends at once, so the timer is not
  activated and the calling task is blocked and unblocked in the same thread
  dispatch critical section. An interval with zero seconds and a positive
  nanoseconds value ends after the current time, so the timer is activated. The
  representatives of the states lie at the edges where the implementation
  compares a member. The nanoseconds member has its edges at zero and one
  billion. The seconds member has its edges at zero and at the last second of the
  ${/glossary/clock-monotonic:/term} which the watchdog can represent.

  POSIX.1-2024 requires the error ${/c/errno/if/einval:/name} for a nanoseconds
  member which is less than zero or not less than one billion. The implementation
  also returns it for a negative seconds member and for a ${/c/if/null:/name}
  `rqtp` parameter, for which POSIX.1-2024 specifies no behaviour. The function
  returns minus one and sets ${/c/errno/if/errno:/name} for every error, and it
  returns zero and leaves ${/c/errno/if/errno:/name} unchanged otherwise. The
  test starts with an ${/c/errno/if/errno:/name} value which differs from every
  error.

  POSIX.1-2024 specifies the error ${/c/errno/if/eintr:/name}, if a signal
  interrupts the function, and the storage of the remaining time in the object
  referenced by the `rmtp` parameter. The pre-qualified build has RTEMS_POSIX_API
  set to false, so no signal interrupts the function and
  ${/c/errno/if/eintr:/name} is not returned. The function clears the object to
  zero in every other case, also after an error.
