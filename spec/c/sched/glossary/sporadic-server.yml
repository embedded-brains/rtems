term: POSIX sporadic server
text: |
  A scheduling policy designed to provide predictable execution behavior for
  sporadic tasks. See
  [POSIX.1-2024, General Information, Process Scheduling](https://pubs.opengroup.org/onlinepubs/9799919799/functions/V2_chap02.html#tag_15_08_04).
