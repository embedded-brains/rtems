term: low scheduling priority
text: |
  An attribute of the ${sporadic-server:/term} that specifies the background
  execution priority. See
  [POSIX.1-2024, System Interfaces, sched_getparam](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sched_getparam.html).
