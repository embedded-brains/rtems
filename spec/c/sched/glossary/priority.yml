term: scheduling priority
text: |
  An integer value associated with a thread or process that determines its
  execution precedence. See
  [POSIX.1-2024, Base Definitions, Section 3.298 Priority](https://pubs.opengroup.org/onlinepubs/9799919799/basedefs/V1_chap03.html#tag_04_298).
