brief: |
  Get the ${../glossary/policy:/term} of the process with the ID specified by
  ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pid_t:/name} ${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    Invalid arguments: ${.:/params[0]/name} is negative or param is NULL.
    (sched_setscheduler()) policy is not one of the recognized policies.
    (sched_setscheduler()) param does not make sense for the specified policy.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The calling thread does not have appropriate privileges.
  role: errno
  uid: /c/errno/if/eperm
- description: |
    The thread whose ID is ${.:/params[0]/name} could not be found.
  role: errno
  uid: /c/errno/if/esrch
name: sched_getscheduler
notes: |
  See [POSIX.1-2024, System Interfaces, sched_getscheduler()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sched_getscheduler.html).
params:
- description: |
    is the process ID.
  dir: null
  name: pid
return:
  return: |
    Returns the ${../glossary/policy:/term} of the process on success.
  return-values:
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
