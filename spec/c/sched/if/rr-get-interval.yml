brief: |
  Get the round-robin scheduling interval of the process with the ID specified by
  ${.:/params[0]/name} and store it in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pid_t:/name} ${.:/params[0]/name}
    - ${/c/if/timespec:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    Problem with copying information to user space.
  role: errno
  uid: /c/errno/if/efault
- description: |
    Invalid ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/einval
- description: |
    The system call is not yet implemented (only on rather old kernels).
  role: errno
  uid: /c/errno/if/enosys
- description: |
    Could not find a process with the ID ${.:/params[0]/name}.
  role: errno
  uid: /c/errno/if/esrch
name: sched_rr_get_interval
notes: |
  See [POSIX.1-2024, System Interfaces, sched_rr_get_interval()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sched_rr_get_interval.html).
params:
- description: |
    is the process ID.
  dir: null
  name: pid
- description: |
    is the pointer to a timespec structure where the interval will be stored.
  dir: out
  name: interval
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
