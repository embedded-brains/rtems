brief: |
  Get the ${../glossary/parameter:/plural} of the process with the ID specified
  by ${.:/params[0]/name} and store them in the object referenced by
  ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - ${/c/if/pid_t:/name} ${.:/params[0]/name}
    - struct sched_param *restrict ${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    Invalid arguments: ${.:/params[1]/name} is NULL or ${.:/params[0]/name} is
    negative (sched_setparam()) The argument ${.:/params[1]/name} does not make
    sense for the current scheduling policy.
  role: errno
  uid: /c/errno/if/einval
- description: |
    (sched_setparam()) The caller does not have appropriate privileges (Linux: does
    not have the CAP_SYS_NICE capability).
  role: errno
  uid: /c/errno/if/eperm
- description: |
    The thread whose ID is ${.:/params[0]/name} could not be found.
  role: errno
  uid: /c/errno/if/esrch
name: sched_getparam
notes: |
  See [POSIX.1-2024, System Interfaces, sched_getparam()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/sched_getparam.html).
params:
- description: |
    is the process ID.
  dir: null
  name: pid
- description: |
    is the pointer to a sched_param structure where the parameters will be stored.
  dir: out
  name: param
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
