brief: |
  Get the next argument of type ${.:/params[1]/name} from the variable argument
  list ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: _ImplementationDefined
    params:
    - ${/c/if/va_list:/name} ${.:/params[0]/name}
    - ${/c/if/va_list:/name} ${.:/params[1]/name}
    return: ${.:/params[1]/name}
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: macro
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
name: va_arg
notes: |
  See [C23, <stdarg.h>, va_arg()](https://en.cppreference.com/w/c/variadic/va_arg).
params:
- description: |
    is the variable argument list.
  dir: inout
  name: ap
- description: |
    is the type of the next argument.
  dir: null
  name: type
return:
  return: |
    Returns the next argument of type ${.:/params[1]/name} from the variable
    argument list ${.:/params[0]/name}.
  return-values: []
type: interface
