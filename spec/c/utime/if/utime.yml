brief: |
  Change the last access and modification times of the file referenced by
  ${.:/params[0]/name} according to the times referenced by ${.:/params[1]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    - const ${/c/if/utimbuf:/name} *${.:/params[1]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- role: constraint
  uid: /constraint/directive-not-pre-qualified
- description: |
    This error number indicates the following error conditions:

    - Search permission is denied for one of the directories in the path prefix of
      ${.:/params[0]/name}.
    - ${.:/params[1]/name} is NULL, the caller's effective user ID does not match
      the owner of the file, the caller does not have write access to the file, and
      the caller is not privileged.
  role: errno
  uid: /c/errno/if/eacces
- description: |
    ${.:/params[0]/name} points to an invalid address.
  role: errno
  uid: /c/errno/if/efault
- description: |
    The file specified by ${.:/params[0]/name} does not exist.
  role: errno
  uid: /c/errno/if/enoent
- description: |
    ${.:/params[1]/name} is not NULL, the caller's effective UID does not match the
    owner of the file, and the caller is not privileged.
  role: errno
  uid: /c/errno/if/eperm
- description: |
    The file specified by ${.:/params[0]/name} resides on a read-only filesystem.
  role: errno
  uid: /c/errno/if/erofs
name: utime
notes: |
  See [POSIX.1-2024, System Interfaces, utime()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/utime.html).
params:
- description: |
    is the path to the file.
  dir: in
  name: path
- description: |
    is the pointer to the utimbuf object specifying the new access and modification
    times.
  dir: in
  name: times
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
