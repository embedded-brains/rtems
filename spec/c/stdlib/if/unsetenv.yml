brief: |
  Remove the environment variable with the name specified by
  ${.:/params[0]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    ${.:/params[0]/name} is NULL, points to a string of length 0, or contains an
    '=' character.
  role: errno
  uid: /c/errno/if/einval
- description: |
    Insufficient memory to add a new variable to the environment.
  role: errno
  uid: /c/errno/if/enomem
name: unsetenv
notes: |
  See [POSIX.1-2024, System Interfaces, unsetenv()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/unsetenv.html).
params:
- description: |
    is the name of the environment variable to remove.
  dir: in
  name: name
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
