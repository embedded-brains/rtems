brief: |
  Add or change the environment variable with the name specified by
  ${.:/params[0]/name} to the value specified by ${.:/params[1]/name} according
  to the overwrite flag specified by ${.:/params[2]/name}.
copyrights:
- Copyright (C) 2026 embedded brains GmbH & Co. KG
definition:
  default:
    attributes: null
    body: null
    params:
    - const char *${.:/params[0]/name}
    - const char *${.:/params[1]/name}
    - int ${.:/params[2]/name}
    return: int
  variants: []
description: null
enabled-by: true
index-entries: []
interface-type: function
links:
- role: interface-placement
  uid: header
- role: interface-ingroup
  uid: group
- description: |
    This error number indicates the following error conditions:

    - The ${.:/params[0]/name} parameter is a null pointer.
    - The ${.:/params[0]/name} parameter points to an empty string.
    - The ${.:/params[0]/name} parameter contains an '=' character.
  role: errno
  uid: /c/errno/if/einval
- description: |
    There is not enough memory to add a new variable to the environment.
  role: errno
  uid: /c/errno/if/enomem
name: setenv
notes: |
  See [POSIX.1-2024, System Interfaces, setenv()](https://pubs.opengroup.org/onlinepubs/9799919799/functions/setenv.html).
params:
- description: |
    is the pointer to the environment variable name.
  dir: in
  name: name
- description: |
    is the pointer to the environment variable value.
  dir: in
  name: value
- description: |
    is the overwrite flag.
  dir: null
  name: overwrite
return:
  return: null
  return-values:
  - description: |
      Returns zero on success.
    value: 0
  - description: |
      An error occurred. The ${/c/errno/if/errno:/name} is set to indicate the error.
    value: -1
type: interface
