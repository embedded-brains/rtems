requirement-type: functional
text: |
  While the pseudo-random number generator used by ${../if/arc4random:/name}
  and ${../if/arc4random-buf:/name} is reinitialized, if the call to
  ${/c/unistd/if/getentropy:/name} fails, then the system shall terminate with
  the ${/score/interr/if/internal-error-core:/name} fatal source and the
  ${/score/interr/if/arc4random-getentropy-fail:/name} fatal code.
