enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/malloc-usable-size
post-conditions:
- name: Value
  states:
  - name: Zero
    test-code: |
      T_eq_sz( ctx->value, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/malloc-usable-size:/name} shall
      be equal to zero.
  - name: Usable
    test-code: |
      T_ge_sz( ctx->value, REQUEST_SIZE );
      T_le_uptr( (uintptr_t) ctx->ptr + ctx->value, (uintptr_t) ctx->next );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/malloc-usable-size:/name} shall
      be a size of at least the size of the request which returned the
      ${/score/heap/glossary/used-block:/term} referenced by the
      ${../if/malloc-usable-size:/params[0]/name} parameter, up to the end of this
      block.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Ptr
  states:
  - name: 'Null'
    test-code: |
      ctx->ptr = NULL;
    text: |
      While the ${../if/malloc-usable-size:/params[0]/name} parameter is equal to
      ${../if/null:/name}.
  - name: Used
    test-code: |
      ctx->ptr = malloc( REQUEST_SIZE );
      T_quiet_not_null( ctx->ptr );
      ctx->next = malloc( 1 );
      T_quiet_not_null( ctx->next );
      T_quiet_gt_uptr( (uintptr_t) ctx->next, (uintptr_t) ctx->ptr );
    text: |
      While the ${../if/malloc-usable-size:/params[0]/name} parameter is the begin
      address of a ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  - name: Invalid
    test-code: |
      ctx->ptr = HeapGetArea();
    text: |
      While the ${../if/malloc-usable-size:/params[0]/name} parameter is not equal to
      ${../if/null:/name}, while the ${../if/malloc-usable-size:/params[0]/name}
      parameter is not the begin address of a
      ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  The heap places the block of the Used state and the next block one after the
  other. The usable size of a block ends at or before the begin of the next
  block.
requirement-type: functional
skip-reasons: {}
test-action: |
  ctx->value = malloc_usable_size( ctx->ptr );
test-brief: null
test-cleanup: null
