enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/free
post-conditions:
- name: Heap
  states:
  - name: Freed
    test-code: |
      T_eq_u32( ctx->after.used_blocks + 1, ctx->before.used_blocks );
      T_eq_uptr( ctx->after.free_size, ctx->before.free_size + ctx->block_size );
    text: |
      The memory area referenced by the ${../if/free:/params[0]/name} parameter shall
      be a ${/score/heap/glossary/free-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks );
      T_eq_u32( ctx->after.free_blocks, ctx->before.free_blocks );
      T_eq_uptr( ctx->after.free_size, ctx->before.free_size );
    text: |
      The ${/score/heap/glossary/used-block:/plural} and the
      ${/score/heap/glossary/free-block:/plural} of the
      ${/score/heap/glossary/c-program-heap:/term} shall not be changed by the
      ${../if/free:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Ptr
  states:
  - name: 'Null'
    test-code: |
      ctx->ptr = NULL;
    text: |
      While the ${../if/free:/params[0]/name} parameter is equal to
      ${../if/null:/name}.
  - name: Used
    test-code: |
      ctx->ptr = malloc( 1 );
      T_quiet_not_null( ctx->ptr );
      T_quiet_true(
        _RBHeap_Size_of_block( &ctx->heap.heap, ctx->ptr, &ctx->block_size )
      );
      ctx->block_size += RBHEAP_GUARD_SIZE;
    text: |
      While the ${../if/free:/params[0]/name} parameter is the begin address of a
      ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  - name: Invalid
    test-code: |
      ctx->ptr = HeapGetArea();
    text: |
      While the ${../if/free:/params[0]/name} parameter is not equal to
      ${../if/null:/name}, while the ${../if/free:/params[0]/name} parameter is not
      the begin address of a ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  The ${../if/free:/name} function terminates the system for an invalid
  ${../if/free:/params[0]/name} parameter as specified by ${free-invalid:/path}.
requirement-type: functional
skip-reasons:
  Fatal: |
    The ${../if/free:/name} function terminates the system, so the test case cannot
    check the post-conditions.
test-action: |
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->before );
  free( ctx->ptr );
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->after );
test-brief: null
test-cleanup: null
test-context:
- brief: |
    This member contains the heap of the test.
  description: null
  member: |
    HeapContext heap
- brief: |
    This member contains the snapshot of the heap before the call.
  description: null
  member: |
    HeapSnapshot before
- brief: |
    This member contains the snapshot of the heap after the call.
  description: null
  member: |
    HeapSnapshot after
- brief: |
    This member contains the size of the block referenced by the
    ${../if/free:/params[0]/name} parameter.
  description: null
  member: |
    uintptr_t block_size
- brief: |
    This member specifies the ${../if/free:/params[0]/name} parameter value.
  description: null
  member: |
    void *ptr
test-context-support: null
test-description: null
test-header: null
test-includes:
- stdlib.h
test-local-includes:
- tx-heap.h
test-prepare: |
  HeapReset( &ctx->heap );
test-setup:
  brief: null
  code: |
    HeapInstall( &ctx->heap );
  description: null
test-stop: null
test-support: null
test-target: testsuites/validation/tc-mem-free.c
test-teardown:
  brief: null
  code: |
    HeapRestore( &ctx->heap );
  description: null
text: |
  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Heap: Nop
  pre-conditions:
    Ptr:
    - 'Null'
- enabled-by: true
  post-conditions:
    Heap: Freed
  pre-conditions:
    Ptr:
    - Used
- enabled-by: true
  post-conditions: Fatal
  pre-conditions:
    Ptr:
    - Invalid
type: requirement
