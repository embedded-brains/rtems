enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/posix-memalign
- role: requirement-refinement
  uid: /score/heap/req/disjoint
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/posix-memalign:/name} shall be
      equal to zero.
  - name: EINVAL
    test-code: |
      T_eq_int( ctx->status, EINVAL );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/posix-memalign:/name} shall be
      equal to ${/c/errno/if/einval:/name}.
  - name: ENOMEM
    test-code: |
      T_eq_int( ctx->status, ENOMEM );
    text: |
      The ${/glossary/returnvalue:/term} of ${../if/posix-memalign:/name} shall be
      equal to ${/c/errno/if/enomem:/name}.
  test-epilogue: null
  test-prologue: null
- name: MemptrVar
  states:
  - name: AreaBegin
    test-code: |
      T_not_null( ctx->memptr_obj );
      T_true( _RBHeap_Size_of_block( &ctx->heap.heap, ctx->memptr_obj, &size ) );
    text: |
      The value of the object referenced by the
      ${../if/posix-memalign:/params[0]/name} parameter shall be the begin address of
      a ${/score/heap/glossary/used-block:/term} of the
      ${/score/heap/glossary/c-program-heap:/term}.
  - name: 'Null'
    test-code: |
      T_null( ctx->memptr_obj );
    text: |
      The value of the object referenced by the
      ${../if/posix-memalign:/params[0]/name} parameter shall be ${../if/null:/name}.
  - name: Nop
    test-code: |
      T_eq_uptr( (uintptr_t) ctx->memptr_obj, 1 );
    text: |
      Objects referenced by the ${../if/posix-memalign:/params[0]/name} parameter in
      past calls to ${../if/posix-memalign:/name} shall not be accessed by the
      ${../if/posix-memalign:/name} call.
  test-epilogue: null
  test-prologue: |
    uintptr_t size;
- name: Alignment
  states:
  - name: Valid
    test-code: |
      T_eq_uptr( (uintptr_t) ctx->memptr_obj % ctx->alignment, 0 );
    text: |
      The begin address of the ${/score/heap/glossary/used-block:/term} shall be an
      integral multiple of the ${../if/posix-memalign:/params[1]/name} parameter.
  test-epilogue: null
  test-prologue: null
- name: Size
  states:
  - name: Valid
    test-code: |
      T_true( _RBHeap_Size_of_block( &ctx->heap.heap, ctx->memptr_obj, &size ) );
      T_ge_uptr( size, ctx->size );
    text: |
      The size of the ${/score/heap/glossary/used-block:/term} shall be greater than
      or equal to the ${../if/posix-memalign:/params[2]/name} parameter.
  test-epilogue: null
  test-prologue: |
    uintptr_t size;
- name: Heap
  states:
  - name: Allocated
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks + 1 );
    text: |
      The ${/score/heap/glossary/c-program-heap:/term} shall have one more
      ${/score/heap/glossary/used-block:/term}.
  - name: Nop
    test-code: |
      T_eq_u32( ctx->after.used_blocks, ctx->before.used_blocks );
      T_eq_u32( ctx->after.free_blocks, ctx->before.free_blocks );
      T_eq_uptr( ctx->after.free_size, ctx->before.free_size );
    text: |
      The ${/score/heap/glossary/used-block:/plural} and the
      ${/score/heap/glossary/free-block:/plural} of the
      ${/score/heap/glossary/c-program-heap:/term} shall not be changed by the
      ${../if/posix-memalign:/name} call.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Memptr
  states:
  - name: Valid
    test-code: |
      ctx->memptr = &ctx->memptr_obj;
    text: |
      While the ${../if/posix-memalign:/params[0]/name} parameter references an
      object of type `void *`.
  - name: 'Null'
    test-code: |
      ctx->memptr = NULL;
    text: |
      While the ${../if/posix-memalign:/params[0]/name} parameter is equal to
      ${../if/null:/name}.
  test-epilogue: null
  test-prologue: null
- name: Alignment
  states:
  - name: Tiny
    test-code: |
      ctx->alignment = sizeof( void * ) - 1;
    text: |
      While the ${../if/posix-memalign:/params[1]/name} parameter is less than
      `sizeof( void * )`.
  - name: NotPower2
    test-code: |
      ctx->alignment = sizeof( void * ) + 1;
    text: |
      While the ${../if/posix-memalign:/params[1]/name} parameter is greater than or
      equal to `sizeof( void * )`, while the ${../if/posix-memalign:/params[1]/name}
      parameter is not a power of two.
  - name: Valid
    test-code: |
      ctx->alignment = 128;
    text: |
      While the ${../if/posix-memalign:/params[1]/name} parameter is greater than or
      equal to `sizeof( void * )`, while the ${../if/posix-memalign:/params[1]/name}
      parameter is a power of two.
  test-epilogue: null
  test-prologue: null
- name: Size
  states:
  - name: Zero
    test-code: |
      ctx->size = 0;
    text: |
      While the ${../if/posix-memalign:/params[2]/name} parameter is equal to zero.
  - name: NonZero
    test-code: |
      ctx->size = sizeof( uint64_t );
    text: |
      While the ${../if/posix-memalign:/params[2]/name} parameter is not equal to
      zero.
  test-epilogue: null
  test-prologue: null
- name: Fit
  states:
  - name: 'Yes'
    test-code: |
      /* The heap is empty */
    text: |
      While the ${/score/heap/glossary/c-program-heap:/term} has a
      ${/score/heap/glossary/free-block:/term} which satisfies the request.
  - name: 'No'
    test-code: |
      HeapExhaust( &ctx->heap.heap );
    text: |
      While the ${/score/heap/glossary/c-program-heap:/term} has no
      ${/score/heap/glossary/free-block:/term} which satisfies the request.
  test-epilogue: null
  test-prologue: null
rationale: |
  The ${/score/heap/glossary/c-program-heap:/term} stores ${../if/null:/name} in
  the object referenced by the ${../if/posix-memalign:/params[0]/name} parameter
  for a request of size zero.

  Dimension Fit covers the free blocks of the
  ${/score/heap/glossary/c-program-heap:/term}, 2 states.
requirement-type: functional
skip-reasons: {}
test-action: |
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->before );
  ctx->status = posix_memalign( ctx->memptr, ctx->alignment, ctx->size );
  HeapTakeSnapshot( &ctx->heap.heap, &ctx->after );
