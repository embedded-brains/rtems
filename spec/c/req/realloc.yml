test-context-support: |
  #define ERRNO_SENTINEL -1

  #define OLD_SIZE 32

  #define PATTERN 0x5a
test-description: null
test-header: null
test-includes:
- errno.h
- stdlib.h
- string.h
test-local-includes:
- tx-heap.h
test-prepare: |
  HeapReset( &ctx->heap );
test-setup:
  brief: null
  code: |
    HeapInstall( &ctx->heap );
  description: null
test-stop: null
test-support: |
  static bool HasPattern( const void *ptr, size_t size )
  {
    const unsigned char *bytes;
    size_t               i;

    bytes = ptr;

    for ( i = 0; i < size; ++i ) {
      if ( bytes[ i ] != PATTERN ) {
        return false;
      }
    }

    return true;
  }
test-target: testsuites/validation/tc-mem-realloc.c
test-teardown:
  brief: null
  code: |
    HeapRestore( &ctx->heap );
  description: null
