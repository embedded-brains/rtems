test-actions:
- action-brief: |
    The test action is carried out by configuring more descriptors of the processor
    blocks than the C Program Heap can store.
  action-code: |
    /* Nothing to do */
  checks:
  - brief: |
      Check that the expected fatal source is present.
    code: |
      T_step_eq_int( ${.:/step}, ctx->source, INTERNAL_ERROR_CORE );
    links:
    - role: validation
      uid: ../req/fatal-malloc-cpu-descriptors
  - brief: |
      Check that the expected fatal code is present.
    code: |
      T_step_eq_ulong( ${.:/step}, ctx->code, INTERNAL_ERROR_NO_MEMORY_FOR_HEAP );
    links:
    - role: validation
      uid: ../req/fatal-malloc-cpu-descriptors
  - brief: |
      Check that the C Program Heap has no processor blocks.
    code: |
      T_step_null( ${.:/step}, RTEMS_Malloc_Heap->processors );
    links:
    - role: validation
      uid: ../req/fatal-malloc-cpu-descriptors
  links: []
