description: |
  In case this configuration option is defined, then unlimited objects are used
  by default.
enabled-by: true
index-entries: []
interface-type: appl-config-option
links:
- role: interface-placement
  uid: domain
- role: interface-ingroup
  uid: group-general
- role: constraint
  uid: ../constraint/option-not-pre-qualified
name: CONFIGURE_UNLIMITED_OBJECTS
notes: |
  If an object class uses unlimited objects, then the RTEMS Workspace allocates
  from the C Program Heap if its storage area is exhausted.

  This option does not override an explicit configuration for a particular object
  class by the user.

  See also ${unlimited-allocation-size:/name}.
type: interface
