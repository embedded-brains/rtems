default-value: 0
description: |
  The value of this configuration option defines the count of descriptors of the
  processor blocks of the C Program Heap for each configured processor.
enabled-by: true
index-entries: []
interface-type: appl-config-option
links:
- role: interface-placement
  uid: domain
- role: interface-ingroup
  uid: group-general
- role: constraint
  uid: ../constraint/malloc-cpu-descriptors
name: CONFIGURE_MALLOC_CPU_DESCRIPTORS
notes: |
  A processor block is a block of the C Program Heap which a processor keeps for
  the allocations on this processor. The allocations and the frees of blocks up
  to ${malloc-cpu-max-size:/name} use the processor blocks of the current
  processor first. A value of zero disables the processor blocks.

  The C Program Heap allocates the descriptors of the processor blocks during
  system initialization.

  A free block in the bins of one processor is not available to the allocations
  on other processors. An allocation which fails in the C Program Heap takes no
  block from the bins. A block which another processor frees stays in the kept
  list of its owner until the owner misses a bin. Each processor therefore holds
  up to half the value of this option times ${malloc-cpu-max-size:/name} bytes.

  The owner of a block detects a double free of the block on another processor
  only when it takes the block from its bin or from its kept list. The system
  then terminates with the fatal source
  ${/score/interr/if/source-invalid-heap-free:/name} in the context of an
  unrelated allocation.

  This configuration option is only evaluated in SMP configurations of RTEMS. In
  all other configurations, it has no effect.
type: interface
