default: |
  If this configuration option is undefined, then the RTEMS Workspace allocates
  from the C Program Heap only if an object class uses
  ${/ref/rtems/c-user/config-unlimited-objects:/name}.
description: |
  In case this configuration option is defined, then the RTEMS Workspace
  allocates from the C Program Heap if its storage area is exhausted.
enabled-by: true
index-entries:
- unified work areas
- separate work areas
- RTEMS Workspace
- C Program Heap
interface-type: appl-config-option
links:
- role: interface-placement
  uid: domain
- role: interface-ingroup
  uid: group-general
- role: constraint
  uid: ../constraint/option-not-pre-qualified
- role: reference
  uid: /ref/rtems/c-user/config-unlimited-objects
name: CONFIGURE_UNIFIED_WORK_AREAS
notes: |
  The application configuration defines the storage area of the RTEMS Workspace
  as a statically allocated array. The size of the array covers the configured
  objects and task stacks. Objects which an unlimited object class allocates
  beyond its initial allocation come from the C Program Heap.
type: interface
