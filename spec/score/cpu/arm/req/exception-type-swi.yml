  uid: exception-init-swi
- location: B1.8.1
  role: reference
  uid: /ref/arch/arm/ddi0406c-d
rationale: |
  The index of a vector is its offset in the exception vector table divided by
  four. The index of the software interrupt vector is two, which is the value of
  ARM_EXCEPTION_SWI.
references: []
requirement-type: functional
text: |
  When a software interrupt exception occurs, the default exception handler shall
  set the vector member of the exception frame to the index of the software
  interrupt vector in the exception vector table.
type: requirement
