  uid: exception-init-fiq
- location: B1.8.1
  role: reference
  uid: /ref/arch/arm/ddi0406c-d
rationale: |
  The index of a vector is its offset in the exception vector table divided by
  four. The index of the FIQ vector is seven, which is the value of
  ARM_EXCEPTION_FIQ.
references: []
requirement-type: functional
text: |
  When an FIQ exception occurs, the default exception handler shall set the
  vector member of the exception frame to the index of the FIQ vector in the
  exception vector table.
type: requirement
