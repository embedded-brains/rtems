links:
- role: requirement-refinement
  uid: exception-init-undefined-instruction
- location: B1.8.1
  role: reference
  uid: /ref/arch/arm/ddi0406c-d
rationale: |
  The index of a vector is its offset in the exception vector table divided by
  four. The index of the undefined instruction vector is one, which is the value
  of ARM_EXCEPTION_UNDEF.
references: []
requirement-type: functional
text: |
  When an undefined instruction exception occurs, the default exception handler
  shall set the vector member of the exception frame to the index of the
  undefined instruction vector in the exception vector table.
type: requirement
