links:
- role: requirement-refinement
  uid: exception-init-prefetch-abort
- location: B1.8.1
  role: reference
  uid: /ref/arch/arm/ddi0406c-d
rationale: |
  The index of a vector is its offset in the exception vector table divided by
  four. The index of the prefetch abort vector is three, which is the value of
  ARM_EXCEPTION_PREF_ABORT.
references: []
requirement-type: functional
text: |
  When a prefetch abort exception occurs, the default exception handler shall set
  the vector member of the exception frame to the index of the prefetch abort
  vector in the exception vector table.
type: requirement
