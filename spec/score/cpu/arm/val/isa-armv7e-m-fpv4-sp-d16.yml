test-support: |
  #if defined(__ARM_FEATURE_DSP)
  #define ARCH_DSP __ARM_FEATURE_DSP
  #else
  #define ARCH_DSP 0
  #endif

  #if defined(__ARM_FP)
  #define ARCH_FP __ARM_FP
  #else
  #define ARCH_FP 0x0
  #endif

  #if defined(__ARM_NEON)
  #define ARCH_NEON __ARM_NEON
  #else
  #define ARCH_NEON 0
