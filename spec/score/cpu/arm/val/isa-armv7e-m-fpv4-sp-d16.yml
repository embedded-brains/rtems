test-actions:
- action-brief: |
    Read the predefined macros of the compiler which describe the target
    architecture.
  action-code: |
    /* Nothing to do */
  checks:
  - brief: |
      Check that the compiler generates code for Armv7E-M with the floating-point
      extension FPv4-SP-D16.
    code: |
      T_step_eq_int( ${.:/step}, __ARM_ARCH, 7 );
      T_step_eq_int( ${.:/step}, __ARM_ARCH_PROFILE, 'M' );
      T_step_eq_int( ${.:/step}, ARCH_DSP, 1 );
      T_step_eq_int( ${.:/step}, ARCH_FP, 0x4 );
      T_step_eq_int( ${.:/step}, ARCH_NEON, 0 );
    links:
    - role: validation
      uid: ../req/isa-armv7e-m-fpv4-sp-d16
  links: []
