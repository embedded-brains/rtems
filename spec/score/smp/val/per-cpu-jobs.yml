enabled-by: RTEMS_SMP
links: []
test-actions:
- action-brief: |
    Issue two jobs on the current processor with interrupts disabled.  Wait for
    completion of the second job.
  action-code: |
    rtems_interrupt_level level;
    Per_CPU_Control      *cpu;

    rtems_interrupt_local_disable(level);
    cpu = _Per_CPU_Get();
    _Per_CPU_Add_job( cpu, &job_0 );
    _Per_CPU_Submit_job( cpu, &job_1 );
    rtems_interrupt_local_enable(level);

    _Per_CPU_Wait_for_job( cpu, &job_1 );
  checks:
  - brief: |
      Check that the first job was processed firstly.
    code: |
      T_step_eq_int( ${.:/step}, counter_0, 1 );
    links:
    - role: validation
      uid: ../req/per-cpu-jobs-order
  - brief: |
      Check that the second job was processed secondly.
    code: |
      T_step_eq_int( ${.:/step}, counter_1, 2 );
    links:
    - role: validation
      uid: ../req/per-cpu-jobs-order
  links: []
- action-brief: |
    Actions were performed by
    __wrap__SMP_Start_multitasking_on_secondary_processor().
  action-code: |
    /* Nothing to do */
  checks:
  - brief: |
      Check that the unicast action was performed while the worker processor is
      in the initial state.  Check that the counter was incremented exactly
      once by the boot processor while it is waiting for the other online
      processors to get ready for start multiprocessing.
    code: |
      T_step_eq_int( ${.:/step}, worker_state, PER_CPU_STATE_INITIAL );
      T_step_eq_uint(
        ${.:/step},
        _Atomic_Fetch_add_uint(
          &start_multitasking_counter,
          0,
          ATOMIC_ORDER_RELAXED
        ),
        1
      );
    links:
    - role: validation
      uid: ../req/per-cpu-jobs-request-start-multitasking
  links: []
test-brief: |
  Tests the processing order of per-processor jobs.
test-context: []
test-context-support: null
test-description: null
test-header: null
test-includes:
- rtems.h
- rtems/score/atomic.h
- rtems/score/percpu.h
- rtems/score/smpimpl.h
test-local-includes: []
test-setup: null
test-stop: null
test-support: |
  static Atomic_Uint job_counter;

  static void Increment( void *arg )
  {
    unsigned int *value;

    value = (unsigned int *) arg;
    *value =
      _Atomic_Fetch_add_uint( &job_counter, 1, ATOMIC_ORDER_RELAXED ) + 1;
  }

  static unsigned int counter_0;

  static const Per_CPU_Job_context job_context_0 = {
    .handler = Increment,
    .arg = &counter_0
  };

  Per_CPU_Job job_0 = {
    .context = &job_context_0
  };

  static unsigned int counter_1;

  static const Per_CPU_Job_context job_context_1 = {
    .handler = Increment,
    .arg = &counter_1
  };

  Per_CPU_Job job_1 = {
    .context = &job_context_1
  };

  static Atomic_Uint start_multitasking_counter;

  static Atomic_Uint worker_selection;

  static Per_CPU_State worker_state;

  static uint32_t GetBootProcessorIndex( void )
  {
    uint32_t cpu_max;

    cpu_max = _SMP_Processor_configured_maximum;

    while ( true ) {
      uint32_t cpu_index;

      for ( cpu_index = 0 ; cpu_index < cpu_max; ++cpu_index ) {
        Per_CPU_Control *cpu;

        cpu = _Per_CPU_Get_by_index( cpu_index );
        RTEMS_COMPILER_MEMORY_BARRIER();

        if ( cpu->boot ) {
          return cpu_index;
        }
      }
    }
  }

  static void IncrementCounter( void *arg )
  {
    _Atomic_Fetch_add_uint( (Atomic_Uint *) arg, 1, ATOMIC_ORDER_RELAXED );
  }

  void __real__SMP_Start_multitasking_on_secondary_processor(
    Per_CPU_Control *cpu_self
  );

  void __wrap__SMP_Start_multitasking_on_secondary_processor(
    Per_CPU_Control *cpu_self
  );

  void __wrap__SMP_Start_multitasking_on_secondary_processor(
    Per_CPU_Control *cpu_self
  )
  {
    unsigned int worker;

    worker = _Atomic_Fetch_add_uint(
      &worker_selection,
      1,
      ATOMIC_ORDER_RELAXED
    );

    if ( worker == 0 ) {
      uint32_t cpu_boot;

      worker_state = cpu_self->state;
      cpu_boot = GetBootProcessorIndex();
      _SMP_Unicast_action(
        cpu_boot,
        IncrementCounter,
        &start_multitasking_counter
      );
    }
    __real__SMP_Start_multitasking_on_secondary_processor( cpu_self );
  }
test-target: testsuites/validation/tc-score-smp-per-cpu-jobs.c
