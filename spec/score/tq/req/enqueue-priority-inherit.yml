transition-map:
- enabled-by: true
  post-conditions:
    OwnerPriority: &id001
    - if:
        pre-conditions:
          PriorityForOwner: Vital
      then: Raise
    - else: Nop
    OwnerScheduler: &id002
    - if:
        pre-conditions:
          SchedulerForOwner: Vital
      then: NewHelper
    - else: Nop
    OwnerOwnerPriority: &id003
    - if:
        pre-conditions:
          OwnerState: PriorityInherit
          PriorityForOwner: Vital
      then: Raise
    - else: Nop
    OwnerOwnerScheduler: &id004
    - if:
        pre-conditions:
          OwnerState: PriorityInherit
          SchedulerForOwner: Vital
      then: NewHelper
    - else: Nop
  pre-conditions:
    EligibleScheduler:
    - Home
    PriorityForOwner: all
    SchedulerForOwner:
    - Dispensable
    OwnerState: all
- enabled-by: true
  post-conditions: NoOtherScheduler
  pre-conditions: default
- enabled-by: true
  post-conditions: OnlyHomeScheduler
  pre-conditions:
    EligibleScheduler:
    - Home
    PriorityForOwner:
    - Vital
    SchedulerForOwner:
    - Vital
    OwnerState: all
- enabled-by: RTEMS_SMP
  post-conditions:
    OwnerPriority: *id001
    OwnerScheduler: *id002
    OwnerOwnerPriority: *id003
    OwnerOwnerScheduler: *id004
  pre-conditions:
    EligibleScheduler:
    - Home
    PriorityForOwner:
    - Dispensable
    SchedulerForOwner:
    - Vital
    OwnerState: all
- enabled-by: RTEMS_SMP
  post-conditions:
    OwnerPriority: *id001
    OwnerScheduler: *id002
    OwnerOwnerPriority: *id003
    OwnerOwnerScheduler: *id004
  pre-conditions:
    EligibleScheduler:
    - Helping
    PriorityForOwner: all
    SchedulerForOwner: all
    OwnerState: all
