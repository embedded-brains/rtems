enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: OwnerPriority
  states:
  - name: Raise
    test-code: |
      CheckPriorityRaise( ctx, ctx->owner_before, ctx->owner_after );
    text: |
      Each priority of the enqueueing thread which is higher than the highest
      priority of the owner of the thread queue shall be made the highest priority of
      the owner.
  - name: Nop
    test-code: |
      CheckPriorityNop( ctx->owner_before, ctx->owner_after );
    text: |
      The priorities of the owner of the thread queue shall not change.
  test-epilogue: null
  test-prologue: null
- name: OwnerScheduler
  states:
  - name: NewHelper
    test-code: |
      CheckSchedulerNewHelper( ctx, ctx->owner_before, ctx->owner_after );
    text: |
      Each ${/glossary/scheduler-eligible:/term} of the enqueueing thread which is
      not an ${/glossary/scheduler-eligible:/term} of the owner of the thread queue
      shall be made a ${/glossary/scheduler-helping:/term} of the owner with the
      priority of the enqueueing thread.
  - name: Nop
    test-code: |
      CheckSchedulerNop( ctx->owner_before, ctx->owner_after );
    text: |
      The set of ${/glossary/scheduler-eligible:/plural} of the owner of the thread
      queue shall not change.
  test-epilogue: null
  test-prologue: null
- name: OwnerOwnerPriority
  states:
  - name: Raise
    test-code: |
      CheckPriorityRaise( ctx, ctx->owner_owner_before, ctx->owner_owner_after );
    text: |
      Each priority of the enqueueing thread which is higher than the highest
      priority of the owner of the thread queue on which the owner of the thread
      queue is enqueued shall be made the highest priority of the owner.
  - name: Nop
    test-code: |
      CheckPriorityNop( ctx->owner_owner_before, ctx->owner_owner_after );
    text: |
      The priorities of the owner of the thread queue on which the owner of the
      thread queue is enqueued shall not change.
  test-epilogue: null
  test-prologue: null
- name: OwnerOwnerScheduler
  states:
  - name: NewHelper
    test-code: |
      CheckSchedulerNewHelper(
        ctx,
        ctx->owner_owner_before,
        ctx->owner_owner_after
      );
    text: |
      Each ${/glossary/scheduler-eligible:/term} of the enqueueing thread which is
      not an ${/glossary/scheduler-eligible:/term} of the owner of the thread queue
      on which the owner of the thread queue is enqueued shall be made a
      ${/glossary/scheduler-helping:/term} of the owner with the priority of the
      enqueueing thread.
  - name: Nop
    test-code: |
      CheckSchedulerNop( ctx->owner_owner_before, ctx->owner_owner_after );
    text: |
      The set of ${/glossary/scheduler-eligible:/plural} of the owner of the thread
      queue on which the owner of the thread queue is enqueued shall not change.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: EligibleScheduler
  states:
  - name: Home
    test-code: |
      ctx->helping = false;
    text: |
      While the enqueueing thread has no ${/glossary/scheduler-helping:/term}.
  - name: Helping
    test-code: |
      ctx->helping = true;

      if ( rtems_scheduler_get_processor_maximum() < 2 ) {
        ${.:skip}
      }
    text: |
      While the enqueueing thread has at least one
      ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: PriorityForOwner
  states:
  - name: Vital
    test-code: |
      ctx->vital_priority = true;
    text: |
      While at least one priority of the enqueueing thread is higher than the highest
      priority of the owner of the thread queue with respect to the same scheduler.
  - name: Dispensable
    test-code: |
      ctx->vital_priority = false;
    text: |
      While each priority of the enqueueing thread is lower than or equal to the
      highest priority of the owner of the thread queue with respect to the same
      scheduler.
  test-epilogue: null
  test-prologue: null
- name: SchedulerForOwner
  states:
  - name: Vital
    test-code: |
      ctx->vital_scheduler = true;

      if ( rtems_scheduler_get_processor_maximum() < 2 ) {
        ${.:skip}
      }
    text: |
      While at least one ${/glossary/scheduler-eligible:/term} of the enqueueing
      thread is not an ${/glossary/scheduler-eligible:/term} of the owner of the
      thread queue.
  - name: Dispensable
    test-code: |
      ctx->vital_scheduler = false;
    text: |
      While all ${/glossary/scheduler-eligible:/plural} of the enqueueing thread are
      an ${/glossary/scheduler-eligible:/term} of the owner of the thread queue.
  test-epilogue: null
  test-prologue: null
- name: OwnerState
  states:
  - name: NotEnqueued
    test-code: |
      ctx->owner_obtain = 0;
      ctx->owner_release = 0;
    text: |
      While the owner of the thread queue is not enqueued on a thread queue.
  - name: FIFO
    test-code: |
      ctx->owner_obtain = TQ_EVENT_MUTEX_FIFO_OBTAIN;
      ctx->owner_release = TQ_EVENT_MUTEX_FIFO_RELEASE;
    text: |
      While the owner of the thread queue is enqueued on a thread queue in FIFO
      order.
  - name: Priority
    test-code: |
      ctx->owner_obtain = TQ_EVENT_MUTEX_NO_PROTOCOL_OBTAIN;
      ctx->owner_release = TQ_EVENT_MUTEX_NO_PROTOCOL_RELEASE;
    text: |
      While the owner of the thread queue is enqueued on a thread queue in priority
      order.
  - name: PriorityInherit
    test-code: |
      ctx->owner_obtain = TQ_EVENT_MUTEX_C_OBTAIN;
      ctx->owner_release = TQ_EVENT_MUTEX_C_RELEASE;
    text: |
      While the owner of the thread queue is enqueued on a thread queue in priority
      order with ${/glossary/priorityinheritance:/term}.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension EligibleScheduler covers whether the enqueueing thread has a helping
  scheduler, 2 states.

  Dimension PriorityForOwner covers whether the enqueueing thread has a priority
  higher than the owner priority for the same scheduler, 2 states.

  Dimension SchedulerForOwner covers whether an eligible scheduler of the
  enqueueing thread is not an eligible scheduler of the owner, 2 states.

  Dimension OwnerState covers how the owner waits on another thread queue, 4
  states.

  The position of the enqueueing thread in the thread queue is specified by
  ${enqueue-priority:/spec}.
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
  OnlyHomeScheduler: |
    The home scheduler is the only eligible scheduler of the enqueueing thread. It
    cannot be an eligible scheduler of the owner and at the same time not be an
    eligible scheduler of the owner.
test-action: |
  Arrange( ctx );
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_MUTEX_A_OBTAIN );
  TQSetScheduler(
    ctx->tq_ctx,
    TQ_HELPER_A,
    ctx->owner_scheduler,
    ctx->owner_priority
  );
  TQSendAndWaitForExecutionStop(
    ctx->tq_ctx,
    TQ_HELPER_A,
    TQ_EVENT_MUTEX_B_OBTAIN | TQ_EVENT_ENQUEUE_PREPARE
  );

  if ( ctx->owner_helper_priority != PRIO_INVALID ) {
    TQSetScheduler(
      ctx->tq_ctx,
      TQ_HELPER_B,
      SCHEDULER_B_ID,
      ctx->owner_helper_priority
    );
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_HELPER_B,
      TQ_EVENT_MUTEX_B_OBTAIN | TQ_EVENT_MUTEX_B_RELEASE
    );
  }

  if ( ctx->helping ) {
    TQSetScheduler( ctx->tq_ctx, TQ_BLOCKER_D, SCHEDULER_B_ID, PRIO_NORMAL );
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_BLOCKER_D,
      TQ_EVENT_MUTEX_A_OBTAIN | TQ_EVENT_MUTEX_A_RELEASE
    );
  }

  if ( ctx->owner_obtain != 0 ) {
    TQSetScheduler(
      ctx->tq_ctx,
      TQ_HELPER_C,
      ctx->owner_scheduler,
      ctx->owner_priority
    );
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_HELPER_C,
      ctx->owner_obtain
    );
    TQClearDone( ctx->tq_ctx, TQ_HELPER_A );
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_HELPER_A,
      ctx->owner_obtain | ctx->owner_release
    );
  }

  GetPriorities( ctx, TQ_BLOCKER_A, ctx->enqueue_priority );
  GetPriorities( ctx, TQ_HELPER_A, ctx->owner_before );
  GetPriorities( ctx, TQ_HELPER_C, ctx->owner_owner_before );
  TQSendAndWaitForExecutionStop(
    ctx->tq_ctx,
    TQ_BLOCKER_A,
    TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER | TQ_EVENT_RUNNER_SYNC
  );
  GetPriorities( ctx, TQ_HELPER_A, ctx->owner_after );
  GetPriorities( ctx, TQ_HELPER_C, ctx->owner_owner_after );

  if ( ctx->owner_obtain != 0 ) {
    TQSend( ctx->tq_ctx, TQ_HELPER_C, ctx->owner_release );
    TQWaitForDone( ctx->tq_ctx, TQ_HELPER_A );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_HELPER_A );
  }

  TQSend( ctx->tq_ctx, TQ_HELPER_A, TQ_EVENT_ENQUEUE_DONE );
  TQSynchronizeRunner();

  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_MUTEX_A_RELEASE );
  TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
  TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );

  TQSend( ctx->tq_ctx, TQ_HELPER_A, TQ_EVENT_MUTEX_B_RELEASE );
  TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_B );
  TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_B );
