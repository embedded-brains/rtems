enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: Dequeue
  states:
  - name: First
    test-code: |
      CheckDequeue( ctx );
    text: |
      The surrender operation shall dequeue the first thread of the first priority
      queue of the thread queue.
  test-epilogue: null
  test-prologue: null
- name: Extract
  states:
  - name: All
    test-code: |
      CheckExtract( ctx );
    text: |
      The surrender operation shall remove the dequeued thread from each priority
      queue of the thread queue.
  test-epilogue: null
  test-prologue: null
- name: EmptyQueue
  states:
  - name: Removed
    test-code: |
      CheckEmptyQueues( ctx );
    text: |
      The surrender operation shall remove each priority queue which contains no
      thread after the removal of the dequeued thread from the thread queue.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: Rotated
    test-code: |
      CheckOrder( ctx, true );
    text: |
      The priority queue which was the first priority queue of the thread queue
      before the surrender shall be positioned after each other priority queue of the
      thread queue.
  - name: Kept
    test-code: |
      CheckOrder( ctx, false );
    text: |
      The surrender operation shall not change the order of the priority queues of
      the thread queue.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: FirstQueueThreads
  states:
  - name: One
    test-code: |
      ctx->first_more = false;

      if ( IsSticky( ctx ) && !HasProcessors( 4 ) ) {
        ${.:skip}
      }
    text: |
      While the first priority queue of the thread queue contains exactly one thread.
  - name: More
    test-code: |
      ctx->first_more = true;

      if ( IsSticky( ctx ) && !HasProcessors( 4 ) ) {
        ${.:skip}
      }
    text: |
      While the first priority queue of the thread queue contains at least two
      threads.
  test-epilogue: null
  test-prologue: null
- name: FirstThreadQueues
  states:
  - name: Only
    test-code: |
      ctx->helping = false;
      ctx->alone = false;
    text: |
      While the first thread of the first priority queue of the thread queue is
      contained in no other priority queue of the thread queue.
  - name: Shared
    test-code: |
      ctx->helping = true;
      ctx->alone = false;

      if ( !HasProcessors( 2 ) ) {
        ${.:skip}
      }
    text: |
      While the first thread of the first priority queue of the thread queue is
      contained in another priority queue of the thread queue, while this priority
      queue contains at least one other thread.
  - name: Alone
    test-code: |
      ctx->helping = true;
      ctx->alone = true;

      if ( !HasProcessors( 2 ) ) {
        ${.:skip}
      }
    text: |
      While the first thread of the first priority queue of the thread queue is
      contained in another priority queue of the thread queue, while this priority
      queue contains no other thread.
  test-epilogue: null
  test-prologue: null
- name: QueueCount
  states:
  - name: One
    test-code: |
      ctx->queue_count = 1;
    text: |
      While the thread queue has exactly one priority queue.
  - name: Two
    test-code: |
      ctx->queue_count = 2;

      if ( !HasProcessors( 2 ) || ( ctx->home_only && !ctx->alone ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has exactly two priority queues.
  - name: More
    test-code: |
      ctx->queue_count = 3;

      if ( !HasThirdScheduler( ctx ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has at least three priority queues.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension FirstQueueThreads covers the count of threads in the first priority
  queue, 2 states.

  Dimension FirstThreadQueues covers the other priority queues which contain the
  first thread of the first priority queue, 3 states.

  Dimension QueueCount covers the count of priority queues of the thread queue, 3
  states.

  The sticky variant runs on at least four processors. A thread which waits in a
  sticky enqueue occupies a processor of its home scheduler. The test needs these
  processors to set up the states. A system with two processors reaches the same
  states without them. The test skips the sticky variant on a system with less
  than four processors.
requirement-type: functional
skip-reasons:
  NoOtherQueue: |
    The first thread of the first priority queue cannot be contained in another
    priority queue, if the thread queue has only one priority queue.
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  rtems_event_set events;
  size_t          i;

  SetSelfPriority( PRIO_VERY_LOW );
  ctx->tq_ctx->how_many = 1;

  if ( IsSticky( ctx ) ) {
    TQEnqueuePrepare( ctx->tq_ctx );
  } else {
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  }

  if ( ctx->helping ) {
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_BLOCKER_C,
      TQ_EVENT_MUTEX_A_OBTAIN
    );
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_BLOCKER_E,
      TQ_EVENT_MUTEX_A_OBTAIN | TQ_EVENT_MUTEX_A_RELEASE
    );
  }

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    if ( HasRole( ctx, (Role) i ) ) {
      events = TQ_EVENT_ENQUEUE;

      if ( i != ROLE_FIRST ) {
        events |= TQ_EVENT_SURRENDER;
      }

      TQClearDone( ctx->tq_ctx, role_worker[ i ] );
      Enqueue( ctx, role_worker[ i ], events );
      ++ctx->tq_ctx->how_many;
    }
  }

  ctx->queue = GetFirst( ctx )->Wait.queue;
  T_assert_not_null( ctx->queue );
  TQTakeSnapshot( &ctx->before, ctx->queue );

  if ( IsSticky( ctx ) ) {
    TQEnqueueDone( ctx->tq_ctx );
  } else {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  }

  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );
  ctx->first_done = true;
  TQTakeSnapshot( &ctx->after, ctx->queue );

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    ctx->waits[ i ] = ctx->tq_ctx->worker_tcb[ role_worker[ i ] ]
                        ->Wait.queue == ctx->queue;
  }

  events = TQ_EVENT_SURRENDER;

  if ( ctx->helping ) {
    events |= TQ_EVENT_MUTEX_A_RELEASE;
  }

  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  TQSend( ctx->tq_ctx, TQ_BLOCKER_C, events );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    if ( HasRole( ctx, (Role) i ) ) {
      TQWaitForDone( ctx->tq_ctx, role_worker[ i ] );
      TQWaitForExecutionStop( ctx->tq_ctx, role_worker[ i ] );
    }
  }

  if ( ctx->helping ) {
    TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
    TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );
  }

  SetSelfPriority( PRIO_NORMAL );
