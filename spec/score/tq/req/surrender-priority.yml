    QueueOrder: &id001
    - if:
        pre-conditions:
          FirstQueueThreads: More
      then: Rotated
    - else: Kept
  pre-conditions:
    FirstQueueThreads: all
    FirstThreadQueues:
    - Only
    QueueCount:
    - One
- enabled-by: true
  post-conditions: NoOtherScheduler
  pre-conditions: default
