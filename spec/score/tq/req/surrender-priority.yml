  code: |
    TQReset( ctx->tq_ctx );
    TQSetScheduler( ctx->tq_ctx, TQ_WORKER_F, SCHEDULER_A_ID, PRIO_LOW );
  description: null
text: |
  When the thread queue is surrendered.
