    - Shared
    - Alone
    QueueCount:
    - One
- enabled-by: RTEMS_SMP
  post-conditions:
    Dequeue: First
    Extract: All
    EmptyQueue: Removed
    QueueOrder: *id001
  pre-conditions:
    FirstQueueThreads: all
    FirstThreadQueues: all
    QueueCount:
    - Two
    - More
