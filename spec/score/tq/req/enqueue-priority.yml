rationale: |
  Dimension EligibleScheduler covers the count of helping schedulers of the
  enqueueing thread, 4 states. The map skips the state More, which
  ${enqueue-priority-further-helping:/spec} specifies. On a system with two or
  three processors, scheduler B is the first helping scheduler, so the state One
  runs there as well.

  Dimension QueueHome covers the priority queue associated with the home
  scheduler, 4 states. The states are the absence of the priority queue and the
  three orders of its highest priority against the priority of the enqueueing
  thread.

  Dimension QueueFirstHelping covers the priority queue associated with the first
  helping scheduler in the same way, 4 states.

  Dimension QueueSecondHelping covers the priority queue associated with the
  second helping scheduler in the same way, 4 states.

  The states High and Low of QueueHome have two representatives. So do the states
  Equal and Low of QueueFirstHelping and QueueSecondHelping. In the
  representative Alone, the priority queue contains one thread. In the
  representative Lower, it also contains a thread with a priority lower than the
  eligible priority of the enqueueing thread. One worker provides this thread, so
  a run which needs it in two priority queues is skipped. The other states have
  one representative. The sticky enqueue reaches them, and a second waiting
  thread would need a second processor of the scheduler.

  Dimension QueueIneligible covers the count of priority queues associated with
  ineligible schedulers, 3 states. The map skips the state More, which
  ${enqueue-priority-ineligible:/spec} specifies.

  Dimension QueueOrder covers the creation orders of the priority queues of the
  four roles, 24 states. The map skips a variant which differs from an earlier
  variant only in the position of an absent priority queue.
requirement-type: functional
skip-reasons:
  FurtherHelping: |
    The requirement ${enqueue-priority-further-helping:/spec} specifies the enqueue
    of a thread with at least three ${/glossary/scheduler-helping:/plural}.
  MoreIneligible: |
    The requirement ${enqueue-priority-ineligible:/spec} specifies the enqueue in a
    thread queue with at least two priority queues associated with
    ${/glossary/scheduler-ineligible:/plural} of the enqueueing thread.
  NoHelpingScheduler: |
    A priority queue associated with a helping scheduler cannot exist without the
    helping scheduler.
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
  SameOrder: |
    The variant arranges the same thread queue as an earlier variant with another
    order of priority queues which the thread queue does not contain.
test-action: |
  rtems_event_set events;
  size_t          i;

  SetSelfPriority( PRIO_VERY_LOW );
  ctx->tq_ctx->how_many = 1;
  BorrowProcessor( ctx );

  if ( IsSticky( ctx ) ) {
    TQEnqueuePrepare( ctx->tq_ctx );
  } else {
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  }

  if ( ctx->helping > 0 ) {
    TQSend( ctx->tq_ctx, TQ_BLOCKER_C, TQ_EVENT_MUTEX_A_OBTAIN );

    for ( i = 0; i < ctx->helping; ++i ) {
      AddHelper( ctx, i );
    }
  }

  for ( i = 0; i <= ROLE_ORDER_COUNT; ++i ) {
    Role role;

    if ( i < ROLE_ORDER_COUNT ) {
      role = ctx->order[ i ];
    } else {
      role = ROLE_INELIGIBLE_LAST;
    }

    if ( HasQueue( ctx, role ) ) {
      TQWorkerKind worker;

      worker = role_worker[ role ];
      TQSetPriority( ctx->tq_ctx, worker, ctx->queue_priority[ role ] );
      TQClearDone( ctx->tq_ctx, worker );
      Enqueue( ctx, worker, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
      ++ctx->tq_ctx->how_many;
    }
  }

  EnqueueLower( ctx );
  events = TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER;

  if ( ctx->helping > 0 ) {
    events |= TQ_EVENT_MUTEX_A_RELEASE;
  }

  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  Enqueue( ctx, TQ_BLOCKER_C, events );
  TakeSnapshot( ctx );

  if ( IsSticky( ctx ) ) {
    TQEnqueueDone( ctx->tq_ctx );
  } else {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  }

  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    if ( HasQueue( ctx, (Role) i ) ) {
      TQWaitForDone( ctx->tq_ctx, role_worker[ i ] );
      TQWaitForExecutionStop( ctx->tq_ctx, role_worker[ i ] );
    }
  }

  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_C );
  ReturnLower( ctx );

  if ( ctx->helping > 0 ) {
    TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
    TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );
  }

  ReturnProcessor( ctx );

  SetSelfPriority( PRIO_NORMAL );
