enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: PositionHome
  states:
  - name: Initial
    test-code: |
      CheckPosition( ctx, ROLE_HOME, PLACE_INITIAL );
    text: |
      A priority queue which contains exactly the enqueueing thread and which is
      associated with the ${/glossary/scheduler-home:/term} of the enqueueing thread
      shall be positioned after each priority queue which the thread queue contained
      before the enqueue.
  - name: First
    test-code: |
      CheckPosition( ctx, ROLE_HOME, PLACE_FIRST );
    text: |
      The enqueueing thread shall be enqueued as the first thread of the priority
      queue associated with the ${/glossary/scheduler-home:/term} of the enqueueing
      thread.
  - name: Second
    test-code: |
      CheckPosition( ctx, ROLE_HOME, PLACE_SECOND );
    text: |
      The enqueueing thread shall be enqueued in the priority queue associated with
      the ${/glossary/scheduler-home:/term} of the enqueueing thread after each
      thread of the priority queue with a priority higher than or equal to the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this ${/glossary/scheduler-home:/term} and before each thread of the priority
      queue with a lower priority.
  test-epilogue: null
  test-prologue: null
- name: PositionFirstHelping
  states:
  - name: Absent
    test-code: |
      CheckPosition( ctx, ROLE_FIRST, PLACE_NONE );
    text: |
      The enqueueing thread shall not be enqueued in a priority queue associated with
      the first ${/glossary/scheduler-helping:/term} of the enqueueing thread.
  - name: Initial
    test-code: |
      CheckPosition( ctx, ROLE_FIRST, PLACE_INITIAL );
    text: |
      A priority queue which contains exactly the enqueueing thread and which is
      associated with the first ${/glossary/scheduler-helping:/term} of the
      enqueueing thread shall be positioned after each priority queue which the
      thread queue contained before the enqueue and after the priority queue
      associated with the ${/glossary/scheduler-home:/term} of the enqueueing thread.
  - name: First
    test-code: |
      CheckPosition( ctx, ROLE_FIRST, PLACE_FIRST );
    text: |
      The enqueueing thread shall be enqueued as the first thread of the priority
      queue associated with the first ${/glossary/scheduler-helping:/term} of the
      enqueueing thread.
  - name: Second
    test-code: |
      CheckPosition( ctx, ROLE_FIRST, PLACE_SECOND );
    text: |
      The enqueueing thread shall be enqueued in the priority queue associated with
      the first ${/glossary/scheduler-helping:/term} of the enqueueing thread after
      each thread of the priority queue with a priority higher than or equal to the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this first ${/glossary/scheduler-helping:/term} and before each thread of the
      priority queue with a lower priority.
  test-epilogue: null
  test-prologue: null
- name: PositionSecondHelping
  states:
  - name: Absent
    test-code: |
      CheckPosition( ctx, ROLE_SECOND, PLACE_NONE );
    text: |
      The enqueueing thread shall not be enqueued in a priority queue associated with
      the second ${/glossary/scheduler-helping:/term} of the enqueueing thread.
  - name: Initial
    test-code: |
      CheckPosition( ctx, ROLE_SECOND, PLACE_INITIAL );
    text: |
      A priority queue which contains exactly the enqueueing thread and which is
      associated with the second ${/glossary/scheduler-helping:/term} of the
      enqueueing thread shall be positioned after each priority queue which the
      thread queue contained before the enqueue and after the priority queues
      associated with the ${/glossary/scheduler-home:/term} and the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread.
  - name: First
    test-code: |
      CheckPosition( ctx, ROLE_SECOND, PLACE_FIRST );
    text: |
      The enqueueing thread shall be enqueued as the first thread of the priority
      queue associated with the second ${/glossary/scheduler-helping:/term} of the
      enqueueing thread.
  - name: Second
    test-code: |
      CheckPosition( ctx, ROLE_SECOND, PLACE_SECOND );
    text: |
      The enqueueing thread shall be enqueued in the priority queue associated with
      the second ${/glossary/scheduler-helping:/term} of the enqueueing thread after
      each thread of the priority queue with a priority higher than or equal to the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this second ${/glossary/scheduler-helping:/term} and before each thread of the
      priority queue with a lower priority.
  test-epilogue: null
  test-prologue: null
- name: PositionOtherHelping
  states:
  - name: Absent
    test-code: |
      CheckPosition( ctx, ROLE_OTHER, PLACE_NONE );
    text: |
      The enqueueing thread shall not be enqueued in a priority queue associated with
      a ${/glossary/scheduler-helping:/term} of the enqueueing thread other than the
      first and the second ${/glossary/scheduler-helping:/term}.
  - name: Initial
    test-code: |
      CheckPosition( ctx, ROLE_OTHER, PLACE_INITIAL );
    text: |
      For each ${/glossary/scheduler-helping:/term} of the enqueueing thread other
      than the first and the second ${/glossary/scheduler-helping:/term}, a priority
      queue which contains exactly the enqueueing thread and which is associated with
      this ${/glossary/scheduler-helping:/term} shall be positioned after each
      priority queue which the thread queue contained before the enqueue, after the
      priority queues associated with the ${/glossary/scheduler-home:/term}, the
      first ${/glossary/scheduler-helping:/term}, and the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, and after the
      priority queues associated with each ${/glossary/scheduler-helping:/term} which
      became a ${/glossary/scheduler-helping:/term} of the enqueueing thread before
      this ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: Kept
    test-code: |
      CheckOrder( ctx );
    text: |
      The order of the priority queues which the thread queue contained before the
      enqueue shall not change.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: EligibleScheduler
  states:
  - name: Home
    test-code: |
      ctx->helping = 0;

      if ( IsSticky( ctx ) && !HasFourProcessors() ) {
        ${.:skip}
      }
    text: |
      While the enqueueing thread has no ${/glossary/scheduler-helping:/term}.
  - name: One
    test-code: |
      ctx->helping = 1;

      if ( !HasFourProcessors() && ( IsSticky( ctx ) || !HasTwoProcessors() ) ) {
        ${.:skip}
      }
    text: |
      While the enqueueing thread has exactly one
      ${/glossary/scheduler-helping:/term}.
  - name: Two
    test-code: |
      ctx->helping = 2;

      if ( !HasFourProcessors() || ( IsSticky( ctx ) && !HasFiveProcessors() ) ) {
        ${.:skip}
      }
    text: |
      While the enqueueing thread has exactly two
      ${/glossary/scheduler-helping:/plural}.
  - name: More
    test-code: |
      ctx->helping = 3;
    text: |
      While the enqueueing thread has at least three
      ${/glossary/scheduler-helping:/plural}, while the thread queue has no priority
      queue associated with a ${/glossary/scheduler-helping:/term} of the enqueueing
      thread other than the first and the second
      ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: QueueHome
  states:
  - name: Empty
    test-code: |
      ctx->queue_priority[ ROLE_HOME ] = PRIO_INVALID;
    text: |
      While the thread queue has no priority queue associated with the
      ${/glossary/scheduler-home:/term} of the enqueueing thread.
  - name: High
    representatives:
    - name: Alone
      test-code: |
        ctx->with_lower[ ROLE_HOME ] = false;
    - name: Lower
      test-code: |
        if ( HasLower( ctx ) ) {
          ${.:skip}
        } else {
          ctx->with_lower[ ROLE_HOME ] = true;
        }
    test-code: |
      ctx->queue_priority[ ROLE_HOME ] = PRIO_VERY_HIGH;

      if ( IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the
      ${/glossary/scheduler-home:/term} of the enqueueing thread, while the highest
      priority of the priority queue is higher than the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this ${/glossary/scheduler-home:/term}.
  - name: Equal
    test-code: |
      ctx->queue_priority[ ROLE_HOME ] = PRIO_HIGH;
    text: |
      While the thread queue has a priority queue associated with the
      ${/glossary/scheduler-home:/term} of the enqueueing thread, while the highest
      priority of the priority queue is equal to the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this ${/glossary/scheduler-home:/term}.
  - name: Low
    representatives:
    - name: Alone
      test-code: |
        ctx->with_lower[ ROLE_HOME ] = false;
    - name: Lower
      test-code: |
        if ( HasLower( ctx ) ) {
          ${.:skip}
        } else {
          ctx->with_lower[ ROLE_HOME ] = true;
        }
    test-code: |
      ctx->queue_priority[ ROLE_HOME ] = PRIO_NORMAL;

      if ( IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the
      ${/glossary/scheduler-home:/term} of the enqueueing thread, while the highest
      priority of the priority queue is lower than the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this ${/glossary/scheduler-home:/term}.
  test-epilogue: null
  test-prologue: null
- name: QueueFirstHelping
  states:
  - name: Empty
    test-code: |
      ctx->queue_priority[ ROLE_FIRST ] = PRIO_INVALID;
    text: |
      While the thread queue has no priority queue associated with the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread.
  - name: High
    test-code: |
      ctx->queue_priority[ ROLE_FIRST ] = PRIO_VERY_HIGH;

      if ( ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, while the
      highest priority of the priority queue is higher than the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this first ${/glossary/scheduler-helping:/term}.
  - name: Equal
    representatives:
    - name: Alone
      test-code: |
        ctx->with_lower[ ROLE_FIRST ] = false;
    - name: Lower
      test-code: |
        if ( HasLower( ctx ) ) {
          ${.:skip}
        } else {
          ctx->with_lower[ ROLE_FIRST ] = true;
        }
    test-code: |
      ctx->queue_priority[ ROLE_FIRST ] = PRIO_HIGH;

      if ( ctx->home_only || IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, while the
      highest priority of the priority queue is equal to the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this first ${/glossary/scheduler-helping:/term}.
  - name: Low
    representatives:
    - name: Alone
      test-code: |
        ctx->with_lower[ ROLE_FIRST ] = false;
    - name: Lower
      test-code: |
        if ( HasLower( ctx ) ) {
          ${.:skip}
        } else {
          ctx->with_lower[ ROLE_FIRST ] = true;
        }
    test-code: |
      ctx->queue_priority[ ROLE_FIRST ] = PRIO_NORMAL;

      if ( ctx->home_only || IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, while the
      highest priority of the priority queue is lower than the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this first ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: QueueSecondHelping
  states:
  - name: Empty
    test-code: |
      ctx->queue_priority[ ROLE_SECOND ] = PRIO_INVALID;
    text: |
      While the thread queue has no priority queue associated with the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread.
  - name: High
    test-code: |
      ctx->queue_priority[ ROLE_SECOND ] = PRIO_VERY_HIGH;

      if ( ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, while the
      highest priority of the priority queue is higher than the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this second ${/glossary/scheduler-helping:/term}.
  - name: Equal
    representatives:
    - name: Alone
      test-code: |
        ctx->with_lower[ ROLE_SECOND ] = false;
    - name: Lower
      test-code: |
        if ( HasLower( ctx ) ) {
          ${.:skip}
        } else {
          ctx->with_lower[ ROLE_SECOND ] = true;
        }
    test-code: |
      ctx->queue_priority[ ROLE_SECOND ] = PRIO_HIGH;

      if ( ctx->home_only || IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, while the
      highest priority of the priority queue is equal to the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this second ${/glossary/scheduler-helping:/term}.
  - name: Low
    representatives:
    - name: Alone
      test-code: |
        ctx->with_lower[ ROLE_SECOND ] = false;
    - name: Lower
      test-code: |
        if ( HasLower( ctx ) ) {
          ${.:skip}
        } else {
          ctx->with_lower[ ROLE_SECOND ] = true;
        }
    test-code: |
      ctx->queue_priority[ ROLE_SECOND ] = PRIO_NORMAL;

      if ( ctx->home_only || IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, while the
      highest priority of the priority queue is lower than the
      ${/glossary/priority-eligible:/term} of the enqueueing thread with respect to
      this second ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: QueueIneligible
  states:
  - name: None
    test-code: |
      ctx->queue_priority[ ROLE_INELIGIBLE ] = PRIO_INVALID;
      ctx->queue_priority[ ROLE_INELIGIBLE_LAST ] = PRIO_INVALID;
    text: |
      While the thread queue has no priority queue associated with an
      ${/glossary/scheduler-ineligible:/term} of the enqueueing thread.
  - name: One
    test-code: |
      ctx->queue_priority[ ROLE_INELIGIBLE ] = PRIO_LOW;
      ctx->queue_priority[ ROLE_INELIGIBLE_LAST ] = PRIO_INVALID;

      if (
        !HasFourProcessors() || ctx->home_only ||
        ( IsSticky( ctx ) && !HasEightProcessors() && HasQueue( ctx, ROLE_HOME ) )
      ) {
        ${.:skip}
      }
    text: |
      While the thread queue has exactly one priority queue associated with an
      ${/glossary/scheduler-ineligible:/term} of the enqueueing thread.
  - name: More
    test-code: |
      ctx->queue_priority[ ROLE_INELIGIBLE ] = PRIO_LOW;
      ctx->queue_priority[ ROLE_INELIGIBLE_LAST ] = PRIO_LOW;
    text: |
      While the thread queue has at least two priority queues associated with
      ${/glossary/scheduler-ineligible:/plural} of the enqueueing thread, while each
      of these priority queues except one is positioned after each other priority
      queue of the thread queue.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: HomeFirstSecondIneligible
    test-code: |
      SetOrder( ctx, ROLE_HOME, ROLE_FIRST, ROLE_SECOND, ROLE_INELIGIBLE );
    text: |
      While the priority queues of the thread queue associated with the
      ${/glossary/scheduler-home:/term}, the first
      ${/glossary/scheduler-helping:/term}, the second
      ${/glossary/scheduler-helping:/term}, and an
      ${/glossary/scheduler-ineligible:/term} of the enqueueing thread are positioned
      in this order, where a priority queue which the thread queue does not contain
      is left out.
  - name: HomeFirstIneligibleSecond
    test-code: |
      SetOrder( ctx, ROLE_HOME, ROLE_FIRST, ROLE_INELIGIBLE, ROLE_SECOND );
    text: |
      While the priority queues of the thread queue associated with the
      ${/glossary/scheduler-home:/term}, the first
      ${/glossary/scheduler-helping:/term}, an
      ${/glossary/scheduler-ineligible:/term}, and the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: HomeSecondFirstIneligible
    test-code: |
      SetOrder( ctx, ROLE_HOME, ROLE_SECOND, ROLE_FIRST, ROLE_INELIGIBLE );
    text: |
      While the priority queues of the thread queue associated with the
      ${/glossary/scheduler-home:/term}, the second
      ${/glossary/scheduler-helping:/term}, the first
      ${/glossary/scheduler-helping:/term}, and an
      ${/glossary/scheduler-ineligible:/term} of the enqueueing thread are positioned
      in this order, where a priority queue which the thread queue does not contain
      is left out.
  - name: HomeSecondIneligibleFirst
    test-code: |
      SetOrder( ctx, ROLE_HOME, ROLE_SECOND, ROLE_INELIGIBLE, ROLE_FIRST );
    text: |
      While the priority queues of the thread queue associated with the
      ${/glossary/scheduler-home:/term}, the second
      ${/glossary/scheduler-helping:/term}, an
      ${/glossary/scheduler-ineligible:/term}, and the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: HomeIneligibleFirstSecond
    test-code: |
      SetOrder( ctx, ROLE_HOME, ROLE_INELIGIBLE, ROLE_FIRST, ROLE_SECOND );
    text: |
      While the priority queues of the thread queue associated with the
      ${/glossary/scheduler-home:/term}, an ${/glossary/scheduler-ineligible:/term},
      the first ${/glossary/scheduler-helping:/term}, and the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: HomeIneligibleSecondFirst
    test-code: |
      SetOrder( ctx, ROLE_HOME, ROLE_INELIGIBLE, ROLE_SECOND, ROLE_FIRST );
    text: |
      While the priority queues of the thread queue associated with the
      ${/glossary/scheduler-home:/term}, an ${/glossary/scheduler-ineligible:/term},
      the second ${/glossary/scheduler-helping:/term}, and the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: FirstHomeSecondIneligible
    test-code: |
      SetOrder( ctx, ROLE_FIRST, ROLE_HOME, ROLE_SECOND, ROLE_INELIGIBLE );
    text: |
      While the priority queues of the thread queue associated with the first
      ${/glossary/scheduler-helping:/term}, the ${/glossary/scheduler-home:/term},
      the second ${/glossary/scheduler-helping:/term}, and an
      ${/glossary/scheduler-ineligible:/term} of the enqueueing thread are positioned
      in this order, where a priority queue which the thread queue does not contain
      is left out.
  - name: FirstHomeIneligibleSecond
    test-code: |
      SetOrder( ctx, ROLE_FIRST, ROLE_HOME, ROLE_INELIGIBLE, ROLE_SECOND );
    text: |
      While the priority queues of the thread queue associated with the first
      ${/glossary/scheduler-helping:/term}, the ${/glossary/scheduler-home:/term}, an
      ${/glossary/scheduler-ineligible:/term}, and the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: FirstSecondHomeIneligible
    test-code: |
      SetOrder( ctx, ROLE_FIRST, ROLE_SECOND, ROLE_HOME, ROLE_INELIGIBLE );
    text: |
      While the priority queues of the thread queue associated with the first
      ${/glossary/scheduler-helping:/term}, the second
      ${/glossary/scheduler-helping:/term}, the ${/glossary/scheduler-home:/term},
      and an ${/glossary/scheduler-ineligible:/term} of the enqueueing thread are
      positioned in this order, where a priority queue which the thread queue does
      not contain is left out.
  - name: FirstSecondIneligibleHome
    test-code: |
      SetOrder( ctx, ROLE_FIRST, ROLE_SECOND, ROLE_INELIGIBLE, ROLE_HOME );
    text: |
      While the priority queues of the thread queue associated with the first
      ${/glossary/scheduler-helping:/term}, the second
      ${/glossary/scheduler-helping:/term}, an
      ${/glossary/scheduler-ineligible:/term}, and the
      ${/glossary/scheduler-home:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: FirstIneligibleHomeSecond
    test-code: |
      SetOrder( ctx, ROLE_FIRST, ROLE_INELIGIBLE, ROLE_HOME, ROLE_SECOND );
    text: |
      While the priority queues of the thread queue associated with the first
      ${/glossary/scheduler-helping:/term}, an
      ${/glossary/scheduler-ineligible:/term}, the ${/glossary/scheduler-home:/term},
      and the second ${/glossary/scheduler-helping:/term} of the enqueueing thread
      are positioned in this order, where a priority queue which the thread queue
      does not contain is left out.
  - name: FirstIneligibleSecondHome
    test-code: |
      SetOrder( ctx, ROLE_FIRST, ROLE_INELIGIBLE, ROLE_SECOND, ROLE_HOME );
    text: |
      While the priority queues of the thread queue associated with the first
      ${/glossary/scheduler-helping:/term}, an
      ${/glossary/scheduler-ineligible:/term}, the second
      ${/glossary/scheduler-helping:/term}, and the ${/glossary/scheduler-home:/term}
      of the enqueueing thread are positioned in this order, where a priority queue
      which the thread queue does not contain is left out.
  - name: SecondHomeFirstIneligible
    test-code: |
      SetOrder( ctx, ROLE_SECOND, ROLE_HOME, ROLE_FIRST, ROLE_INELIGIBLE );
    text: |
      While the priority queues of the thread queue associated with the second
      ${/glossary/scheduler-helping:/term}, the ${/glossary/scheduler-home:/term},
      the first ${/glossary/scheduler-helping:/term}, and an
      ${/glossary/scheduler-ineligible:/term} of the enqueueing thread are positioned
      in this order, where a priority queue which the thread queue does not contain
      is left out.
  - name: SecondHomeIneligibleFirst
    test-code: |
      SetOrder( ctx, ROLE_SECOND, ROLE_HOME, ROLE_INELIGIBLE, ROLE_FIRST );
    text: |
      While the priority queues of the thread queue associated with the second
      ${/glossary/scheduler-helping:/term}, the ${/glossary/scheduler-home:/term}, an
      ${/glossary/scheduler-ineligible:/term}, and the first
      ${/glossary/scheduler-helping:/term} of the enqueueing thread are positioned in
      this order, where a priority queue which the thread queue does not contain is
      left out.
  - name: SecondFirstHomeIneligible
    test-code: |
      SetOrder( ctx, ROLE_SECOND, ROLE_FIRST, ROLE_HOME, ROLE_INELIGIBLE );
    text: |
      While the priority queues of the thread queue associated with the second
      ${/glossary/scheduler-helping:/term}, the first
      ${/glossary/scheduler-helping:/term}, the ${/glossary/scheduler-home:/term},
      and an ${/glossary/scheduler-ineligible:/term} of the enqueueing thread are
      positioned in this order, where a priority queue which the thread queue does
      not contain is left out.
  - name: SecondFirstIneligibleHome
    test-code: |
      SetOrder( ctx, ROLE_SECOND, ROLE_FIRST, ROLE_INELIGIBLE, ROLE_HOME );
    text: |
      While the priority queues of the thread queue associated with the second
      ${/glossary/scheduler-helping:/term}, the first
      ${/glossary/scheduler-helping:/term}, an
      ${/glossary/scheduler-ineligible:/term}, and the
