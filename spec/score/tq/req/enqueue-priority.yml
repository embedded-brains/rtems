test-context-support: |
  typedef enum {
    ROLE_HOME,
    ROLE_FIRST,
    ROLE_SECOND,
    ROLE_INELIGIBLE,
    ROLE_OTHER,
    ROLE_INELIGIBLE_LAST,
    ROLE_COUNT
  } Role;

  #define ROLE_ORDER_COUNT 4

  typedef enum { PLACE_NONE, PLACE_INITIAL, PLACE_FIRST, PLACE_SECOND } Place;
