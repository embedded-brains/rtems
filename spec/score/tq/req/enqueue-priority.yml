  ctx->queue_priority[ ROLE_OTHER ] = PRIO_INVALID;
  memset( ctx->with_lower, 0, sizeof( ctx->with_lower ) );
test-setup:
  brief: null
  code: |
    TQReset( ctx->tq_ctx );
    TQSetPriority( ctx->tq_ctx, TQ_BLOCKER_A, PRIO_VERY_HIGH );
    TQSetPriority( ctx->tq_ctx, TQ_BLOCKER_C, PRIO_HIGH );

