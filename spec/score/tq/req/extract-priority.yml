test-context-support: |
  typedef enum {
    ROLE_TARGET,
    ROLE_NEIGHBOR,
    ROLE_SHARER,
    ROLE_OTHER,
    ROLE_COUNT
  } Role;

  typedef enum { OTHER_NONE, OTHER_BEFORE, OTHER_BETWEEN, OTHER_AFTER } Other;
test-description: null
test-header:
  code: null
  freestanding: false
  includes: []
  local-includes:
  - tx-thread-queue.h
  run-params:
  - description: |
      is the thread queue context.
    dir: inout
    name: tq_ctx
    specifier: TQContext *${.:name}
