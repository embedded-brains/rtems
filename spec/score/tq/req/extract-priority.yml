enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: Extract
  states:
  - name: All
    test-code: |
      CheckExtract( ctx );
    text: |
      The thread queue extract operation shall remove the extracted thread from each
      priority queue of the thread queue.
  test-epilogue: null
  test-prologue: null
- name: EmptyQueue
  states:
  - name: Removed
    test-code: |
      CheckEmptyQueues( ctx );
    text: |
      The thread queue extract operation shall remove each priority queue which
      contains no thread after the removal of the extracted thread from the thread
      queue.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: Kept
    test-code: |
      CheckOrder( ctx );
    text: |
      The thread queue extract operation shall not change the order of the priority
      queues of the thread queue.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: TargetQueueThreads
  states:
  - name: One
    test-code: |
      ctx->neighbor = false;

      if ( IsSticky( ctx ) && !HasProcessors( 4 ) ) {
        ${.:skip}
      }
    text: |
      While the priority queue associated with the ${/glossary/scheduler-home:/term}
      of the extracted thread contains no other thread.
  - name: More
    test-code: |
      ctx->neighbor = true;

      if ( IsSticky( ctx ) && !HasProcessors( 4 ) ) {
        ${.:skip}
      }
    text: |
      While the priority queue associated with the ${/glossary/scheduler-home:/term}
      of the extracted thread contains at least one other thread.
  test-epilogue: null
  test-prologue: null
- name: TargetQueues
  states:
  - name: Only
    test-code: |
      ctx->helping = false;
      ctx->alone = false;
    text: |
      While the extracted thread is contained in no other priority queue of the
      thread queue.
  - name: Shared
    test-code: |
      ctx->helping = true;
      ctx->alone = false;

      if ( !HasProcessors( 2 ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the extracted thread is contained in another priority queue of the thread
      queue, while this priority queue contains at least one other thread.
  - name: Alone
    test-code: |
      ctx->helping = true;
      ctx->alone = true;

      if ( !HasProcessors( 2 ) ) {
        ${.:skip}
      }
    text: |
      While the extracted thread is contained in another priority queue of the thread
      queue, while this priority queue contains no other thread.
  test-epilogue: null
  test-prologue: null
- name: OtherQueue
  states:
  - name: None
    test-code: |
      ctx->other = OTHER_NONE;
    text: |
      While each priority queue of the thread queue contains the extracted thread.
  - name: Present
    representatives:
    - name: Before
      test-code: |
        ctx->other = OTHER_BEFORE;
    - name: Between
      test-code: |
        if ( !ctx->helping || ( ctx->alone && !ctx->neighbor ) ) {
          ${.:skip}
        } else {
          ctx->other = OTHER_BETWEEN;
        }
    - name: After
      test-code: |
        ctx->other = OTHER_AFTER;
    test-code: |
      if ( !HasThirdScheduler( ctx ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue which does not contain the
      extracted thread.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension TargetQueueThreads covers whether the priority queue of the home
  scheduler of the extracted thread contains another thread, 2 states.

  Dimension TargetQueues covers the other priority queues which contain the
  extracted thread, 3 states.

  Dimension OtherQueue covers a priority queue which does not contain the
  extracted thread, 2 states. The state Present has three representatives. In the
  representatives Before and After, this priority queue is positioned before or
  after each priority queue which contains the extracted thread. In the
  representative Between, it is positioned between two such priority queues. This
  needs a priority queue of the extracted thread which exists before the other
  priority queue, so the representative skips a run without it.

  The test extracts the thread through the thread timeout. A task delete and a
  task restart extract a waiting thread through the same operation.

  The sticky variant runs on at least four processors. A thread which waits in a
  sticky enqueue occupies a processor of its home scheduler. The test needs these
  processors to set up the states. A system with two processors reaches the same
  states without them. The test skips the sticky variant on a system with less
  than four processors.
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  static const Role order[ 4 ][ ROLE_COUNT ] = {
    { ROLE_OTHER, ROLE_TARGET, ROLE_NEIGHBOR, ROLE_SHARER },
    { ROLE_NEIGHBOR, ROLE_OTHER, ROLE_TARGET, ROLE_SHARER },
    { ROLE_SHARER, ROLE_OTHER, ROLE_TARGET, ROLE_NEIGHBOR },
    { ROLE_TARGET, ROLE_NEIGHBOR, ROLE_SHARER, ROLE_OTHER }
  };

  const Role      *roles;
  Per_CPU_Control *cpu_self;
  rtems_event_set  events;
  size_t           i;
  TQWait           wait;

  /*
   * The thread timeout of a thread which waits with a timeout would leave the
   * watchdog of the thread armed.
   */
  wait = ctx->tq_ctx->wait;
  ctx->tq_ctx->wait = TQ_WAIT_FOREVER;
  SetSelfPriority( PRIO_VERY_LOW );
  ctx->tq_ctx->how_many = 1;

  if ( IsSticky( ctx ) ) {
    TQEnqueuePrepare( ctx->tq_ctx );
  } else {
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  }

  if ( ctx->helping ) {
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_BLOCKER_C,
      TQ_EVENT_MUTEX_A_OBTAIN
    );
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      TQ_BLOCKER_E,
      TQ_EVENT_MUTEX_A_OBTAIN | TQ_EVENT_MUTEX_A_RELEASE
    );
  }

  if ( ctx->other == OTHER_BEFORE ) {
    roles = order[ 0 ];
  } else if ( ctx->other == OTHER_BETWEEN && ctx->neighbor ) {
    roles = order[ 1 ];
  } else if ( ctx->other == OTHER_BETWEEN ) {
    roles = order[ 2 ];
  } else {
    roles = order[ 3 ];
  }

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    Role role;

    role = roles[ i ];

    if ( HasRole( ctx, role ) ) {
      events = TQ_EVENT_ENQUEUE;

      if ( role != ROLE_TARGET ) {
        events |= TQ_EVENT_SURRENDER;
      }

      TQClearDone( ctx->tq_ctx, role_worker[ role ] );
      Enqueue( ctx, role_worker[ role ], events );
      ++ctx->tq_ctx->how_many;
    }
  }

  ctx->queue = GetTarget( ctx )->Wait.queue;
  T_assert_not_null( ctx->queue );
  TQTakeSnapshot( &ctx->before, ctx->queue );

  cpu_self = _Thread_Dispatch_disable();
  TQTimeout( ctx->tq_ctx->worker_tcb[ TQ_BLOCKER_C ] );
  _Thread_Dispatch_direct( cpu_self );

  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );
  ctx->target_done = true;
  TQTakeSnapshot( &ctx->after, ctx->queue );

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    ctx->waits[ i ] = ctx->tq_ctx->worker_tcb[ role_worker[ i ] ]
                        ->Wait.queue == ctx->queue;
  }

  if ( ctx->helping ) {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
    TQSend( ctx->tq_ctx, TQ_BLOCKER_C, TQ_EVENT_MUTEX_A_RELEASE );
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );
  }

  if ( IsSticky( ctx ) ) {
    TQEnqueueDone( ctx->tq_ctx );
  } else {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  }

  for ( i = 0; i < ROLE_COUNT; ++i ) {
    if ( HasRole( ctx, (Role) i ) ) {
      TQWaitForDone( ctx->tq_ctx, role_worker[ i ] );
      TQWaitForExecutionStop( ctx->tq_ctx, role_worker[ i ] );
    }
  }

  if ( ctx->helping ) {
    TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
    TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );
  }

  SetSelfPriority( PRIO_NORMAL );
  ctx->tq_ctx->wait = wait;
