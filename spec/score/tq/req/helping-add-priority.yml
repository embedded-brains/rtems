enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: AddPosition
  states:
  - name: Initial
    test-code: |
      CheckAddPosition( ctx, PLACE_INITIAL );
    text: |
      The thread queue shall position the priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is added to the thread after each
      other priority queue of the thread queue.
  - name: First
    test-code: |
      CheckAddPosition( ctx, PLACE_FIRST );
    text: |
      The thread queue shall position the thread as the first thread of the priority
      queue associated with the ${/glossary/scheduler-helping:/term} which is added
      to the thread.
  - name: Second
    test-code: |
      CheckAddPosition( ctx, PLACE_SECOND );
    text: |
      The thread queue shall position the thread in the priority queue associated
      with the ${/glossary/scheduler-helping:/term} which is added to the thread
      after each thread of the priority queue with a priority higher than or equal to
      the ${/glossary/priority-eligible:/term} of the thread with respect to this
      ${/glossary/scheduler-helping:/term} and before each thread of the priority
      queue with a lower priority.
  test-epilogue: null
  test-prologue: null
- name: AddOrder
  states:
  - name: Kept
    test-code: |
      CheckAddOrder( ctx );
    text: |
      The addition of the ${/glossary/scheduler-helping:/term} shall not change the
      order of the priority queues which the thread queue contained before the
      addition.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: NewQueue
  states:
  - name: Empty
    test-code: |
      ctx->waiter_priority = PRIO_INVALID;

      if ( !HasProcessors( 2 ) || IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has no priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is added to the thread.
  - name: High
    representatives:
    - name: Alone
      test-code: |
        ctx->lower = false;
    - name: Lower
      test-code: |
        ctx->lower = true;
    test-code: |
      ctx->waiter_priority = PRIO_VERY_HIGH;

      if ( !HasProcessors( 2 ) || IsSticky( ctx ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is added to the thread, while the
      highest priority of the priority queue is higher than the
      ${/glossary/priority-eligible:/term} of the thread with respect to this
      ${/glossary/scheduler-helping:/term}.
  - name: Equal
    representatives:
    - name: Alone
      test-code: |
        ctx->lower = false;
    - name: Lower
      test-code: |
        ctx->lower = true;
    test-code: |
      ctx->waiter_priority = PRIO_HIGH;

      if ( !HasProcessors( 2 ) || IsSticky( ctx ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is added to the thread, while the
      highest priority of the priority queue is equal to the
      ${/glossary/priority-eligible:/term} of the thread with respect to this
      ${/glossary/scheduler-helping:/term}.
  - name: Low
    representatives:
    - name: Alone
      test-code: |
        ctx->lower = false;
    - name: Lower
      test-code: |
        ctx->lower = true;
    test-code: |
      ctx->waiter_priority = PRIO_NORMAL;

      if ( !HasProcessors( 2 ) || IsSticky( ctx ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is added to the thread, while the
      highest priority of the priority queue is lower than the
      ${/glossary/priority-eligible:/term} of the thread with respect to this
      ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: OtherQueue
  states:
  - name: None
    test-code: |
      ctx->other = false;
    text: |
      While each priority queue of the thread queue is associated with the
      ${/glossary/scheduler-home:/term} of the thread or with the
      ${/glossary/scheduler-helping:/term} which is added to the thread.
  - name: One
    test-code: |
      ctx->other = true;

      if ( !HasProcessors( 3 ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue which is associated with a
      ${/glossary/scheduler:/term} other than the ${/glossary/scheduler-home:/term}
      of the thread and the ${/glossary/scheduler-helping:/term} which is added to
      the thread.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension NewQueue covers the priority queue of the added helping scheduler
  before the addition, 4 states. The states High, Equal, and Low have two
  representatives. In the representative Alone, the priority queue contains one
  thread. In the representative Lower, it also contains a thread with a priority
  lower than the eligible priority of the thread.

  Dimension OtherQueue covers a priority queue of a third scheduler, 2 states.

  The test adds the helping scheduler through a thread which waits for a mutex
  with the priority inheritance locking protocol owned by the thread. A thread
  which waits for a mutex with the MrsP locking protocol occupies a processor, so
  the test skips the sticky enqueue.
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  rtems_status_code sc;

  if ( ctx->waiter_priority != PRIO_INVALID ) {
    TQSetPriority( ctx->tq_ctx, TQ_WORKER_F, ctx->waiter_priority );
  }

  SetSelfPriority( PRIO_ULTRA_LOW );
  ctx->tq_ctx->how_many = 1;
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  TQSendAndWaitForExecutionStop(
    ctx->tq_ctx,
    TQ_BLOCKER_C,
    TQ_EVENT_MUTEX_A_OBTAIN
  );
  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  Enqueue(
    ctx,
    TQ_BLOCKER_C,
    TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER | TQ_EVENT_MUTEX_A_RELEASE
  );
  ++ctx->tq_ctx->how_many;

  if ( ctx->waiter_priority != PRIO_INVALID ) {
    TQClearDone( ctx->tq_ctx, TQ_WORKER_F );
    Enqueue( ctx, TQ_WORKER_F, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  if ( ctx->lower ) {
    TQClearDone( ctx->tq_ctx, TQ_WORKER_G );
    Enqueue( ctx, TQ_WORKER_G, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  if ( ctx->other ) {
    TQClearDone( ctx->tq_ctx, TQ_HELPER_C );
    Enqueue( ctx, TQ_HELPER_C, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  ctx->queue = GetTCB( ctx, TQ_BLOCKER_C )->Wait.queue;
  T_assert_not_null( ctx->queue );
  TQTakeSnapshot( &ctx->before, ctx->queue );
  TQSendAndWaitForExecutionStop(
    ctx->tq_ctx,
    TQ_BLOCKER_E,
    TQ_EVENT_MUTEX_A_OBTAIN
  );
  TQTakeSnapshot( &ctx->added, ctx->queue );

  /*
   * The restart extracts the thread from the thread queue of mutex A, so the
   * waiting thread loses the helping scheduler.
   */
  sc = rtems_task_restart(
    ctx->tq_ctx->worker_id[ TQ_BLOCKER_E ],
    (rtems_task_argument) ctx->tq_ctx
  );
  T_rsc_success( sc );
  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_E );

  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );
  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_C );

  if ( ctx->waiter_priority != PRIO_INVALID ) {
    TQWaitForDone( ctx->tq_ctx, TQ_WORKER_F );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_WORKER_F );
  }

  if ( ctx->lower ) {
    TQWaitForDone( ctx->tq_ctx, TQ_WORKER_G );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_WORKER_G );
  }

  if ( ctx->other ) {
    TQWaitForDone( ctx->tq_ctx, TQ_HELPER_C );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_HELPER_C );
  }

  TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
  TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );
  SetSelfPriority( PRIO_NORMAL );
