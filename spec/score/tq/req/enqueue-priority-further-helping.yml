post-conditions:
- name: PositionEligible
  states:
  - name: AsTwo
    test-code: |
      CheckEligible( ctx );
    text: |
      The enqueueing thread shall be enqueued in the priority queues associated with
      the ${/glossary/scheduler-home:/term}, the first
      ${/glossary/scheduler-helping:/term}, and the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread as specified by
      ${enqueue-priority:/spec} for an enqueueing thread with exactly two
      ${/glossary/scheduler-helping:/plural}.
  test-epilogue: null
  test-prologue: null
- name: PositionFurtherHelping
  states:
  - name: Initial
    test-code: |
      CheckFurther( ctx );
    text: |
      For each ${/glossary/scheduler-helping:/term} of the enqueueing thread other
      than the first and the second ${/glossary/scheduler-helping:/term}, a priority
      queue which contains exactly the enqueueing thread and which is associated with
      this ${/glossary/scheduler-helping:/term} shall be positioned after each
      priority queue which the thread queue contained before the enqueue, after the
      priority queues associated with the ${/glossary/scheduler-home:/term}, the
      first ${/glossary/scheduler-helping:/term}, and the second
      ${/glossary/scheduler-helping:/term} of the enqueueing thread, and after the
      priority queues associated with each ${/glossary/scheduler-helping:/term} which
      became a ${/glossary/scheduler-helping:/term} of the enqueueing thread before
      this ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: Kept
    test-code: |
      CheckOrder( ctx );
    text: |
      The order of the priority queues which the thread queue contained before the
      enqueue shall not change.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: EligibleScheduler
  states:
  - name: More
    test-code: |
      if ( !UsesProcessors( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the enqueueing thread has at least three
      ${/glossary/scheduler-helping:/plural}, while the thread queue has no priority
      queue associated with a ${/glossary/scheduler-helping:/term} of the enqueueing
      thread other than the first and the second
      ${/glossary/scheduler-helping:/term}.
  test-epilogue: null
  test-prologue: null
- name: ThreadQueue
  states:
  - name: Empty
    test-code: |
      ctx->other = false;
    text: |
      While the thread queue is empty.
  - name: NotEmpty
    test-code: |
      ctx->other = true;
    text: |
      While the thread queue is not empty.
  test-epilogue: null
  test-prologue: null
rationale: |
  The enqueue handles the scheduler node of each eligible scheduler of the
  enqueueing thread on its own. It appends a new priority queue at the end of the
  thread queue in the order of the eligible schedulers. The priority queue of a
  third helping scheduler therefore follows the rule of the priority queue of the
  second helping scheduler. The map of ${enqueue-priority:/spec} skips this case.
  Its variants need six processors and multiply the variants of each other
  dimension.

  Dimension EligibleScheduler holds the one case of this requirement, 1 state.
  The test provides exactly three helping schedulers.

  Dimension ThreadQueue covers the two ways to enqueue a thread, 2 states. An
  empty thread queue initializes its priority queues. A thread queue which is not
  empty adds the priority queues of the enqueueing thread to its priority queues.
  The test of the state NotEmpty provides one priority queue associated with an
  ${/glossary/scheduler-ineligible:/term} of the enqueueing thread.
references: []
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  rtems_event_set events;
  size_t          i;

  SetSelfPriority( PRIO_VERY_LOW );
  ctx->tq_ctx->how_many = 1;

  if ( IsSticky( ctx ) ) {
    TQEnqueuePrepare( ctx->tq_ctx );
  } else {
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  }

  TQSend( ctx->tq_ctx, TQ_BLOCKER_C, TQ_EVENT_MUTEX_A_OBTAIN );

  for ( i = 0; i < RTEMS_ARRAY_SIZE( helper_provider ); ++i ) {
    TQSendAndWaitForExecutionStop(
      ctx->tq_ctx,
      helper_provider[ i ],
      TQ_EVENT_MUTEX_A_OBTAIN | TQ_EVENT_MUTEX_A_RELEASE
    );
  }

  if ( ctx->other ) {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_D );
    Enqueue( ctx, TQ_BLOCKER_D, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  events = TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER | TQ_EVENT_MUTEX_A_RELEASE;
  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  Enqueue( ctx, TQ_BLOCKER_C, events );
  TakeSnapshot( ctx );

  if ( IsSticky( ctx ) ) {
    TQEnqueueDone( ctx->tq_ctx );
  } else {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  }

  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );

  if ( ctx->other ) {
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_D );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_D );
  }

  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_C );
  TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
  TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );
  SetSelfPriority( PRIO_NORMAL );
