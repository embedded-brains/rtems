enabled-by: true
functional-type: action
links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: Position
  states:
  - name: First
    test-code: |
      CheckPosition( ctx, true );
    text: |
      The thread queue shall position the thread as the first thread of the priority
      queue associated with its ${/glossary/scheduler-home:/term}.
  - name: Second
    test-code: |
      CheckPosition( ctx, false );
    text: |
      The thread queue shall position the thread in the priority queue associated
      with its ${/glossary/scheduler-home:/term} after each thread of the priority
      queue with a priority higher than or equal to the new
      ${/glossary/priority-eligible:/term} of the thread and before each thread of
      the priority queue with a lower priority.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: Kept
    test-code: |
      TQCheckSameQueues( &ctx->before, &ctx->after );
    text: |
      The thread queue shall not change the order of its priority queues.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: TargetPosition
  states:
  - name: First
    representatives:
    - name: OneOther
      test-code: |
        ctx->lower = false;
    - name: TwoOthers
      test-code: |
        ctx->lower = true;
    test-code: |
      ctx->initial_priority = PRIO_HIGH;

      if ( IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread is the first thread of the priority queue associated with its
      ${/glossary/scheduler-home:/term}, while the priority queue contains at least
      one other thread.
  - name: Second
    representatives:
    - name: OneOther
      test-code: |
        ctx->lower = false;
    - name: TwoOthers
      test-code: |
        ctx->lower = true;
    test-code: |
      ctx->initial_priority = PRIO_VERY_LOW;

      if ( IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread is the second thread of the priority queue associated with its
      ${/glossary/scheduler-home:/term}.
  test-epilogue: null
  test-prologue: null
- name: NewPriority
  states:
  - name: High
    test-code: |
      ctx->new_priority = PRIO_VERY_HIGH;
    text: |
      While the new ${/glossary/priority-eligible:/term} of the thread with respect
      to its ${/glossary/scheduler-home:/term} is higher than the highest priority of
      the other threads of the priority queue.
  - name: Equal
    test-code: |
      ctx->new_priority = PRIO_NORMAL;
    text: |
      While the new ${/glossary/priority-eligible:/term} of the thread with respect
      to its ${/glossary/scheduler-home:/term} is equal to the highest priority of
      the other threads of the priority queue.
  - name: Low
    test-code: |
      ctx->new_priority = PRIO_LOW;
    text: |
      While the new ${/glossary/priority-eligible:/term} of the thread with respect
      to its ${/glossary/scheduler-home:/term} is lower than the highest priority of
      the other threads of the priority queue.
  test-epilogue: null
  test-prologue: null
- name: OtherQueue
  states:
  - name: None
    test-code: |
      ctx->other = OTHER_NONE;
    text: |
      While the thread queue has exactly one priority queue.
  - name: Before
    test-code: |
      ctx->other = OTHER_BEFORE;

      if ( !HasProcessors( 2 ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a second priority queue, while this priority queue
      is positioned before the priority queue which contains the thread.
  - name: After
    test-code: |
      ctx->other = OTHER_AFTER;

      if ( !HasProcessors( 2 ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a second priority queue, while this priority queue
      is positioned after the priority queue which contains the thread.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension TargetPosition covers the position of the thread in the priority
  queue of its home scheduler, 2 states. Each state has two representatives. In
  the representative OneOther, the priority queue contains one other thread. In
  the representative TwoOthers, it also contains a last thread with a priority
  lower than each new priority.

  Dimension NewPriority covers the new priority against the highest priority of
  the other threads, 3 states.

  Dimension OtherQueue covers a second priority queue and its position, 3 states.

  A thread which waits for a mutex with the MrsP locking protocol has the ceiling
  priority. A change of its real priority therefore does not change its eligible
  priority, so the test skips the sticky enqueue.
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  TQSetPriority( ctx->tq_ctx, TQ_BLOCKER_C, ctx->initial_priority );
  SetSelfPriority( PRIO_ULTRA_LOW );
  ctx->tq_ctx->how_many = 1;
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );

  if ( ctx->other == OTHER_BEFORE ) {
    TQClearDone( ctx->tq_ctx, TQ_HELPER_C );
    Enqueue( ctx, TQ_HELPER_C, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  Enqueue( ctx, TQ_BLOCKER_C, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_B );
  Enqueue( ctx, TQ_BLOCKER_B, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
  ctx->tq_ctx->how_many += 2;

  if ( ctx->lower ) {
    TQSetPriority( ctx->tq_ctx, TQ_BLOCKER_D, PRIO_VERY_LOW );
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_D );
    Enqueue( ctx, TQ_BLOCKER_D, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  if ( ctx->other == OTHER_AFTER ) {
    TQClearDone( ctx->tq_ctx, TQ_HELPER_C );
    Enqueue( ctx, TQ_HELPER_C, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  ctx->queue = GetTCB( ctx, TQ_BLOCKER_C )->Wait.queue;
  T_assert_not_null( ctx->queue );
  TQTakeSnapshot( &ctx->before, ctx->queue );
  (void)
    SetPriority( ctx->tq_ctx->worker_id[ TQ_BLOCKER_C ], ctx->new_priority );
  TQTakeSnapshot( &ctx->after, ctx->queue );

  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_B );
  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_C );
  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_B );

  if ( ctx->lower ) {
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_D );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_D );
  }

  if ( ctx->other != OTHER_NONE ) {
    TQWaitForDone( ctx->tq_ctx, TQ_HELPER_C );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_HELPER_C );
  }

  SetSelfPriority( PRIO_NORMAL );
