pre-conditions:
- name: QueueIneligible
  states:
  - name: More
    test-code: |
      ctx->order[ 0 ] = TQ_HELPER_C;
      ctx->order[ 1 ] = TQ_BLOCKER_D;

      if ( !UsesProcessors( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the thread queue has at least two priority queues associated with
      ${/glossary/scheduler-ineligible:/plural} of the enqueueing thread.
  test-epilogue: null
  test-prologue: null
rationale: |
  The enqueue adds the enqueueing thread only to the priority queues associated
  with its eligible schedulers. It does not access a priority queue associated
  with an ${/glossary/scheduler-ineligible:/term} of the enqueueing thread. The
  map of ${enqueue-priority:/spec} skips this case. Its variants need six
  processors and multiply the variants of each other dimension.

  Dimension QueueIneligible holds the one case of this requirement, 1 state. The
  test provides exactly two priority queues associated with the schedulers B and
  D. The enqueueing thread has no helping scheduler.
references: []
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  size_t i;

  SetSelfPriority( PRIO_VERY_LOW );
  ctx->tq_ctx->how_many = 1;

  if ( IsSticky( ctx ) ) {
    TQEnqueuePrepare( ctx->tq_ctx );
  } else {
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  }

  for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->order ); ++i ) {
    TQClearDone( ctx->tq_ctx, ctx->order[ i ] );
    Enqueue( ctx, ctx->order[ i ], TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  TQTakeSnapshot( &ctx->before, GetQueue( ctx ) );
  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  Enqueue( ctx, TQ_BLOCKER_C, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
  TQTakeSnapshot( &ctx->after, GetQueue( ctx ) );

  if ( IsSticky( ctx ) ) {
    TQEnqueueDone( ctx->tq_ctx );
  } else {
    TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
    TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
    TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  }

  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );

  for ( i = 0; i < RTEMS_ARRAY_SIZE( ctx->order ); ++i ) {
    TQWaitForDone( ctx->tq_ctx, ctx->order[ i ] );
    TQWaitForExecutionStop( ctx->tq_ctx, ctx->order[ i ] );
  }

  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_C );
  SetSelfPriority( PRIO_NORMAL );
test-brief: null
test-cleanup: null
