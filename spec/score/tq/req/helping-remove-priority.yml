links:
- role: requirement-refinement
  uid: ../if/group
post-conditions:
- name: Thread
  states:
  - name: Removed
    test-code: |
      CheckThread( ctx );
    text: |
      The thread queue shall remove the thread from the priority queue associated
      with the ${/glossary/scheduler-helping:/term} which is removed from the thread.
  test-epilogue: null
  test-prologue: null
- name: RemovedQueue
  states:
  - name: Removed
    test-code: |
      CheckRemovedQueue( ctx, false );
    text: |
      The thread queue shall remove the priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is removed from the thread.
  - name: Kept
    test-code: |
      CheckRemovedQueue( ctx, true );
    text: |
      The priority queue associated with the ${/glossary/scheduler-helping:/term}
      which is removed from the thread shall keep its other threads in their order.
  test-epilogue: null
  test-prologue: null
- name: QueueOrder
  states:
  - name: Kept
    test-code: |
      CheckOrder( ctx );
    text: |
      The removal of the ${/glossary/scheduler-helping:/term} shall not change the
      order of the other priority queues of the thread queue.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: RemovedQueue
  states:
  - name: Alone
    test-code: |
      ctx->waiter_priority = PRIO_INVALID;

      if ( !HasProcessors( 2 ) || IsSticky( ctx ) ) {
        ${.:skip}
      }
    text: |
      While the priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is removed from the thread contains
      no other thread.
  - name: Shared
    representatives:
    - name: ThreadFirst
      test-code: |
        ctx->waiter_priority = PRIO_NORMAL;
    - name: ThreadSecond
      test-code: |
        ctx->waiter_priority = PRIO_VERY_HIGH;
    test-code: |
      if ( !HasProcessors( 2 ) || IsSticky( ctx ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the priority queue associated with the
      ${/glossary/scheduler-helping:/term} which is removed from the thread contains
      at least one other thread.
  test-epilogue: null
  test-prologue: null
- name: OtherQueue
  states:
  - name: None
    test-code: |
      ctx->other = OTHER_NONE;
    text: |
      While each priority queue of the thread queue is associated with the
      ${/glossary/scheduler-home:/term} of the thread or with the
      ${/glossary/scheduler-helping:/term} which is removed from the thread.
  - name: Present
    representatives:
    - name: Before
      test-code: |
        ctx->other = OTHER_BEFORE;
    - name: After
      test-code: |
        ctx->other = OTHER_AFTER;
    test-code: |
      if ( !HasProcessors( 3 ) || ctx->home_only ) {
        ${.:skip}
      }
    text: |
      While the thread queue has a priority queue which is associated with a
      ${/glossary/scheduler:/term} other than the ${/glossary/scheduler-home:/term}
      of the thread and the ${/glossary/scheduler-helping:/term} which is removed
      from the thread.
  test-epilogue: null
  test-prologue: null
rationale: |
  Dimension RemovedQueue covers the other threads of the priority queue of the
  removed helping scheduler, 2 states. The state Shared has two representatives.
  In the representative ThreadFirst, the thread is the first thread of this
  priority queue. In the representative ThreadSecond, it is the second thread.

  Dimension OtherQueue covers a priority queue of a third scheduler, 2 states.
  The state Present has two representatives. This priority queue is positioned
  before or after the priority queue of the removed helping scheduler.

  The test adds the helping scheduler through a thread which waits for a mutex
  with the priority inheritance locking protocol owned by the thread. A restart
  of this thread removes the helping scheduler. A thread which waits for a mutex
  with the MrsP locking protocol occupies a processor, so the test skips the
  sticky enqueue.
requirement-type: functional
skip-reasons:
  NoOtherScheduler: |
    Where the system was built with SMP support disabled, no other scheduler can
    exist.
test-action: |
  rtems_status_code sc;

  if ( ctx->waiter_priority != PRIO_INVALID ) {
    TQSetPriority( ctx->tq_ctx, TQ_WORKER_F, ctx->waiter_priority );
  }

  SetSelfPriority( PRIO_ULTRA_LOW );
  ctx->tq_ctx->how_many = 1;
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_PREPARE );
  TQSendAndWaitForExecutionStop(
    ctx->tq_ctx,
    TQ_BLOCKER_C,
    TQ_EVENT_MUTEX_A_OBTAIN
  );
  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_C );
  Enqueue(
    ctx,
    TQ_BLOCKER_C,
    TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER | TQ_EVENT_MUTEX_A_RELEASE
  );
  ++ctx->tq_ctx->how_many;

  if ( ctx->other == OTHER_BEFORE ) {
    EnqueueOther( ctx );
  }

  if ( ctx->waiter_priority != PRIO_INVALID ) {
    TQClearDone( ctx->tq_ctx, TQ_WORKER_F );
    Enqueue( ctx, TQ_WORKER_F, TQ_EVENT_ENQUEUE | TQ_EVENT_SURRENDER );
    ++ctx->tq_ctx->how_many;
  }

  ctx->queue = GetTCB( ctx, TQ_BLOCKER_C )->Wait.queue;
  T_assert_not_null( ctx->queue );
  TQSendAndWaitForExecutionStop(
    ctx->tq_ctx,
    TQ_BLOCKER_E,
    TQ_EVENT_MUTEX_A_OBTAIN
  );

  if ( ctx->other == OTHER_AFTER ) {
    EnqueueOther( ctx );
  }

  TQTakeSnapshot( &ctx->before, ctx->queue );

  /*
   * The restart extracts the thread from the thread queue of mutex A, so the
   * waiting thread loses the helping scheduler.
   */
  sc = rtems_task_restart(
    ctx->tq_ctx->worker_id[ TQ_BLOCKER_E ],
    (rtems_task_argument) ctx->tq_ctx
  );
  T_rsc_success( sc );
  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_E );
  TQTakeSnapshot( &ctx->after, ctx->queue );

  TQClearDone( ctx->tq_ctx, TQ_BLOCKER_A );
  TQSend( ctx->tq_ctx, TQ_BLOCKER_A, TQ_EVENT_ENQUEUE_DONE );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_A );
  TQWaitForDone( ctx->tq_ctx, TQ_BLOCKER_C );
  TQWaitForExecutionStop( ctx->tq_ctx, TQ_BLOCKER_C );

  if ( ctx->waiter_priority != PRIO_INVALID ) {
    TQWaitForDone( ctx->tq_ctx, TQ_WORKER_F );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_WORKER_F );
  }

  if ( ctx->other != OTHER_NONE ) {
    TQWaitForDone( ctx->tq_ctx, TQ_HELPER_C );
    TQWaitForExecutionStop( ctx->tq_ctx, TQ_HELPER_C );
  }

  TQMutexObtain( ctx->tq_ctx, TQ_MUTEX_A );
  TQMutexRelease( ctx->tq_ctx, TQ_MUTEX_A );
  SetSelfPriority( PRIO_NORMAL );
