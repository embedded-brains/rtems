  uid: ../if/group
rationale: |
  One allocation, free or resize moves at most four descriptors, so the release
  of a slab spreads over several operations.
requirement-type: functional
text: |
  When the slabs inside the memory areas of the heap hold more descriptors than
  the reserve needs, the heap shall move the descriptors in use of the slab with
  the fewest descriptors in use to other slabs and free that slab.
type: requirement
