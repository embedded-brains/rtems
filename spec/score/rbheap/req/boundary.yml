- role: requirement-refinement
  uid: ../if/group
rationale: |
  A boundary does not change the alignment of the block, so a small block with a
  large boundary takes no more memory than without the boundary.
requirement-type: functional
text: |
  When the heap allocates a block for a boundary other than zero, the heap shall
  place the block so that its requested size crosses no multiple of the boundary.
type: requirement
