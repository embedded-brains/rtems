rationale: |
  The tree of the free blocks orders the blocks by size, so the search takes
  logarithmic time in the count of the free blocks.
requirement-type: functional
text: |
  When the heap reports the size of its largest free block, the heap shall report
  the size of the largest block in the tree of the free blocks, else zero.
