test-actions:
- action-brief: |
    Run a random sequence of allocations, frees and resizes on a heap which takes
    its slabs from its memory area.
  action-code: |
    bool ok;

    ok = _RBHeap_Initialize( &ctx->heap, ctx->area, sizeof( ctx->area ) );
    T_assert_true( ok );
    RunWorkload( ctx, 1 );
    RunWorkload( ctx, 2 );
  checks:
  - brief: |
      Check that the heap stayed consistent, that the used blocks kept their content
      and that the heap holds its whole memory again.
    code: |
      CheckEmpty( ctx );
    links:
    - role: validation
      uid: ../req/slab
    - role: validation
      uid: ../req/reserve
    - role: validation
      uid: ../req/release
    - role: validation
      uid: ../req/merge
    - role: validation
      uid: ../req/walk
    - role: validation
      uid: /score/heap/req/disjoint
  links: []
- action-brief: |
    Run a random sequence of allocations, frees and resizes on a heap which takes
    its slabs from a slab source and on a heap with added descriptors.
  action-code: |
    bool ok;

    slab_source_context = ctx;
    ctx->slab_count = 0;
    ok = _RBHeap_Initialize_with_slab(
      &ctx->heap,
      ctx->area,
      sizeof( ctx->area ),
      &ctx->slabs[ 0 ],
      SlabSource
    );
    T_assert_true( ok );
    RunWorkload( ctx, 3 );
    CheckEmpty( ctx );

    ok = _RBHeap_Initialize( &ctx->heap, ctx->area, sizeof( ctx->area ) / 2 );
    T_assert_true( ok );
    ok = _RBHeap_Add_descriptors( &ctx->heap, ctx->slabs, sizeof( ctx->slabs ) );
    T_assert_true( ok );
    RunWorkload( ctx, 4 );
  checks:
  - brief: |
      Check that the heap stayed consistent and that it holds its whole memory again.
    code: |
      CheckEmpty( ctx );
    links:
    - role: validation
      uid: ../req/slab
    - role: validation
      uid: ../req/walk
  links: []
- action-brief: |
    Extend a heap by an area after its area, by an adjacent area and by an area
    before its area. Run a random sequence of operations on it.
  action-code: |
    bool      ok;
    uintptr_t quarter;
    char     *area;

    quarter = sizeof( ctx->area ) / 4;
    area = ctx->area;
    ok = _RBHeap_Initialize( &ctx->heap, area + quarter, quarter );
    T_assert_true( ok );
    ok = _RBHeap_Extend( &ctx->heap, area + 3 * quarter, quarter );
    T_true( ok );
    ok = _RBHeap_Extend( &ctx->heap, area + 2 * quarter, quarter );
    T_true( ok );
    ok = _RBHeap_Extend( &ctx->heap, area, quarter / 2 );
    T_true( ok );
    ok = _RBHeap_Extend( &ctx->heap, area + quarter, quarter );
    T_false( ok );
    T_true( _RBHeap_Walk( &ctx->heap ) );
    RunWorkload( ctx, 5 );
  checks:
  - brief: |
      Check that the heap stayed consistent and that it holds its whole memory again.
    code: |
      CheckEmpty( ctx );
    links:
    - role: validation
      uid: ../req/extend
    - role: validation
      uid: ../req/walk
  links: []
- action-brief: |
    Free and allocate blocks of a heap with processor blocks and of a heap without
    processor blocks.
  action-code: |
    RunProcessorBlocks( ctx );
  checks: []
  links:
  - role: validation
    uid: ../req/bound
- action-brief: |
    Free the processor blocks of the current processor on the other processors
    while the current processor allocates them from its kept list.
  action-code: |
    RunKeptRace( ctx );
  checks: []
  links:
  - role: validation
    uid: ../req/bound
- action-brief: |
    Get the information and the statistics of a heap with blocks.
  action-code: |
    RunInformation( ctx );
  checks: []
  links:
  - role: validation
    uid: ../req/information
- action-brief: |
    Initialize heaps with invalid memory areas.
  action-code: |
    RunInitialize( ctx );
  checks: []
  links: []
test-brief: |
  Tests the red-black tree heap.
test-context:
