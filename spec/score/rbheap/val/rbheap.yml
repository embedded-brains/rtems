test-context-support: |
  #define AREA_SIZE ( 32 * RBHEAP_SLAB_SIZE )

  #define SLAB_COUNT 8

  #define BLOCK_COUNT 256

  #define STEP_COUNT 3000

  typedef struct {
    unsigned char *begin;
    size_t         size;
  } Block;
test-description: null
test-header: null
test-includes:
- rtems/config.h
- rtems/score/heapinfo.h
- rtems/score/percpu.h
- rtems/score/rbheap.h
