- role: requirement-refinement
  uid: ../if/group
rationale: |
  A destroy of a lock which a processor owns or waits for is undefined behaviour.
  After the destroy, only an initialization of the lock is defined.
requirement-type: functional
text: |
  When the lock is destroyed, the status of maskable interrupts on the calling
  processor shall not change.
type: requirement
