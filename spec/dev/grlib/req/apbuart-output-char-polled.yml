  ${.:text-template}
transition-map:
- enabled-by: true
  post-conditions:
    Status:
    - if:
        pre-conditions:
          FifoEmpty: 'No'
          Request: DrainTry
      then: MinusOne
    - if:
        pre-conditions:
          Request: DrainTry
          ShiftEmpty: 'No'
      then: MinusOne
    - if:
        pre-conditions:
          FifoEmpty: 'No'
          Request: Try
      then: MinusOne
    - else: Zero
    Action:
    - if:
        pre-conditions:
          FifoEmpty: 'No'
          Request:
          - Char
          - Negative
      then: WaitStore
    - if:
        pre-conditions:
          FifoEmpty: 'Yes'
          Request:
          - Char
          - Negative
          - Try
      then: Store
    - if:
        pre-conditions:
          FifoEmpty: 'No'
          Request: Drain
      then: Wait
    - if:
        pre-conditions:
          Request: Drain
          ShiftEmpty: 'No'
      then: Wait
    - else: None
  pre-conditions:
    Request: all
    FifoEmpty: all
    ShiftEmpty: all
type: requirement
