enabled-by: true
functional-type: action
links:
- role: interface-function
  uid: ../if/apbuart-output-char-polled
- role: requirement-refinement
  uid: /rtems/io/req/bsp-output-char
- role: requirement-refinement
  uid: /rtems/io/req/bsp-output-char-try-ready
- role: requirement-refinement
  uid: /rtems/io/req/bsp-output-char-try-busy
- role: requirement-refinement
  uid: /rtems/io/req/bsp-output-char-drain
- role: requirement-refinement
  uid: /rtems/io/req/bsp-output-char-drain-try-empty
- role: requirement-refinement
  uid: /rtems/io/req/bsp-output-char-drain-try-busy
post-conditions:
- name: Status
  states:
  - name: Zero
    test-code: |
      T_eq_int( ctx->status, 0 );
    text: |
      The return value of ${../if/apbuart-output-char-polled:/name} shall be zero.
  - name: MinusOne
    test-code: |
      T_eq_int( ctx->status, -1 );
    text: |
      The return value of ${../if/apbuart-output-char-polled:/name} shall be minus
      one.
  test-epilogue: null
  test-prologue: null
- name: Action
  states:
  - name: Store
    test-code: |
      T_eq_int( ctx->io_relax_counter, 0 );
      T_eq_u32( ctx->regs.data, ctx->expected );
    text: |
      The ${../if/apbuart-output-char-polled:/name} function shall store the
      character specified by ${../if/apbuart-output-char-polled:/params[1]/name} to
      the data register without a wait.
  - name: WaitStore
    test-code: |
      T_eq_int( ctx->io_relax_counter, 1 );
      T_eq_u32( ctx->regs.data, ctx->expected );
    text: |
      The ${../if/apbuart-output-char-polled:/name} function shall wait until the
      transmitter FIFO is empty and then store the character specified by
      ${../if/apbuart-output-char-polled:/params[1]/name} to the data register.
  - name: Wait
    test-code: |
      T_eq_int( ctx->io_relax_counter, 1 );
      T_eq_u32( ctx->regs.data, 0 );
    text: |
      The ${../if/apbuart-output-char-polled:/name} function shall wait until the
      transmitter FIFO and the transmitter shift register are empty and store no
      character.
  - name: None
    test-code: |
      T_eq_int( ctx->io_relax_counter, 0 );
      T_eq_u32( ctx->regs.data, 0 );
    text: |
      The ${../if/apbuart-output-char-polled:/name} function shall neither wait nor
      store a character.
  test-epilogue: null
  test-prologue: null
pre-conditions:
- name: Request
  states:
  - name: Char
    test-code: |
      ctx->c = 'c';
      ctx->expected = 'c';
    text: |
      While the second parameter specifies a character and no flag.
  - name: Negative
    test-code: |
      ctx->c = (signed char) 0xe9;
      ctx->expected = 0xe9;
    text: |
      While the second parameter is a negative value.
  - name: Try
    test-code: |
      ctx->c = RTEMS_OUTPUT_CHAR_TRY | 'c';
      ctx->expected = 'c';
    text: |
      While the second parameter specifies a character and
      ${/rtems/io/if/output-char-try:/name}.
  - name: Drain
    test-code: |
      ctx->c = RTEMS_OUTPUT_CHAR_DRAIN | 'c';
      ctx->expected = 0;
    text: |
      While the second parameter specifies ${/rtems/io/if/output-char-drain:/name}
      and not ${/rtems/io/if/output-char-try:/name}.
  - name: DrainTry
    test-code: |
      ctx->c = RTEMS_OUTPUT_CHAR_DRAIN | RTEMS_OUTPUT_CHAR_TRY | 'c';
      ctx->expected = 0;
    text: |
      While the second parameter specifies ${/rtems/io/if/output-char-drain:/name}
      and ${/rtems/io/if/output-char-try:/name}.
  test-epilogue: null
  test-prologue: null
- name: FifoEmpty
  states:
  - name: 'Yes'
    test-code: |
      ctx->regs.status |= APBUART_STATUS_TE;
    text: |
      While the transmitter FIFO is empty.
  - name: 'No'
    test-code: |
      ctx->regs.status &= ~APBUART_STATUS_TE;
    text: |
      While the transmitter FIFO is not empty.
  test-epilogue: null
  test-prologue: null
- name: ShiftEmpty
  states:
  - name: 'Yes'
    test-code: |
      ctx->regs.status |= APBUART_STATUS_TS;
    text: |
      While the transmitter shift register is empty.
  - name: 'No'
    test-code: |
      ctx->regs.status &= ~APBUART_STATUS_TS;
    text: |
      While the transmitter shift register is not empty.
  test-epilogue: null
  test-prologue: null
rationale: null
