name: Harmonia
on:
  workflow_run:
    workflows:
    - Echo
    types:
    - completed
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
permissions:
  contents: write
  pull-requests: write
env:
  BRANCH: harmonia/rtems.org
  MIRROR: origin/rtems.org/main
  REPORT_NAME: harmonia-report.txt
  MESSAGE_NAME: harmonia-message.txt
jobs:
  merge:
    name: Harmonia
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        ref: eb/next
        fetch-depth: 0
    - name: Check for an open merge pull request
      id: open
      env:
        # The GitHub Actions token, scoped to 'contents: write' and
        # 'pull-requests: write' in the eb repository.
        GH_TOKEN: ${{ github.token }}
      # An open pull request may carry conflict resolutions pushed by a
      # maintainer.  Never touch its branch.
      run: |
        number="$(gh pr list --head "${BRANCH}" --base eb/next --state open \
          --json number --jq '.[0].number // empty')"
        echo "number=${number}" >>"${GITHUB_OUTPUT}"
        if test -n "${number}"; then
          echo "Pull request #${number} is still open; nothing to do."
        fi
    - name: Check for pending commits
      id: pending
      if: ${{ steps.open.outputs.number == '' }}
      run: |
        if ! git rev-parse --verify --quiet "${MIRROR}" >/dev/null; then
          echo 'The rtems.org/main mirror does not exist yet.  Run Echo first.'
          exit 1
        fi
        count="$(git rev-list --count "${MIRROR}" "^eb/next")"
        echo "count=${count}" >>"${GITHUB_OUTPUT}"
        echo "${count} commits to merge"
    - name: Merge
      if: ${{ steps.open.outputs.number == '' && steps.pending.outputs.count != '0' }}
      env:
        COUNT: ${{ steps.pending.outputs.count }}
      # GitHub builds the message of the merge commit from the title and the
      # body of the pull request, so both are written as a commit message:
      # plain text wrapped at 72 columns, no markup.  The same text is the
      # message of the merge commit of this branch.
      #
      # The merge is left uncommitted until the checks have run, so their
      # report goes into that message.
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git checkout -B "${BRANCH}" eb/next
        report="${RUNNER_TEMP}/${REPORT_NAME}"
        # Only the report may reach the message, so the scripts write anything
        # else to the standard error stream, which is kept for the summary.
        errors="${RUNNER_TEMP}/harmonia-errors.txt"
        : >"${errors}"
        failed=
        # A conflict whose 'ours' side is empty is mechanical: the eb
        # repository deleted that region and an upstream build change must not
        # enter the pre-qualified set by itself.  Anything else is a
        # qualification scope decision for a human.
        if git merge --no-commit --no-ff "${MIRROR}"; then
          echo 'The merge was clean.' >"${report}"
        else
          python3 ./.github/resolve_merge.py >"${report}" 2>"${errors}" \
            || failed=yes
        fi
        # The rtems.org repository relocates sources.  A build item of this
        # repository which still lists the old path merges without a conflict
        # and leaves the build specification pointing at a file which is gone.
        if test -z "${failed}"; then
          echo >>"${report}"
          python3 ./.github/check_sources.py eb/next >>"${report}" \
            2>>"${errors}" || failed=yes
        fi
        cat "${errors}"
        if test -n "${failed}"; then
          cat "${report}"
          {
            echo '## Harmonia'
            echo
            echo 'Harmonia could not finish the merge of `rtems.org/main`'
            echo 'into `eb/next`.  Resolve it locally; no pull request was'
            echo 'created.'
            echo
            echo '```'
            cat "${errors}" "${report}"
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
          git merge --abort
          exit 1
        fi
        commits="${COUNT} commits"
        if test "${COUNT}" -eq 1; then
          commits='1 commit'
        fi
        message="${RUNNER_TEMP}/${MESSAGE_NAME}"
        {
          echo 'Merge rtems.org/main into eb/next'
          echo
          echo "Merge ${commits} of the rtems.org repository.  Echo"
          echo 'mirrors main of the rtems.org repository into rtems.org/main'
          echo 'once a day, and Harmonia merges that mirror into eb/next.'
          echo
          cat "${report}"
          echo
          echo 'A source which the rtems.org repository added is built outside'
          echo 'the qualified subset until a maintainer decides otherwise,'
          echo 'which is a change of its own.  This merge moves nothing into'
          echo 'or out of that subset.'
        } >"${message}"
        git commit -F "${message}"
        cat "${message}"
        {
          echo '## Harmonia'
          echo
          echo 'The message of the merge commit:'
          echo
          echo '```'
          cat "${message}"
          echo '```'
        } >>"${GITHUB_STEP_SUMMARY}"
    - name: Open the pull request
      if: ${{ steps.open.outputs.number == '' && steps.pending.outputs.count != '0' }}
      env:
        GH_TOKEN: ${{ github.token }}
      # The branch has no open pull request, so it carries no work of anyone
      # else and may be replaced.
      run: |
        git push --force origin "${BRANCH}"
        message="${RUNNER_TEMP}/${MESSAGE_NAME}"
        body="${RUNNER_TEMP}/harmonia-body.txt"
        tail -n +3 "${message}" >"${body}"
        gh pr create \
          --base eb/next \
          --head "${BRANCH}" \
          --title "$(head -n 1 "${message}")" \
          --body-file "${body}"
